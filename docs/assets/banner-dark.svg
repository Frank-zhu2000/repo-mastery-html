<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310" role="img" aria-label="repo-mastery-html hero banner">
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c17"/>
      <stop offset="55%" stop-color="#0d172b"/>
      <stop offset="100%" stop-color="#131632"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="0.18" cy="0.22" r="0.55">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-indigo" cx="0.86" cy="0.72" r="0.52">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="dot-grid-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="310" rx="18" fill="url(#bg-dark)"/>
  <rect width="1200" height="310" rx="18" fill="url(#dot-grid-dark)"/>
  <rect width="1200" height="310" rx="18" fill="url(#glow-cyan)"/>
  <rect width="1200" height="310" rx="18" fill="url(#glow-indigo)"/>
  <rect x="1" y="1" width="1198" height="308" rx="17" fill="none" stroke="#1e3154" stroke-width="1.5"/>

  <!-- Left Brand Block -->
  <g transform="translate(56, 48)">
    <!-- Square Logo -->
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#logo-grad)"/>
    <text x="26" y="34" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="800">链</text>

    <!-- Kicker Pill -->
    <rect x="68" y="11" width="234" height="30" rx="15" fill="#38bdf8" fill-opacity="0.13" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1"/>
    <text x="185" y="30.5" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">AGENT SKILL · ZERO DEPS</text>

    <!-- Main Title -->
    <text x="0" y="108" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">repo-mastery-html</text>
    <rect x="0" y="122" width="180" height="4" rx="2" fill="url(#accent-grad)"/>

    <!-- Subtitle -->
    <text x="0" y="156" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="600">任意 GitHub 开源仓库 → 0 基础到精通 · 单文件离线交互式源码学习系统</text>
    <text x="0" y="182" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5">Turn any GitHub repo into an interactive 4-view HTML workbench.</text>

    <!-- 4 Feature Pills -->
    <g transform="translate(0, 202)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" font-weight="700">
      <rect x="0" y="0" width="166" height="28" rx="14" fill="#0c2638" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="83" y="18.5" text-anchor="middle" fill="#bae6fd">三大蓝图 · 6维档案</text>

      <rect x="176" y="0" width="150" height="28" rx="14" fill="#0b2b24" stroke="#34d399" stroke-opacity="0.6"/>
      <text x="251" y="18.5" text-anchor="middle" fill="#d1fae5">100% 逐行中文精注</text>

      <rect x="336" y="0" width="150" height="28" rx="14" fill="#22163b" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="411" y="18.5" text-anchor="middle" fill="#ede9fe">I/O 契约与故障推演</text>

      <rect x="496" y="0" width="136" height="28" rx="14" fill="#2f200c" stroke="#fbbf24" stroke-opacity="0.6"/>
      <text x="564" y="18.5" text-anchor="middle" fill="#fef3c7">CDP 零溢出校验</text>
    </g>
  </g>

  <!-- Right Stylized Interactive Workbench Motif -->
  <g transform="translate(742, 34)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="406" height="242" rx="14" fill="#0a1222" stroke="#253a60" stroke-width="1.4"/>
    <!-- Window Header -->
    <rect x="0" y="0" width="406" height="32" rx="14" fill="#111d34"/>
    <rect x="0" y="18" width="406" height="14" fill="#111d34"/>
    <line x1="0" y1="32" x2="406" y2="32" stroke="#1e3154" stroke-width="1"/>
    <circle cx="18" cy="16" r="4.5" fill="#fb7185" fill-opacity="0.85"/>
    <circle cx="33" cy="16" r="4.5" fill="#fbbf24" fill-opacity="0.85"/>
    <circle cx="48" cy="16" r="4.5" fill="#34d399" fill-opacity="0.85"/>
    <text x="208" y="20" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="10.5">project-mastery-v1.html (Offline)</text>

    <!-- Left Mini Code Pane with Chinese Annotations -->
    <rect x="14" y="44" width="182" height="184" rx="8" fill="#070b12" stroke="#1d2b44"/>
    <text x="24" y="64" fill="#c084fc" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="600">fn <tspan fill="#60a5fa">RunPipeline</tspan>(in)</text>
    <text x="24" y="79" fill="#34d399" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9.5">↳ 核心编排：串联全链路阶段</text>
    <rect x="18" y="88" width="174" height="36" rx="5" fill="#38bdf8" fill-opacity="0.14"/>
    <rect x="18" y="88" width="3" height="36" rx="1.5" fill="#38bdf8"/>
    <text x="27" y="103" fill="#e2e8f0" font-family="ui-monospace, Consolas, monospace" font-size="10.5">ctx = <tspan fill="#38bdf8">ParseInput</tspan>(in)</text>
    <text x="27" y="117" fill="#34d399" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9.5">↳ 入口校验与强类型上下文</text>
    <text x="24" y="142" fill="#e2e8f0" font-family="ui-monospace, Consolas, monospace" font-size="10.5">ir = <tspan fill="#60a5fa">Transform</tspan>(ctx)</text>
    <text x="24" y="157" fill="#34d399" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9.5">↳ 核心状态变换与边界调度</text>
    <text x="24" y="180" fill="#e2e8f0" font-family="ui-monospace, Consolas, monospace" font-size="10.5"><tspan fill="#c084fc">return</tspan> <tspan fill="#fbbf24">EmitResult</tspan>(ir)</text>
    <text x="24" y="195" fill="#34d399" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9.5">↳ 契约交付、兜底降级与输出</text>
    <text x="24" y="216" fill="#64748b" font-family="ui-monospace, Consolas, monospace" font-size="10">}</text>
    <text x="36" y="216" fill="#34d399" fill-opacity="0.8" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">↳ 结束 RunPipeline</text>

    <!-- Bidirectional Sync Connector -->
    <path d="M 196 106 L 214 106" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 2"/>
    <circle cx="205" cy="106" r="3" fill="#38bdf8"/>

    <!-- Right Mini Interactive Flow Cards -->
    <g transform="translate(214, 44)">
      <!-- Node 1 -->
      <rect x="0" y="0" width="178" height="48" rx="8" fill="#0c2638" stroke="#38bdf8" stroke-width="1.6"/>
      <circle cx="16" cy="18" r="7.5" fill="#38bdf8"/>
      <text x="16" y="21.5" text-anchor="middle" fill="#080d16" font-family="sans-serif" font-size="9.5" font-weight="800">1</text>
      <text x="30" y="22" fill="#bae6fd" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" font-weight="700">入口解析与边界收敛</text>
      <text x="12" y="38" fill="#7dd3fc" font-family="ui-monospace, Consolas, monospace" font-size="9">↔ pipeline.core · L42</text>

      <!-- Arrow 1->2 -->
      <path d="M 89 48 L 89 64" stroke="#38bdf8" stroke-width="1.8"/>
      <polygon points="85,61 93,61 89,67" fill="#38bdf8"/>

      <!-- Node 2 (Active Glow) -->
      <rect x="0" y="68" width="178" height="48" rx="8" fill="#14203b" stroke="#818cf8" stroke-width="2"/>
      <circle cx="16" cy="86" r="7.5" fill="#818cf8"/>
      <text x="16" y="89.5" text-anchor="middle" fill="#080d16" font-family="sans-serif" font-size="9.5" font-weight="800">2</text>
      <text x="30" y="90" fill="#dbeafe" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" font-weight="700">核心算法与 6 维档案</text>
      <text x="12" y="106" fill="#a5b4fc" font-family="ui-monospace, Consolas, monospace" font-size="9">Input → Transform → Output</text>

      <!-- Arrow 2->3 -->
      <path d="M 89 116 L 89 132" stroke="#34d399" stroke-width="1.8"/>
      <polygon points="85,129 93,129 89,135" fill="#34d399"/>

      <!-- Node 3 -->
      <rect x="0" y="136" width="178" height="48" rx="8" fill="#0b2b24" stroke="#34d399" stroke-width="1.6"/>
      <circle cx="16" cy="154" r="7.5" fill="#34d399"/>
      <text x="16" y="157.5" text-anchor="middle" fill="#052e16" font-family="sans-serif" font-size="9.5" font-weight="800">✓</text>
      <text x="30" y="158" fill="#d1fae5" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" font-weight="700">产物交付与自测通关</text>
      <text x="12" y="174" fill="#6ee7b7" font-family="ui-monospace, Consolas, monospace" font-size="9">Dossier + Quiz + Interview</text>
    </g>
  </g>
</svg>
