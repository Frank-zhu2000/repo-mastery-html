  /* Blueprint SVG styles */
  .stage-band-bg { fill: var(--bg-elev); fill-opacity: 0.45; stroke: var(--border); stroke-width: 1; rx: 8; }

  .wf-grp-rect.security { fill: rgba(251,113,133,0.055); stroke: rgba(251,113,133,0.45); }
  .wf-grp-lbl { fill: var(--text-muted); font-size: 10px; font-weight: 700; }
  .src-chip-inline {
    display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: 5px;
    font-family: ui-monospace, Consolas, monospace; font-size: 10.5px;

  }

  .arch-node { cursor: pointer; transition: opacity 0.18s; }
  .arch-node .node-box { stroke-width: 1.5; transition: stroke-width 0.15s, filter 0.15s; }
  .arch-node:hover .node-box { stroke-width: 2.5; filter: drop-shadow(0 4px 12px rgba(56,189,248,0.28)); }
  .arch-node.active .node-box { stroke-width: 2.8; filter: drop-shadow(0 0 16px rgba(56,189,248,0.46)); }
  .arch-node.dimmed { opacity: 0.32; }
  .arch-node.peek .node-box { stroke-width: 2.6; stroke-dasharray: 5 3; }
  .arch-node .node-pulse { fill: none; stroke: var(--accent); stroke-width: 2; opacity: 0; pointer-events: none; }
  .arch-node.active .node-pulse { opacity: 0.8; animation: ringPulse 1.8s ease-out infinite; }
  @keyframes ringPulse { 0% { stroke-width: 2.5; opacity: 0.85; } 100% { stroke-width: 9; opacity: 0; } }
  .arch-node .node-title { font-size: 12.5px; font-weight: 700; pointer-events: none; }

  .arch-node .node-tag-tx { font-size: 9.2px; font-weight: 700; pointer-events: none; }

  .arch-edge { cursor: pointer; transition: opacity 0.2s; }

  .arch-edge .edge-path { fill: none; stroke-width: 1.8; transition: stroke-width 0.15s; }
  .arch-edge.variant-emphasis .edge-path { stroke: #38bdf8; stroke-width: 2.1; }
  .arch-edge.variant-security .edge-path { stroke: #fb7185; stroke-width: 2.1; }
  .arch-edge.variant-dashed .edge-path { stroke: #94a3b8; stroke-dasharray: 5 4; }

  /* 3-Flow Syllabus Table Section */

    background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 14px;

  .sf-badge {
    font-size: 10.5px; font-weight: 800; padding: 2px 9px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-ring);
  }
  .sf-badge.emerald { background: var(--emerald-soft); color: var(--emerald); border-color: rgba(52,211,153,0.4); }

  .sf-table th { color: var(--text-dim); font-size: 11px; font-weight: 700; border-top: none; background: var(--bg-panel); }

    display: inline-flex; align-items: center; justify-content: center;

  }

  .metro-bar {

    background: var(--bg); padding: 1px 4px; border-radius: 4px; color: var(--accent); border: 1px solid var(--border);

    width: 50%; min-width: 340px; display: flex; flex-direction: column;
    background: var(--code-bg); border-right: 1px solid var(--border); min-height: 0;
  }

    flex: 1; min-width: 340px; display: flex; flex-direction: column;
    background: var(--bg); min-height: 0; overflow-y: auto; padding: 12px 14px 20px;
  }

    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 6px 10px; background: var(--bg-panel); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .st-file-tabs { display: flex; gap: 4px; overflow-x: auto; }
  .st-file-tab {
    border: 1px solid transparent; background: transparent; color: var(--text-muted);
    padding: 4px 9px; border-radius: 6px; cursor: pointer; font-size: 11.5px;

ll>(null)// 错误信息","  const lastStreamRequest = ref<StreamRequestMeta | null>(null)","  let controller = new AbortController()","  let streamGeneration = 0","","  // 流式渲染缓冲","  let buffer: string[] = []","  let renderTimer: number | null = null","","  // 启动流式请求","  const startStream = async (params: { session_id: any; query: any; knowledge_base_ids?: string[]; knowledge_ids?: string[]; tag_ids?: string[]; agent_enabled?: boolean; agent_id?: string; agent_source_tenant_id?: string | number; web_search_enabled?: boolean; local_browser_enabled?: boolean; summary_model_id?: string; reasoning_effort?: string; mcp_service_ids?: string[]; skill_names?: string[]; mentioned_items?: Array<{id: string; name: string; type: string; kb_type?: string; kb_id?: string; kb_name?: string; service_id?: string; skill_name?: string}>; images?: Array<{data: string}>; attachment_uploads?: Array<{data: string; file_name: string; file_size: number}>; attachment_ids?: string[]; suggestion_attribution?: { suggestion_set_id: string; question_id: string }; question_origin?: { knowledge_base_id: string; knowledge_id?: string }; page_context?: PageContextPayload; assistant_access?: AssistantAccessLevel; method: string; url: string; resume_pending_id?: string; embed_token?: string; embed_session_sig?: string; embed_visitor_id?: string }) => {","    const myGeneration = ++streamGeneration","    const streamAbort = controller","    // 重置状态","    output.value = '';","    error.value = null;","    isStreaming.value = true;","    isLoading.value = true;","","    // 获取API配置","    const apiUrl = getApiBaseUrl();","    ","    const embedToken = params.embed_token;","    const token = embedToken || localStorage.getItem('weknora_token');","    if (!token) {","      error.value = i18n.global.t('error.tokenNotFound');","      stopStream();","      return;","    }","","    // 跨空间访问请求头：只要 setSelectedTenant 写过激活空间，就附","    // X-Tenant-ID。早期版本会 short-circuit \"selectedTenantId ===","    // defaultTenantId 时不附\" 来减少 "endLine":88,"explain":"主站通过 `meta: { requiresAuth, requiresInit, requiresTenant }` 分层守卫；公开网站挂件（Embed）则拆为独立 `embed.html` 入口，避免污染主站登录态与包体。","pitfall":"桌面 Lite WebView 硬刷新容易回退到 `/`，路由层用 `LITE_LAST_PATH_KEY` 在白名单路径内自动恢复用户上次页面。"},{"id":"sq1_2","order":2,"type":"frontend","label":"SSE 发流与租户头","sublabel":"无条件附X-Tenant-ID","tag":"防404断流","edgeLabel":"进网关","fileId":"fq1_sse","startLine":59,"endLine":130,"explain":"`useStream` 发起流式提问时记录 `sentAt` 与 `requestID` 对齐后端 TTFB 首字延迟，无条件附带激活空间 `X-Tenant-ID`，并严格规定断线后绝不重发 POST（改走 GET 续流）。","pitfall":"早期试图在“激活空间 == 默认空间”时省掉 `X-Tenant-ID` 头，导致 OIDC 同步后悄悄落回旧空间报 404！"},{"id":"sq1_3","order":3,"type":"cloud","label":"多端前置自鉴权面","sublabel":"IM · Embed · MCP · WS","tag":"免全局Auth","edgeLabel":"","fileId":"fq1_gin","startLine":174,"endLine":211,"explain":"后端 Gin 在全局登录中间件 `Auth` 之前精准挂载 4 类外部入口：IM 平台签名回调、Embed 短期令牌、内置 MCP 端点 Bearer 与沙箱 WS 一次性票据。","pitfall":"顺序绝不能写反！否则飞书/企微 Webhook 或外部 MCP 客户端会全部撞上全局 JWT 拦截返回 401。"}],"quiz":{"question":"用户从前端发起流式问答（`streame.ts`）时，为什么现在改为只要设置了激活工作空间就无条件附带 `X-Tenant-ID` 请求头？","options":["因为 HTTP/2 规范要求必须带 X-Tenant-ID","早期按“等于默认空间就省略”的优化会在 OIDC/状态刷新后悄悄丢头，导致流式请求落到错误空间返回 404","为了让浏览器缓存 SSE 响应","用来绕过后端 RBAC 鉴权"],"correctIndex":1,"explanation":"答对了！前端显式透传激活空间 ID，后端依然在服务端做 `IsTenantAccessible` 真值校验，既不丢上下文又绝不信任伪造头。"},"interviewQ":"从用户点击“发送问题”到请求进入后端业务层，前后端接口层做了哪些关键工程保护？","interviewA":"前端 `streame.ts` 附带 `X-Request-ID` 做首字延迟 TTFB 对齐、无条件透传 `X-Tenant-ID` 并用 `streamGeneration` 防并发竞态；后端 `router.go` 限制 `TrustedProxies` 防伪造 XFF 绕过限流，将 IM/Embed/MCP/WS 自鉴权入口前置，常规 Web/API 请求统一收归 `/api/v1`。","whyBlock":{"painPoint":"企业级 AI 知识库同时服务 Web、Wails 桌面、9 类 IM（企微/飞书/钉钉/Slack 等）、Embed 嵌入挂件与内置 MCP Server，拥有 355 个路径 / 456 个操作。如果请求入口没按「前置通道 + 统一鉴权 + 真实来源校验」分层，或者前端断线后直接重发 POST，轻则限流被绕过，重则重复触发 LLM/Agent 写操作造成资损！","analogy":"请求接入层就像**国际机场安检大厅**：行李先过安检清理（`MultipartFormCleanup`），海关核实真实护照来源防伪造（`TrustedProxies`），外交/中转通道走专属前置门（IM/Embed/MCP/WS），普通旅客全进主航站楼安检（`/api/v1`）；登机牌上还会盖唯一追踪号（`X-Request-ID`），如果飞机晚点（断线），旅客凭登机牌去改签口续乘，绝不重新买票重检！","avoidRabbitHole":"不要一口气把 `internal/router/routes_*.go` 里 355 个接口或 267 个 Vue 页面全翻一遍！本站只需抓牢 `frontend/src/router/index.ts`（免登白名单）、`api/chat/streame.ts`（SSE 发起与 Abort 防重发）和 `internal/router/router.go`（前置挂载顺序）这三处入口锚点即可。"},"ioContract":{"inType":"Browser / IM / MCP 原始请求 · HTTP POST /api/v1/knowledge-chat/:session_id","inFields":[{"name":"Authorization","type":"Header (string)","desc":"Bearer JWT 登录态令牌或 sk-xxx 租户 API Key"},{"name":"X-Tenant-ID","type":"Header (uint64)","desc":"当前空间/租户 ID（用于跨空间切换校验）"},{"name":"X-Request-ID","type":"Header (UUID)","desc":"全链路唯一请求追踪号，串联前端 TTFB、后端日志与 Langfuse Trace"},{"name":"query","type":"Body (string)","desc":"用户输入的原始自然语言问题文本"},{"name":"knowledge_base_ids","type":"Body (string[])","desc":"前端勾选的目标知识库 ID 列表（仅作为候选，待下一站强收敛）"},{"name":"agent_enabled","type":"Body (bool)","desc":"是否启用 ReAct 多轮工具智能体模式（false 则走快速 RAG Pipeline）"}],"inSample":"POST /api/v1/knowledge-chat/sess_9f2a1c HTTP/1.1\nAuthorization: Bearer eyJhbGciOiJIUzI1NiIs...\nX-Tenant-ID: 10042\nX-Request-ID: req_20261121_8a91c0\nAccept: text/event-stream\n\n{\n  \"query\": \"今年差旅住宿报销一线城市标准是多少？\",\n  \"knowledge_base_ids\": [\"kb_finance_2026\", \"kb_shared_hr\"],\n  \"knowledge_ids\": [],\n  \"web_search_enabled\": false,\n  \"agent_enabled\": false,\n  \"attachments\": []\n}","transformSteps":["Vue Router 全局守卫校验 JWT 与免登白名单（`/login`、`/embed`），放行合法对话页","前端 `streame.ts` 创建 `AbortController` 发起 `fetchEventSource`，注册 `onopen` 记录 TTFB 并禁用自动重试 POST","Gin `router.go` 依次经过 `TrustedProxies`、`Recovery`、`RequestID` 与前置多渠道路由（IM/Embed/MCP/WS），进入 `/api/v1` 主干"],"outType":"gin.Context（携带追踪上下文，准备进入认证与权限收敛中间件链）","outFields":[{"name":"c.Request.Context()","type":"context.Context","desc":"已注入 RequestID、ClientIP 与客户端取消信号（断连自动取消）"},{"name":"RouteMatch","type":"string","desc":"命中路由组 `/api/v1/knowledge-chat/:session_id`，挂入 Auth + APIKeyGate + RBAC 链"},{"name":"RawBodyPayload","type":"types.CreateChatRequest","desc":"反序列化后的提问、候选 KB 列表、附件与模式开关"}],"outSample":"{\n  \"route\": \"POST /api/v1/knowledge-chat/:session_id\",\n  \"session_id\": \"sess_9f2a1c\",\n  \"request_id\": \"req_20261121_8a91c0\",\n  \"client_ip\": \"10.24.8.19\",\n  \"auth_header_present\": true,\n  \"raw_kb_candidates\": [\"kb_finance_2026\", \"kb_shared_hr\"],\n  \"next_middleware\": [\"Auth\", \"APIKeyGate\", \"RBAC\"]\n}"}},{"id":"q2","flowId":"flow_qa","stage":1,"row":1,"dfNodeId":"scope_guard","techCompIds":["gateway","qa_agent"],"wbTarget":{"moduleId":"m_auth","nodeId":"au_triple"},"codeLabel":"1-2","title":"权限收敛与改写：后端如何确保绝不偷看到别人的知识库？","dfLabel":"权限收敛与改写","dfSublabel":"RBAC · KB范围 · 改写","dfTag":"空间隔离","nodeType":"security","stars":4,"duration":"15 分钟","inputSpec":"已进入 `/api/v1` 的用户请求（携带 Bearer JWT 或 X-API-Key，及客户端传入的 `knowledge_base_ids`）","outputSpec":"服务端完成真值验证后的合法 `Principal` 身份 + 收敛过的可检索 KB 白名单（越权直接 404 阻断）","packetSample":"AuthContext: { user_id: \"u_42\", tenant_id: 1001, role: \"contributor\", api_key_scope: null }\nAuthorizedKBs: [\"kb_hr\"] // 跨空间无权 KB 直接返回 404 NotFound","analogy":"就像**进入企业档案室查资料**：大门先核对员工工牌还是外部访客证（三轨认证 + API Key 默认拒绝）；进了房间哪怕你报出一个机密档案柜编号，管理员也会核查三维共享权限，没权看的柜子直接回复“查无此柜（404）”不让你猜编号！","files":[{"id":"fq2_auth","path":"internal/middleware/auth.go","sliceStart":141,"sliceEnd":220,"label":"middleware/auth.go","relPath":"internal/middleware/auth.go","startLine":141,"endLine":220,"lines":["\t\t// 检查请求是否在无需认证的API列表中","\t\tif isNoAuthAPI(c.Request.URL.Path, c.Request.Method) {","\t\t\tc.Next()","\t\t\treturn","\t\t}","","\t\t// In-process dispatch (agent operations): the identity lives on the Go","\t\t// context, which no inbound request can carry, and is re-validated","\t\t// against the database exactly like a JWT session.","\t\tif dispatch, ok := types.InternalDispatchFromContext(c.Request.Context()); ok {","\t\t\tif authenticateInternalDispatch(c, tenantService, userService, memberService, cfg, dispatch) {","\t\t\t\tc.Next()","\t\t\t}","\t\t\treturn","\t\t}","","\t\t// 尝试JWT Token认证","\t\tbearerPresented := false","\t\tif token, ok := bearerToken(c); ok {","\t\t\tbearerPresented = true","\t\t\tuser, jwtTenantID, err := userService.ValidateToken(c.Request.Context(), token)","\t\t\tif err == nil && user != nil {","\t\t\t\tif authenticateJWTUser(c, tenantService, memberService, cfg, user, jwtTenantID) {","\t\t\t\t\tc.Next()","\t\t\t\t}","\t\t\t\treturn","\t\t\t}","\t\t\tlogger.Warnf(c.Request.Context(), \"[auth] bearer token rejected: %v\", err)","\t\t}","","\t\t// 尝试X-API-Key认证（兼容模式）","\t\tif apiKey := c.GetHeader(\"X-API-Key\"); apiKey != \"\" {","\t\t\tif apiKeyService == nil {","\t\t\t\tc.JSON(http.StatusUnauthorized, gin.H{\"error\": \"Unauthorized: API key service is not configured\"})","\t\t\t\tc.Abort()","\t\t\t\treturn","\t\t\t}","\t\t\tif authenticateAPIKeyRequest(c, tenantService, userService, apiKeyService, apiKey) {","\t\t\t\tc.Next()","\t\t\t}","\t\t\treturn","\t\t}","","\t\t// 没有任何通道认证成功","\t\tif bearerPresented {","\t\t\tc.JSON(http.StatusUnauthorized, gin.H{\"error\": \"Unauthorized: invalid or expired token\"})","\t\t} else {","\t\t\tc.JSON(http.StatusUnauthorized, gin.H{\"error\": \"Unauthorized: missing authentication\"})","\t\t}","\t\tc.Abort()","\t}","}","","// authenticateInternalDispatch authenticates a request the server dispatched","// to itself on behalf of a signed-in user. The user is reloaded so a disabled","// account or revoked membership takes effect immediately, and tenant/role","// resolution goes through the same path as a JWT session pinned to the","// dispatch tenant. Credential headers are ignored: the dispatcher never sets","// them, and honoring them here would let a caller switch identities.","func authenticateInternalDispatch(","\tc *gin.Context,","\ttenantService interfaces.TenantService,","\tuserService interfaces.UserService,","\tmemberService interfaces.TenantMemberService,","\tcfg *config.Config,","\tdispatch types.InternalDispatch,",") bool {","\tctx := c.Request.Context()","\tuser, err := userService.GetUserByID(ctx, dispatch.UserID)","\tif err != nil || user == nil || !user.IsActive {","\t\tlogger.Warnf(ctx, \"[auth] internal dispatch rejected: user=%s err=%v\", dispatch.UserID, err)","\t\tc.JSON(http.StatusUnauthorized, gin.H{\"error\": \"Unauthorized: invalid dispatch identity\"})","\t\tc.Abort()","\t\treturn false","\t}","\tc.Request.Header.Del(\"Authorization\")","\tc.Request.Header.Del(\"X-API-Key\")","\tc.Request.Header.Set(\"X-Tenant-ID\", strconv.FormatUint(dispatch.TenantID, 10))","\treturn authenticateJWTUser(c, tenantService, memberService, cfg, user, dispatch.TenantID)","}"]},{"id":"fq2_gate","path":"internal/middleware/api_key_gate.go","sliceStart":111,"sliceEnd":172,"label":"api_key_gate.go","relPath":"internal/middleware/api_key_gate.go","startLine":111,"endLine":172,"lines":["func (a *APIKeyRouteAuthorizer) Middleware() gin.HandlerFunc {","\treturn func(c *gin.Context) {","\t\tscope, ok := types.TenantAPIKeyScopeFromContext(c.Request.Context())","\t\tif !ok {","\t\t\tc.Next()","\t\t\treturn","\t\t}","\t\tif err := a.authorize(scope, c.Request.Method, c.FullPath()); err != nil {","\t\t\tc.AbortWithStatusJSON(http.StatusForbidden, gin.H{","\t\t\t\t\"error\": \"Forbidden: API key scope does not allow this operation\",","\t\t\t})","\t\t\treturn","\t\t}","\t\tc.Next()","\t}","}","","// authorize applies the declared policy to an API-key scope. Absent policy =>","// default deny.","func (a *APIKeyRouteAuthorizer) authorize(scope types.TenantAPIKeyScope, method, fullPath string) error {","\tpolicy, ok := a.Lookup(method, fullPath)","\tif !ok {","\t\treturn errTenantAPIKeyScopeForbidden","\t}","\tif policy.PlatformOnly && !scope.IsPlatform() {","\t\treturn errTenantAPIKeyScopeForbidden","\t}","\tif policy.PlatformOnly && len(policy.Capabilities) == 0 {","\t\treturn errTenantAPIKeyScopeForbidden","\t}","\tif scope.FullAccess {","\t\treturn nil","\t}","\tfor _, cap := range policy.Capabilities {","\t\tif cap != \"\" && scope.HasCapability(cap) {","\t\t\treturn nil","\t\t}","\t}","\tif !policy.RequireFullAccess && len(policy.Capabilities) == 0 {","\t\treturn nil","\t}","\treturn errTenantAPIKeyScopeForbidden","}","","// DenyAPIKeyPrincipal returns a middleware that rejects any X-API-Key","// principal outright. Use it on routes registered directly on the engine","// (outside the /api/v1 group) where the APIKeyRouteAuthorizer.Middleware","// gate does NOT run — the JWT role guards (RequireRole / RequireSystemAdmin","// / RequireOwnershipOrRole) short-circuit API-key principals on the","// assumption the gate already authorized them, so an ungated route would","// otherwise let any valid key through. JWT sessions pass straight through.","func DenyAPIKeyPrincipal() gin.HandlerFunc {","\treturn func(c *gin.Context) {","\t\tif _, ok := types.TenantAPIKeyScopeFromContext(c.Request.Context()); ok {","\t\t\tc.AbortWithStatusJSON(http.StatusForbidden, gin.H{","\t\t\t\t\"error\": \"Forbidden: API keys cannot access this endpoint\",","\t\t\t})","\t\t\treturn","\t\t}","\t\tc.Next()","\t}","}"]},{"id":"fq2_kb","path":"internal/application/access/kb_search.go","sliceStart":23,"sliceEnd":65,"label":"access/kb_search.go","relPath":"internal/application/access/kb_search.go","startLine":23,"endLine":65,"lines":["func AuthorizeKBAccess(","\tctx context.Context,","\tshares KBShareLookup,","\tkbs []*types.KnowledgeBase,",") error {","\tif len(kbs) == 0 {","\t\treturn nil","\t}","","\tkbIDs := make([]string, 0, len(kbs))","\tfor _, kb := range kbs {","\t\tkbIDs = append(kbIDs, kb.ID)","\t}","\tif err := types.AuthorizeTenantAPIKeyKnowledgeBases(ctx, kbIDs...); err != nil {","\t\treturn err","\t}","","\trequestTenantID := types.CallerFromContext(ctx).TenantID","\tpermissions := NewKBPermissions(ctx, shares)","","\tfor _, kb := range kbs {","\t\thasPermission, permErr := permissions.Check(kb.ID, kb.TenantID, types.OrgRoleViewer)","\t\tif permErr != nil {","\t\t\tlogger.ErrorWithFields(ctx, permErr, map[string]interface{}{","\t\t\t\t\"caller_tenant_id\": requestTenantID,","\t\t\t\t\"kb_tenant_id\":     kb.TenantID,","\t\t\t\t\"kb_id\":            kb.ID,","\t\t\t\t\"reason\":           \"shared-KB permission lookup failed\",","\t\t\t})","\t\t\treturn apperrors.NewInternalServerError(\"failed to verify knowledge base access\")","\t\t}","\t\tif !hasPermission {","\t\t\tlogger.WarnWithFields(ctx, logger.Fields{","\t\t\t\t\"caller_tenant_id\": requestTenantID,","\t\t\t\t\"kb_tenant_id\":     kb.TenantID,","\t\t\t\t\"kb_id\":            kb.ID,","\t\t\t\t\"reason\":           \"tenant lacks viewer permission for foreign-tenant KB\",","\t\t\t}, \"search scope rejected: unauthorized foreign-tenant KB\")","\t\t\treturn apperrors.NewNotFoundError(\"knowledge base not found\")","\t\t}","\t}","\treturn nil","}"]}],"steps":[{"id":"sq2_1","order":1,"type":"security","label":"三轨身份解析","sublabel":"内部派发·JWT·APIKey","tag":"零信任头","edgeLabel":"门禁","fileId":"fq2_auth","startLine":141,"endLine":220,"explain":"按「免鉴权白名单 → 进程内 `InternalDispatch`（回库重查 `IsActive` 并删外部头）→ JWT Bearer → `X-API-Key`」顺序解析调用者身份，杜绝伪造。","pitfall":"进程内代用户执行操作时必须主动清空 `Authorization`/`X-API-Key` 头，避免下游误用残留凭据。"},{"id":"sq2_2","order":2,"type":"security","label":"API Key 默认拒绝","sublabel":"未显式声明即 403","tag":"Default-Deny","edgeLabel":"收敛","fileId":"fq2_gate","startLine":111,"endLine":172,"explain":"机器 API Key 与人类 RBAC 彻底正交分离：`APIKeyRouteAuthorizer.Middleware()` 查启动期注册的路由策略表，未声明的路由默认 403 拒绝（且启动期自检防止路径模板漂移）。","pitfall":"直接挂在 Gin Engine 外的非 `/api/v1` 路由需额外挂 `DenyAPIKeyPrincipal()` 防漏网。"},{"id":"sq2_3","order":3,"type":"database","label":"多KB收敛与404","sublabel":"三维权限封顶·防枚举","tag":"防存在泄露","edgeLabel":"","fileId":"fq2_kb","startLine":23,"endLine":65,"explain":"`AuthorizeKBAccess` 逐一核验 API Key KB 白名单与组织共享三维封顶（共享角色 + 组织角色 + 租户 Viewer 上限），任一未授权跨空间 KB 写审计并返 `404 NotFound`。","pitfall":"返回 `403` 会向攻击者暴露“该 UUID 对应的知识库存在”，返回 `404` 彻底消除枚举探测！"}],"quiz":{"question":"在 `access/kb_search.go` 中，当调用者传入一个无权访问的跨租户 KB UUID 时，为什么返回 `404 NotFound` 而不是 `403 Forbidden`？","options":["因为 Go HTTP 标准库没有 403 状态码","防止攻击者通过遍历 UUID 区分“不存在(404)”与“存在但无权(403)”从而枚举出其他租户的敏感 KB ID","为了让浏览器自动重试请求","因为数据库查询超时统一映射为 404"],"correctIndex":1,"explanation":"正确！防存在性枚举（anti-enumeration）是多租户企业级 SaaS 鉴权设计的黄金准则。"},"interviewQ":"多租户 RAG 问答系统，怎么保证用户绝不会通过多库联合检索越权查到其他空间的机密分块？","interviewA":"实行“入口双轨门禁 + 领域层范围收敛”双重防线：`middleware` 完成三轨身份解析、四级 RBAC 与 API Key Default-Deny；检索前 `access.AuthorizeKBAccess` 强制校验 API Key KB 白名单及组织共享三维封顶，越权记录审计日志并统一返 404 防枚举。","whyBlock":{"painPoint":"企业多租户场景同时存在登录员工（JWT）、外部系统调用（API Key）、内部调度（Internal Dispatch）以及跨组织共享知识库。如果轻信前端传来的 `knowledge_base_ids`，或者 API Key 漏配白名单默认放行，又或者越权访问返回 403 暴露资源存在，就会立刻发生跨租户越权泄密事故！","analogy":"权限收敛就像**写字楼门禁 + 会议室智能锁双重核验**：一楼保安（`Auth + APIKeyGate`）先核实你的工牌或访客临时卡（默认拒绝所有未登记楼层）；走到具体会议室门口，门锁（`application/access/`）再核对房间是不是你建的或共享给你的——对于没共享的房间，门锁甚至直接回复「查无此房（404）」而非「你无权进入（403）」，彻底杜绝黑客扫库踩点！","avoidRabbitHole":"外围的 OIDC/SSO/LDAP 第三方登录细节（`oidc.go`）可以先跳过！本站牢牢吃透「三轨认证 → API Key 默认拒绝 + 启动期路由一致性断言 → 服务端检索范围收敛（`ResolveKnowledgeSearchScope`）」三道铁门即可。"},"ioContract":{"inType":"gin.Context（未认证的原始 HTTP 凭证与前端候选知识库列表）","inFields":[{"name":"Authorization / X-API-Key","type":"string","desc":"Bearer JWT、sk-xxx 能力范围 API Key 或内部调度签名"},{"name":"requestedKBIDs","type":"[]string","desc":"前端勾选的候选知识库 ID（不可信，可能含他租户或无权 ID）"},{"name":"requestedKnowledgeIDs","type":"[]string","desc":"前端 @ 提及的单篇文档 ID 列表"}],"inSample":"{\n  \"token_type\": \"Bearer JWT\",\n  \"claimed_tenant_id\": 10042,\n  \"requested_kb_ids\": [\"kb_finance_2026\", \"kb_shared_hr\", \"kb_other_secret\"],\n  \"requested_knowledge_ids\": [\"doc_travel_2026\"],\n  \"http_method_path\": \"POST /api/v1/knowledge-chat/:session_id\"\n}","transformSteps":["`auth.go` 执行三轨认证解析出可信 `UserID`、`TenantID` 与 `AuthType`，禁止伪造跨租户身份","`api_key_gate.go` 对 API Key 强制执行「未登记即 403 默认拒绝」，按路径模板校验能力域（Capability）","`kb_search.go` 查询本租户 + 跨空间共享表，剔除非法 ID（如 `kb_other_secret`），收敛为最小可信 `SearchTargets`"],"outType":"types.SearchTargets & 已授权 Context（传给下游检索与 RAG 编排）","outFields":[{"name":"ctx.TenantID / UserID","type":"uint64 / string","desc":"经服务端验签确认的真实租户 ID 与用户 ID"},{"name":"SearchTargets","type":"types.SearchTargets","desc":"按目标租户分组的合法 `(TenantID, KBID, KnowledgeIDs)` 白名单集合"},{"name":"RejectedCount","type":"int","desc":"被静默剔除的无权知识库/文档数量（不泄露存在性）"}],"outSample":"{\n  \"verified_user_id\": \"u_88201\",\n  \"verified_tenant_id\": 10042,\n  \"auth_track\": \"jwt\",\n  \"search_targets\": [\n    {\n      \"tenant_id\": 10042,\n      \"kb_id\": \"kb_finance_2026\",\n      \"knowledge_ids\": [\"doc_travel_2026\"],\n      \"share_role\": \"owner\"\n    },\n    {\n      \"tenant_id\": 10099,\n      \"kb_id\": \"kb_shared_hr\",\n      \"knowledge_ids\": [],\n      \"share_role\": \"viewer\"\n    }\n  ],\n  \"dropped_unauthorized\": [\"kb_other_secret\"]\n}"}},{"id":"q3","flowId":"flow_qa","stage":2,"row":1,"dfNodeId":"vector_graph","techCompIds":["vector_graph","rdb"],"wbTarget":{"moduleId":"rag","nodeId":"pg_hnsw"},"codeLabel":"1-3","title":"向量与图谱索引：多路并行召回 & PG 动态维度 HNSW 无锁建索引","dfLabel":"向量与图谱索引","dfSublabel":"pgvector HNSW · Neo4j","dfTag":"原子替换","nodeType":"database","stars":5,"duration":"16 分钟","inputSpec":"经服务端权限收敛后的合法 KB 集合 + 改写/扩展后的查询向量与关键词","outputSpec":"多路检索（向量余弦 Top-K + 关键词 BM25 Top-K + 可选图谱实体）原始候选列表","packetSample":"VectorHits(halfvec HNSW): 28 chunks [cosine 0.89..0.52]\nBM25Hits(paradedb.score): 19 chunks [raw score 24.6..3.1]\nHNSWIndex: embeddings_embedding_idx_1024 (READY)","analogy":"就像**用“语义联想 + 精确字面索引”双管齐下翻书架**；更厉害的是，如果团队某天临时换了一套新规格（新维度）的向量编码模型，图书馆绝不闭馆装修（不锁表），而是在后台派专人拿唯一施工牌（Advisory Lock）悄悄加装新维度高速索引（`CONCURRENTLY`）！","files":[{"id":"fq3_hnsw","path":"internal/application/repository/retriever/postgres/hnsw_index.go","sliceStart":36,"sliceEnd":165,"label":"postgres/hnsw_index.go","relPath":"internal/application/repository/retriever/postgres/hnsw_index.go","startLine":36,"endLine":165,"lines":["// ensureHNSWIndex schedules, once per dimension per process, a background","// check that the embeddings table has a partial HNSW index for that","// dimension, the way migrations 000002 and 000059 provide for 3584, 798 and","// 1024. Any other dimension fell through to a sequential scan on every","// vector query (#3298). It runs on every write and vector query, so it only","// touches a map; the request is never blocked and never fails because of","// the index.","func (g *pgRepository) ensureHNSWIndex(dimension int) {","\tif dimension <= 0 || !g.autoIndex {","\t\treturn","\t}","\tif _, seen := g.hnswSeen.LoadOrStore(dimension, struct{}{}); seen {","\t\treturn","\t}","\tgo g.buildHNSWIndex(dimension)","}","","// buildHNSWIndexInBackground is the default buildHNSWIndex. The dimension","// stays marked as seen whatever happens, so a failure is reported once per","// process instead of on every request, and the log line says what to do.","func (g *pgRepository) buildHNSWIndexInBackground(dimension int) {","\tif err := g.createHNSWIndex(dimension); err != nil {","\t\tlogger.GetLogger(context.Background()).Warnf(\"[Postgres] HNSW index for %d-dim embeddings: %v \"+","\t\t\t\"(vector queries on this dimension keep scanning sequentially; \"+","\t\t\t\"build it by hand with CREATE INDEX CONCURRENTLY, or restart to retry)\", dimension, err)","\t}","}","","// hnswIndexRow is one HNSW index over a dimension's halfvec cast, whatever it","// is called: the migrations' name, or one an operator built by hand.","type hnswIndexRow struct {","\tName  string `gorm:\"column:name\"` // indexrelid::regclass::text, ready for DROP INDEX","\tValid bool   `gorm:\"column:valid\"`","}","","// createHNSWIndex builds the partial HNSW index for one dimension unless a","// valid one already exists. An invalid index of the app's own name is the","// leftover of a build that did not finish and is dropped first, because IF","// NOT EXISTS would keep it forever; an invalid index of any other name is","// left alone. The whole sequence runs on one pinned connection under a","// session advisory lock, so replicas take turns instead of dropping each","// other's builds, and CREATE INDEX CONCURRENTLY runs outside a transaction","// as PostgreSQL requires. statement_timeout is lifted for the DDL and reset","// before the connection is returned to the pool.","func (g *pgRepository) createHNSWIndex(dimension int) error {","\tctx := context.Background()","\tlog := logger.GetLogger(ctx)","\tif dimension > maxHNSWHalfvecDimension {","\t\tlog.Warnf(\"[Postgres] No HNSW index for %d-dim embeddings: pgvector indexes halfvec up to %d dimensions, \"+","\t\t\t\"so vector queries on this dimension scan sequentially\", dimension, maxHNSWHalfvecDimension)","\t\treturn nil","\t}","\tname := hnswIndexName(dimension)","\tpredicate := fmt.Sprintf(\"(dimension = %d)\", dimension)","\treturn g.db.WithContext(ctx).Connection(func(conn *gorm.DB) error {","\t\t// Every statement gets its own session on the pinned connection: gorm","\t\t// keeps one statement per instance here, so an error from one would","\t\t// otherwise stick and silently skip the ones after it, the unlock","\t\t// included.","\t\ton := func() *gorm.DB { return conn.Session(&gorm.Session{NewDB: true}) }","\t\tvar locked bool","\t\tif err := on().Raw(\"SELECT pg_try_advisory_lock(?, ?)\", hnswAdvisoryLockKey, dimension).","\t\t\tScan(&locked).Error; err != nil {","\t\t\treturn fmt.Errorf(\"could not take the build lock: %w\", err)","\t\t}","\t\tif !locked {","\t\t\tlog.Infof(\"[Postgres] Another process is building the HNSW index for %d-dim embeddings\", dimension)","\t\t\treturn nil","\t\t}","\t\tdefer on().Exec(\"SELECT pg_advisory_unlock(?, ?)\", hnswAdvisoryLockKey, dimension)","","\t\tvar rows []hnswIndexRow","\t\terr := on().Raw(`","\t\t\tSELECT i.indexrelid::regclass::text AS name, i.indisvalid AS valid","\t\t\tFROM pg_index i","\t\t\tWHERE i.indrelid = 'embeddings'::regclass","\t\t\t  AND pg_get_indexdef(i.indexrelid) LIKE '%USING hnsw%'","\t\t\t  AND pg_get_indexdef(i.indexrelid) LIKE ?","\t\t  AND pg_get_indexdef(i.indexrelid) LIKE '%halfvec_cosine_ops%'","\t\t  AND (i.indpred IS NULL OR pg_get_expr(i.indpred, i.indrelid) = ?)`,","\t\t\tfmt.Sprintf(\"%%halfvec(%d)%%\", dimension), predicate).Scan(&rows).Error","\t\tif err != nil {","\t\t\treturn fmt.Errorf(\"could not read the catalog: %w\", err)","\t\t}","\t\tfor _, row := range rows {","\t\t\tif row.Valid {","\t\t\t\tlog.Debugf(\"[Postgres] HNSW index %s already covers %d-dim embeddings\", row.Name, dimension)","\t\t\t\treturn nil","\t\t\t}","\t\t}","","\t\t// Everything from here may run a CONCURRENTLY statement, which can take","\t\t// a long time on a large table. A statement_timeout set on the role or","\t\t// the database would cancel it and leave exactly the invalid index this","\t\t// function exists to repair — which then waits for a restart to be","\t\t// retried. Lift it for this session only. SET LOCAL is not an option:","\t\t// CONCURRENTLY cannot run inside a transaction. The connection goes","\t\t// back to the pool afterwards, so the RESET is not optional either.","\t\tif err := on().Exec(\"SET statement_timeout = 0\").Error; err != nil {","\t\t\treturn fmt.Errorf(\"could not lift statement_timeout for the build: %w\", err)","\t\t}","\t\tdefer func() {","\t\t\tif err := on().Exec(\"RESET statement_timeout\").Error; err != nil {","\t\t\t\tlog.Warnf(\"[Postgres] Could not reset statement_timeout after the HNSW build: %v \"+","\t\t\t\t\t\"(this pooled connection may run without the configured timeout until it is recycled)\", err)","\t\t\t}","\t\t}()","\t\tfor _, row := range rows {","\t\t\tif row.Name != name {","\t\t\t\tlog.Warnf(\"[Postgres] Invalid HNSW index %s over %d-dim embeddings is not the app's; leaving it alone \"+","\t\t\t\t\t\"(drop it by hand if no build is running)\", row.Name, dimension)","\t\t\t\tcontinue","\t\t\t}","\t\t\t// The app's own name, invalid: a build that died, or one still","\t\t\t// running in a session that does not hold the lock (an older","\t\t\t// version, an operator's psql). Only the first may be dropped.","\t\t\tvar building int64","\t\t\tinFlight := \"SELECT count(*) FROM pg_stat_progress_create_index WHERE relid = 'embeddings'::regclass\"","\t\t\tif err := on().Raw(inFlight).Scan(&building).Error; err != nil {","\t\t\t\treturn fmt.Errorf(\"could not tell whether %s is still being built: %w\", name, err)","\t\t\t}","\t\t\tif building > 0 {","\t\t\t\tlog.Infof(\"[Postgres] HNSW index %s is being built by another session; leaving it to finish\", name)","\t\t\t\treturn nil","\t\t\t}","\t\t\tlog.Warnf(\"[Postgres] Dropping invalid HNSW index %s (an earlier build did not finish) \"+","\t\t\t\t\"before rebuilding it\", name)","\t\t\tif err := on().Exec(\"DROP INDEX CONCURRENTLY IF EXISTS \" + row.Name).Error; err != nil {","\t\t\t\treturn fmt.Errorf(\"could not drop invalid index %s: %w\", name, err)","\t\t\t}"]},{"id":"fq3_sq","path":"internal/application/repository/retriever/sqlite/repository.go","sliceStart":39,"sliceEnd":78,"label":"sqlite/repository.go","relPath":"internal/application/repository/retriever/sqlite/repository.go","startLine":39,"endLine":78,"lines":["type sqliteRepository struct {","\tdb *gorm.DB","\t// vecMu guards vecTables: concurrent BatchSave and retrieval goroutines","\t// all consult it, and an unguarded map write is a fatal runtime error.","\tvecMu     sync.RWMutex","\tvecTables map[int]bool // tracks which vec0 tables have been created (keyed by dimension)","\t// ftsUnavailable records that the driver was built without the fts5 module","\t// (upstream test runs do not pass -tags sqlite_fts5). Keyword indexing","\t// cannot exist in such a build at all, so its writes are skipped instead of","\t// failing every ingestion; Lite release builds always pass the tag.","\tftsUnavailable bool","}","","func NewSQLiteRetrieveEngineRepository(db *gorm.DB) interfaces.RetrieveEngineRepository {","\tlogger.GetLogger(context.Background()).Info(\"[SQLite] Initializing SQLite retriever engine repository with sqlite-vec\")","","\tif err := db.AutoMigrate(&sqliteEmbedding{}); err != nil {","\t\tlogger.GetLogger(context.Background()).Errorf(\"[SQLite] Failed to auto-migrate lite_embeddings: %v\", err)","\t}","","\trepo := &sqliteRepository{","\t\tdb:        db,","\t\tvecTables: make(map[int]bool),","\t}","","\tif err := repo.initFTS5(); err != nil {","\t\tif errors.Is(err, errFTS5ModuleMissing) {","\t\t\trepo.ftsUnavailable = true","\t\t\tlogger.GetLogger(context.Background()).Warnf(","\t\t\t\t\"[SQLite] Keyword index disabled, driver has no fts5 module: %v\", err)","\t\t} else {","\t\t\tlogger.GetLogger(context.Background()).Errorf(\"[SQLite] Failed to initialize FTS5 index: %v\", err)","\t\t}","\t}","\tenableImageChunkIndexes(db)","","\trepo.ensureExistingVecTables()","","\treturn repo","}"]}],"steps":[{"id":"sq3_1","order":1,"type":"backend","label":"非阻塞懒触发与锁","sublabel":"hnswSeen + Advisory Lock","tag":"多副本互斥","edgeLabel":"无锁建","fileId":"fq3_hnsw","startLine":43,"endLine":118,"explain":"读写向量时 `ensureHNSWIndex` 先按 `sync.Map` 进程内去重并限制 `≤4000` 维，再后台起协程用独立连接抢 `pg_try_advisory_lock(0x574B4E48, dim)` 串行多副本，并查 `pg_stat_progress_create_index` 清理残留无效索引。","pitfall":"绝不能跳过进度表检查直接删 `INVALID` 索引，否则会把另一副本正在建的索引中途腰斩！"},{"id":"sq3_2","order":2,"type":"database","label":"CONCURRENTLY与Reset","sublabel":"禁事务 · defer恢复超时","tag":"必考暗坑","edgeLabel":"Lite版","fileId":"fq3_hnsw","startLine":119,"endLine":165,"explain":"在非事务连接上 `SET statement_timeout = 0` 执行 `CREATE INDEX CONCURRENTLY ... USING hnsw ((embedding::halfvec(dim)) halfvec_cosine_ops)`，最后务必 `defer RESET statement_timeout`！","pitfall":"因为 `CONCURRENTLY` 不能在事务内跑，所以不能用 `SET LOCAL`；若忘写 `RESET`，该连接回池后会永久失去 SQL 超时保护！"},{"id":"sq3_3","order":3,"type":"cloud","label":"Lite SQLite 双引擎","sublabel":"sqlite-vec + FTS5","tag":"零依赖对等","edgeLabel":"","fileId":"fq3_sq","startLine":39,"endLine":78,"explain":"Lite 单进程版用 `sqlite-vec` 按维度动态建 `vec0` 虚拟表（受 `vecMu` 读写锁保护）+ FTS5 倒排全文索引，零外部组件跑完同样的混合召回。","pitfall":"10 类检索后端（Milvus/ES/Qdrant 等）共用统一接口，学习时精读 PG + SQLite 这两套即可覆盖 95% 考点。"}],"quiz":{"question":"在 `hnsw_index.go` 中为新维度 Embedding 动态创建索引时，为什么必须用会话级 `SET statement_timeout = 0` 加 `defer RESET`，而不是 `SET LOCAL`？","options":["PostgreSQL 的 CREATE INDEX CONCURRENTLY 禁止运行在事务块内（故不能用 SET LOCAL）；必须 defer RESET 防止连接归还连接池后永久失去超时保护","SET LOCAL 会自动删除已有 HNSW 索引","因为 halfvec 不支持 1024 维","Go database/sql 不支持事务"],"correctIndex":0,"explanation":"满分！这一个细节同时考察了 PostgreSQL DDL 底层限制与 Go 数据库连接池生命周期管理，含金量极高！"},"interviewQ":"业务方临时更换了不同维度的 Embedding 模型（如 1024 → 2560 维），pgvector 怎么既不退化全表扫描又不锁表？","interviewA":"按维度动态构建部分索引 `embeddings_embedding_idx_{dim}`（利用 `halfvec` 支持最高 4000 维）：请求侧通过 `sync.Map` 去重非阻塞异步触发，多副本经独立连接 `pg_try_advisory_lock` 互斥并检查 `pg_stat_progress_create_index` 防误删在建索引，最后 `SET statement_timeout = 0` 执行 `CREATE INDEX CONCURRENTLY` 并务必 `defer RESET`。","whyBlock":{"painPoint":"企业常在不同知识库混用 1024 维 BGE、1536 维 OpenAI、2560 维 Qwen3 向量模型！如果把 HNSW 索引维度写死，切换模型就会退化成全表扫描卡死数据库；如果在问答或写入请求里同步 `CREATE INDEX`，又会直接锁表造成线上雪崩！同时 Lite 单机版还要在零外部依赖下支持向量 + 关键词双路检索。","analogy":"PostgreSQL 动态维度 HNSW 就像**大型超市动态增开收银通道**：来了一批新扫码方式的顾客（新向量维度），收银员绝不让整队人停下来等装修（非阻塞立即放行），同时派一位拿唯一施工令的经理（`pg_try_advisory_lock`）在后台悄悄搭好新通道（`CREATE INDEX CONCURRENTLY`），全程不封堵主干道！","avoidRabbitHole":"WeKnora 一共适配了 10 类检索/图谱引擎（ES/Milvus/Qdrant/Weaviate/Doris/Neo4j 等），**千万不要把 10 个目录逐行全看一遍**！它们共享同一 `RetrieveEngineRepository` 接口，本站吃透 PG 动态 HNSW（标准版）+ SQLite sqlite-vec/FTS5（Lite 版）这两套即可通杀。"},"ioContract":{"inType":"types.RetrieveParams（多路并行检索查询对象，含 Query 向量 + 关键词 + 授权过滤）","inFields":[{"name":"Query","type":"string","desc":"经多轮上下文改写后的精准查询词（供 BM25 / FTS5 / 图谱检索）"},{"name":"Embedding","type":"[]float32","desc":"当前知识库绑定 Embedding 模型编码出的查询向量（如 1024 / 1536 维）"},{"name":"KnowledgeBaseIDs","type":"[]string","desc":"上一站收敛后的合法知识库白名单，用于 SQL `WHERE` 强隔离"},{"name":"TopK / Threshold","type":"int / float64","desc":"每路单表召回上限（通常 20~50）与最低相似度门槛"},{"name":"RetrieverTypes","type":"[]RetrieverType","desc":"启用的召回路：`vector`（向量）、`keywords`（BM25）、`graph`（图谱）"}],"inSample":"{\n  \"query\": \"2026年 差旅 住宿 报销 一线城市 标准\",\n  \"embedding_dim\": 1536,\n  \"embedding_preview\": [0.0214, -0.0881, 0.0432, \"...(1536 floats)\"],\n  \"knowledge_base_ids\": [\"kb_finance_2026\", \"kb_shared_hr\"],\n  \"top_k\": 20,\n  \"threshold\": 0.30,\n  \"retrievers\": [\"vector\", \"keywords\"]\n}","transformSteps":["PostgreSQL 路由查询时动态校验对应维度半精度 HNSW 表达式索引是否存在；缺失则非阻塞放行并后台 `AdvisoryLock + CREATE INDEX CONCURRENTLY`","SQLite Lite 版在单文件内同步走 `sqlite-vec`（向量余弦）+ `FTS5`（倒排全文）两路召回，并通过 `MaxOpenConns(1)` 与 WAL 防写锁冲突","向量路输出 `[0, 1]` 余弦相似度候选集；BM25/FTS5 路输出无上界相关性分数候选集，供下一站统一归一化融合"],"outType":"[]*types.SearchResult（多路原始候选片段列表，尚未归一化融合）","outFields":[{"name":"ID / ChunkID","type":"string","desc":"命中的分块唯一 ID（对应关系主库 `chunks.id`）"},{"name":"KnowledgeID","type":"string","desc":"所属源文档 ID（用于后续邻块扩展与原文溯源）"},{"name":"Score","type":"float64","desc":"原始路分数：向量路 `0~1`，BM25 关键词路无上界（如 `14.82`）"},{"name":"MatchType","type":"types.MatchType","desc":"命中来源标记：`MatchTypeEmbedding` / `MatchTypeKeywords` / `MatchTypeGraph`"},{"name":"Content","type":"string","desc":"命中分块正文（附带标题面包屑上下文）"}],"outSample":"{\n  \"vector_results\": [\n    { \"chunk_id\": \"chk_401\", \"knowledge_id\": \"doc_travel_2026\", \"score\": 0.864, \"match_type\": \"embedding\", \"content\": \"一线城市（北上广深）住宿报销上限 750 元/晚...\" },\n    { \"chunk_id\": \"chk_405\", \"knowledge_id\": \"doc_travel_2026\", \"score\": 0.742, \"match_type\": \"embedding\", \"content\": \"特殊旺季需部门总监提前邮件审批...\" }\n  ],\n  \"keyword_results\": [\n    { \"chunk_id\": \"chk_401\", \"knowledge_id\": \"doc_travel_2026\", \"score\": 18.42, \"match_type\": \"keywords\", \"content\": \"一线城市（北上广深）住宿报销上限 750 元/晚...\" },\n    { \"chunk_id\": \"chk_412\", \"knowledge_id\": \"doc_travel_2025\", \"score\": 11.05, \"match_type\": \"keywords\", \"content\": \"2025年旧版一线城市住宿上限 650 元/晚...\" }\n  ]\n}"}},{"id":"q4","flowId":"flow_qa","stage":3,"row":1,"dfNodeId":"rag_rerank","techCompIds":["qa_agent","llm_providers"],"wbTarget":{"moduleId":"rag","nodeId":"rrf_fuse"},"codeLabel":"1-4","title":"混合召回与重排：11 步动态 RAG、加权 RRF 归一、重排降级与 MMR","dfLabel":"混合召回与重排","dfSublabel":"加权 RRF · Rerank · MMR","dfTag":"Top-K 证据","nodeType":"backend","stars":5,"duration":"22 分钟","inputSpec":"向量路（余弦 0~1）与关键词路（无界 BM25）多路原始候选片段","outputSpec":"去重、归一、重排、多样性筛选（MMR）且带视觉保护的高可信 Top-K 证据（全空则短路兜底绝不编造）","packetSample":"RRF Norm: [0.7/(60+1) + 0.3/(60+4)] / (1.0/61) = 0.985\nComposite: 0.6*rerank + 0.3*base + 0.1*source + MMR(λ=0.7) -> Top 5 Chunks","analogy":"就像**高考复试综合录取**：两科分制不同（余弦 vs 无上限 BM25）先按各自排名做归一化加权融合（RRF）；复试官（Rerank）最多面 200 人，录取线过高全刷空时降一次门槛（`×0.7` 且 `≥0.3`），复试官生病宕机就按初试排名兜底，最后挑人还要兼顾多样性（MMR）且保护“以图搜图”特长生！","files":[{"id":"fq4_qa","path":"internal/application/service/session_knowledge_qa.go","sliceStart":198,"sliceEnd":270,"label":"session_knowledge_qa.go","relPath":"internal/application/service/session_knowledge_qa.go","startLine":198,"endLine":270,"lines":["\t// this decision or the request is incorrectly downgraded to pure chat.","\thasKB := types.HasKnowledgeRetrievalScope(searchTargets, knowledgeBaseIDs, knowledgeIDs)","\tneedsRAG := hasKB || webSearchEnabled","\thasHistory := chatManage.MaxRounds > 0","","\tvar pipeline []types.EventType","\tif !needsRAG {","\t\t// Pure chat — no retrieval needed.","\t\tuserContent := req.Query","\t\tif req.ImageDescription != \"\" && !chatModelSupportsVision {","\t\t\tuserContent += \"\\n\\n[用户上传图片内容]\\n\" + req.ImageDescription","\t\t}","\t\tif req.QuotedContext != \"\" {","\t\t\tuserContent += \"\\n\\n\" + req.QuotedContext","\t\t}","\t\t// Inject attachment content for pure-chat path (RAG path handles this in INTO_CHAT_MESSAGE).","\t\tif len(req.Attachments) > 0 {","\t\t\tuserContent += req.Attachments.BuildPrompt()","\t\t}","\t\tchatManage.UserContent = userContent","","\t\tpipeline = types.NewPipelineBuilder().","\t\t\tAddIf(hasHistory, types.LOAD_HISTORY).","\t\t\tAdd(types.MEMORY_RECALL).","\t\t\tAdd(types.CHAT_COMPLETION_STREAM).","\t\t\tBuild()","\t} else {","\t\t// RAG — dynamically assemble based on feature flags.","\t\tpipeline = types.NewPipelineBuilder().","\t\t\tAddIf(hasHistory, types.LOAD_HISTORY).","\t\t\tAdd(types.MEMORY_RECALL).","\t\t\tAdd(types.QUERY_UNDERSTAND).","\t\t\tAdd(types.CHUNK_SEARCH_PARALLEL).","\t\t\tAdd(types.CHUNK_RERANK).","\t\t\tAddIf(webSearchEnabled, types.WEB_FETCH).","\t\t\tAdd(types.CHUNK_MERGE).","\t\t\tAdd(types.FILTER_TOP_K).","\t\t\tAddIf(chatManage.DataAnalysisEnabled, types.DATA_ANALYSIS).","\t\t\tAdd(types.INTO_CHAT_MESSAGE).","\t\t\tAdd(types.CHAT_COMPLETION_STREAM).","\t\t\tBuild()","\t}","","\tlogger.Infof(ctx, \"Assembled pipeline (%d stages), hasKB=%v, webSearch=%v, history=%v\",","\t\tlen(pipeline), hasKB, webSearchEnabled, hasHistory)","","\t// Start knowledge QA event processing (set session tenant so pipeline session/message lookups use session owner)","\tctx = context.WithValue(ctx, types.SessionTenantIDContextKey, req.Session.TenantID)","\t// Propagate the session ID so stateful sandbox backends (CubeSandbox) can","\t// bind script execution to a per-session MicroVM instance.","\tctx = types.WithSessionID(ctx, req.Session.ID)","\tlogger.Info(ctx, \"Triggering question answering event\")","\tsetupSpan.Finish(map[string]interface{}{","\t\t\"stages\":             len(pipeline),","\t\t\"knowledge_base_ids\": knowledgeBaseIDs,","\t\t\"search_targets\":     len(searchTargets),","\t}, nil, nil)","\terr = s.KnowledgeQAByEvent(ctx, chatManage, pipeline)","\tif err != nil {","\t\tlogger.ErrorWithFields(ctx, err, map[string]interface{}{","\t\t\t\"session_id\": req.Session.ID,","\t\t})","\t\treturn err","\t}","","\t// Note: Answer events are now emitted directly by chat_completion_stream plugin","\t// Completion event will be emitted when the last answer event has Done=true","\t// We can optionally add a completion watcher here if needed, but for now","\t// the frontend can detect completion from the Done flag","","\tlogger.Info(ctx, \"Knowledge base question answering initiated\")","\treturn nil","}"]},{"id":"fq4_rrf","path":"internal/application/service/knowledgebase_search_fusion.go","sliceStart":115,"sliceEnd":221,"label":"knowledgebase_search_fusion.go","relPath":"internal/application/service/knowledgebase_search_fusion.go","startLine":115,"endLine":221,"lines":["// rescaleUnboundedScores maps a single-retriever candidate set onto [0, 1]","// by dividing through the maximum finite score. Keyword (BM25) scores are","// unbounded; leaving them in place saturates compositeScore (0.3*base with","// a [0, 1] clamp) so every candidate ties at 1.0 and MMR degenerates to","// diversity-only ordering.","//","// Scores already in [0, 1] are left unchanged so engines that stamp","// keyword hits at 1.0 (Qdrant, Doris) and already-normalized vector","// scores keep their current magnitude. Relative order is preserved","// either way. Retrieve/Langfuse sampling happens before fusion, so","// raw BM25 remains visible in the retrieve span.","func rescaleUnboundedScores(results []*types.IndexWithScore) {","\tmaxScore := 0.0","\tfor _, r := range results {","\t\tif r == nil {","\t\t\tcontinue","\t\t}","\t\tif math.IsNaN(r.Score) || math.IsInf(r.Score, 0) {","\t\t\tcontinue","\t\t}","\t\tif r.Score > maxScore {","\t\t\tmaxScore = r.Score","\t\t}","\t}","\tif maxScore <= 1 {","\t\treturn","\t}","\tfor _, r := range results {","\t\tif r == nil {","\t\t\tcontinue","\t\t}","\t\tswitch {","\t\tcase math.IsNaN(r.Score), math.IsInf(r.Score, -1), r.Score <= 0:","\t\t\tr.Score = 0","\t\tcase math.IsInf(r.Score, 1):","\t\t\tr.Score = 1","\t\tdefault:","\t\t\tr.Score = r.Score / maxScore","\t\t}","\t}","}","","// fuseWithRRF merges vector and keyword retrieval results using Reciprocal Rank Fusion.","// RRF score = vectorWeight/(k+vectorRank) + keywordWeight/(k+keywordRank),","// divided by its maximum (vectorWeight+keywordWeight)/(k+1) so it lands in","// [0, 1] like the single-retriever paths. Raw RRF tops out near 0.016, which","// made hybrid hits lose to any vector-only or keyword-only result they were","// ranked against and left rerank's base-score term and MMR's relevance term","// with nothing to work with.","//","// A chunk's rank for a retriever is its best position in any one list of","// that retriever, each list ordered by its own score. Positions in the","// concatenation of several lists are arbitrary: the second list's best hit","// would otherwise rank behind every hit of the first.","// k, vectorWeight and keywordWeight are sourced from retrievalCfg (with defaults).","// The merged results are sorted by RRF score descending.","func fuseWithRRF(","\tctx context.Context, vectorLists, keywordLists [][]*types.IndexWithScore, retrievalCfg *types.RetrievalConfig,",") []*types.IndexWithScore {","\trrfK := retrievalCfg.GetEffectiveRRFK()","\tvectorWeight, keywordWeight := retrievalCfg.GetEffectiveRRFWeights()","\tmaxRRF := (vectorWeight + keywordWeight) / float64(rrfK+1)","","\tvectorRanks := bestRanks(vectorLists)","\tkeywordRanks := bestRanks(keywordLists)","","\t// Collect all unique chunks — prefer vector result's metadata for each chunk","\tchunkInfoMap := make(map[string]*types.IndexWithScore)","\tfor _, r := range flattenLists(vectorLists) {","\t\tif existing, exists := chunkInfoMap[r.ChunkID]; !exists || r.Score > existing.Score {","\t\t\tchunkInfoMap[r.ChunkID] = r","\t\t}","\t}","\tfor _, r := range flattenLists(keywordLists) {","\t\tif _, exists := chunkInfoMap[r.ChunkID]; !exists {","\t\t\tchunkInfoMap[r.ChunkID] = r","\t\t}","\t}","","\t// Compute weighted RRF scores and assign to each chunk","\tresult := make([]*types.IndexWithScore, 0, len(chunkInfoMap))","\tfor chunkID, info := range chunkInfoMap {","\t\trrfScore := 0.0","\t\tif rank, ok := vectorRanks[chunkID]; ok {","\t\t\trrfScore += vectorWeight / float64(rrfK+rank)","\t\t}","\t\tif rank, ok := keywordRanks[chunkID]; ok {","\t\t\trrfScore += keywordWeight / float64(rrfK+rank)","\t\t}","\t\tinfo.Score = rrfScore / maxRRF","\t\tresult = append(result, info)","\t}","\tslices.SortFunc(result, sortByScoreDesc)","","\t// Log top results for debugging","\tfor i, chunk := range result {","\t\tif i >= 15 {","\t\t\tbreak","\t\t}","\t\tvRank, vOk := vectorRanks[chunk.ChunkID]","\t\tkRank, kOk := keywordRanks[chunk.ChunkID]","\t\tlogger.Debugf(ctx, \"RRF rank %d: chunk_id=%s, rrf_score=%.6f, vector_rank=%v(%v), keyword_rank=%v(%v)\",","\t\t\ti, chunk.ChunkID, chunk.Score, vRank, vOk, kRank, kOk)","\t}","","\treturn result","}"]},{"id":"fq4_rk","path":"internal/reranking/rerank.go","sliceStart":107,"sliceEnd":233,"label":"reranking/rerank.go","relPath":"internal/reranking/rerank.go","startLine":107,"endLine":233,"lines":["// Rerank scores results against query with model and returns the rows that","// pass opts, best first. A failed model call is not an error: the result","// carries the input rows unchanged and a model_error outcome, so callers can","// degrade to the retrieval order.","func Rerank(","\tctx context.Context,","\tmodel rerank.Reranker,","\tquery string,","\tresults []*types.SearchResult,","\topts Options,",") *Result {","\tres := &Result{","\t\tDiagnostics: types.RerankDiagnostics{","\t\t\tThreshold:          opts.Threshold,","\t\t\tEffectiveThreshold: opts.Threshold,","\t\t},","\t}","","\tvar scoredAsImage map[int]bool","\tdefer func() { recordSelection(ctx, results, res, opts, scoredAsImage) }()","","\tkeep := topByScore(results, opts.MaxCandidates)","\tcandidateIdx := make([]int, 0, len(results))","\tfor i, r := range results {","\t\tif r == nil || (keep != nil && !keep[i]) {","\t\t\tcontinue","\t\t}","\t\tpassage := ModelPassage(ctx, r)","\t\tif strings.TrimSpace(passage) == \"\" {","\t\t\tcontinue","\t\t}","\t\tcandidateIdx = append(candidateIdx, i)","\t\tres.Candidates = append(res.Candidates, r)","\t\tres.Passages = append(res.Passages, passage)","\t}","\tres.Diagnostics.CandidateCount = len(res.Candidates)","\tif len(res.Candidates) == 0 {","\t\tres.Diagnostics.Outcome = types.RerankOutcomeNoCandidates","\t\treturn res","\t}","\tfitPassages(ctx, res.Passages, rerank.MaxPassageRunes(model, query))","","\timagePositions, images := imageCandidates(ctx, model, res.Candidates, opts)","\tscores, scoredAsImage, err := scoreCandidates(ctx, model, query, res.Passages, imagePositions, images)","\tres.Diagnostics.ImagesScored = len(scoredAsImage)","\tif err != nil {","\t\tlogger.Warnf(ctx, \"[Rerank] Model call failed, keeping retrieval order: %v\", err)","\t\tres.Diagnostics.Outcome = types.RerankOutcomeModelError","\t\tres.Diagnostics.Error = err.Error()","\t\tres.Results = results","\t\tres.Indices = make([]int, len(results))","\t\tfor i := range results {","\t\t\tres.Indices[i] = i","\t\t}","\t\tres.Diagnostics.ResultCount = len(results)","\t\treturn res","\t}","\t// Drop out-of-range indices once so nothing below has to re-check them.","\tvalid := scores[:0:0]","\tfor _, s := range scores {","\t\tif s.Index >= 0 && s.Index < len(res.Candidates) {","\t\t\tvalid = append(valid, s)","\t\t}","\t}","\tres.ModelScores = valid","\tres.Diagnostics.Applied = true","\ttop, hasTop := bestScore(valid)","\tif hasTop {","\t\tres.Diagnostics.TopScore = top.RelevanceScore","\t}","","\tpassing, outcome, effective := applyThreshold(valid, opts)","\tres.Diagnostics.Outcome = outcome","\tres.Diagnostics.EffectiveThreshold = effective","","\tscored := make([]*types.SearchResult, 0, len(passing))","\tscoredIdx := make([]int, 0, len(passing))","\tfor _, rr := range passing {","\t\tscored = append(scored, scoredCopy(res.Candidates[rr.Index], rr.RelevanceScore, opts.FAQScoreBoost))","\t\tscoredIdx = append(scoredIdx, candidateIdx[rr.Index])","\t}","\torder := make([]int, len(scored))","\tfor i := range order {","\t\torder[i] = i","\t}","\tsort.SliceStable(order, func(a, b int) bool {","\t\tsa, sb := scored[order[a]], scored[order[b]]","\t\tif sa.Score != sb.Score {","\t\t\treturn sa.Score > sb.Score","\t\t}","\t\t// Boosted FAQs capped at 1 tie; keep them in relevance order.","\t\treturn PreBoostScore(sa) > PreBoostScore(sb)","\t})","\tres.Scored = make([]*types.SearchResult, len(order))","\tsortedIdx := make([]int, len(order))","\tfor i, o := range order {","\t\tres.Scored[i] = scored[o]","\t\tsortedIdx[i] = scoredIdx[o]","\t}","","\tpicks := make([]int, len(res.Scored))","\tfor i := range picks {","\t\tpicks[i] = i","\t}","\tif opts.TopK > 0 {","\t\tpicks = SelectMMR(ctx, res.Scored, min(opts.TopK, len(res.Scored)), DefaultMMRLambda)","\t}","\tres.Results = make([]*types.SearchResult, 0, len(picks))","\tres.Indices = make([]int, 0, len(picks))","\tfor _, p := range picks {","\t\tres.Results = append(res.Results, res.Scored[p])","\t\tres.Indices = append(res.Indices, sortedIdx[p])","\t}","\tfor _, k := range keptImages(ctx, res.Candidates, valid, passing, scoredAsImage, opts) {","\t\tkept := scoredCopy(res.Candidates[k.Index], k.RelevanceScore, opts.FAQScoreBoost)","\t\tkept.Metadata[types.MetadataKeptBy] = types.KeptByImageVector","\t\tres.Results = append(res.Results, kept)","\t\tres.Indices = append(res.Indices, candidateIdx[k.Index])","\t\tres.Diagnostics.ImagesKept++","\t}","\tres.Diagnostics.ResultCount = len(res.Results)","","\tlogger.Infof(ctx, \"[Rerank] %d candidates -> %d results, outcome=%s threshold=%.3f effective=%.3f top=%.4f\",","\t\tlen(res.Candidates), len(res.Results), outcome, opts.Threshold, effective, res.Diagnostics.TopScore)","\treturn res","}",""]}],"steps":[{"id":"sq4_1","order":1,"type":"frontend","label":"11步动态链与短路","sublabel":"纯聊3步/RAG11步·无命中兜底","tag":"责任链","edgeLabel":"融合","fileId":"fq4_qa","startLine":198,"endLine":270,"explain":"入口按是否选 KB/联网动态构建 3 步纯聊或 11 步 RAG 事件链；无召回命中返回 `ErrSearchNothing` 立即短路切兜底，防大模型拿到空上下文强行编造引用。","pitfall":"纯聊分支在入口拼接附件，RAG 分支延后到 `INTO_CHAT_MESSAGE` 拼接，避免附件重复注入浪费 Token。"},{"id":"sq4_2","order":2,"type":"backend","label":"BM25缩放与加权RRF","sublabel":"0.7/0.3/k60 归一至[0,1]","tag":"核心公式","edgeLabel":"重排","fileId":"fq4_rrf","startLine":115,"endLine":221,"explain":"单路 BM25 按单表极值缩放到 `[0,1]`；双路混合用 `fuseWithRRF` 计算加权倒数排名后除以理论最大值 `(vw+kw)/(k+1)`，把原始 `~0.016` 精准归一回 `[0,1]`！","pitfall":"必须先在每个子列表内独立按分排名（`bestRanks`），绝不能先拼大表再排！"},{"id":"sq4_3","order":3,"type":"security","label":"200上限降级与MMR","sublabel":"单次×0.7 · 故障退化 · 护图","tag":"高可用","edgeLabel":"","fileId":"fq4_rk","startLine":107,"endLine":233,"explain":"截断 200 候选防超时；全滤空时对高阈值执行单次 `max(t×0.7, 0.3)` 降级及 `0.15` 兜底；复合分 `0.6/0.3/0.1` + MMR(`λ=0.7`) + `ImageKeepScore` 保护图像命中；Rerank 故障优雅退化为召回序。","pitfall":"纯文本 Rerank 看不懂视觉向量命中的图片分块，缺少 `ImageKeepScore` 保护会把高价值图表误杀！"}],"quiz":{"question":"在 `knowledgebase_search_fusion.go` 中，为什么单路 BM25 要按单表最大值缩放到 `[0, 1]`，且双路 RRF 也要除以理论最大值 `(vw+kw)/(k+1)`？","options":["为了把所有分块分数统一变成 0.5","让单向量、单 BM25、双路混合三条路径的输出全部对齐到 [0,1] 尺度，既不淹没下游复合分/MMR，也不被默认阈值误杀","因为 JSON 不支持小于 0.1 的浮点数","为了减少向量维度"],"correctIndex":1,"explanation":"完美！尺度统一是一切多路混合检索与重排/MMR 协同工作的数学基石。"},"interviewQ":"RAG 检索融合与重排这一站，面试官深挖公式、降级和容错时该怎么一口气讲透？","interviewA":"记住四组硬指标：① 融合：`vw=0.7, kw=0.3, k=60` 除以 `(vw+kw)/(k+1)` 归一 `[0,1]`，单路 BM25 按极值缩放、纯向量保余弦；② 重排上限 200，全滤空仅单次降级 `max(t×0.7, 0.3)` 并留 `0.15` 兜底；③ 复合分 `0.6*model + 0.3*base + 0.1*source` + MMR(`λ=0.7`) + 图像保护；④ Rerank 宕机退化召回序，无命中由 `ErrSearchNothing` 短路防幻觉。","whyBlock":{"painPoint":"这是整个 RAG 引擎含金量最高的一站，专门解决 4 个线上顽疾：① 向量分在 `[0,1]` 而 BM25 分无上界，直接加权会被 BM25 淹没；② 重排模型（Reranker）慢、有输入上限且偶尔超时宕机；③ 重排门槛设太高把候选全刷光导致无结果；④ 如果库里真没相关资料，直接把空上下文丢给大模型会引发严重「幻觉编造引用」！","analogy":"就像**高考复试综合录取**：语文（向量）百分制、奥数（BM25）无上限积分制，不能直接相加，要先按各自排名做**归一化加权 RRF** 对齐到 `[0,1]`；复试考官（Rerank）最多面 200 人，录取线太高全刷空时降一次门槛（`×0.7` 且 `≥0.3`），考官宕机就按初试排名兜底；最后录人还要兼顾多样性（MMR `λ=0.7`）且保护「以图搜图」特长生；如果初试压根没人报名（`ErrSearchNothing`），直接发公告停招，绝不硬编录取名单！","avoidRabbitHole":"不要迷失在 `chat_pipeline/` 20 多个插件文件里！本站死磕 3 个文件里的 4 组核心参数：`11 步动态事件链 + ErrSearchNothing 短路`、`BM25 极值缩放 + 0.7/0.3/k=60 归一化 RRF`、`200 上限 + 单次 ×0.7 降级 + 故障退化`、`0.6/0.3/0.1 复合分 + MMR(λ=0.7)`——背熟这四组，面试 RAG 稳赢！"},"ioContract":{"inType":"types.ChatManage + 多路原始检索候选集（Vector + BM25 + Graph + Web）","inFields":[{"name":"hasKB / webSearchEnabled","type":"bool","desc":"决定动态构建「3 步纯聊链」还是「11 步 RAG 事件链」"},{"name":"vectorResults / kwResults","type":"[]*SearchResult","desc":"上一站返回的不同量纲候选集（余弦 `0~1` vs 无界 BM25）"},{"name":"RerankThreshold","type":"float64","desc":"租户/知识库配置的重排分数门槛（如 `0.50`）"},{"name":"TopK","type":"int","desc":"最终送入大模型 Prompt 的最大证据片段数（默认 `5`）"}],"inSample":"{\n  \"pipeline_mode\": \"11-step RAG (hasKB=true)\",\n  \"vector_top\": { \"chunk_id\": \"chk_401\", \"rank\": 1, \"raw_score\": 0.864 },\n  \"keyword_top\": [\n    { \"chunk_id\": \"chk_401\", \"rank\": 1, \"raw_score\": 18.42 },\n    { \"chunk_id\": \"chk_412\", \"rank\": 2, \"raw_score\": 11.05 }\n  ],\n  \"rerank_config\": { \"max_candidates\": 200, \"threshold\": 0.50, \"top_k\": 5, \"mmr_lambda\": 0.7 }\n}","transformSteps":["`session_knowledge_qa.go` 按 `needsRAG` 动态装配 11 步事件链；若召回为空抛出 `ErrSearchNothing` 立刻短路兜底","`knowledgebase_search_fusion.go` 单路 BM25 按最大值缩放到 `[0,1]`；双路按 `(0.7/(60+r_v) + 0.3/(60+r_k)) / (1.0/61)` 归一化到 `[0,1]`","`rerank.go` 截断前 200 条调用重排模型（异常直接降级回初排），全刷空时执行单次门槛下调 `max(t×0.7, 0.3)`，再用 `0.6*rerank + 0.3*base + 0.1*source` + MMR(`λ=0.7`) 选出高多样 Top-K"],"outType":"[]*types.SearchResult（高可信 Top-K 证据）→ 注入 Prompt 交给流式生成","outFields":[{"name":"MergedResults","type":"[]*SearchResult","desc":"经重排、去重、邻居扩展与视觉特例保护后的最终 Top-K 证据列表"},{"name":"CompositeScore","type":"float64","desc":"融合重排分(0.6)、初排分(0.3)、来源权重(0.1)后的最终 `[0,1]` 置信分"},{"name":"FallbackTriggered","type":"bool","desc":"是否触发过阈值降级或重排超时兜底（写入观测日志）"}],"outSample":"{\n  \"rrf_normalized_chk_401\": 1.000,\n  \"rerank_status\": \"ok (candidates=28, fallback=false)\",\n  \"final_top_k\": [\n    {\n      \"rank\": 1,\n      \"chunk_id\": \"chk_401\",\n      \"composite_score\": 0.942,\n      \"citation_index\": 1,\n      \"content\": \"[报销制度 > 第三章 住宿标准] 一线城市（北上广深）住宿报销上限 750 元/晚...\"\n    },\n    {\n      \"rank\": 2,\n      \"chunk_id\": \"chk_405\",\n      \"composite_score\": 0.818,\n      \"citation_index\": 2,\n      \"content\": \"[报销制度 > 第三章 例外审批] 特殊旺季超标需部门总监提前邮件审批...\"\n    }\n  ]\n}"}},{"id":"q5","flowId":"flow_qa","stage":4,"row":1,"dfNodeId":"sse_stream","techCompIds":["stream_mgr","clients"],"wbTarget":{"moduleId":"rag","nodeId":"redis_stream"},"codeLabel":"1-5","title":"SSE 流式交付：断线续流、跨副本 Stop 与运行中 Steer 插话","dfLabel":"SSE 流式交付","dfSublabel":"Redis Stream · 引用定位","dfTag":"断线续流","nodeType":"messagebus","stars":4,"duration":"12 分钟","inputSpec":"LLM 正在持续输出的增量 Token、思考过程与原文引用坐标","outputSpec":"经 Redis Stream 持久化并支持断线续接、跨副本停止与运行中插话的 SSE 事件流送达用户屏幕！","packetSample":"event: answer_delta\ndata: { \"message_id\": \"m_901\", \"delta\": \"一线城市住宿上限 600 元 [1]\", \"citations\": [{ \"chunk_id\": \"c_209\", \"start\": 412, \"end\": 538 }] }","analogy":"就像**带云端录像回放的实时直播**：生成协程边播边写进 Redis 录像带（活跃续期 1 小时）；观众断网重连只需报上 `message_id` 走 `GET` 接着看（绝不重发 POST），还能随时跨机房按暂停（`stop`）或发弹幕插话（`steer`）！","files":[{"id":"fq5_fac","path":"internal/stream/factory.go","sliceStart":11,"sliceEnd":40,"label":"stream/factory.go","relPath":"internal/stream/factory.go","startLine":11,"endLine":40,"lines":["// 流管理器类型","const (","\tTypeMemory = \"memory\"","\tTypeRedis  = \"redis\"",")","","// NewStreamManager 创建流管理器","func NewStreamManager() (interfaces.StreamManager, error) {","\tswitch os.Getenv(\"STREAM_MANAGER_TYPE\") {","\tcase TypeRedis:","\t\tdb, err := strconv.Atoi(os.Getenv(\"REDIS_DB\"))","\t\tif err != nil {","\t\t\tdb = 0","\t\t}","\t\t// Default 1h. Live-run keys are refreshed while the turn is still","\t\t// streaming (AppendEvent / GetEvents / steer writes), so a run that","\t\t// lasts longer than this TTL does not look idle to /steer.","\t\tttl := time.Hour","\t\treturn NewRedisStreamManager(","\t\t\tos.Getenv(\"REDIS_ADDR\"),","\t\t\tos.Getenv(\"REDIS_USERNAME\"),","\t\t\tos.Getenv(\"REDIS_PASSWORD\"),","\t\t\tdb,","\t\t\tos.Getenv(\"REDIS_PREFIX\"),","\t\t\tttl,","\t\t)","\tdefault:","\t\treturn NewMemoryStreamManager(), nil","\t}","}"]},{"id":"fq5_hdl","path":"internal/handler/session/stream.go","sliceStart":37,"sliceEnd":90,"label":"handler/session/stream.go","relPath":"internal/handler/session/stream.go","startLine":37,"endLine":90,"lines":["func (h *Handler) ContinueStream(c *gin.Context) {","\tctx := c.Request.Context()","","\tlogger.Info(ctx, \"Start continuing stream response processing\")","","\t// Get session ID from URL parameter","\tsessionID := secutils.SanitizeForLog(c.Param(\"session_id\"))","\tif sessionID == \"\" {","\t\tlogger.Error(ctx, \"Session ID is empty\")","\t\tc.Error(errors.NewBadRequestError(errors.ErrInvalidSessionID.Error()))","\t\treturn","\t}","","\t// Get message ID from query parameter","\tmessageID := secutils.SanitizeForLog(c.Query(\"message_id\"))","\tif messageID == \"\" {","\t\tlogger.Error(ctx, \"Message ID is empty\")","\t\tc.Error(errors.NewBadRequestError(\"Missing message ID\"))","\t\treturn","\t}","","\tlogger.Infof(ctx, \"Continuing stream, session ID: %s, message ID: %s\", sessionID, messageID)","","\t// Resolve before any SSE header is written so an invalid resource_urls value","\t// is still reportable as a normal 400 JSON error.","\tresourceRewriter, err := h.resolveStreamRewriter(c)","\tif err != nil {","\t\tlogger.Warnf(ctx, \"Rejected resource URL mode: %v\", err)","\t\t_ = c.Error(err)","\t\treturn","\t}","","\t// Verify that the session exists and belongs to this tenant","\tif _, err := h.sessionService.GetSession(ctx, sessionID); err != nil {","\t\tif stderrors.Is(err, errors.ErrSessionNotFound) {","\t\t\tlogger.Warnf(ctx, \"Session not found, ID: %s\", sessionID)","\t\t\tc.Error(errors.NewNotFoundError(err.Error()))","\t\t} else {","\t\t\tlogger.ErrorWithFields(ctx, err, nil)","\t\t\tc.Error(errors.NewInternalServerError(err.Error()))","\t\t}","\t\treturn","\t}","","\t// Get the incomplete message","\tmessage, err := h.messageService.GetMessage(ctx, sessionID, messageID)","\tif err != nil {","\t\tif stderrors.Is(err, errors.ErrSessionNotFound) {","\t\t\t// PR #1309 plumbed user-scope into messageService.GetMessage's","\t\t\t// session existence check; non-owner / wrong-user lookups now","\t\t\t// surface as ErrSessionNotFound. Map to 404 so clients can tell","\t\t\t// \"wrong URL\" from a real 5xx instead of seeing a generic 500.","\t\t\tlogger.Warnf(ctx, \"Session not found, ID: %s\", sessionID)","\t\t\tc.Error(errors.NewNotFoundError(err.Error()))"]},{"id":"fq5_rt","path":"internal/router/routes_chat.go","sliceStart":68,"sliceEnd":98,"label":"router/routes_chat.go","relPath":"internal/router/routes_chat.go","startLine":68,"endLine":98,"lines":["\t\tsessions.POST(\"/:session_id/attachments\", handler.UploadTemporaryDocument)","\t\tsessions.GET(\"/:id/attachments\", handler.ListTemporaryDocuments)","\t\tsessions.GET(\"/:id/attachments/:attachment_id\", handler.GetTemporaryDocument)","\t\tsessions.GET(\"/:id/attachments/:attachment_id/preview\", handler.PreviewTemporaryDocument)","\t\tsessions.DELETE(\"/:id/attachments/:attachment_id\", handler.DeleteTemporaryDocument)","\t\tsessions.POST(\"/:session_id/stop\", handler.StopSession)","\t\tsessions.POST(\"/:session_id/fork\", handler.ForkSession)","\t\tsessions.POST(\"/:session_id/rewind\", handler.RewindSession)","\t\tsessions.POST(\"/:session_id/sandbox/terminal-ticket\", handler.IssueSandboxTerminalTicket)","\t\tsessions.POST(\"/:session_id/sandbox/desktop-ticket\", handler.IssueSandboxDesktopTicket)","\t\tsessions.POST(\"/:session_id/sandbox/desktop/activity\", handler.ReportSandboxDesktopActivity)","\t\tsessions.GET(\"/:id/local-browser\", handler.BrowserSkillConnection)","\t\tsessions.POST(\"/:session_id/local-browser\", handler.BrowserSkillConnection)","\t\t// Mid-run message injection: append a user message to the turn that is","\t\t// currently generating. Accepts even when no run is live (the client","\t\t// then falls back to a normal send), mirroring StopSession's ownership","\t\t// rules.","\t\tsessions.POST(\"/:session_id/steer\", handler.SteerMessage)","\t\tsessions.GET(\"/:id/steer\", handler.ListSteerMessages)","\t\tsessions.DELETE(\"/:id/steer/:steer_id\", handler.DeleteSteerMessage)","\t\tsessions.POST(\"/:session_id/steer/:steer_id/inject\", handler.PromoteSteerMessage)","\t\t// Background work: cheap list for the chip, on-demand output for the","\t\t// user, owner-only cancel. Same WorkHandler the model tools use.","\t\t// GET stays on :id and POST on :session_id so each verb's radix tree","\t\t// keeps the wildcard name it already uses.","\t\tsessions.GET(\"/:id/background-work\", handler.ListBackgroundWork)","\t\tsessions.GET(\"/:id/background-work/:work_id\", handler.GetBackgroundWork)","\t\tsessions.POST(\"/:session_id/background-work/:work_id/cancel\", handler.CancelBackgroundWork)","\t\t// POST and DELETE share this path but gin maintains a separate radix tree","\t\t// per HTTP verb, and the existing trees use different wildcard names","\t\t// (POST uses :session_id, DELETE uses :id). Use whatever matches each"]}],"steps":[{"id":"sq5_1","order":1,"type":"messagebus","label":"双模流管理器工厂","sublabel":"Redis多副本 vs Lite内存","tag":"流式解耦","edgeLabel":"续流","fileId":"fq5_fac","startLine":11,"endLine":40,"explain":"按 `STREAM_MANAGER_TYPE` 无缝切换 `RedisStreamManager`（集群多副本共享流与控流信号）与 `MemoryStreamManager`（Lite 零依赖单进程），让 HTTP 连接与生成协程彻底解耦。","pitfall":"如果把 SSE 写死在单个 Gin ResponseWriter 上，负载均衡下的 `stop` 请求落到另一节点就彻底失灵！"},{"id":"sq5_2","order":2,"type":"security","label":"ContinueStream 前置校验","sublabel":"写SSE头前完成400/404校验","tag":"安全续接","edgeLabel":"控流","fileId":"fq5_hdl","startLine":37,"endLine":90,"explain":"在发出任何 `text/event-stream` 响应头之前，先完成参数、资源 URL 模式、租户会话存在性与消息归属校验，非法请求仍返回标准 JSON 400/404。","pitfall":"一旦提前吐出 HTTP 200 SSE 响应头，后面发现越权或消息不存在就再也改不回 404 状态码了！"},{"id":"sq5_3","order":3,"type":"backend","label":"Stop / Steer / 后台控制","sublabel":"跨副本停流 · 运行中追加","tag":"实时互动","edgeLabel":"","fileId":"fq5_rt","startLine":68,"endLine":98,"explain":"通过 `POST /:session_id/stop`、`POST /:session_id/steer`（及排队/注入管理）和 `fork`/`rewind`，给流式长任务提供完整的运行期操控能力。","pitfall":"🎉 恭喜通关「主线一 · 消息发入到返回结果」全链路！你已经彻底打通了在线问答从第 1 跳到最后 1 跳的全部核心源码！"}],"quiz":{"question":"在 `handler/session/stream.go` 的 `ContinueStream` 中，为什么要把 `resolveStreamRewriter`、会话校验和消息校验全部放在写 SSE 响应头之前？","options":["因为 Go 不允许在函数末尾调用 GetSession","一旦写入 HTTP 200 text/event-stream 头，就无法再返回标准 400/404 JSON 错误状态码给客户端判断异常原因","因为 Redis Stream 只能读取一次","为了加快前端 CSS 渲染"],"correctIndex":1,"explanation":"完全正确！这是写所有 SSE / 流式接口时的必备后端基本功。"},"interviewQ":"在线问答的最后一公里，如何实现断线不断答、刷新页面可续流、多副本能即时打断生成？","interviewA":"后端生成与 HTTP 连接解耦，经 `StreamManager` 写入 Redis Stream（1h 活跃续期）；前端断线只带 `message_id` 走 `GET /continue-stream` 幂等重放且先做权限与归属校验再发 SSE 头；`stop` 与 `steer` 控制指令通过 Redis 广播给执行副本即时响应。","whyBlock":{"painPoint":"大模型流式输出往往持续 10~60 秒。如果用户手机切后台、Wi-Fi 闪断或刷新浏览器，普通内存 SSE 连接一断，正在生成的半截回答就彻底丢了！更糟糕的是如果前端傻傻自动重发 POST，既浪费 Token 账单，又会二次触发 Agent 写操作；在 K8s 多副本集群里，用户点「停止生成」发到副本 B，怎么秒级停掉副本 A 上正在跑的协程？","analogy":"就像**带云端录像回放和遥控器的直播间**：主播（后端 LLM 协程）每说一个字都同时写进云端录像带（Redis Stream，活跃自动续期 1 小时）；观众掉线重连时，绝不是让主播从头重讲一遍，而是凭进度条坐标走 `GET /continue-stream?message_id=...` 从录像带无缝续播！哪怕遥控器按下的「停止」信号发到另一台机器，通过 Redis 广播也能秒级喊停主播，甚至中途插话（`steer`）让 Agent 改方向！","avoidRabbitHole":"不必死记 Redis `XADD`/`XREAD` 的底层驱动参数！本站核心看懂「`factory.go` 双实现抽象（Redis / 内存） + `stream.go` 断线续流校验 + `routes_chat.go` 停流/插话路由」这三段铁三角配合即可。"},"ioContract":{"inType":"LLM Token 增量事件流 (`types.StreamEvent`) + 客户端重连/控制指令","inFields":[{"name":"session_id / message_id","type":"string","desc":"本次流式回答的唯一会话与消息标识（Redis Stream Key 组成）"},{"name":"event.ResponseType","type":"enum","desc":"`references`（引用） / `thinking`（思考） / `answer`（正文） / `tool_call` / `done`"},{"name":"offset","type":"int / string","desc":"客户端重连时上报的最后已消费事件偏移量（用于断点续流）"}],"inSample":"{\n  \"stream_key\": \"weknora:stream:sess_9f2a1c:msg_77c1\",\n  \"ttl_seconds\": 3600,\n  \"incoming_events\": [\n    { \"offset\": 0, \"type\": \"references\", \"knowledge_references\": [{ \"chunk_id\": \"chk_401\", \"index\": 1 }] },\n    { \"offset\": 1, \"type\": \"answer\", \"content\": \"根据《2026年差旅报销制度》[1]，\" },\n    { \"offset\": 2, \"type\": \"answer\", \"content\": \"一线城市（北上广深）住宿标准为 750 元/晚。\" }\n  ]\n}","transformSteps":["`factory.go` 按部署模式装配 `RedisStreamManager`（集群跨副本共享）或 `MemoryStreamManager`（Lite 单进程）","每产出一个增量片段先持久化到流存储再推给 SSE；客户端断网重连改为发起幂等 `GET /continue-stream/:session_id?message_id=...` 从断点回放并无缝追上实时流","`routes_chat.go` 提供 `POST /sessions/:id/stop`（跨副本广播取消信号）与 `POST /sessions/:id/steer`（Agent 运行中插话改向）"],"outType":"text/event-stream (SSE 增量帧，含引用溯源坐标与结束标记)","outFields":[{"name":"data.response_type","type":"string","desc":"事件类型，前端据此分发渲染「引用角标 / 思考折叠 / 正文打字机」"},{"name":"data.content","type":"string","desc":"增量 Markdown 文本块"},{"name":"data.done","type":"bool","desc":"流结束标志；前端收到 `done: true` 后关闭连接并锁定最终消息"}],"outSample":"event: message\ndata: {\"response_type\":\"references\",\"knowledge_references\":[{\"chunk_id\":\"chk_401\",\"title\":\"2026差旅报销制度.pdf\",\"start_at\":1240,\"end_at\":1395}]}\n\nevent: message\ndata: {\"response_type\":\"answer\",\"content\":\"根据《2026差旅报销制度》[1]，一线城市住宿标准为 **750 元/晚**。\",\"done\":false}\n\nevent: message\ndata: {\"response_type\":\"answer\",\"content\":\"\",\"done\":true,\"request_id\":\"req_20261121_8a91c0\"}"}},{"id":"d1","flowId":"flow_ingest","stage":0,"row":0,"dfNodeId":"doc_input","techCompIds":["datasources","obj_store"],"wbTarget":{"moduleId":"m_eco","nodeId":"ec_conn"},"codeLabel":"2-1","title":"多源文档接入：11 类企业数据源流式同步、Cron 防重与安全文件代理","dfLabel":"多源文档接入","dfSublabel":"文件 · URL · 11类连接器","dfTag":"生产入口","nodeType":"external","stars":4,"duration":"14 分钟","inputSpec":"管理员手动上传 PDF/Word/Markdown，或企业飞书/Confluence/Notion/GitLab 等 11 类数据源定时增量同步","outputSpec":"原件安全落盘对象存储、同步游标按页 Checkpoint 持久化，并生成异步解析任务入队","packetSample":"StreamingConnector -> Emit(item: \"员工手册.pdf\") -> Checkpoint(cursor: { page_token: \"p_18\", edited_at: 1732000100 })","analogy":"就像**图书馆采购部批量进书**：如果一次拉一万本书全抱在怀里走，半路摔一跤就得重头搬（传统 `FetchAll` OOM/超时）；改成推小车边拉边上架、每搬完一排打勾记进度（`StreamingConnector` + `Checkpoint`），断电重启直接从下一排接着搬！","files":[{"id":"fd1_conn","path":"internal/datasource/connector.go","sliceStart":54,"sliceEnd":94,"label":"datasource/connector.go","relPath":"internal/datasource/connector.go","startLine":54,"endLine":94,"lines":["// StreamHandler receives items and progress checkpoints emitted during a","// streaming fetch. The service implements it to ingest each item as it arrives","// (bounding memory to one item instead of the whole wiki) and to persist the","// connector cursor at page boundaries, so a sync that times out mid-traversal","// resumes from the last checkpoint instead of restarting from scratch","// (Tencent/WeKnora#2136).","type StreamHandler interface {","\t// Emit ingests a single fetched item. Returning an error aborts the","\t// stream: the connector stops fetching and propagates the error, since a","\t// failed ingest means the sync is failing and further API calls are wasted.","\tEmit(ctx context.Context, item types.FetchedItem) error","","\t// Checkpoint persists the cursor reached so far. The cursor is only valid","\t// for the duration of the call (the connector may keep mutating its backing","\t// maps afterwards), so implementations must serialize it synchronously.","\t//","\t// The cursor MUST be a complete resumable snapshot, not a delta: resuming","\t// from it must reproduce all progress so far. This is what lets the service","\t// treat a checkpoint as a safe restart point and, for a full sync, drop the","\t// prior baseline without losing already-synced state.","\tCheckpoint(ctx context.Context, cursor *types.SyncCursor) error","}","","// StreamingConnector is an optional interface. Connectors that implement it let","// the service interleave fetch→ingest→checkpoint so a large sync persists","// incrementally and resumes after a timeout, rather than holding every item in","// memory and losing all progress on retry. Connectors that do not implement it","// fall back to FetchAll / FetchIncremental unchanged.","type StreamingConnector interface {","\tConnector","","\t// FetchStream walks the configured resources starting from cursor (nil =","\t// from the beginning / full sync), calling h.Emit for each changed item and","\t// h.Checkpoint at page boundaries. It returns the final cursor for the next","\t// sync. Nodes already recorded in cursor at their current edit time are","\t// skipped, which is what makes a resumed sync converge.","\tFetchStream(","\t\tctx context.Context, config *types.DataSourceConfig,","\t\tcursor *types.SyncCursor, h StreamHandler,","\t) (*types.SyncCursor, error)","}"]},{"id":"fd1_sch","path":"internal/datasource/scheduler.go","sliceStart":35,"sliceEnd":99,"label":"datasource/scheduler.go","relPath":"internal/datasource/scheduler.go","startLine":35,"endLine":99,"lines":["// Scheduler manages cron-based periodic sync for data sources.","//","// robfig/cron fires at absolute wall-clock times (e.g. \"0 0 * * * *\" always fires","// at the top of every hour regardless of when the process started). So multiple","// instances will fire at the same moment. Dedup is handled by two layers:","//","//  1. HasRunningSync — if a previous sync is still running, skip (prevent overlap).","//  2. asynq.TaskID  — deterministic ID per (dataSourceID, minute). Redis ensures","//     only one task with a given ID is enqueued. Losers get ErrTaskIDConflict.","type Scheduler struct {","\tcron         *cron.Cron","\tdsRepo       interfaces.DataSourceRepository","\tsyncLogRepo  interfaces.SyncLogRepository","\ttaskEnqueuer interfaces.TaskEnqueuer","","\tmu      sync.Mutex","\tentries map[string]cron.EntryID // dataSourceID → cron entry ID","}","","// NewScheduler creates a new Scheduler.","func NewScheduler(","\tdsRepo interfaces.DataSourceRepository,","\tsyncLogRepo interfaces.SyncLogRepository,","\ttaskEnqueuer interfaces.TaskEnqueuer,",") *Scheduler {","\treturn &Scheduler{","\t\tcron: cron.New(cron.WithParser(syncScheduleParser), cron.WithChain(","\t\t\tcron.Recover(cron.DefaultLogger),","\t\t)),","\t\tdsRepo:       dsRepo,","\t\tsyncLogRepo:  syncLogRepo,","\t\ttaskEnqueuer: taskEnqueuer,","\t\tentries:      make(map[string]cron.EntryID),","\t}","}","","// Start loads all active data sources from the database and registers their","// cron schedules. Then starts the cron runner in the background.","func (s *Scheduler) Start(ctx context.Context) error {","\tdataSources, err := s.dsRepo.FindActive(ctx)","\tif err != nil {","\t\treturn fmt.Errorf(\"load active data sources: %w\", err)","\t}","","\tfor _, ds := range dataSources {","\t\tif ds.SyncSchedule == \"\" {","\t\t\tcontinue","\t\t}","\t\tif err := s.addEntry(ds); err != nil {","\t\t\tlogger.Warnf(ctx, \"[Scheduler] failed to register cron for ds=%s schedule=%q: %v\",","\t\t\t\tds.ID, ds.SyncSchedule, err)","\t\t}","\t}","\t// Retention also runs for paused and manual-only sources. Reuse this","\t// runner so StopWithin waits for cleanup along with in-flight sync jobs.","\tif _, err := s.cron.AddJob(\"@daily\", cron.NewChain(","\t\tcron.SkipIfStillRunning(cron.DefaultLogger),","\t).Then(cron.FuncJob(s.cleanupSyncLogs))); err != nil {","\t\treturn fmt.Errorf(\"register sync log retention: %w\", err)","\t}","","\ts.cron.Start()","\tlogger.Infof(ctx, \"[Scheduler] started with %d cron entries\", len(s.entries))","\treturn nil","}"]},{"id":"fd1_file","path":"internal/router/files.go","sliceStart":26,"sliceEnd":94,"label":"router/files.go","relPath":"internal/router/files.go","startLine":26,"endLine":94,"lines":["// files.go hosts every file-proxy surface the router exposes:","//","//   - /files                              tenant-scoped raw storage proxy","//   - /api/v1/knowledge-bases/:id/files   KB-scoped proxy (shared-KB images)","//   - /api/v1/sessions/:id/messages/:message_id/files","//                                          message-scoped proxy (shared-agent output)","//   - /api/v1/files/presigned             HMAC-signed anonymous access (IM)","//   - /api/v1/files/presigned-preview     Admin-only URL diagnostics","//   - /r/:token                           short-lived capability URLs","//","// The handlers differ in how they authenticate and which tenant owns the","// object, but share the same storage plumbing — the helpers directly below","// are that shared plumbing.","","// getRouteRegistrar is the minimal registration surface serveFiles* needs;","// both *gin.Engine and *gin.RouterGroup satisfy it, which keeps the file","// routes testable without building a full engine.","type getRouteRegistrar interface {","\tGET(string, ...gin.HandlerFunc) gin.IRoutes","}","","type (","\tmessageFileLookup        = access.MessageFileLookup","\tsharedAgentFileLookup    = access.SharedAgentFileLookup","\tmessageKBShareAuthorizer = access.MessageKBShareAuthorizer",")","","// localStorageBaseDir resolves LOCAL_STORAGE_BASE_DIR with the container","// default.","func localStorageBaseDir() string {","\tbaseDir := strings.TrimSpace(os.Getenv(\"LOCAL_STORAGE_BASE_DIR\"))","\tif baseDir == \"\" {","\t\tbaseDir = \"/data/files\"","\t}","\treturn baseDir","}","","// localStorageAbsDir is localStorageBaseDir made absolute — the form the","// storage resolvers expect.","func localStorageAbsDir() string {","\tabsDir, _ := filepath.Abs(localStorageBaseDir())","\treturn absDir","}","","// parseStorageTarget splits a stored file path into its optional storage","// backend ID and provider scheme (e.g. \"backend://3/local://7/x.png\" ->","// (\"3\", \"local\"); \"cos://7/x.png\" -> (\"\", \"cos\")).","func parseStorageTarget(filePath string) (backendID, provider string) {","\tbackendID, providerPath, scoped := types.ParseStorageBackendPath(filePath)","\tif !scoped {","\t\tproviderPath = filePath","\t}","\treturn backendID, types.ParseProviderScheme(providerPath)","}","","// requireFilePathQuery validates the file_path query parameter every proxy","// route accepts. On failure the 400 response has been written and ok=false.","func requireFilePathQuery(c *gin.Context) (string, bool) {","\tfilePath := strings.TrimSpace(c.Query(\"file_path\"))","\tif filePath == \"\" {","\t\tc.JSON(http.StatusBadRequest, gin.H{\"error\": \"missing required parameter: file_path\"})","\t\treturn \"\", false","\t}","\tif strings.Contains(filePath, \"..\") {","\t\tc.JSON(http.StatusBadRequest, gin.H{\"error\": \"invalid file path\"})","\t\treturn \"\", false","\t}","\treturn filePath, true","}"]}],"steps":[{"id":"sd1_1","order":1,"type":"backend","label":"流式拉取+Checkpoint","sublabel":"Emit单条入库 · 分页落游标","tag":"防OOM超时","edgeLabel":"定时防重","fileId":"fd1_conn","startLine":54,"endLine":94,"explain":"`StreamingConnector` 交错执行 `Fetch → Emit → Checkpoint`：内存占用恒定为单篇文档，翻页边界同步序列化完整可重放 `SyncCursor`，超时重试直接跳过未变更节点。","pitfall":"游标 `SyncCursor` 必须是完整可重放快照而非增量 delta，否则全量同步删旧基线后会丢失已同步状态！"},{"id":"sd1_2","order":2,"type":"messagebus","label":"Cron 多副本双层去重","sublabel":"HasRunningSync + 确定TaskID","tag":"无选主防重","edgeLabel":"文件代理","fileId":"fd1_sch","startLine":35,"endLine":99,"explain":"多副本独立运行 `robfig/cron`，靠“先查 `HasRunningSync` 跳过在途同步 + 入队时生成确定性 `asynq.TaskID(dsID, minute)` 让 Redis 原子去重”，免去沉重分布式选主！","pitfall":"注意日志清理定时任务复用同一 runner 且覆盖暂停数据源，确保停机平滑收敛。"},{"id":"sd1_3","order":3,"type":"security","label":"三级安全文件代理","sublabel":"租户/KB/消息级 · 禁..穿越","tag":"多存储统一","edgeLabel":"","fileId":"fd1_file","startLine":26,"endLine":94,"explain":"统一收口 Local/MinIO/COS/TOS 多存储后端路径解析，入口拦截 `..` 路径穿越；针对共享 KB 与共享 Agent 回复图片拆分独立代理面，权限从持久化消息反推。","pitfall":"绝不能让共享 Agent 回复中的源空间图片走租户原始 `/files` 接口，必须走消息级权限反推路由。"}],"quiz":{"question":"在多副本部署下，WeKnora 没有引入 ZooKeeper/etcd 选主，如何防止 N 个实例的 Cron 调度器在同一分钟把同一个数据源同步任务重复入队 N 次？","options":["靠随机 sleep 几秒碰运气错开","双层去重：应用层先查 HasRunningSync 跳过运行中任务，入队时生成确定性 asynq.TaskID(dataSourceID, minute) 由 Redis 原子拒绝重复入队","只允许用户手动点按钮同步，关闭 Cron","让每个副本只同步偶数编号的数据源"],"correctIndex":1,"explanation":"非常优雅的无选主分布式防重设计！既简单可靠又零额外基础设施依赖。"},"interviewQ":"同时接入 11 类外部 SaaS 知识源定时同步，怎么避免大 Wiki 同步 OOM/超时重跑以及多副本重复调度？","interviewA":"数据拉取侧抽象 `StreamingConnector` 交错 `Emit` 入库与分页 `Checkpoint` 持久化完整 `SyncCursor`，实现恒定单条内存与断点续传；定时调度侧结合 `HasRunningSync` + Redis 确定性 `asynq.TaskID(dsID, minute)` 双层防重，无需选主即可多副本安全运行。","whyBlock":{"painPoint":"企业知识分散在本地 PDF/Word、网页 URL、飞书、Notion、Confluence、语雀、S3 等 11 类数据源里。如果每个连接器各写一套拉取与定时调度，且全量拉取时一万篇文档全塞进内存，不仅会 OOM 崩溃，而且同步到第 8000 篇断网后还得从第 1 篇重头再来！同时文件代理下载若不校验签名或租户归属，极易成为公开文件泄露漏洞。","analogy":"就像**多港口集装箱码头 + 断点加油口**：不管货物从公路（上传）、海运（URL）还是 11 家外贸公司（SaaS 连接器）运来，都要装进统一标准集装箱（`FetchedItem`），用流式传送带分批卸货（`StreamingConnector`），每卸完一批记下进度书签（`Checkpoint`），断电重来接着卸；所有入库原件必须经保安核验临时提货单签名（`files.go`）才能访问！","avoidRabbitHole":"不要逐个去读 `internal/datasource/connector/` 下飞书/Notion/Confluence 11 个连接器的 SDK 翻页细节！本站吃透 `connector.go`（流式接口 + Checkpoint）、`scheduler.go`（Cron 防重调度）和 `files.go`（代理与签名门禁）三个核心抽象，就能一通百通！"},"ioContract":{"inType":"Multipart 文件上传 / URL 提交 / SaaS 连接器 Cron 同步触发","inFields":[{"name":"kb_id","type":"string","desc":"目标归属知识库 ID"},{"name":"source_type","type":"enum","desc":"`file`（上传） / `url`（网页） / `feishu` / `notion` / `confluence` 等 11 类"},{"name":"cursor / checkpoint","type":"map[string]any","desc":"上次同步保存的断点游标（增量同步只拉取变更文档）"},{"name":"enable_multimodel","type":"bool","desc":"是否启用图片/多模态视觉理解解析"}],"inSample":"{\n  \"sync_job_id\": \"sync_20261121_09\",\n  \"kb_id\": \"kb_finance_2026\",\n  \"connector_type\": \"feishu_wiki\",\n  \"sync_mode\": \"incremental\",\n  \"last_checkpoint\": {\n    \"space_id\": \"7281904412\",\n    \"updated_after\": \"2026-11-20T00:00:00Z\",\n    \"page_token\": \"pt_9921a\"\n  }\n}","transformSteps":["`connector.go` 通过 `StreamingConnector.FetchStream` 分批流式拉取远端文档，边拉边投递并持久化 `Checkpoint` 防 OOM 与重拉","`scheduler.go` 基于 Cron + 分布式防重锁调度周期同步，同一数据源不会重叠并发拉取","`files.go` 将原始文件落入对象存储并生成带租户隔离的代理/签名访问路径，随后把文档解析任务投递至 Asynq 解析队列"],"outType":"Asynq `document:process` 任务消息 + `knowledges` 初始待解析记录","outFields":[{"name":"knowledge_id","type":"string","desc":"新创建或更新的文档主键 ID"},{"name":"file_path / storage_key","type":"string","desc":"对象存储中的原件路径（后续解析器按需读取）"},{"name":"parse_status","type":"string","desc":"初始状态 `pending`，同时携带递增 `attempt` 版本号防旧任务乱序"}],"outSample":"{\n  \"queue\": \"doc:parse\",\n  \"task_type\": \"document:process\",\n  \"payload\": {\n    \"tenant_id\": 10042,\n    \"kb_id\": \"kb_finance_2026\",\n    \"knowledge_id\": \"doc_travel_2026\",\n    \"file_name\": \"2026差旅报销制度.pdf\",\n    \"storage_key\": \"tenants/10042/kb_finance_2026/doc_travel_2026.pdf\",\n    \"attempt\": 1\n  }\n}"}},{"id":"d2","flowId":"flow_ingest","stage":1,"row":0,"dfNodeId":"parse_chunk","techCompIds":["doc_parser"],"wbTarget":{"moduleId":"m_infra","nodeId":"inf_py_img"},"codeLabel":"2-2","title":"解析与分块：Python DocReader 无状态内联图 + Go 位移不变量分块","dfLabel":"解析与分块","d
