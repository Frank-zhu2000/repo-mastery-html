kens\": 600 },\n    { \"idx\": 5, \"role\": \"user\", \"content\": \"继续查二季度\", \"tokens\": 90 }\n  ],\n  \"naive_cut_idx\": 3\n}","transformSteps":["PG (`000136`) 与 SQLite (`000052`) 统一以 `(tenant_id, user_id, name)` 唯一约束落库加密凭据，仅凭据本人上下文可读","`cutpoint.go` 从尾部向前累算保留预算，发现初始切点 `idx=3` 落在 `role == \"tool\"` 上，会立刻安全回退/前移切点直到避开所有孤立工具结果","安全切点之前的历史压缩为结构化摘要，切点之后的「完整工具调用对 + 最新轮次」原样保留，保证 100% 通过任意 LLM API 协议校验"],"outType":"合规加密凭据表记录 + 协议零报错的压缩后消息序列","outFields":[{"name":"safe_cut_index","type":"int","desc":"调整后的合法切割下标（保证 `messages[cut].Role != \"tool\"`）"},{"name":"compacted_summary","type":"string","desc":"旧轮次提炼出的关键事实摘要，替代被压缩的冗长工具输出"},{"name":"retained_messages","type":"[]types.Message","desc":"成对完整的近期消息，继续喂给下一站工具执行循环"}],"outSample":"{\n  \"db_persisted\": \"credential_vault (PG & SQLite schema synced)\",\n  \"compaction_result\": {\n    \"naive_cut_idx\": 3,\n    \"adjusted_safe_cut_idx\": 4,\n    \"reason\": \"禁止切在 idx=3 (role=tool) 拆散 assistant(call_1)+tool(call_1) 成对结构\",\n    \"tokens_saved\": 8870,\n    \"retained_roles\": [\"system\", \"summary\", \"assistant(idx=4)\", \"user(idx=5)\"]\n  }\n}"}},{"id":"a4","flowId":"flow_agent","stage":3,"row":2,"dfNodeId":"agent_sandbox","techCompIds":["sandbox_vault","qa_agent"],"wbTarget":{"moduleId":"security","nodeId":"sec_probe"},"codeLabel":"3-4","title":"Agent 与沙箱执行：残缺 JSON 拒执、快照挂起与 /dev/shm 零明文填表","dfLabel":"Agent 与沙箱执行","dfSublabel":"ReAct · MCP · wk-secret-fill","dfTag":"受控执行","nodeType":"backend","stars":5,"duration":"18 分钟","inputSpec":"LLM 输出的工具调用 JSON 参数、审批等待信号，以及用于沙箱浏览器登录的不透明凭据句柄","outputSpec":"可修复小瑕疵放行、截断半成品拒执；长审批挂起释放协程；沙箱核实顶层 URL 后零日志注入表单！","packetSample":"Probe: top_url=\"https://erp.corp/login\" (MATCH domains)\nExec: write 32B key -> /dev/shm/k_x | argv: wk-secret-fill --enc <ciphertext> | defer clear(key) + WithoutCancel(rm)","analogy":"就像**防爆机械臂执行任务**：① 指令纸多写了个逗号自动修，撕掉半截（`truncated`）坚决不动手；② 等领导签字太久先存档撤回机械臂（`RunSnapshot`）；③ 给浏览器输密码前先拿激光确认门牌号没被钓鱼掉包（顶层 URL 探针），再用阅后即焚内存纸递钥匙，完事当场烧毁（`clear` + `WithoutCancel`）！","files":[{"id":"fa4_rep","path":"internal/agent/tools/json_repair.go","sliceStart":20,"sliceEnd":65,"label":"tools/json_repair.go","relPath":"internal/agent/tools/json_repair.go","startLine":20,"endLine":65,"lines":["func RepairJSON(s string) string {","\trepaired, _ := RepairJSONDetail(s)","\treturn repaired","}","","// RepairJSONDetail is RepairJSON that also reports whether the payload had to","// be closed off to parse — an unterminated string or an unbalanced bracket.","// That only happens when the provider stopped emitting mid-argument, so the","// values now parse but are partial: `content` holds half a file, `query` holds","// half a sentence. Callers must refuse such a call rather than run it.","// Escape and trailing-comma fixes are ordinary malformations, not truncation,","// and do not set the flag.","func RepairJSONDetail(s string) (string, bool) {","\ts = strings.TrimSpace(s)","\tif s == \"\" {","\t\treturn \"{}\", false","\t}","","\t// Must start with { for object","\tif s[0] != '{' {","\t\t// Maybe the LLM returned just key=value pairs without braces","\t\tif strings.Contains(s, \":\") || strings.Contains(s, \"=\") {","\t\t\ts = \"{\" + s + \"}\"","\t\t} else {","\t\t\treturn s, false","\t\t}","\t}","","\t// Fix invalid backslash escapes before anything else, because unbalanced","\t// strings confuse the comma/bracket trackers below.","\ts = fixInvalidEscapes(s)","","\t// Drop anything after the first complete top-level value","\ts = trimAfterTopLevelValue(s)","","\t// Fix trailing commas: ,} or ,]","\ts = fixTrailingCommas(s)","","\t// Balance brackets and braces","\treturn balanceBrackets(s)","}","","// fixInvalidEscapes turns invalid JSON string escapes into literal backslash","// sequences. JSON only allows the escape letters \\\" \\\\ \\/ \\b \\f \\n \\r \\t \\u;","// any other backslash inside a string (e.g. \\+ \\d \\w \\. \\| \\( \\)) is a parse","// error. LLMs frequently emit these when they meant to pass a regex pattern"]},{"id":"fa4_sus","path":"internal/agent/suspend.go","sliceStart":29,"sliceEnd":88,"label":"agent/suspend.go","relPath":"internal/agent/suspend.go","startLine":29,"endLine":88,"lines":["// RunSnapshot is everything needed to resume a run that ended waiting on a","// user prompt. It holds durable values only: request-local model handles","// (chunk://N, doc://N, res://, msN, mtN) do not survive the run, so the user turn is kept","// as the raw query and re-rendered on resume, and tool arguments are kept in","// their decoded form.","type RunSnapshot struct {","\tCollaborationDeliveries []CollaborationDelivery `json:\"collaboration_deliveries,omitempty\"`","\tCollaborationCursor     *int64                  `json:\"collaboration_cursor,omitempty\"`","\tMCPToolRefs             []string                `json:\"mcp_tool_refs,omitempty\"`","\tVersion                 int                     `json:\"version\"`","\tCollaborationWait       bool                    `json:\"collaboration_wait,omitempty\"`","\tBetweenRounds           bool                    `json:\"between_rounds,omitempty\"`","\t// Request is the caller's types.ResumableAgentRequest.","\tRequest   json.RawMessage `json:\"request,omitempty\"`","\tQuery     string          `json:\"query\"`","\tImageURLs []string        `json:\"image_urls,omitempty\"`","\t// UserMessages holds the raw text referenced by UserMessagesBefore.","\tUserMessages map[string]string `json:\"user_messages,omitempty\"`","","\tCompletedSteps []types.AgentStep     `json:\"completed_steps\"`","\tKnowledgeRefs  []*types.SearchResult `json:\"knowledge_refs,omitempty\"`","\tCurrentRound   int                   `json:\"current_round\"`","\tTurnUsage      types.TokenUsage      `json:\"turn_usage\"`","","\tPendingRound PendingRound `json:\"pending_round\"`","}","","// PendingRound is the round interrupted by the prompt.","type PendingRound struct {","\t// Step carries the round's thought and reasoning; its ToolCalls are the","\t// calls that finished before the blocked one.","\tStep  types.AgentStep `json:\"step\"`","\tCalls []PendingCall   `json:\"calls\"`","\t// BlockedIndex is the call waiting on the prompt. Calls after it have","\t// not run.","\tBlockedIndex int `json:\"blocked_index\"`","}","","// PendingCall is one tool call of the interrupted round.","type PendingCall struct {","\tID   string `json:\"id\"`","\tName string `json:\"name\"`","\t// Arguments is the decoded JSON the call executes with.","\tArguments         string                 `json:\"arguments\"`","\tUnresolvedHandles []string               `json:\"unresolved_handles,omitempty\"`","\tProviderMetadata  types.ToolCallMetadata `json:\"provider_metadata,omitempty\"`","}","","// DecodeRunSnapshot parses a saved snapshot, rejecting unknown versions.","func DecodeRunSnapshot(data []byte) (*RunSnapshot, error) {","\tvar snap RunSnapshot","\tif err := json.Unmarshal(data, &snap); err != nil {","\t\treturn nil, fmt.Errorf(\"decode run snapshot: %w\", err)","\t}","\tif snap.Version != RunSnapshotVersion {","\t\treturn nil, fmt.Errorf(\"unsupported run snapshot version %d\", snap.Version)","\t}","\treturn &snap, nil","}",""]},{"id":"fa4_fill","path":"internal/sandbox/secret_fill.go","sliceStart":53,"sliceEnd":160,"label":"sandbox/secret_fill.go","relPath":"internal/sandbox/secret_fill.go","startLine":53,"endLine":160,"lines":["// SessionSecureBrowser advertises the capability while the manager is open.","func (m *SessionBoundManager) SessionSecureBrowser() SessionSecureBrowser {","\tif m == nil || m.remoteDisabled() {","\t\treturn nil","\t}","\treturn m","}","","// CurrentPage reads the top-level URL of the session browser.","func (m *SessionBoundManager) CurrentPage(ctx context.Context, sessionID string) (BrowserPage, error) {","\tout, err := m.runSecretHelper(ctx, sessionID, \"\", nil, []string{\"--probe\"}, secretProbeTimeout)","\tif err != nil {","\t\treturn BrowserPage{}, err","\t}","\tvar probe struct {","\t\tURL   *string `json:\"url\"`","\t\tError string  `json:\"error\"`","\t}","\tif err := json.Unmarshal([]byte(strings.TrimSpace(out)), &probe); err != nil {","\t\treturn BrowserPage{}, errors.New(\"sandbox: unreadable browser probe output\")","\t}","\tif probe.Error != \"\" {","\t\treturn BrowserPage{}, fmt.Errorf(\"sandbox: browser probe: %s\", probe.Error)","\t}","\tif probe.URL == nil {","\t\treturn BrowserPage{}, nil","\t}","\treturn BrowserPage{URL: *probe.URL}, nil","}","","// FillSecret hands req to the helper without putting a value on any channel","// envd logs: the one-time key travels through the file API, which logs only","// the path, and argv carries only ciphertext.","func (m *SessionBoundManager) FillSecret(","\tctx context.Context, sessionID string, req SecretFillRequest,",") (*SecretFillResult, error) {","\tkey := make([]byte, 32)","\tif _, err := rand.Read(key); err != nil {","\t\treturn nil, err","\t}","\tdefer clear(key)","\tpayload, err := json.Marshal(req)","\tif err != nil {","\t\treturn nil, err","\t}","\tsealed, err := sealSecretPayload(key, payload)","\tclear(payload)","\tif err != nil {","\t\treturn nil, err","\t}","\tname := make([]byte, 16)","\tif _, err := rand.Read(name); err != nil {","\t\treturn nil, err","\t}","\tkeyPath := secretFillKeyDir + \"/wk-fill-\" + hex.EncodeToString(name)","\tout, err := m.runSecretHelper(ctx, sessionID, keyPath, key,","\t\t[]string{\"--key-file\", keyPath, sealed}, secretFillTimeout)","\tif err != nil {","\t\treturn nil, err","\t}","\tvar res struct {","\t\tFields map[string]string `json:\"fields\"`","\t\tError  string            `json:\"error\"`","\t}","\tif err := json.Unmarshal([]byte(strings.TrimSpace(out)), &res); err != nil {","\t\treturn nil, errors.New(\"sandbox: unreadable wk-secret-fill output\")","\t}","\tswitch res.Error {","\tcase \"\":","\tcase \"no_browser\":","\t\treturn nil, errors.New(\"sandbox: the session browser is not running\")","\tcase \"browser_busy\":","\t\treturn nil, errors.New(\"sandbox: the session browser stayed busy; retry\")","\tdefault:","\t\treturn nil, fmt.Errorf(\"sandbox: wk-secret-fill: %s\", res.Error)","\t}","\treturn &SecretFillResult{Fields: res.Fields}, nil","}","","// runSecretHelper runs wk-secret-fill in the session's sandbox. With keyPath","// set it stages key there first and always removes it afterwards.","func (m *SessionBoundManager) runSecretHelper(","\tctx context.Context, sessionID, keyPath string, key []byte, args []string, timeout time.Duration,",") (string, error) {","\tif err := m.requireRemoteBackend(); err != nil {","\t\treturn \"\", err","\t}","\tif strings.TrimSpace(sessionID) == \"\" {","\t\treturn \"\", errors.New(\"sandbox: session ID required for the browser helper\")","\t}","\tsc, err := m.scope(ctx, sessionID)","\tif err != nil {","\t\treturn \"\", err","\t}","\tctx, release, err := m.admitUser(ctx, sc, \"shell\")","\tif err != nil {","\t\treturn \"\", err","\t}","\tdefer release()","\thandle, err := m.resolveScope(ctx, sc)","\tif err != nil {","\t\treturn \"\", err","\t}","\tif keyPath != \"\" {","\t\tdefer func() { _ = m.client.Remove(context.WithoutCancel(ctx), handle, keyPath) }()","\t\tencoded := []byte(base64.StdEncoding.EncodeToString(key))","\t\terr := m.client.WriteFile(ctx, handle, keyPath, encoded)","\t\tclear(encoded)"]}],"steps":[{"id":"sa4_1","order":1,"type":"messagebus","label":"JSON修复与截断拒执","sublabel":"先修转义 · truncated拒写","tag":"防半截破坏","edgeLabel":"长等挂起","fileId":"fa4_rep","startLine":20,"endLine":65,"explain":"`RepairJSONDetail` 按序修非法反斜杠、去多余尾巴和尾逗号；但若靠强行闭环括号才合法，标记 `truncated=true` 阻止上层执行，防写文件工具把源码截断覆写！","pitfall":"必须先修非法反斜杠再做括号配对，否则未转义字符会污染引号状态机！"},{"id":"sa4_2","order":2,"type":"cloud","label":"RunSnapshot 快照挂起","sublabel":"序列化落库 · 零协程占死","tag":"任意副本续跑","edgeLabel":"安全填表","fileId":"fa4_sus","startLine":29,"endLine":88,"explain":"高危工具审批或安全表单等待超过热等待窗时，将完整对话历史、步数、Token 比例与挂起项序列化为 `RunSnapshot` 落库并退出协程，批准后任意副本读档续跑！","pitfall":"同时叠加重复 2 轮与同错 3 次熔断守卫，防止失控 Agent 死循环狂烧预算。"},{"id":"sa4_3","order":3,"type":"security","label":"域探针+/dev/shm清零","sublabel":"argv无明文 · WithoutCancel删键","tag":"零日志泄露","edgeLabel":"","fileId":"fa4_fill","startLine":53,"endLine":160,"explain":"填表前先调 `--probe` 读沙箱真实顶层 URL 核对域名白名单（防 Prompt Injection 跳钓鱼站）；生成 32B 临时密钥写 `/dev/shm`，`argv` 仅传密文，退出立即 `clear(key)` 并用 `context.WithoutCancel` 必删密钥文件！","pitfall":"用原 `ctx` 删 `/dev/shm` 密钥会在请求取消时失败导致密钥滞留沙箱内存盘！"}],"quiz":{"question":"向沙箱执行 `wk-secret-fill` 注入密码时，WeKnora 同时做了哪两道防线来防止“钓鱼页面窃密”和“容器命令行日志泄露”？","options":["信任大模型口头汇报的 URL + 直接把明文密码放进环境变量","先调 --probe 探针核验沙箱浏览器真实顶层 URL 命中域名白名单；再生成 32B 一次性密钥写 /dev/shm，命令行 argv 仅传密文且用 clear() + WithoutCancel 必删","禁止浏览器打开任何 HTTPS 页面","要求用户每次手动 SSH 进容器敲密码"],"correctIndex":1,"explanation":"顶级企业级安全设计！这一条链路讲透，几乎能秒杀市面上绝大多数 AI Agent 架构面试！"},"interviewQ":"沙箱浏览器 Agent 自动填表登录，怎么防止 Prompt Injection 诱导跳钓鱼站以及容器命令参数审计泄露密码？","interviewA":"填表前服务端先调 `CurrentPage` 探针直接读取沙箱浏览器真实顶层 URL 并比对凭据域名白名单；投递时生成 32B 随机密钥经文件 API 写进 `/dev/shm`，`wk-secret-fill` 命令行 `argv` 仅传密文，执行后立即 `clear()` 清零 Go 内存并用 `context.WithoutCancel` 强制删除 `/dev/shm` 密钥文件。","whyBlock":{"painPoint":"Agent 真正动手调工具、进沙箱执行时，有三大最容易把生产搞炸的雷区：① 大模型输出工具 JSON 经常带非法转义 `\\d`、尾逗号，更糟的是撞到 `max_tokens` 输出了一半残缺 JSON——盲目补全右括号会导致删错文件/发错金额！② 等用户点审批可能耗时 10 分钟，绝不能让 Go 协程傻等占死连接！③ 沙箱浏览器自动填密码时，怎么防止网页跳转钓鱼域名套取密码，且绝不在容器磁盘或命令行留下明文？","analogy":"① **JSON 修复器**像严谨的手术室护士：医生字迹多写了个逗号（合法格式修复），护士帮忙誊清；但处方写到一半纸撕了（`truncated == true`），护士**绝不脑补药量**直接退回重开！② **审批挂起快照**像单机游戏存档：等审批期间存盘释放主机资源，点同意立刻读档续战！③ **沙箱零明文填表**像押运车送钥匙：到门口先核对真银行门牌（顶层 URL 防钓鱼），再从一次性内存暗格递钥匙（`/dev/shm` 填完即清零）！","avoidRabbitHole":"这一站是整个 WeKnora 最具「硬核工程含金量」的王牌章节！不必去翻 Docker Daemon 底层 API，牢牢吃透 `json_repair.go`（可修 vs 截断拒执边界）、`suspend.go`（`RunSnapshot` 挂起与恢复）和 `secret_fill.go`（顶层 URL 探针 + `/dev/shm` 一次性清零填表）三段代码，面试能讲出别人听都没听过的深度！"},"ioContract":{"inType":"LLM 原始工具调用 JSON + 不透明凭据句柄 `{{secret:cred_id}}` + 审批状态","inFields":[{"name":"raw_tool_args","type":"string","desc":"大模型流式输出的工具参数原文（可能含非法转义、尾逗号或截断）"},{"name":"credential_handle","type":"string","desc":"Agent 传入的凭据句柄（全程无明文密码）"},{"name":"target_page_url","type":"string","desc":"沙箱浏览器当前顶层页面真实 URL（用于防钓鱼域校验）"}],"inSample":"{\n  \"llm_raw_args\": \"{\\\"url\\\": \\\"https://oa.corp.internal/login\\\", \\\"cred_id\\\": \\\"cred_88201_oa\\\",}\",\n  \"sandbox_container_id\": \"wk_sbx_7721\",\n  \"browser_top_frame_url\": \"https://oa.corp.internal/login\",\n  \"approval_required\": true\n}","transformSteps":["`json_repair.go` 扫描修复尾逗号/非法反斜杠；若检测到未闭合字符串或截断（`truncated == true`），立刻拒绝执行并把纠错提示喂回 LLM 重试","`suspend.go` 在需要人工审批时将完整 `RunSnapshot`（消息历史、待执工具、迭代计数）序列化挂起并释放协程，审批通过后无缝唤醒","`secret_fill.go` 先探针核对浏览器顶层 URL 命中 `allowed_domains` 防钓鱼，再由宿主机解密经一次性 `/dev/shm` 内存通道注入 `wk-secret-fill` 填表并在毫秒内彻底清零"],"outType":"结构化工具观察结果 (`ToolObservation`，零明文脱敏，回喂 ReAct 下一轮)","outFields":[{"name":"status","type":"enum","desc":"`success` / `suspended_for_approval` / `rejected_truncated_json` / `domain_mismatch`"},{"name":"observation","type":"string","desc":"沙箱执行产出的脱敏结果（如页面登录态已建立、报表数据摘要），绝不含密码"},{"name":"shm_wiped","type":"bool","desc":"内存临时凭据文件是否已覆写清零并卸载"}],"outSample":"{\n  \"tool_call_id\": \"call_01\",\n  \"json_repair_applied\": [\"trailing_comma_removed\"],\n  \"domain_probe\": \"PASS (oa.corp.internal in allowed_domains)\",\n  \"shm_secret_wiped\": true,\n  \"status\": \"success\",\n  \"observation\": \"已在受控沙箱完成 OA 登录并提取 2026 Q2 差旅报表（共 12 行汇总数据）。\"\n}"}},{"id":"a5","flowId":"flow_agent","stage":4,"row":2,"dfNodeId":"audit_action","techCompIds":["sandbox_vault","stream_mgr"],"wbTarget":{"moduleId":"security","nodeId":"sec_hrev"},"codeLabel":"3-5","title":"Lite 自动审校 Fail-Closed、记忆主体合规审计与可续租锁清理","dfLabel":"产物、记忆与审计","dfSublabel":"自动审校 · 记忆治理 · 清理","dfTag":"合规留痕","nodeType":"cloud","stars":5,"duration":"14 分钟","inputSpec":"Lite 宿主机待审命令/文件改动、租户级长期记忆查询与对话历史检索索引清理请求","outputSpec":"严格六重 Fail-Closed 安全裁决 + 脱敏记忆主体审计留痕 + 分布式续租锁保护的无冲突索引清理！","packetSample":"HostReview: { temp: 0, reasoning: \"off\", tools: [], isolated: true, only_current_turn: true } -> Deny on any anomaly\nClearLock: WithRenewableLock(key, ttl=30s, renew=10s)","analogy":"就像**核电站安全总阀 + 合规档案审计**：自动审校官不带工具、不开脑洞、只认你当面说的话，哪怕有一丁点模糊或超时都一律按“拒绝”退回人工确认；管理员查团队记忆只看统计不偷窥正文且留审计；清理对话索引前先挂上每 10 秒自动续期的防撞锁，绝不和在线写入打架！","files":[{"id":"fa5_rev","path":"internal/agent/hostreview/reviewer.go","sliceStart":51,"sliceEnd":127,"label":"hostreview/reviewer.go","relPath":"internal/agent/hostreview/reviewer.go","startLine":51,"endLine":127,"lines":["// Review fails closed: any error, timeout or malformed reply is a refusal.","func (r *Reviewer) Review(ctx context.Context, turn Turn, req sandbox.CommandApprovalRequest) Verdict {","\tstarted := time.Now()","\tv := r.review(ctx, turn, req)","\tlogger.Infof(ctx, \"[HostReview] session=%s tool=%s reason=%s approved=%t risk=%s elapsed=%s why=%q\",","\t\tturn.SessionID, req.Tool, reviewReason(req), v.Approved, v.RiskLevel, time.Since(started), v.Reason)","\treturn v","}","","func (r *Reviewer) review(ctx context.Context, turn Turn, req sandbox.CommandApprovalRequest) Verdict {","\tif r == nil || r.model == nil {","\t\treturn Verdict{Reason: \"auto review is unavailable; ask the user to switch to ask mode\"}","\t}","\tif !req.TargetsComplete {","\t\treturn Verdict{Reason: \"too many targets to review automatically; ask the user to switch to ask mode\"}","\t}","\tif req.ScriptsIncomplete {","\t\treturn Verdict{Reason: \"this command runs a script that cannot be shown for review; \" +","\t\t\t\"ask the user to switch to ask mode\"}","\t}","\tif size, err := actionSize(req); err != nil || size > maxActionBytes {","\t\treturn Verdict{Reason: \"the action is too long to review automatically; ask the user to switch to ask mode\"}","\t}","\tif turn.RequestID == \"\" {","\t\tturn.RequestID, _ = types.RequestIDFromContext(ctx)","\t}","\tvar msgs []*types.Message","\tif r.messages != nil {","\t\tvar err error","\t\tif msgs, err = r.messages.GetRecentUserMessages(ctx, turn.SessionID, transcriptFetch); err != nil {","\t\t\treturn Verdict{Reason: fmt.Sprintf(\"auto review could not read the conversation: %v\", err)}","\t\t}","\t}","\tcurrent, earlier := splitTranscript(msgs, turn.RequestID)","\t// Only this turn can authorize. An empty current list would leave the","\t// model guessing from earlier messages or the untrusted action.","\tif turn.RequestID == \"\" || len(current) == 0 {","\t\treturn Verdict{Reason: \"auto review could not identify this turn's user messages; \" +","\t\t\t\"ask the user to switch to ask mode\"}","\t}","\tif currentTurnTooLong(current) {","\t\treturn Verdict{Reason: \"this turn's messages are too long to review automatically; \" +","\t\t\t\"ask the user to switch to ask mode\"}","\t}","\tprompt, err := buildUserPrompt(current, earlier, req)","\tif err != nil {","\t\treturn Verdict{Reason: fmt.Sprintf(\"auto review could not build its input: %v\", err)}","\t}","","\tcallCtx, cancel := context.WithTimeout(ctx, r.timeout)","\tdefer cancel()","\tresp, err := r.model.Chat(callCtx, []chat.Message{","\t\t{Role: \"system\", Content: systemPolicy},","\t\t{Role: \"user\", Content: prompt},","\t}, &chat.ChatOptions{","\t\tTemperature:         0,","\t\tMaxCompletionTokens: 4096,","\t\t// Off, not low: a graded level still turns thinking on, and a small","\t\t// completion budget is then spent before the JSON answer is written.","\t\tReasoningEffort: api.ReasoningOff,","\t\tIsolated:        true,","\t\tPromptCacheKey:  \"host-review:\" + turn.SessionID,","\t})","\tswitch {","\tcase errors.Is(callCtx.Err(), context.DeadlineExceeded) && ctx.Err() == nil:","\t\treturn Verdict{Reason: \"auto review timed out\"}","\tcase ctx.Err() != nil:","\t\treturn Verdict{Reason: \"the turn was stopped\"}","\tcase err != nil:","\t\treturn Verdict{Reason: fmt.Sprintf(\"auto review failed: %v\", err)}","\tcase resp == nil:","\t\treturn Verdict{Reason: \"auto review returned nothing\"}","\tcase len(resp.ToolCalls) > 0:","\t\treturn Verdict{Reason: \"auto review tried to call a tool, which is not allowed\"}","\t}","\treturn parseAssessment(resp.Content).verdict()","}"]},{"id":"fa5_mem","path":"internal/handler/memory_admin.go","sliceStart":36,"sliceEnd":60,"label":"handler/memory_admin.go","relPath":"internal/handler/memory_admin.go","startLine":36,"endLine":60,"lines":["// AdminListSubjects 分页列出租户内的记忆主体，每次请求记录一条分页审计。","// @Summary      列出租户记忆主体","// @Description  仅允许 JWT 登录的租户管理员或所有者访问；返回主体 UUID、开关、分类计数与最近活动时间，不返回记忆正文","// @Tags         记忆管理","// @Produce      json","// @Param        limit   query     int  false  \"每页条数，默认 50，最大 200\"  default(50)","// @Param        offset  query     int  false  \"非负偏移量\"  default(0)","// @Success      200     {object}  handler.ListMemorySubjectsResponse","// @Failure      403     {object}  handler.MemoryAdminErrorResponse","// @Failure      500     {object}  handler.MemoryAdminErrorResponse","// @Security     Bearer","// @Router       /admin/memory/subjects [get]","func (h *MemoryHandler) AdminListSubjects(c *gin.Context) {","\tlimit, offset := memoryListPaging(c)","\tsubjects, total, err := h.memoryService.AdminListSubjects(c.Request.Context(), limit, offset)","\tif err != nil {","\t\th.failMemoryAdmin(c, err, \"Failed to list memory subjects\")","\t\treturn","\t}","\th.auditMemoryAdmin(c, types.AuditActionMemorySubjectsListed, \"\", map[string]any{","\t\t\"limit\": limit, \"offset\": offset, \"count\": len(subjects),","\t})","\tc.JSON(http.StatusOK, ListMemorySubjectsResponse{Success: true, Data: subjects, Total: total})","}",""]},{"id":"fa5_clr","path":"internal/application/service/message_history_clear.go","sliceStart":19,"sliceEnd":61,"label":"message_history_clear.go","relPath":"internal/application/service/message_history_clear.go","startLine":19,"endLine":61,"lines":["func (s *messageService) withChatHistoryLock(","\tctx context.Context, tenantID uint64, fn func(context.Context) error,",") error {","\tif tenantID == 0 {","\t\treturn apperrors.NewBadRequestError(\"Workspace is empty\")","\t}","\tkey := fmt.Sprintf(\"weknora-chat-history-lock:%d\", tenantID)","\tif s.historyRedis != nil {","\t\treturn redislock.WithRenewableLock(ctx, s.historyRedis, key, 30*time.Second, 10*time.Second, fn)","\t}","\trelease, err := chatHistoryLocalLocks.lock(ctx, key)","\tif err != nil {","\t\treturn err","\t}","\tdefer release()","\treturn fn(ctx)","}","","func (s *messageService) chatHistoryTenant(ctx context.Context, tenantID uint64) (*types.Tenant, error) {","\ttenant, err := s.tenantService.GetTenantByID(ctx, tenantID)","\tif err != nil {","\t\treturn nil, err","\t}","\tif tenant == nil || tenant.ID != tenantID {","\t\treturn nil, apperrors.NewForbiddenError(\"Chat history workspace does not match\")","\t}","\treturn tenant, nil","}","","// Only a server-managed, tenant-owned history KB is a valid cleanup target.","// Neither a request body nor a stale TenantInfo pointer chooses the KB.","func (s *messageService) chatHistoryKB(","\tctx context.Context, tenantID uint64, id string,",") (*types.KnowledgeBase, error) {","\tkb, err := s.kbService.GetKnowledgeBaseByID(ctx, id)","\tif err != nil {","\t\treturn nil, err","\t}","\tif kb == nil || kb.ID != id || kb.TenantID != tenantID || !kb.IsTemporary || kb.Name != \"__chat_history__\" {","\t\treturn nil, apperrors.NewForbiddenError(\"Not a workspace chat history knowledge base\")","\t}","\treturn kb, nil","}"]}],"steps":[{"id":"sa5_1","order":1,"type":"security","label":"Lite 自动审校 Fail-Closed","sublabel":"无工具·禁思考·仅认本轮","tag":"六重默认拒绝","edgeLabel":"记忆合规","fileId":"fa5_rev","startLine":51,"endLine":127,"explain":"六重默认拒绝：① 目标不全/脚本不可见/超长直接拒；② 仅以本轮用户原话作授权依据；③ 独立隔离 `Chat` 设 `Temperature=0`、`ReasoningOff`、`Isolated=true`；④ 审校模型试图吐 `ToolCalls` 直接拒；⑤ 超时/异常/空响应全拒！","pitfall":"刻意关闭 `ReasoningEffort`（`ReasoningOff`），防止审校模型把小输出预算全耗在思考上截断 JSON 裁决。"},{"id":"sa5_2","order":2,"type":"cloud","label":"租户记忆合规审计","sublabel":"只返主体UUID统计 · 写审计","tag":"隐私治理","edgeLabel":"安全清理","fileId":"fa5_mem","startLine":36,"endLine":60,"explain":"管理员列举租户记忆主体时仅限 JWT Admin/Owner，返回 UUID、开关与分类计数而不直接暴露正文，且每次分页查询都自动落一条 `AuditActionMemorySubjectsListed` 审计记录。","pitfall":"企业合规场景下，管理员的每一次“查看行为”本身也必须可追溯留痕。"},{"id":"sa5_3","order":3,"type":"database","label":"可续租锁安全清索引","sublabel":"30s TTL / 10s 续约 · 双模锁","tag":"防并发写脏","edgeLabel":"","fileId":"fa5_clr","startLine":19,"endLine":61,"explain":"清理工作空间对话历史索引时，标准版使用可续租 Redis 分布式锁（30s TTL / 10s 自动续约防大清理中途锁过期），Lite 版降级进程内分组互斥锁，且强校验目标确为 `__chat_history__` 临时库！","pitfall":"🏆 恭喜！至此你已按「技术架构 + 3 条全链路数据流」完整通关全部 15 站，彻底精通 WeKnora 源码！"}],"quiz":{"question":"在 Lite 宿主机自动审校（`hostreview/reviewer.go`）中，为什么要把审校模型的 `ReasoningEffort` 显式设为 `ReasoningOff` 而不是 `low`？","options":["因为所有模型都报错不支持 low","防止审校模型在受限输出预算下把 Token 耗光在思考过程里导致最终 JSON 裁决被截断而误判/失败","为了允许审校模型调用 Shell 工具","为了让审校模型记住前 10 轮历史对话"],"correctIndex":1,"explanation":"完美收官！每一条防御设计背后都有清晰的线上工程边界考量。"},"interviewQ":"用大模型做本地高危命令自动审校（auto 模式）如何防 Prompt Injection 与误放行？清理对话索引怎么防并发冲突？","interviewA":"自动审校遵循六重 Fail-Closed：拒绝不完整目标与不可见脚本、仅信任本轮用户原话、独立隔离模型调用关闭工具与思考且 `Temperature=0`，任何超时/空回/企图调工具一律拒绝退回人工确认；索引清理标准版走 30s TTL/10s 自动续约 Redis 锁、Lite 版走进程内分组锁，并强校验目标库身份防误删业务知识库。","whyBlock":{"painPoint":"企业级 Agent 跑完后，最后一道关口决定了它能不能放心放进生产环境：① Lite 单机版操作用户本机文件时，如果开启 AI 自动审校，如何防止恶意网页藏入 Prompt Injection 诱骗审校 AI 放行 `rm -rf` 或外传私钥？② 租户长期记忆越积越多、或员工要求「彻底清空某会话历史」时，怎么保证多租户严格隔离且合规留痕，不留脏数据？","analogy":"Lite 自动审校官（`hostreview/reviewer.go`）就像**不带武器、绝不瞎猜的海关高级督察**：它自己没有任何工具调用权限（防反杀），只看客观操作摘要；遇到看不清目标路径、解析不了审核结论、审校模型超时或任何异常，**六重防线一律 Fail-Closed 拒签退回人工确认**！而记忆治理与历史清理就像**企业档案销毁室**：严格按租户权限核销，每一步都有合规留痕！","avoidRabbitHole":"本关是全链路收官站！重点背熟 `reviewer.go` 的「无工具纯审 + 六重 Fail-Closed 兜底」原则，以及 `memory_admin.go` + `message_history_clear.go` 如何通过 `TenantID` 硬过滤实现多租户合规治理——把这三块串联进你的 3 分钟面试架构讲述里，极易赢得高分！"},"ioContract":{"inType":"Lite Host 高危操作审校请求 + 租户记忆治理 / 会话历史清理请求","inFields":[{"name":"proposed_action","type":"HostAction","desc":"待审校的本机命令/文件写变更（含工作目录、目标路径、diff 摘要）"},{"name":"review_timeout","type":"time.Duration","desc":"自动审校模型硬超时上限（超时一律 Fail-Closed 拒绝）"},{"name":"tenant_id / session_id","type":"uint64 / string","desc":"记忆管理或历史清空请求的强隔离租户与会话标识"}],"inSample":"{\n  \"host_review_request\": {\n    \"session_id\": \"sess_lite_03\",\n    \"tool\": \"host_write_file\",\n    \"target_path\": \"/Users/ 瓜，不要盲目翻 3,800 个文件；Lite 模式下 `.env.lite` 自动发现严格受编译注入的 `Edition == \"lite\"` 约束。","interviewQ":"刚接手 WeKnora 这么大的仓库，你是怎么快速理清项目骨架和运行边界的？","interviewA":"先抓三处锚点：`cmd/server/main.go` 看进程启停、`internal/container/container.go` 看全部组件装配关系、`docker-compose.yml` 与 `config/config.yaml` 看运行时边界与默认阈值。"},{"id":"dir_router","type":"frontend","label":"路由网关与控制器","sublabel":"router/ · handler/ · task.go","tag":"355路径","x":322,"y":40,"w":214,"h":86,"fileId":"f_tree","startLine":26,"endLine":54,"tabLabel":"🌐 路由与接口","stepOrder":2,"jumpTo":{"moduleId":"m_router","nodeId":"rt_base","label":"进入路由与 6 池流程图"},"summary":"定义 355 个路径 / 456 个 HTTP 操作、文件代理与 Asynq 6 大物理 Worker 池拓扑。","deepDive":"`internal/router/router.go` 严格按顺序注册公开前置面（IM/Embed/MCP/WS）与受保护 `/api/v1`；`handler/` 专注 DTO 校验与 SSE 输出，`task.go` 承载 6 池隔离与死信回调。","pitfall":"启动期执行 `assertAPIKeyPoliciesMatchRoutes(r)`，若修改了路由模板但漏改 API Key 策略会直接 panic 暴露问题，避免线上静默 403。","interviewQ":"一个 355 路径、456 操作的企业 API 服务，如何组织路由文件和控制器避免膨胀？","interviewA":"按业务域拆分为 `routes_{chat,knowledge,agent,auth_tenant,memory,mcp_endpoint,infra}.go`，公开鉴权面与 `/api/v1` 分层隔离，Handler 仅做协议转换与参数校验，核心逻辑全部下沉至 `application/service`。"},{"id":"dir_auth","type":"security","label":"鉴权、RBAC 与访问","sublabel":"middleware/ · access/","tag":"多租户","x":610,"y":40,"w":214,"h":86,"fileId":"f_tree","startLine":55,"endLine":68,"tabLabel":"🔐 权限与访问","stepOrder":3,"jumpTo":{"moduleId":"m_auth","nodeId":"au_noauth","label":"进入认证与 RBAC 流程图"},"summary":"构成多租户安全边界：双轨认证（JWT/API Key）、四级 RBAC、资源归属与共享图片权限反推。","deepDive":"`middleware/` 做入口级认证、四级角色检查与路由级 API Key Default-Deny；`application/access/` 做领域级资源归属、共享 KB 检索范围收敛及共享 Agent 回复图片权限推导。","pitfall":"客户端传入的 `tenant_id` 与 `owner_id` 均不可信；跨空间越权查单资源返回 404 而非 403，防止枚举探测。","interviewQ":"middleware 层的鉴权和 application/access 层的鉴权有什么职责分工？","interviewA":"`middleware` 解决“你是谁、有没有调用该路由的最低角色或 API Key 能力”；`access` 解决“你对具体某个 KB、共享知识或跨空间回复图片有没有操作权”，两者双重兜底。"},{"id":"dir_service","type":"backend","label":"知识、RAG 与 Wiki","sublabel":"service/ · reranking/ · stream/","tag":"核心编排","x":34,"y":218,"w":214,"h":86,"fileId":"f_tree","startLine":69,"endLine":97,"tabLabel":"🔄 RAG与知识服务","stepOrder":4,"jumpTo":{"moduleId":"rag","nodeId":"qa_pipe","label":"进入 RAG 与 HNSW 流程图"},"summary":"整个系统含金量最高的业务编排中枢：11 步 RAG、RRF/Rerank/MMR、无感重解析、并发 Wiki 与 SSE 续流。","deepDive":"`chat_pipeline/` 以事件责任链串联检索与生成，`reranking/` 承载重排降级与 MMR，`knowledge_process.go` 与 `wiki_ingest.go` 管离线生产一致性，`stream/` 靠 Redis Stream 实现断线续流。","pitfall":"这是核心研发最该重仓精读的目录——点击卡片进入 RAG 流程架构图，也可一键切到「重解析与 Wiki」专题深入。","interviewQ":"如果只给 1 周时间精读 WeKnora 核心源码，你最推荐先吃透哪个目录？","interviewA":"首推 `internal/application/service/`（含 `chat_pipeline/`、`knowledge_process.go`、`knowledgebase_search_fusion.go`、`wiki_ingest.go`）+ `internal/reranking/`，直接覆盖 60% 以上高频技术深挖。"},{"id":"dir_agent","type":"backend","label":"ReAct 智能体与工具","sublabel":"internal/agent/ · tools/","tag":"上下文/MCP","x":322,"y":218,"w":214,"h":86,"fileId":"f_tree","startLine":98,"endLine":113,"tabLabel":"🧠 Agent与工具","stepOrder":5,"jumpTo":{"moduleId":"agent","nodeId":"ag_exec","label":"进入 ReAct Agent 流程图"},"summary":"封装无状态 ReAct 状态机、Token 动态校准、保对压缩、挂起恢复、多 Agent 协作与工具生态。","deepDive":"子包按关注点清晰解耦：`compaction/` 管切分压缩、`approval/` 管审批与安全表单、`hostreview/` 管 Lite 自动审校、`collaboration/` 管多智能体、`tools/` 管 JSON 修复与 MCP 目录重验。","pitfall":"不要把 `internal/agent/tools/` 里 50+ 工具逐个背完，重点精读 `engine.go`、`calibration.go`、`compaction/cutpoint.go`、`suspend.go` 和 `json_repair.go`。","interviewQ":"生产级 Agent 目录应该如何做模块化分层，才能同时支撑 RAG 工具、MCP、Skill 和多智能体？","interviewA":"WeKnora 把“执行循环 (`engine`)、上下文工程 (`compaction`/`calibration`)、风控门禁 (`approval`/`hostreview`)、协作 (`collaboration`) 与工具适配 (`tools`)”完全解耦成独立子包。"},{"id":"dir_sandbox","type":"security","label":"沙箱与凭据保险库","sublabel":"credential/ · sandbox/ · local","tag":"零明文","x":610,"y":218,"w":214,"h":86,"fileId":"f_tree","startLine":114,"endLine":128,"tabLabel":"🛡️ 沙箱与凭据","stepOrder":6,"jumpTo":{"moduleId":"security","nodeId":"sec_vault","label":"进入沙箱与凭据流程图"},"summary":"隔离执行 Shell/代码/浏览器任务，并通过 AES-GCM 凭据库 + `wk-secret-fill` 实现零明文安全登录。","deepDive":"`credential/` 负责行绑定密文与句柄化；`sandbox/` 管理 Docker/E2B/Cube 远程隔离与 `/dev/shm` 临时密钥填表；`localsandbox/` 负责 Lite 宿主机文件 Diff 审批与模式切换。","pitfall":"沙箱浏览器填表依赖镜像内置 `/usr/local/bin/wk-secret-fill`；个人凭据库强依赖 `SYSTEM_AES_KEY`，未配置直接禁用。","interviewQ":"远程容器沙箱（`sandbox/`）和本地桌面沙箱（`localsandbox/`）为什么拆成两套包？","interviewA":"隔离边界与信任模型完全不同：远程沙箱关注容器准入、微虚机绑定与 `/dev/shm` 零日志密钥投递；本地沙箱直接操作用户宿主机文件，必须引入 Diff 预览、会话级 `ask/auto` 切换与 Fail-Closed 自动审校。"},{"id":"dir_infra","type":"database","label":"解析、分块与检索库","sublabel":"docreader/ · chunker · retriever","tag":"10类引擎","x":34,"y":396,"w":214,"h":86,"fileId":"f_tree","startLine":129,"endLine":153,"tabLabel":"🗄️ 解析与检索","stepOrder":7,"jumpTo":{"moduleId":"m_infra","nodeId":"inf_py_img","label":"进入解析分块与检索流程图"},"summary":"串联 Python DocReader 多格式解析微服务、Go 自适应分块引擎与 10 类向量/全文/图谱检索仓储。","deepDive":"Python `docreader/` 专注 20+ 格式解析与 OCR 并内联回传图片字节；Go `infrastructure/chunker/` 保证位移不变量与父子分块；`repository/retriever/` 屏蔽 PG/SQLite/ES/Milvus/Qdrant/Neo4j 等 10 类底层差异。","pitfall":"检索后端只需精读 `postgres/`（含动态 HNSW）和 `sqlite/` 两套实现，其余 8 类看 `RetrieveEngine` 接口即可。","interviewQ":"为什么文档解析要拆出独立的 Python DocReader 微服务，而分块却放在 Go 服务里做？","interviewA":"文档解析高度依赖 Python 生态（PyPDF/OCR/MarkItDown/MinerU 等）且易 OOM/耗时，拆独立 gRPC 服务可独立扩缩与隔离故障；分块是纯 CPU 文本计算且与偏移不变量、父子块入库紧耦合，放 Go 侧吞吐高且事务一致。"},{"id":"dir_eco","type":"cloud","label":"模型与多渠道生态","sublabel":"models · datasource · im · mcp","tag":"11连/9IM","x":322,"y":396,"w":214,"h":86,"fileId":"f_tree","startLine":154,"endLine":171,"tabLabel":"📡 模型与生态","stepOrder":8,"jumpTo":{"moduleId":"m_eco","nodeId":"ec_chat","label":"进入模型与多渠道流程图"},"summary":"屏蔽多模态模型厂商差异，对外接入 11 类 SaaS 数据源、9 类 IM 机器人与内置无状态 MCP Server。","deepDive":"`models/` 统一 Chat/VLM/Embedding/Rerank/ASR 五类能力协议；`datasource/` 定时同步外部知识库；`im/` 承接企业微信/飞书/钉钉/Slack 等问答；`mcpserver/` 替代弃用的 Python `mcp-server/`。","pitfall":"学习时只看 `Connector` 接口、`models/` 限流器与 `mcpserver/server.go` 的端点过滤机制，不必死背各 SaaS/IM 平台字段细节。","interviewQ":"WeKnora 同时接入十几种外部数据源、9 种 IM 和几十种模型，如何防止业务代码被供应商 SDK 污染？","interviewA":"在 `models/`、`datasource/`、`im content for pure-chat path (RAG path handles this in INTO_CHAT_MESSAGE).","\t\tif len(req.Attachments) > 0 {","\t\t\tuserContent += req.Attachments.BuildPrompt()","\t\t}","\t\tchatManage.UserContent = userContent","","\t\tpipeline = types.NewPipelineBuilder().","\t\t\tAddIf(hasHistory, types.LOAD_HISTORY).","\t\t\tAdd(types.MEMORY_RECALL).","\t\t\tAdd(types.CHAT_COMPLETION_STREAM).","\t\t\tBuild()","\t} else {","\t\t// RAG — dynamically assemble based on feature flags.","\t\tpipeline = types.NewPipelineBuilder().","\t\t\tAddIf(hasHistory, types.LOAD_HISTORY).","\t\t\tAdd(types.MEMORY_RECALL).","\t\t\tAdd(types.QUERY_UNDERSTAND).","\t\t\tAdd(types.CHUNK_SEARCH_PARALLEL).","\t\t\tAdd(types.CHUNK_RERANK).","\t\t\tAddIf(webSearchEnabled, types.WEB_FETCH).","\t\t\tAdd(types.CHUNK_MERGE).","\t\t\tAdd(types.FILTER_TOP_K).","\t\t\tAddIf(chatManage.DataAnalysisEnabled, types.DATA_ANALYSIS).","\t\t\tAdd(types.INTO_CHAT_MESSAGE).","\t\t\tAdd(types.CHAT_COMPLETION_STREAM).","\t\t\tBuild()","\t}","","\tlogger.Infof(ctx, \"Assembled pipeline (%d stages), hasKB=%v, webSearch=%v, history=%v\",","\t\tlen(pipeline), hasKB, webSearchEnabled, hasHistory)","","\t// Start knowledge QA event processing (set session tenant so pipeline session/message lookups use session owner)","\tctx = context.WithValue(ctx, types.SessionTenantIDContextKey, req.Session.TenantID)","\t// Propagate the session ID so stateful sandbox backends (CubeSandbox) can","\t// bind script execution to a per-session MicroVM instance.","\tctx = types.WithSessionID(ctx, req.Session.ID)","\tlogger.Info(ctx, \"Triggering question answering event\")","\tsetupSpan.Finish(map[string]interface{}{","\t\t\"stages\":             len(pipeline),","\t\t\"knowledge_base_ids\": knowledgeBaseIDs,","\t\t\"search_targets\":     len(searchTargets),","\t}, nil, nil)","\terr = s.KnowledgeQAByEvent(ctx, chatManage, pipeline)","\tif err != nil {","\t\tlogger.ErrorWithFields(ctx, err, map[string]interface{}{","\t\t\t\"session_id\": req.Session.ID,","\t\t})","\t\treturn err","\t}","","\t// Note: Answer events are now emitted directly by chat_completion_stream plugin","\t// Completion event will be emitted when the last answer event has Done=true","\t// We can optionally add a completion watcher here if needed, but for now","\t// the frontend can detect completion from the Done flag","","\tlogger.Info(ctx, \"Knowledge base question answering initiated\")","\treturn nil","}"]},{"id":"f_hnsw","path":"internal/application/repository/retriever/postgres/hnsw_index.go","sliceStart":36,"sliceEnd":165,"label":"hnsw_index.go","relPath":"internal/application/repository/retriever/postgres/hnsw_index.go","startLine":36,"endLine":165,"lines":["// ensureHNSWIndex schedules, once per dimension per process, a background","// check that the embeddings table has a partial HNSW index for that","// dimension, the way migrations 000002 and 000059 provide for 3584, 798 and","// 1024. Any other dimension fell through to a sequential scan on every","// vector query (#3298). It runs on every write and vector query, so it only","// touches a map; the request is never blocked and never fails because of","// the index.","func (g *pgRepository) ensureHNSWIndex(dimension int) {","\tif dimension <= 0 || !g.autoIndex {","\t\treturn","\t}","\tif _, seen := g.hnswSeen.LoadOrStore(dimension, struct{}{}); seen {","\t\treturn","\t}","\tgo g.buildHNSWIndex(dimension)","}","","// buildHNSWIndexInBackground is the default buildHNSWIndex. The dimension","// stays marked as seen whatever happens, so a failure is reported once per","// process instead of on every request, and the log line says what to do.","func (g *pgRepository) buildHNSWIndexInBackground(dimension int) {","\tif err := g.createHNSWIndex(dimension); err != nil {","\t\tlogger.GetLogger(context.Background()).Warnf(\"[Postgres] HNSW index for %d-dim embeddings: %v \"+","\t\t\t\"(vector queries on this dimension keep scanning sequentially; \"+","\t\t\t\"build it by hand with CREATE INDEX CONCURRENTLY, or restart to retry)\", dimension, err)","\t}","}","","// hnswIndexRow is one HNSW index over a dimension's halfvec cast, whatever it","// is called: the migrations' name, or one an operator built by hand.","type hnswIndexRow struct {","\tName  string `gorm:\"column:name\"` // indexrelid::regclass::text, ready for DROP INDEX","\tValid bool   `gorm:\"column:valid\"`","}","","// createHNSWIndex builds the partial HNSW index for one dimension unless a","// valid one already exists. An invalid index of the app's own name is the","// leftover of a build that did not finish and is dropped first, because IF","// NOT EXISTS would keep it forever; an invalid index of any other name is","// left alone. The whole sequence runs on one pinned connection under a","// session advisory lock, so replicas take turns instead of dropping each","// other's builds, and CREATE INDEX CONCURRENTLY runs outside a transaction","// as PostgreSQL requires. statement_timeout is lifted for the DDL and reset","// before the connection is returned to the pool.","func (g *pgRepository) createHNSWIndex(dimension int) error {","\tctx := context.Background()","\tlog := logger.GetLogger(ctx)","\tif dimension > maxHNSWHalfvecDimension {","\t\tlog.Warnf(\"[Postgres] No HNSW index for %d-dim embeddings: pgvector indexes halfvec up to %d dimensions, \"+","\t\t\t\"so vector queries on this dimension scan sequentially\", dimension, maxHNSWHalfvecDimension)","\t\treturn nil","\t}","\tname := hnswIndexName(dimension)","\tpredicate := fmt.Sprintf(\"(dimension = %d)\", dimension)","\treturn g.db.WithContext(ctx).Connection(func(conn *gorm.DB) error {","\t\t// Every statement gets its own session on the pinned connection: gorm","\t\t// keeps one statement per instance here, so an error from one would","\t\t// otherwise stick and silently skip the ones after it, the unlock","\t\t// included.","\t\ton := func() *gorm.DB { return conn.Session(&gorm.Session{NewDB: true}) }","\t\tvar locked bool","\t\tif err := on().Raw(\"SELECT pg_try_advisory_lock(?, ?)\", hnswAdvisoryLockKey, dimension).","\t\t\tScan(&locked).Error; err != nil {","\t\t\treturn fmt.Errorf(\"could not take the build lock: %w\", err)","\t\t}","\t\tif !locked {","\t\t\tlog.Infof(\"[Postgres] Another process is building the HNSW index for %d-dim embeddings\", dimension)","\t\t\treturn nil","\t\t}","\t\tdefer on().Exec(\"SELECT pg_advisory_unlock(?, ?)\", hnswAdvisoryLockKey, dimension)","","\t\tvar rows []hnswIndexRow","\t\terr := on().Raw(`","\t\t\tSELECT i.indexrelid::regclass::text AS name, i.indisvalid AS valid","\t\t\tFROM pg_index i","\t\t\tWHERE i.indrelid = 'embeddings'::regclass","\t\t\t  AND pg_get_indexdef(i.indexrelid) LIKE '%USING hnsw%'","\t\t\t  AND pg_get_indexdef(i.indexrelid) LIKE ?","\t\t  AND pg_get_indexdef(i.indexrelid) LIKE '%halfvec_cosine_ops%'","\t\t  AND (i.indpred IS NULL OR pg_get_expr(i.indpred, i.indrelid) = ?)`,","\t\t\tfmt.Sprintf(\"%%halfvec(%d)%%\", dimension), predicate).Scan(&rows).Error","\t\tif err != nil {","\t\t\treturn fmt.Errorf(\"could not read the catalog: %w\", err)","\t\t}","\t\tfor _, row := range rows {","\t\t\tif row.Valid {","\t\t\t\tlog.Debugf(\"[Postgres] HNSW index %s already covers %d-dim embeddings\", row.Name, dimension)","\t\t\t\treturn nil","\t\t\t}","\t\t}","","\t\t// Everything from here may run a CONCURRENTLY statement, which can take","\t\t// a long time on a large table. A statement_timeout set on the role or","\t\t// the database would cancel it and leave exactly the invalid index this","\t\t// function exists to repair — which then waits for a restart to be","\t\t// retried. Lift it for this session only. SET LOCAL is not an option:","\t\t// CONCURRENTLY cannot run inside a transaction. The connection goes","\t\t// back to the pool afterwards, so the RESET is not optional either.","\t\tif err := on().Exec(\"SET statement_timeout = 0\").Error; err != nil {","\t\t\treturn fmt.Errorf(\"could not lift statement_timeout for the build: %w\", err)","\t\t}","\t\tdefer func() {","\t\t\tif err := on().Exec(\"RESET statement_timeout\").Error; err != nil {","\t\t\t\tlog.Warnf(\"[Postgres] Could not reset statement_timeout after the HNSW build: %v \"+","\t\t\t\t\t\"(this pooled connection may run without the configured timeout until it is recycled)\", err)","\t\t\t}","\t\t}()","\t\tfor _, row := range rows {","\t\t\tif row.Name != name {","\t\t\t\tlog.Warnf(\"[Postgres] Invalid HNSW index %s over %d-dim embeddings is not the app's; leaving it alone \"+","\t\t\t\t\t\"(drop it by hand if no build is running)\", row.Name, dimension)","\t\t\t\tcontinue","\t\t\t}","\t\t\t// The app's own name, invalid: a build that died, or one still","\t\t\t// running in a session that does not hold the lock (an older","\t\t\t// version, an operator's psql). Only the first may be dropped.","\t\t\tvar building int64","\t\t\tinFlight := \"SELECT count(*) FROM pg_stat_progress_create_index WHERE relid = 'embeddings'::regclass\"","\t\t\tif err := on().Raw(inFlight).Scan(&building).Error; err != nil {","\t\t\t\treturn fmt.Errorf(\"could not tell whether %s is still being built: %w\", name, err)","\t\t\t}","\t\t\tif building > 0 {","\t\t\t\tlog.Infof(\"[Postgres] HNSW index %s is being built by another session; leaving it to finish\", name)","\t\t\t\treturn nil","\t\t\t}","\t\t\tlog.Warnf(\"[Postgres] Dropping invalid HNSW index %s (an earlier build did not finish) \"+","\t\t\t\t\"before rebuilding it\", name)","\t\t\tif err := on().Exec(\"DROP INDEX CONCURRENTLY IF EXISTS \" + row.Name).Error; err != nil {","\t\t\t\treturn fmt.Errorf(\"could not drop invalid index %s: %w\", name, err)","\t\t\t}"]},{"id":"f_rrf","path":"internal/application/service/knowledgebase_search_fusion.go","sliceStart":48,"sliceEnd":222,"label":"knowledgebase_search_fusion.go","relPath":"internal/application/service/knowledgebase_search_fusion.go","startLine":48,"endLine":222,"lines":["// fuseOrDeduplicate either fuses vector+keyword results via RRF or deduplicates","// single-retriever results. Every path returns scores in [0, 1] so results of","// separate searches (per-document targets, embedding-model groups, FAQ vs","// document calls) can be ranked together downstream:","//   - vector only: the engines' cosine similarity, unchanged (FAQ thresholds","//     depend on it);","//   - keyword only: BM25 divided by the best score of its own list;","//   - hybrid: weighted RRF divided by its maximum (a chunk ranked first by","//     both retrievers scores 1).","//","// retrievalCfg may be nil — defaults are then used for RRF parameters.","func fuseOrDeduplicate(","\tctx context.Context, vectorLists, keywordLists [][]*types.IndexWithScore, retrievalCfg *types.RetrievalConfig,",") []*types.IndexWithScore {","\tif len(keywordLists) == 0 {","\t\t// Vector-only: keep original embedding scores (important for FAQ)","\t\tresult := deduplicateByScore(flattenLists(vectorLists))","\t\tlogger.Infof(ctx, \"Result count after deduplication: %d\", len(result))","\t\treturn result","\t}","\tif len(vectorLists) == 0 {","\t\t// Keyword-only: keep relative BM25 order, but fold unbounded","\t\t// scores into [0, 1] before they reach rerank/MMR. Raw BM25","\t\t// (often >10) saturates compositeScore's 0.3*base term. BM25 from","\t\t// different engines or indexes is not comparable, so each list is","\t\t// scaled by its own best score.","\t\tfor _, list := range keywordLists {","\t\t\trescaleUnboundedScores(list)","\t\t}","\t\tresult := deduplicateByScore(flattenLists(keywordLists))","\t\tlogger.Infof(ctx, \"Result count after deduplication: %d\", len(result))","\t\treturn result","\t}","\t// Hybrid: use RRF fusion to merge vector + keyword results","\tresult := fuseWithRRF(ctx, vectorLists, keywordLists, retrievalCfg)","\tlogger.Infof(ctx, \"Result count after RRF fusion: %d\", len(result))","\treturn result","}","","// sortByScoreDesc orders hits by descending score, then chunk ID to keep tied ranks stable.","func sortByScoreDesc(a, b *types.IndexWithScore) int {","\tif a.Score > b.Score {","\t\treturn -1","\t} else if a.Score < b.Score {","\t\treturn 1","\t}","\treturn cmp.Compare(a.ChunkID, b.ChunkID)","}","","// deduplicateByScore deduplicates retrieval results by chunk ID, keeping the highest score","// for each chunk. Returns the results sorted by score descending.","// Used when only a single retriever (e.g. vector-only for FAQ) is active.","func deduplicateByScore(results []*types.IndexWithScore) []*types.IndexWithScore {","\tchunkInfoMap := make(map[string]*types.IndexWithScore, len(results))","\tfor _, r := range results {","\t\tif existing, exists := chunkInfoMap[r.ChunkID]; !exists || r.Score > existing.Score {","\t\t\tchunkInfoMap[r.ChunkID] = r","\t\t}","\t}","\tdeduped := make([]*types.IndexWithScore, 0, len(chunkInfoMap))","\tfor _, info := range chunkInfoMap {","\t\tdeduped = append(deduped, info)","\t}","\tslices.SortFunc(deduped, sortByScoreDesc)","\treturn deduped","}","","// rescaleUnboundedScores maps a single-retriever candidate set onto [0, 1]","// by dividing through the maximum finite score. Keyword (BM25) scores are","// unbounded; leaving them in place saturates compositeScore (0.3*base with","// a [0, 1] clamp) so every candidate ties at 1.0 and MMR degenerates to","// diversity-only ordering.","//","// Scores already in [0, 1] are left unchanged so engines that stamp","// keyword hits at 1.0 (Qdrant, Doris) and already-normalized vector","// scores keep their current magnitude. Relative order is preserved","// either way. Retrieve/Langfuse sampling happens before fusion, so","// raw BM25 remains visible in the retrieve span.","func rescaleUnboundedScores(results []*types.IndexWithScore) {","\tmaxScore := 0.0","\tfor _, r := range results {","\t\tif r == nil {","\t\t\tcontinue","\t\t}","\t\tif math.IsNaN(r.Score) || math.IsInf(r.Score, 0) {","\t\t\tcontinue","\t\t}","\t\tif r.Score > maxScore {","\t\t\tmaxScore = r.Score","\t\t}","\t}","\tif maxScore <= 1 {","\t\treturn","\t}","\tfor _, r := range results {","\t\tif r == nil {","\t\t\tcontinue","\t\t}","\t\tswitch {","\t\tcase math.IsNaN(r.Score), math.IsInf(r.Score, -1), r.Score <= 0:","\t\t\tr.Score = 0","\t\tcase math.IsInf(r.Score, 1):","\t\t\tr.Score = 1","\t\tdefault:","\t\t\tr.Score = r.Score / maxScore","\t\t}","\t}","}","","// fuseWithRRF merges vector and keyword retrieval results using Reciprocal Rank Fusion.","// RRF score = vectorWeight/(k+vectorRank) + keywordWeight/(k+keywordRank),","// divided by its maximum (vectorWeight+keywordWeight)/(k+1) so it lands in","// [0, 1] like the single-retriever paths. Raw RRF tops out near 0.016, which","// made hybrid hits lose to any vector-only or keyword-only result they were","// ranked against and left rerank's base-score term and MMR's relevance term","// with nothing to work with.","//","// A chunk's rank for a retriever is its best position in any one list of","// that retriever, each list ordered by its own score. Positions in the","// concatenation of several lists are arbitrary: the second list's best hit","// would otherwise rank behind every hit of the first.","// k, vectorWeight and keywordWeight are sourced from retrievalCfg (with defaults).","// The merged results are sorted by RRF score descending.","func fuseWithRRF(","\tctx context.Context, vectorLists, keywordLists [][]*types.IndexWithScore, retrievalCfg *types.RetrievalConfig,",") []*types.IndexWithScore {","\trrfK := retrievalCfg.GetEffectiveRRFK()","\tvectorWeight, keywordWeight := retrievalCfg.GetEffectiveRRFWeights()","\tmaxRRF := (vectorWeight + keywordWeight) / float64(rrfK+1)","","\tvectorRanks := bestRanks(vectorLists)","\tkeywordRanks := bestRanks(keywordLists)","","\t// Collect all unique chunks — prefer vector result's metadata for each chunk","\tchunkInfoMap := make(map[string]*types.IndexWithScore)","\tfor _, r := range flattenLists(vectorLists) {","\t\tif existing, exists := chunkInfoMap[r.ChunkID]; !exists || r.Score > existing.Score {","\t\t\tchunkInfoMap[r.ChunkID] = r","\t\t}","\t}","\tfor _, r := range flattenLists(keywordLists) {","\t\tif _, exists := chunkInfoMap[r.ChunkID]; !exists {","\t\t\tchunkInfoMap[r.ChunkID] = r","\t\t}","\t}","","\t// Compute weighted RRF scores and assign to each chunk","\tresult := make([]*types.IndexWithScore, 0, len(chunkInfoMap))","\tfor chunkID, info := range chunkInfoMap {","\t\trrfScore := 0.0","\t\tif rank, ok := vectorRanks[chunkID]; ok {","\t\t\trrfScore += vectorWeight / float64(rrfK+rank)","\t\t}","\t\tif rank, ok := keywordRanks[chunkID]; ok {","\t\t\trrfScore += keywordWeight / float64(rrfK+rank)","\t\t}","\t\tinfo.Score = rrfScore / maxRRF","\t\tresult = append(result, info)","\t}","\tslices.SortFunc(result, sortByScoreDesc)","","\t// Log top results for debugging","\tfor i, chunk := range result {","\t\tif i >= 15 {","\t\t\tbreak","\t\t}","\t\tvRank, vOk := vectorRanks[chunk.ChunkID]","\t\tkRank, kOk := keywordRanks[chunk.ChunkID]","\t\tlogger.Debugf(ctx, \"RRF rank %d: chunk_id=%s, rrf_score=%.6f, vector_rank=%v(%v), keyword_rank=%v(%v)\",","\t\t\ti, chunk.ChunkID, chunk.Score, vRank, vOk, kRank, kOk)","\t}","","\treturn result","}",""]},{"id":"f_rerank","path":"internal/reranking/rerank.go","sliceStart":107,"sliceEnd":233,"label":"rerank.go","relPath":"internal/reranking/rerank.go","startLine":107,"endLine":233,"lines":["// Rerank scores results against query with model and returns the rows that","// pass opts, best first. A failed model call is not an error: the result","// carries the input rows unchanged and a model_error outcome, so callers can","// degrade to the retrieval order.","func Rerank(","\tctx context.Context,","\tmodel rerank.Reranker,","\tquery string,","\tresults []*types.SearchResult,","\topts Options,",") *Result {","\tres := &Result{","\t\tDiagnostics: types.RerankDiagnostics{","\t\t\tThreshold:          opts.Threshold,","\t\t\tEffectiveThreshold: opts.Threshold,","\t\t},","\t}","","\tvar scoredAsImage map[int]bool","\tdefer func() { recordSelection(ctx, results, res, opts, scoredAsImage) }()","","\tkeep := topByScore(results, opts.MaxCandidates)","\tcandidateIdx := make([]int, 0, len(results))","\tfor i, r := range results {","\t\tif r == nil || (keep != nil && !keep[i]) {","\t\t\tcontinue","\t\t}","\t\tpassage := ModelPassage(ctx, r)","\t\tif strings.TrimSpace(passage) == \"\" {","\t\t\tcontinue","\t\t}","\t\tcandidateIdx = append(candidateIdx, i)","\t\tres.Candidates = append(res.Candidates, r)","\t\tres.Passages = append(res.Passages, passage)","\t}","\tres.Diagnostics.CandidateCount = len(res.Candidates)","\tif len(res.Candidates) == 0 {","\t\tres.Diagnostics.Outcome = types.RerankOutcomeNoCandidates","\t\treturn res","\t}","\tfitPassages(ctx, res.Passages, rerank.MaxPassageRunes(model, query))","","\timagePositions, images := imageCandidates(ctx, model, res.Candidates, opts)","\tscores, scoredAsImage, err := scoreCandidates(ctx, model, query, res.Passages, imagePositions, images)","\tres.Diagnostics.ImagesScored = len(scoredAsImage)","\tif err != nil {","\t\tlogger.Warnf(ctx, \"[Rerank] Model call failed, keeping retrieval order: %v\", err)","\t\tres.Diagnostics.Outcome = types.RerankOutcomeModelError","\t\tres.Diagnostics.Error = err.Error()","\t\tres.Results = results","\t\tres.Indices = make([]int, len(results))","\t\tfor i := range results {","\t\t\tres.Indices[i] = i","\t\t}","\t\tres.Diagnostics.ResultCount = len(results)","\t\treturn res","\t}","\t// Drop out-of-range indices once so nothing below has to re-check them.","\tvalid := scores[:0:0]","\tfor _, s := range scores {","\t\tif s.Index >= 0 && s.Index < len(res.Candidates) {","\t\t\tvalid = append(valid, s)","\t\t}","\t}","\tres.ModelScores = valid","\tres.Diagnostics.Applied = true","\ttop, hasTop := bestScore(valid)","\tif hasTop {","\t\tres.Diagnostics.TopScore = top.RelevanceScore","\t}","","\tpassing, outcome, effective := applyThreshold(valid, opts)","\tres.Diagnostics.Outcome = outcome","\tres.Diagnostics.EffectiveThreshold = effective","","\tscored := make([]*types.SearchResult, 0, len(passing))","\tscoredIdx := make([]int, 0, len(passing))","\tfor _, rr := range passing {","\t\tscored = append(scored, scoredCopy(res.Candidates[rr.Index], rr.RelevanceScore, opts.FAQScoreBoost))","\t\tscoredIdx = append(scoredIdx, candidateIdx[rr.Index])","\t}","\torder := make([]int, len(scored))","\tfor i := range order {","\t\torder[i] = i","\t}","\tsort.SliceStable(order, func(a, b int) bool {","\t\tsa, sb := scored[order[a]], scored[order[b]]","\t\tif sa.Score != sb.Score {","\t\t\treturn sa.Score > sb.Score","\t\t}","\t\t// Boosted FAQs capped at 1 tie; keep them in relevance order.","\t\treturn PreBoostScore(sa) > PreBoostScore(sb)","\t})","\tres.Scored = make([]*types.SearchResult, len(order))","\tsortedIdx := make([]int, len(order))","\tfor i, o := range order {","\t\tres.Scored[i] = scored[o]","\t\tsortedIdx[i] = scoredIdx[o]","\t}","","\tpicks := make([]int, len(res.Scored))","\tfor i := range picks {","\t\tpicks[i] = i","\t}","\tif opts.TopK > 0 {","\t\tpicks = SelectMMR(ctx, res.Scored, min(opts.TopK, len(res.Scored)), DefaultMMRLambda)","\t}","\tres.Results = make([]*types.SearchResult, 0, len(picks))","\tres.Indices = make([]int, 0, len(picks))","\tfor _, p := range picks {","\t\tres.Results = append(res.Results, res.Scored[p])","\t\tres.Indices = append(res.Indices, sortedIdx[p])","\t}","\tfor _, k := range keptImages(ctx, res.Candidates, valid, passing, scoredAsImage, opts) {","\t\tkept := scoredCopy(res.Candidates[k.Index], k.RelevanceScore, opts.FAQScoreBoost)","\t\tkept.Metadata[types.MetadataKeptBy] = types.KeptByImageVector","\t\tres.Results = append(res.Results, kept)","\t\tres.Indices = append(res.Indices, candidateIdx[k.Index])","\t\tres.Diagnostics.ImagesKept++","\t}","\tres.Diagnostics.ResultCount = len(res.Results)","","\tlogger.Infof(ctx, \"[Rerank] %d candidates -> %d results, outcome=%s threshold=%.3f effective=%.3f top=%.4f\",","\t\tlen(res.Candidates), len(res.Results), outcome, opts.Threshold, effective, res.Diagnostics.TopScore)","\treturn res","}",""]},{"id":"f_stream","path":"internal/stream/factory.go","sliceStart":11,"sliceEnd":40,"label":"stream/factory.go","relPath":"internal/stream/factory.go","startLine":11,"endLine":40,"lines":["// 流管理器类型","const (","\tTypeMemory = \"memory\"","\tTypeRedis  = \"redis\"",")","","// NewStreamManager 创建流管理器","func NewStreamManager() (interfaces.StreamManager, error) {","\tswitch os.Getenv(\"STREAM_MANAGER_TYPE\") {","\tcase TypeRedis:","\t\tdb, err := strconv.Atoi(os.Getenv(\"REDIS_DB\"))","\t\tif err != nil {","\t\t\tdb = 0","\t\t}","\t\t// Default 1h. Live-run keys are refreshed while the turn is still","\t\t// streaming (AppendEvent / GetEvents / steer writes), so a run that","\t\t// lasts longer than this TTL does not look idle to /steer.","\t\tttl := time.Hour","\t\treturn NewRedisStreamManager(","\t\t\tos.Getenv(\"REDIS_ADDR\"),","\t\t\tos.Getenv(\"REDIS_USERNAME\"),","\t\t\tos.Getenv(\"REDIS_PASSWORD\"),","\t\t\tdb,","\t\t\tos.Getenv(\"REDIS_PREFIX\"),","\t\t\tttl,","\t\t)","\tdefault:","\t\treturn NewMemoryStreamManager(), nil","\t}","}"]}],"nodes":[{"id":"qa_pipe","type":"frontend","label":"动态 RAG Pipeline","sublabel":"纯聊 3 步 / RAG 11 步","tag":"事件链","x":34,"y":40,"w":214,"h":86,"fileId":"f_qa","startLine":200,"endLine":242,"stepOrder":1,"summary":"按知识库与 Web 搜索开关动态构建事件链，避免无检索目标时走冗余召回节点。","deepDive":"通过 `types.NewPipelineBuilder()` 条件编排 `LOAD_HISTORY`、`MEMORY_RECALL`、`QUERY_UNDERSTAND`、`CHUNK_SEARCH_PARALLEL`、`CHUNK_RERANK`、`MERGE`、`FILTER_TOP_K` 到 `CHAT_COMPLETION_STREAM`。无 KB 且无 Web 搜索直接退化为纯聊路径。","pitfall":"会话内附件在纯聊分支于此处拼入 `UserContent`，而 RAG 分支延后至 `INTO_CHAT_MESSAGE` 拼接，防止重复注入。","interviewQ":"你们的 RAG 问答链路怎么兼顾纯聊天、知识库问答和 Web 搜索扩展，且保持低耦合？","interviewA":"采用事件驱动责任链（EventManager + Plugin），入口按 `hasKB`/`webSearchEnabled`/`hasHistory` 动态拼装事件列表；各阶段独立注册插件，任一检索环节无命中返回 `ErrSearchNothing` 即可短路切兜底，不侵入主控逻辑。"},{"id":"pg_hnsw","type":"database","label":"PG 动态维度 HNSW","sublabel":"Advisory Lock · ≤4000维","tag":"无锁DDL","x":322,"y":40,"w":214,"h":86,"fileId":"f_hnsw","startLine":43,"endLine":106,"stepOrder":2,"summary":"每次向量读写非阻塞检查维度，进程内去重异步起协程为新维度创建 `halfvec` HNSW 索引。","deepDive":"先用 `hnswSeen.LoadOrStore(dimension)` 保证同维度仅触发一次，再在独立连接上获取 `pg_try_advisory_lock(0x574B4E48, dimension)` 串行多副本，最后临时解除 `statement_timeout` 执行 `CREATE INDEX CONCURRENTLY`。","pitfall":"不能用 `SET LOCAL statement_timeout` 因为 `CONCURRENTLY` 不可在事务内执行；必须在 `defer` 中 `RESET statement_timeout`，防止连接归还连接池后永久失去超时保护。","interviewQ":"业务方临时更换了一个非默认维度（如 1536 或 2560 维）的 Embedding 模型，pgvector 退化全表扫描怎么办？","interviewA":"在 PostgreSQL 检索器里实现按维度懒构建部分索引 `embeddings_embedding_idx_{dim}`：借助会话级 Advisory Lock 协调多副本互斥、检测 `pg_stat_progress_create_index` 清理残留失效索引，并以 `CONCURRENTLY` 后台无锁构建（支持 `halfvec` 最高 4000 维）。"},{"id":"bm25_scale","type":"backend","label":"单路 BM25 极值缩放","sublabel":"无界分值 → [0, 1]","tag":"防退化","x":610,"y":40,"w":214,"h":86,"fileId":"f_rrf","startLine":59,"endLine":85,"stepOrder":3,"summary":"单向量保留余弦相似度；单关键词把无界 BM25 按各自列表最高分缩放至 `[0, 1]`。","deepDive":"纯关键词检索返回的 BM25 常大于 10，若直接送入下游 `compositeScore(0.6*model + 0.3*base)` 会把 `0.3*base` 撑爆并被 `clamp` 在 1.0，导致所有候选同分、MMR 退化为纯多样性排序。","pitfall":"仅在 `maxScore > 1` 时缩放，保留本身已在 `[0, 1]` 的 Qdrant/Doris 打分；NaN/Inf 防御性归零或归 1。","interviewQ":"为什么混合检索不能直接把向量余弦相似度和 BM25 分数做线性加权？","interviewA":"两者量纲与分布完全不同：余弦在 `[0,1]` 有界，BM25 无上界且跨引擎/跨索引不可比。因此单关键词路径按各自列表极大值缩放，双路并存则改用基于排名的加权 RRF。"},{"id":"rrf_fuse","type":"backend","label":"加权 RRF 归一化融合","sublabel":"vw=0.7 · kw=0.3 · k=60","tag":"最优名次","x":610,"y":218,"w":214,"h":86,"fileId":"f_rrf","startLine":171,"endLine":207,"stepOrder":4,"summary":"对向量与关键词多路列表分别取每个 Chunk 的最优排名，计算加权 RRF 后除以理论极值归一化。","deepDive":"原始 RRF 上限只有 `~0.016`，与单向量结果混排时必输。除以 `maxRRF = (vw + kw) / (k + 1)` 后，双路均排第一的 Chunk 得 1.0，使跨 KB、跨检索模式的结果处于同一 `[0, 1]` 尺度。","pitfall":"必须先在每个子列表内独立按分排名（`bestRanks`），绝不能先拼接多个子列表再排名，否则第二个子列表的第一名会排在第一个子列表末尾之后。","interviewQ":"标准 RRF 分值很小（0.016 左右），你们在实际工程里遇到什么问题、怎么改的？","interviewA":"原始 RRF 分值过小导致两类问题：一是与纯向量 FAQ 结果混排时被彻底淹没；二是下游重排复合分里的 `0.3*base` 项失效。WeKnora 通过除以理论最大值 `(vw+kw)/(k+1)` 将加权 RRF 归一化到 `[0,1]`，并采用分列表独立取最优名次。"},{"id":"rerank_mmr","type":"security","label":"降级重排 + MMR + 护图","sublabel":"上限200 · 阈值降级 · λ=0.7","tag":"优雅降级","x":322,"y":218,"w":214,"h":86,"fileId":"f_rerank","startLine":128,"endLine":227,"stepOrder":5,"summary":"按得分截取前 200 候选送排；模型出错直接退化召回序；重排后做 MMR 多样性挑选与图像保留。","deepDive":"重排链路包含五层防护：① `topByScore` 截断 200（图谱命中不占配额）；② 模型异常降级保留原序并写 `RerankDiagnostics`；③ `applyThreshold` 阈值高于 0.3 全拒时单次降级；④ `SelectMMR` 去冗余；⑤ `keptImages` 保护被纯文本重排误杀的图像向量命中。","pitfall":"FAQ 加权（`FAQScoreBoost`）封顶 1.0 后可能产生平局，排序回调显式回退比较 `PreBoostScore` 保证高相关 FAQ 仍排在前面。","interviewQ":"Rerank 模型超时/报错，或者阈值太高把候选全过滤空了，你们怎么兜底？","interviewA":"模型报错直接保留原召回顺序并记录诊断信息而不中断问答；全过滤时若阈值 >0.3 先按 `max(t×0.7, 0.3)` 降级一次，仍空则按 0.15 门槛（或显式文档范围无条件）保留 Top-1，兼顾准确率与召回下限。"},{"id":"stream_sse","type":"messagebus","label":"Redis Stream 断线续流","sublabel":"1h 活跃续期 · 内存降级","tag":"SSE控流","x":34,"y":218,"w":214,"h":86,"fileId":"f_stream","startLine":18,"endLine":40,"stepOrder":6,"summary":"标准版走 Redis Stream 持久化事件流与控制信号，Lite 版无缝切换内存 StreamManager。","deepDive":"通过 `STREAM_MANAGER_TYPE` 工厂解耦存储介质；Redis Stream 默认 1h TTL 并在 `AppendEvent`/`GetEvents`/`steer` 写入时持续续期，确保超长 Agent 运行不被误判空闲，且客户端断网刷新可按 `session_id + message_id` 追平回放。","pitfall":"分布式多副本下用户点击“停止”请求可能打到另一台实例，必须依赖 Redis 控制子流通知正在生成的协程取消 Context。","interviewQ":"多副本部署下，用户生成到一半断网刷新页面或者点“停止生成”，后端怎么保证状态一致？","interviewA":"问答生成协程将 SSE 事件持续追加到 Redis Stream 并动态续期 TTL，HTTP 断连不杀后台任务；刷新后调用 `continue-stream` 按消息 ID 从流中重放增量，停止指令同样写入控制流实现跨副本即时中断。"},{"id":"hnsw_clean","type":"database","label":"失效索引自愈检查","sublabel":"pg_index + progress 校验","tag":"DDL幂等","x":322,"y":396,"w":214,"h":86,"fileId":"f_hnsw","startLine":120,"endLine":165,"stepOrder":7,"summary":"建索引前检查 `pg_index.indisvalid`，识别并安全清理本应用上次中断残留的无效索引。","deepDive":"`CREATE INDEX CONCURRENTLY` 中途失败会留下 `indisvalid=false` 的僵尸索引，`IF NOT EXISTS` 会被它永远挡住。代码先查 `pg_stat_progress_create_index` 确认无其他会话在建，且只删除本应用命名规则的无效索引，不碰运维手工索引。","pitfall":"绝不盲删非本应用命名的无效索引，也不删正在其他会话中构建中的索引，严格做到生产 DDL 幂等安全。","interviewQ":"在生产库里用 `CREATE INDEX CONCURRENTLY` 自动建索引，进程中途被 OOM 杀掉了怎么恢复？","interviewA":"启动或下次触发时查 `pg_index`：若发现同名索引 `indisvalid=false`，先查 `pg_stat_progress_create_index` 确认没有其他会话仍在建，再执行 `DROP INDEX CONCURRENTLY` 清理残留并重建，全程在 Advisory Lock 保护下完成。"}],"edges":[{"id":"e_qa_hnsw","from":"qa_pipe","to":"pg_hnsw","label":"并行召回","variant":"emphasis","fromSide":"right","toSide":"left","targetNodeId":"pg_hnsw"},{"id":"e_hnsw_bm25","from":"pg_hnsw","to":"bm25_scale","label":"多路候选","variant":"emphasis","fromSide":"right","toSide":"left","targetNodeId":"bm25_scale"},{"id":"e_bm25_rrf","from":"bm25_scale","to":"rrf_fuse","label":"双路混合","variant":"emphasis","fromSide":"bottom","toSide":"top","targetNodeId":"rrf_fuse"},{"id":"e_rrf_rerank","from":"rrf_fuse","to":"rerank_mmr","label":"归一[0,1]","variant":"emphasis","fromSide":"left","toSide":"right","targetNodeId":"rerank_mmr"},{"id":"e_rerank_stream","from":"rerank_mmr","to":"stream_sse","label":"Top-K引用","variant":"emphasis","fromSide":"left","toSide":"right","targetNodeId":"stream_sse"},{"id":"e_stream_qa","from":"stream_sse","to":"qa_pipe","label":"SSE续流","variant":"dashed","fromSide":"top","toSide":"bottom","targetNodeId":"stream_sse"},{"id":"e_hnsw_clean","from":"pg_hnsw","to":"hnsw_clean","label":"失效自愈","variant":"dashed","fromSide":"bottom","toSide":"top","via":[[429,168],[573,168],[573,354],[429,354]],"targetNodeId":"hnsw_clean"}],"stationId":"q4"},{"id":"agent","pinnedTab":true,"overviewOrder":5,"overviewBadge":"⑤ ReAct 智能体与工具","parentOverviewNodeId":"dir_agent","shortTitle":"ReAct Agent","title":"ReAct Agent 无状态循环、Token 校准、保对压缩与快照挂起","subtitle":"深入生产级 Agent 如何解决估算失真、上下文爆炸、残缺工具参数与长耗时人工审批","viewBox":[856,370],"files":[{"id":"f_engine","path":"internal/agent/engine.go","sliceStart":33,"sliceEnd":108,"label":"agent/engine.go (结构)","relPath":"internal/agent/engine.go","startLine":33,"endLine":108,"lines":["// AgentEngine is the core engine for running ReAct agents.","//","// History persistence note: the engine is stateless across turns. Conversation","// history is rebuilt from the DB once per turn by the caller","// (see service.LoadAgentHistory) and passed into Execute as llmContext. The","// engine therefore does not maintain its own cache, system-prompt store, or","// cross-turn buffer.","type AgentEngine struct {","\tcollaboration        *collaboration.Binding","\tconfig               *types.AgentConfig","\ttoolRegistry         *agenttools.ToolRegistry","\tchatModel            chat.Chat","\teventBus             *event.EventBus","\tknowledgeBasesInfo   []*KnowledgeBaseInfo    // Detailed knowledge base information for prompt","\tselectedDocs         []*SelectedDocumentInfo // User-selected documents (via @ mention)","\tpinnedMCPServices    []*PinnedMCPServiceInfo // User @mentioned MCP services for this turn","\tpinnedSkills         []*PinnedSkillInfo      // User @mentioned skills for this turn","\tquestionOrigin       *QuestionOriginInfo     // Source of a picked suggested question, if any","\tpageContext          *PageContextInfo        // Page the user has open, if any","\tassistantName        string                  // Workspace name for the assistant, if renamed","\tsessionID            string                  // Session ID for logging and event emission","\tsystemPromptTemplate string                  // System prompt template (optional, uses default if empty)","\tmemoryPrompt         string                  // Long-term memory envelope appended to the system prompt","\trunNote              string                  // How this run was started; see SetRunNote","\tskillsManager        *skills.Manager         // Skills manager for Progressive Disclosure (optional)","\tappConfig            *appconfig.Config       // Application config for prompt template resolution (optional)","\timageDescriber       ImageDescriberFunc      // VLM function for describing images in tool results (optional)","\timageDescribeSlots   chan struct{}           // Bounds VLM calls across parallel tool calls","\ttokenEstimator       *agenttoken.Estimator   // Token estimator for context window management, calibrated","\trawEstimator         *agenttoken.Estimator   // Same tokenizer at scale 1, for measuring the calibration","\tcompactor            *compaction.Compactor   // Summarizes older history to fit the context window (nil = disabled)","\tlastUsage            types.TokenUsage        // Token usage from the most recent LLM call","\tlastSentMsgCount     int                     // Number of messages sent in the most recent LLM call","\t// overflowRecovered records that this turn already spent its one","\t// compact-and-retry on a context overflow. A second attempt would mean","\t// history size was never the problem, and looping on it burns the round","\t// budget without changing anything.","\toverflowRecovered bool","\t// compactionExhaustedAt is the message count at which compaction last","\t// reported it could free nothing. Below that count the answer has not","\t// changed, so there is no reason to spend another summarization call.","\tcompactionExhaustedAt int","\t// checkpointSink, when set, persists compactions that end on a stored","\t// turn so later turns start from them. Nil keeps compaction turn-local.","\tcheckpointSink types.ContextCheckpointSink","\t// calibration learns the provider's tokens per estimated token from","\t// consecutive requests (see calibrateEstimator).","\tcalibration tokenCalibration","\t// contextRewrites counts compactions and tool-result trims. Either one","\t// changes messages an earlier request already sent, so the next request","\t// cannot be compared with that one for calibration.","\tcontextRewrites int","\tmodelContext    *modelcontext.Registry // single request-local boundary for every model handle","\t// steerSink, when set, lets users append messages into the running turn.","\t// Drained at every round boundary; nil disables mid-run injection.","\tsteerSink         types.SteerSink","\tallowSteerOverrun bool // one extra ReAct round after a loop-end inject past MaxIterations","\tsteerOverruns     int  // how many times this turn has already used the extra round","\t// backgroundRun, when set, supplies background-work notices and reminders","\t// at the same two boundaries as steer. Nil disables them.","\tbackgroundRun   BackgroundRun","\tworkspaceLayout sandbox.WorkspaceLayout","\tdesktopEnabled  bool","\t// suspendable lets a user prompt end the run so it can be resumed later;","\t// suspendRequest is saved with the run for that (see EnableSuspension).","\tsuspendable    bool","\tsuspendRequest []byte","\t// collaborationOnlySuspension limits suspension to collaboration waits.","\tcollaborationOnlySuspension bool","\t// mode: whether the client renders prompt cards and can answer them.","\tmode     types.RunMode","\tprogress turnProgress","\t// Hold speculative parent prose until delegated work has been reviewed.","\tholdCollaborationAnswer bool","}",""]},{"id":"f_exec","path":"internal/agent/engine.go","sliceStart":378,"sliceEnd":445,"label":"agent/engine.go (Execute)","relPath":"internal/agent/engine.go","startLine":378,"endLine":445,"lines":["// Execute executes the agent with conversation history and streaming output","// All events are emitted to EventBus and handled by subscribers (like Handler layer)","func (e *AgentEngine) Execute(","\tctx context.Context,","\tsessionID, messageID, query string,","\tllmContext []chat.Message,","\timageURLs ...[]string,",") (*types.AgentState, error) {","\tlogger.Infof(ctx, \"[Agent] Starting execution: session=%s, message=%s, query_len=%d, context_msgs=%d\",","\t\tsessionID, messageID, len(query), len(llmContext))","\t// Ensure tools are cleaned up after execution","\tdefer e.toolRegistry.Cleanup(ctx)","","\tcommon.PipelineInfo(ctx, \"Agent\", \"execute_start\", map[string]interface{}{","\t\t\"session_id\":   sessionID,","\t\t\"message_id\":   messageID,","\t\t\"query\":        query,","\t\t\"context_msgs\": len(llmContext),","\t})","","\t// Open a top-level Langfuse span so the agent run — including every","\t// round's LLM call and every tool execution — groups under a single","\t// node in the Langfuse UI instead of being flat children of the HTTP","\t// trace. No-op when Langfuse is disabled.","\timgCount := 0","\tif len(imageURLs) > 0 {","\t\timgCount = len(imageURLs[0])","\t}","\tkbIDs := make([]string, 0, len(e.knowledgeBasesInfo))","\tfor _, kb := range e.knowledgeBasesInfo {","\t\tif kb != nil {","\t\t\tkbIDs = append(kbIDs, kb.ID)","\t\t}","\t}","\tspanCtx, agentSpan := langfuse.GetManager().StartSpan(ctx, langfuse.SpanOptions{","\t\tName: \"agent.execute\",","\t\tInput: map[string]interface{}{","\t\t\t\"query\":        truncateRunes(query, langfuseQueryPreview),","\t\t\t\"query_len\":    len(query),","\t\t\t\"context_msgs\": len(llmContext),","\t\t\t\"image_count\":  imgCount,","\t\t},","\t\tMetadata: map[string]interface{}{","\t\t\t\"session_id\":          sessionID,","\t\t\t\"message_id\":          messageID,","\t\t\t\"max_iterations\":      e.config.MaxIterations,","\t\t\t\"parallel_tool_calls\": e.config.ParallelToolCalls,","\t\t\t\"web_search\":          e.config.WebSearchEnabled,","\t\t\t\"multi_turn\":          e.config.MultiTurnEnabled,","\t\t\t\"knowledge_base_ids\":  kbIDs,","\t\t\t\"allowed_tools\":       e.config.AllowedTools,","\t\t},","\t})","\tctx = spanCtx","","\t// Initialize state","\tstate := &types.AgentState{","\t\tRoundSteps:    []types.AgentStep{},","\t\tKnowledgeRefs: []*types.SearchResult{},","\t\tIsComplete:    false,","\t\tCurrentRound:  0,","\t\t// A turn that measures no scale of its own (no tool call, so no two","\t\t// requests to compare) passes on the one it started from, so the","\t\t// newest turn always carries the latest known scale and the loader","\t\t// never has to look past its first page for one.","\t\tTurnUsage: types.TokenUsage{ContextTokenScale: e.config.ContextTokenScale},","\t}",""]},{"id":"f_calib","path":"internal/agent/calibration.go","sliceStart":11,"sliceEnd":105,"label":"agent/calibration.go","relPath":"internal/agent/calibration.go","startLine":11,"endLine":105,"lines":["const (","\t// A single sample outside these bounds is a usage report that does not","\t// mean what the delta assumes (a provider counting only uncached input,","\t// a prefix that changed underneath), not a tokenizer.","\tminPlausibleTokenRatio = 0.3","\tmaxPlausibleTokenRatio = 3.0","\t// minCalibrationTokens is how much estimated conversation the samples must","\t// cover before their ratio replaces the prior. A tool result of a few","\t// dozen tokens is mostly per-message overhead and says little.","\tminCalibrationTokens = 256",")","","// tokenCalibration learns how many provider tokens one estimated token of","// conversation costs, from consecutive requests within a turn.","//","// Two requests in a row share their tool schemas, system prompt and earlier","// messages, so the growth of the provider's prompt count between them is the","// cost of exactly the messages appended in between: the previous reply, the","// tool results, any steered message. Dividing it by their estimate prices","// conversation alone. A ratio over the whole request would also measure how","// the provider renders tool schemas, which OpenAI compacts; applied to","// conversation that under-counts it, the direction that overflows the window.","type tokenCalibration struct {","\tprovider, estimated float64 // summed over this turn's samples","","\t// The previous request, when the next one can be compared with it.","\tprevPrompt   int","\tprevSent     int","\tprevTools    int // unscaled tool schema estimate","\tprevRewrites int","}","","// calibrateEstimator compares this round's request with the previous one and,","// once the turn has enough samples, rescales the estimator and records the","// scale on the turn's usage so the next turn starts from it. messages is the","// transcript whose first e.lastSentMsgCount entries were just sent.","func (e *AgentEngine) calibrateEstimator(","\tctx context.Context, round int, messages []chat.Message, tools []chat.Tool,","\tusage types.TokenUsage, state *types.AgentState,",") {","\tif usage.PromptTokens <= 0 {","\t\treturn","\t}","\tc := &e.calibration","\tsent := e.lastSentMsgCount","\ttoolTokens := e.rawEstimator.EstimateTools(tools)","","\tcomparable := c.prevPrompt > 0 && usage.PromptTokens > c.prevPrompt &&","\t\tc.prevRewrites == e.contextRewrites && c.prevTools == toolTokens &&","\t\tc.prevSent > 0 && c.prevSent < sent && sent <= len(messages)","\tif comparable {","\t\tappended := messages[c.prevSent:sent]","\t\testimated := 0","\t\tfor i := range appended {","\t\t\testimated += e.rawEstimator.EstimateMessage(&appended[i])","\t\t}","\t\tcounted := usage.PromptTokens - c.prevPrompt","\t\tif estimated > 0 && !hasImageParts(appended) {","\t\t\tif ratio := float64(counted) / float64(estimated); ratio >= minPlausibleTokenRatio &&","\t\t\t\tratio <= maxPlausibleTokenRatio {","\t\t\t\tc.provider += float64(counted)","\t\t\t\tc.estimated += float64(estimated)","\t\t\t} else {","\t\t\t\tlogger.Debugf(ctx, \"[Agent][Round-%d][ctx] calibration sample skipped: \"+","\t\t\t\t\t\"provider=%d estimated=%d\", round, counted, estimated)","\t\t\t}","\t\t}","\t}","\tc.prevPrompt, c.prevSent, c.prevTools, c.prevRewrites = usage.PromptTokens, sent, toolTokens, e.contextRewrites","","\tif c.estimated < minCalibrationTokens {","\t\treturn","\t}","\te.tokenEstimator.SetScale(c.provider / c.estimated)","\tstate.TurnUsage.ContextTokenScale = e.tokenEstimator.Scale()","\tlogger.Debugf(ctx, \"[Agent][Round-%d][ctx] token scale %.2f (provider=%.0f estimated=%.0f)\",","\t\tround, state.TurnUsage.ContextTokenScale, c.provider, c.estimated)","}","","// hasImageParts reports whether any message carries an image. Images are","// estimated at a fixed cost while providers bill them by tiles, so a sample","// containing one measures image pricing, not text.","func hasImageParts(messages []chat.Message) bool {","\tfor i := range messages {","\t\tif len(messages[i].Images) > 0 {","\t\t\treturn true","\t\t}","\t\tfor _, part := range messages[i].MultiContent {","\t\t\tif part.ImageURL != nil || part.Type == \"image_url\" {","\t\t\t\treturn true","\t\t\t}","\t\t}","\t}","\treturn false","}"]},{"id":"f_cut","path":"internal/agent/compaction/cutpoint.go","sliceStart":8,"sliceEnd":70,"label":"compaction/cutpoint.go","relPath":"internal/agent/compaction/cutpoint.go","startLine":8,"endLine":70,"lines":["// CutPoint is where the conversation is divided into \"summarize this\" and","// \"keep this verbatim\".","type CutPoint struct {","\t// FirstKeptIdx is the index of the first message kept verbatim.","\tFirstKeptIdx int","\t// TurnStartIdx is the user message that opened the turn the cut lands in,","\t// or -1 when the cut falls on a turn boundary.","\tTurnStartIdx int","\t// IsSplitTurn reports that the cut divides a single turn, so the part","\t// before it needs its own summary to explain the part after it.","\tIsSplitTurn bool","}","","// isCutPointMessage reports whether history may be cut immediately before this","// message. Everything except a tool result qualifies. Tool results are excluded","// because they must stay with the assistant message that requested them —","// cutting between the two leaves an orphaned tool result and providers reject","// the request outright.","//","// The corollary is what makes mid-turn compaction safe: a cut that lands on an","// assistant message keeps that message and every tool result following it, so","// the pairing is never split from either side.","func isCutPointMessage(msg *chat.Message) bool {","\treturn msg.Role != \"tool\"","}","","// isTurnStartMessage reports whether this message opens a turn. Compaction","// summaries count: they stand in for everything before them, so the turn they","// begin is complete on its own.","func isTurnStartMessage(msg *chat.Message) bool {","\treturn msg.Role == \"user\"","}","","// historyStart is the first index compaction may touch. The system prompt is","// never a candidate — it carries the agent's instructions, not its history.","func historyStart(messages []chat.Message) int {","\tif len(messages) > 0 && messages[0].Role == \"system\" {","\t\treturn 1","\t}","\treturn 0","}","","// FindCutPoint walks backwards from the newest message accumulating estimated","// size, and keeps the largest suffix that still fits keepRecentTokens.","//","// The budget is a ceiling, not a floor. Stopping at the first message that","// reaches the budget and keeping that message too is the obvious reading and","// the wrong one: a single knowledge_search result is routinely ten thousand","// tokens on its own, so \"keep the recent 16k\" would hand back 25k and leave","// barely a round of headroom before the next compaction.","//","// Nothing here consults the current turn. That is deliberate: the budget is the","// only rule, and a turn large enough to exceed it on its own gets split rather","// than exempted.","func FindCutPoint(","\tmessages []chat.Message,","\tstart, keepRecentTokens int,","\testimator *agenttoken.Estimator,",") CutPoint {","\tif start < 0 {","\t\tstart = 0","\t}","\tvar cutPoints []int"]},{"id":"f_repair","path":"internal/agent/tools/json_repair.go","sliceStart":20,"sliceEnd":65,"label":"tools/json_repair.go","relPath":"internal/agent/tools/json_repair.go","startLine":20,"endLine":65,"lines":["func RepairJSON(s string) string {","\trepaired, _ := RepairJSONDetail(s)","\treturn repaired","}","","// RepairJSONDetail is RepairJSON that also reports whether the payload had to","// be closed off to parse — an unterminated string or an unbalanced bracket.","// That only happens when the provider stopped emitting mid-argument, so the","// values now parse but are partial: `content` holds half a file, `query` holds","// half a sentence. Callers must refuse such a call rather than run it.","// Escape and trailing-comma fixes are ordinary malformations, not truncation,","// and do not set the flag.","func RepairJSONDetail(s string) (string, bool) {","\ts = strings.TrimSpace(s)","\tif s == \"\" {","\t\treturn \"{}\", false","\t}","","\t// Must start with { for object","\tif s[0] != '{' {","\t\t// Maybe the LLM returned just key=value pairs without braces","\t\tif strings.Contains(s, \":\") || strings.Contains(s, \"=\") {","\t\t\ts = \"{\" + s + \"}\"","\t\t} else {","\t\t\treturn s, false","\t\t}","\t}","","\t// Fix invalid backslash escapes before anything else, because unbalanced","\t// strings confuse the comma/bracket trackers below.","\ts = fixInvalidEscapes(s)","","\t// Drop anything after the first complete top-level value","\ts = trimAfterTopLevelValue(s)","","\t// Fix trailing commas: ,} or ,]","\ts = fixTrailingCommas(s)","","\t// Balance brackets and braces","\treturn balanceBrackets(s)","}","","// fixInvalidEscapes turns invalid JSON string escapes into literal backslash","// sequences. JSON only allows the escape letters \\\" \\\\ \\/ \\b \\f \\n \\r \\t \\u;","// any other backslash inside a string (e.g. \\+ \\d \\w \\. \\| \\( \\)) is a parse","// error. LLMs frequently emit these when they meant to pass a regex pattern"]},{"id":"f_suspend","path":"internal/agent/suspend.go","sliceStart":29,"sliceEnd":88,"label":"agent/suspend.go","relPath":"internal/agent/suspend.go","startLine":29,"endLine":88,"lines":["// RunSnapshot is everything needed to resume a run that ended waiting on a","// user prompt. It holds durable values only: request-local model handles","// (chunk://N, doc://N, res://, msN, mtN) do not survive the run, so the user turn is kept","// as the raw query and re-rendered on resume, and tool arguments are kept in","// their decoded form.","type RunSnapshot struct {","\tCollaborationDeliveries []CollaborationDelivery `json:\"collaboration_deliveries,omitempty\"`","\tCollaborationCursor     *int64                  `json:\"collaboration_cursor,omitempty\"`","\tMCPToolR
