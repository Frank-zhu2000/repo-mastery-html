tLine":44,"endLine":100,"stepOrder":4,"summary":"集中定义会话 CRUD、语音转写、沙箱票据、跨副本 `stop`、运行中 `steer` 插话与后台任务管理。","deepDive":"通过 `g.apiKeyGroup(r.Group(\"/sessions\", g.Viewer()), apiKeyChat(...))` 让受限 `chat` 能力 Key 也能跑完整对话流，同时不授予全租户管理权限；并在注释中显式约束 GET `:id` 与 POST `:session_id` 各自对齐基数树。","pitfall":"Gin 按 HTTP Verb 维护独立 Radix Tree，同一动词下混用 `:id` 与 `:session_id` 会在注册期直接触发 wildcard conflict panic。","interviewQ":"Agent 正在流式生成时用户想中途追加补充要求（Steer）或立刻停止，接口层面怎么设计？","interviewA":"暴露 `POST /sessions/:session_id/steer`（支持排队/删除/立即注入）与 `POST /sessions/:session_id/stop`，后端通过 Redis Stream 跨副本投递控制信号给正在运行的 Agent 循环。"},{"id":"rt_files","type":"database","label":"三级代理文件服务 Plumbing","sublabel":"租户/KB/消息三级 · 防路径穿越","tag":"安全代理","x":322,"y":236,"w":214,"h":86,"fileId":"f_rt_files","startLine":26,"endLine":94,"stepOrder":5,"summary":"把租户原始文件、共享 KB 图片、共享 Agent 消息图片与 HMAC 预签名统一收口到共享存储代理层。","deepDive":"共享 Agent 回复中可能引用源空间的知识库图片，无法走同租户 `/files` 路径，因此拆出 `/knowledge-bases/:id/files` 与 `/sessions/:id/messages/:message_id/files`，权限严格从持久化消息与共享关系反推。","pitfall":"`requireFilePathQuery` 在入口强制拦截含 `..` 的路径穿越，同时 `parseStorageTarget` 区分 `backend://id/scheme://...` 多存储后端寻址。","interviewQ":"租户 A 使用了租户 B 共享的 Agent，回复里带了一张租户 B 私有知识库里的图片，前端怎么安全加载？","interviewA":"走消息级代理路由 `/sessions/:id/messages/:message_id/files`：服务端从持久化消息记录反查共享 Agent 或共享 KB 关系鉴权，绝不信任前端自传的 `tenant_id`。"},{"id":"rt_task","type":"messagebus","label":"Asynq 6 池隔离与死信挂载","sublabel":"core/post/enrich/maint/shared/wiki","tag":"队列拓扑","x":34,"y":236,"w":214,"h":86,"fileId":"f_rt_task","startLine":172,"endLine":255,"stepOrder":6,"summary":"构建 6 个物理隔离的 Asynq Server，并在 ServeMux 最外层串联死信回调、后台限流标记与 Langfuse。","deepDive":"核心解析、后处理扇出、AI 增强、维护清理、弹性共享与独立 Wiki 各占专属物理池；`RunAsynqServer` 把 `asynqdl.MiddlewareWithCallback` 装在第一位捕获原始错误并即时翻转父文档状态，随后挂 `backgroundTaskMiddleware` 与交互对话做并发限流隔离。","pitfall":"死信中间件顺序绝不能放在错误包装中间件之后，否则看到的不是原始任务错误。","interviewQ":"为什么 `RunAsynqServer` 里要专门加一个 `backgroundTaskMiddleware()` 标记上下文？","interviewA":"给所有异步队列任务打上 `WithBackgroundTask` 标记，这样最外层模型限流器只约束批量离线解析/摘要并发，而绝不阻塞前台用户的实时交互对话。"}],"edges":[{"id":"e_rt_1","from":"rt_base","to":"rt_public","label":"前置放行","variant":"emphasis","fromSide":"right","toSide":"left","targetNodeId":"rt_public"},{"id":"e_rt_2","from":"rt_public","to":"rt_v1","label":"全局Auth","variant":"security","fromSide":"right","toSide":"left","targetNodeId":"rt_v1"},{"id":"e_rt_3","from":"rt_v1","to":"rt_chat","label":"会话分发","variant":"emphasis","fromSide":"bottom","toSide":"top","targetNodeId":"rt_chat"},{"id":"e_rt_4","from":"rt_chat","to":"rt_files","label":"消息文件","variant":"dashed","fromSide":"left","toSide":"right","targetNodeId":"rt_files"},{"id":"e_rt_5","from":"rt_files","to":"rt_task","label":"异步入队","variant":"emphasis","fromSide":"left","toSide":"right","targetNodeId":"rt_task"}],"stationId":"q1"},{"id":"m_auth","overviewOrder":3,"overviewBadge":"③ 鉴权、RBAC 与访问","parentOverviewNodeId":"dir_auth","relatedModule":{"moduleId":"security","label":"🛡️ 关联: 沙箱凭据与审校"},"shortTitle":"③ 认证与RBAC访问","title":"③ 多租户认证、API Key 门禁与归属校验","subtitle":"拆解 Middleware 入口认证与 Application/Access 领域真值校验如何构筑双层多租户防线","viewBox":[856,370],"files":[{"id":"f_au_auth","path":"internal/middleware/auth.go","sliceStart":36,"sliceEnd":220,"label":"middleware/auth.go","relPath":"internal/middleware/auth.go","startLine":36,"endLine":220,"lines":["var noAuthAPI = map[string][]string{","\t\"/health\":                 {\"GET\"},","\t\"/api/v1/auth/register\":   {\"POST\"},","\t\"/api/v1/auth/login\":      {\"POST\"},","\t\"/api/v1/auth/auto-setup\": {\"POST\"},","\t// Share-link surfaces accept a plaintext invite token from anonymous","\t// callers (an invitee who hasn't registered yet). They are registered","\t// as public routes in RegisterAuthRoutes and rate-limited by IP, so the","\t// global Auth middleware must let them through — otherwise opening a","\t// share link while logged out 401s and the frontend bounces the user to","\t// /login instead of the register page (issue #1617).","\t\"/api/v1/auth/invitations/lookup\": {\"POST\"},","\t\"/api/v1/auth/register-by-invite\": {\"POST\"},","\t\"/api/v1/auth/config\":             {\"GET\"},","\t\"/api/v1/auth/oidc/config\":        {\"GET\"},","\t\"/api/v1/auth/oidc/url\":           {\"GET\"},","\t\"/api/v1/auth/oidc/start\":         {\"GET\"},","\t\"/api/v1/auth/oidc/callback\":      {\"GET\"},","\t// MCP OAuth provider redirect: the third-party authorization server","\t// redirects the browser here without a WeKnora bearer token. The request","\t// is authenticated by the opaque, single-use `state` parameter instead.","\t\"/api/v1/mcp-oauth/callback\": {\"GET\"},","\t\"/api/v1/auth/refresh\":       {\"POST\"},","\t// IM platforms (Feishu, Slack, etc.) commonly issue a HEAD request","\t// before GET to validate Content-Type / Content-Length when rendering","\t// image previews — both verbs must be allowed for image links to work.","\t\"/api/v1/files/presigned\": {\"GET\", \"HEAD\"},","}","","// 检查请求是否在无需认证的API列表中","func isNoAuthAPI(path string, method string) bool {","\tfor api, methods := range noAuthAPI {","\t\t// 如果以*结尾，按照前缀匹配，否则按照全路径匹配","\t\tif strings.HasSuffix(api, \"*\") {","\t\t\tif strings.HasPrefix(path, strings.TrimSuffix(api, \"*\")) && slices.Contains(methods, method) {","\t\t\t\treturn true","\t\t\t}","\t\t} else if path == api && slices.Contains(methods, method) {","\t\t\treturn true","\t\t}","\t}","\treturn false","}","","// isTenantOptionalAPI lists authenticated identity-level operations that are","// meaningful before a user belongs to any tenant. Every other authenticated","// route remains tenant-scoped and returns TENANT_REQUIRED when the JWT and","// request headers do not resolve a tenant.","func isTenantOptionalAPI(path, method string) bool {","\tswitch {","\tcase path == \"/api/v1/auth/me\" && (method == http.MethodGet || method == http.MethodPut):","\t\treturn true","\tcase path == \"/api/v1/auth/me/preferences\" && method == http.MethodPut:","\t\treturn true","\tcase path == \"/api/v1/auth/logout\" && method == http.MethodPost:","\t\treturn true","\tcase path == \"/api/v1/auth/change-password\" && method == http.MethodPost:","\t\treturn true","\tcase path == \"/api/v1/auth/validate\" && method == http.MethodGet:","\t\treturn true","\tcase path == \"/api/v1/auth/switch-tenant\" && method == http.MethodPost:","\t\treturn true","\tcase path == \"/api/v1/tenants\" && method == http.MethodPost:","\t\treturn true","\tcase strings.HasPrefix(path, \"/api/v1/me/invitations\"):","\t\treturn true","\tdefault:","\t\treturn false","\t}","}","","func attachTenantlessUserContext(c *gin.Context, user *types.User) {","\tapplyAuthSession(c, authSession{","\t\tUser:        user,","\t\tPrincipal:   types.Principal{Type: types.PrincipalWebUser, ID: user.ID},","\t\tSystemAdmin: user.IsSystemAdmin,","\t\tAuthSource:  types.AuthSourceWeb,","\t})","}","","// Auth 认证中间件。按顺序尝试三条通道：","//","//  1. 白名单（isNoAuthAPI）/ OPTIONS 预检 —— 直接放行；","//  2. Bearer JWT —— 成功则走 authenticateJWTUser 完成空间/角色解析；","//     校验失败不立即拒绝，继续尝试 X-API-Key（保持既有兼容行为：","//     携带过期 JWT 但同时带有效 API key 的客户端仍可通过）；","//  3. X-API-Key —— authenticateAPIKeyRequest。","//","// 三条通道都未命中时返回 401；若调用方提交过 Bearer token，错误消息","// 明确指出 token 无效而不是笼统的 \"missing authentication\"，方便客户端","// 区分「没登录」和「登录态过期」。","func Auth(","\ttenantService interfaces.TenantService,","\tuserService interfaces.UserService,","\tmemberService interfaces.TenantMemberService,","\tapiKeyService interfaces.TenantAPIKeyService,","\tcfg *config.Config,",") gin.HandlerFunc {","\treturn func(c *gin.Context) {","\t\t// ignore OPTIONS request","\t\tif c.Request.Method == http.MethodOptions {","\t\t\tc.Next()","\t\t\treturn","\t\t}","","\t\t// 检查请求是否在无需认证的API列表中","\t\tif isNoAuthAPI(c.Request.URL.Path, c.Request.Method) {","\t\t\tc.Next()","\t\t\treturn","\t\t}","","\t\t// In-process dispatch (agent operations): the identity lives on the Go","\t\t// context, which no inbound request can carry, and is re-validated","\t\t// against the database exactly like a JWT session.","\t\tif dispatch, ok := types.InternalDispatchFromContext(c.Request.Context()); ok {","\t\t\tif authenticateInternalDispatch(c, tenantService, userService, memberService, cfg, dispatch) {","\t\t\t\tc.Next()","\t\t\t}","\t\t\treturn","\t\t}","","\t\t// 尝试JWT Token认证","\t\tbearerPresented := false","\t\tif token, ok := bearerToken(c); ok {","\t\t\tbearerPresented = true","\t\t\tuser, jwtTenantID, err := userService.ValidateToken(c.Request.Context(), token)","\t\t\tif err == nil && user != nil {","\t\t\t\tif authenticateJWTUser(c, tenantService, memberService, cfg, user, jwtTenantID) {","\t\t\t\t\tc.Next()","\t\t\t\t}","\t\t\t\treturn","\t\t\t}","\t\t\tlogger.Warnf(c.Request.Context(), \"[auth] bearer token rejected: %v\", err)","\t\t}","","\t\t// 尝试X-API-Key认证（兼容模式）","\t\tif apiKey := c.GetHeader(\"X-API-Key\"); apiKey != \"\" {","\t\t\tif apiKeyService == nil {","\t\t\t\tc.JSON(http.StatusUnauthorized, gin.H{\"error\": \"Unauthorized: API key service is not configured\"})","\t\t\t\tc.Abort()","\t\t\t\treturn","\t\t\t}","\t\t\tif authenticateAPIKeyRequest(c, tenantService, userService, apiKeyService, apiKey) {","\t\t\t\tc.Next()","\t\t\t}","\t\t\treturn","\t\t}","","\t\t// 没有任何通道认证成功","\t\tif bearerPresented {","\t\t\tc.JSON(http.StatusUnauthorized, gin.H{\"error\": \"Unauthorized: invalid or expired token\"})","\t\t} else {","\t\t\tc.JSON(http.StatusUnauthorized, gin.H{\"error\": \"Unauthorized: missing authentication\"})","\t\t}","\t\tc.Abort()","\t}","}","","// authenticateInternalDispatch authenticates a request the server dispatched","// to itself on behalf of a signed-in user. The user is reloaded so a disabled","// account or revoked membership takes effect immediately, and tenant/role","// resolution goes through the same path as a JWT session pinned to the","// dispatch tenant. Credential headers are ignored: the dispatcher never sets","// them, and honoring them here would let a caller switch identities.","func authenticateInternalDispatch(","\tc *gin.Context,","\ttenantService interfaces.TenantService,","\tuserService interfaces.UserService,","\tmemberService interfaces.TenantMemberService,","\tcfg *config.Config,","\tdispatch types.InternalDispatch,",") bool {","\tctx := c.Request.Context()","\tuser, err := userService.GetUserByID(ctx, dispatch.UserID)","\tif err != nil || user == nil || !user.IsActive {","\t\tlogger.Warnf(ctx, \"[auth] internal dispatch rejected: user=%s err=%v\", dispatch.UserID, err)","\t\tc.JSON(http.StatusUnauthorized, gin.H{\"error\": \"Unauthorized: invalid dispatch identity\"})","\t\tc.Abort()","\t\treturn false","\t}","\tc.Request.Header.Del(\"Authorization\")","\tc.Request.Header.Del(\"X-API-Key\")","\tc.Request.Header.Set(\"X-Tenant-ID\", strconv.FormatUint(dispatch.TenantID, 10))","\treturn authenticateJWTUser(c, tenantService, memberService, cfg, user, dispatch.TenantID)","}"]},{"id":"f_au_gate","path":"internal/middleware/api_key_gate.go","sliceStart":14,"sliceEnd":203,"label":"api_key_gate.go","relPath":"internal/middleware/api_key_gate.go","startLine":14,"endLine":203,"lines":["// APIKeyRoutePolicy declares how an X-API-Key caller may use a single route.","//","// Design: API-key authorization is a SEPARATE authority from the JWT","// role/ownership guards. Ownership (\"creator OR Admin+\") is a human concept","// and never applies to a machine principal; instead every API-key-accessible","// route declares one policy here, and the APIKeyGate is the single place that","// enforces it. Routes that declare no policy are denied for API keys by","// default (fail-closed), which removes the old \"remember to add APIKeyDeny\"","// footgun.","type APIKeyRoutePolicy struct {","\t// PlatformOnly rejects workspace-bound keys even when they are full-access.","\t// It is used for control-plane routes under /system/admin and cross-workspace","\t// tenant lifecycle APIs.","\tPlatformOnly bool","\t// RequireFullAccess admits only full-access tenant API keys unless one of","\t// the listed capabilities also matches. Routes with neither full-access","\t// requirement nor capabilities are open to any valid API key.","\tRequireFullAccess bool","","\t// Capabilities is an any-of allow-list for scoped API keys. A capability","\t// never widens which knowledge bases a key may touch; KB scoping is","\t// enforced downstream by KBAccess guards and handler scope checks.","\tCapabilities []types.APIKeyCapability","}","","// WithCapability returns a copy of the policy that additionally admits keys","// carrying capability c. Multiple calls accumulate (any-of semantics);","// duplicates are ignored.","func (p APIKeyRoutePolicy) WithCapability(c types.APIKeyCapability) APIKeyRoutePolicy {","\tfor _, existing := range p.Capabilities {","\t\tif existing == c {","\t\t\treturn p","\t\t}","\t}","\t// Copy the slice so mutating the returned policy never aliases the","\t// receiver's backing array.","\tnext := make([]types.APIKeyCapability, len(p.Capabilities), len(p.Capabilities)+1)","\tcopy(next, p.Capabilities)","\tp.Capabilities = append(next, c)","\treturn p","}","","// APIKeyRouteAuthorizer is the registry of per-route API-key policies. It is","// populated at router-construction time (single-threaded) and only read at","// request time, so it needs no locking.","type APIKeyRouteAuthorizer struct {","\t// policies is keyed by HTTP method, then by the gin full-path","\t// template (e.g. \"/api/v1/knowledge-bases/:id/knowledge/file\").","\tpolicies map[string]map[string]APIKeyRoutePolicy","}","","// NewAPIKeyRouteAuthorizer returns an empty authorizer.","func NewAPIKeyRouteAuthorizer() *APIKeyRouteAuthorizer {","\treturn &APIKeyRouteAuthorizer{policies: map[string]map[string]APIKeyRoutePolicy{}}","}","","// Register records the API-key policy for (method, fullPath). fullPath MUST be","// the same string gin reports via c.FullPath() for the route, otherwise the","// gate lookup will miss and the route will be denied for API keys. Router-side","// helpers build fullPath from the group's BasePath so the two stay in sync.","func (a *APIKeyRouteAuthorizer) Register(method, fullPath string, policy APIKeyRoutePolicy) {","\tmethod = strings.ToUpper(strings.TrimSpace(method))","\tfullPath = normalizeRoutePath(fullPath)","\tif a.policies[method] == nil {","\t\ta.policies[method] = map[string]APIKeyRoutePolicy{}","\t}","\ta.policies[method][fullPath] = policy","}","","// Lookup returns the policy for (method, fullPath) if one was declared.","func (a *APIKeyRouteAuthorizer) Lookup(method, fullPath string) (APIKeyRoutePolicy, bool) {","\tbyPath, ok := a.policies[strings.ToUpper(method)]","\tif !ok {","\t\treturn APIKeyRoutePolicy{}, false","\t}","\tpolicy, ok := byPath[normalizeRoutePath(fullPath)]","\treturn policy, ok","}","","// RegisteredRoutes returns every (method, fullPath) pair the authorizer knows","// about. Used by the router startup self-check to detect stale path templates.","func (a *APIKeyRouteAuthorizer) RegisteredRoutes() map[string][]string {","\tout := make(map[string][]string, len(a.policies))","\tfor method, byPath := range a.policies {","\t\tpaths := make([]string, 0, len(byPath))","\t\tfor path := range byPath {","\t\t\tpaths = append(paths, path)","\t\t}","\t\tout[method] = paths","\t}","\treturn out","}","","// Middleware returns the gate middleware. It runs as the first handler on the","// authenticated API group, after routing (so c.FullPath() is populated). JWT","// principals pass straight through; API-key principals are authorized purely","// from the declared policy table.","func (a *APIKeyRouteAuthorizer) Middleware() gin.HandlerFunc {","\treturn func(c *gin.Context) {","\t\tscope, ok := types.TenantAPIKeyScopeFromContext(c.Request.Context())","\t\tif !ok {","\t\t\tc.Next()","\t\t\treturn","\t\t}","\t\tif err := a.authorize(scope, c.Request.Method, c.FullPath()); err != nil {","\t\t\tc.AbortWithStatusJSON(http.StatusForbidden, gin.H{","\t\t\t\t\"error\": \"Forbidden: API key scope does not allow this operation\",","\t\t\t})","\t\t\treturn","\t\t}","\t\tc.Next()","\t}","}","","// authorize applies the declared policy to an API-key scope. Absent policy =>","// default deny.","func (a *APIKeyRouteAuthorizer) authorize(scope types.TenantAPIKeyScope, method, fullPath string) error {","\tpolicy, ok := a.Lookup(method, fullPath)","\tif !ok {","\t\treturn errTenantAPIKeyScopeForbidden","\t}","\tif policy.PlatformOnly && !scope.IsPlatform() {","\t\treturn errTenantAPIKeyScopeForbidden","\t}","\tif policy.PlatformOnly && len(policy.Capabilities) == 0 {","\t\treturn errTenantAPIKeyScopeForbidden","\t}","\tif scope.FullAccess {","\t\treturn nil","\t}","\tfor _, cap := range policy.Capabilities {","\t\tif cap != \"\" && scope.HasCapability(cap) {","\t\t\treturn nil","\t\t}","\t}","\tif !policy.RequireFullAccess && len(policy.Capabilities) == 0 {","\t\treturn nil","\t}","\treturn errTenantAPIKeyScopeForbidden","}","","// DenyAPIKeyPrincipal returns a middleware that rejects any X-API-Key","// principal outright. Use it on routes registered directly on the engine","// (outside the /api/v1 group) where the APIKeyRouteAuthorizer.Middleware","// gate does NOT run — the JWT role guards (RequireRole / RequireSystemAdmin","// / RequireOwnershipOrRole) short-circuit API-key principals on the","// assumption the gate already authorized them, so an ungated route would","// otherwise let any valid key through. JWT sessions pass straight through.","func DenyAPIKeyPrincipal() gin.HandlerFunc {","\treturn func(c *gin.Context) {","\t\tif _, ok := types.TenantAPIKeyScopeFromContext(c.Request.Context()); ok {","\t\t\tc.AbortWithStatusJSON(http.StatusForbidden, gin.H{","\t\t\t\t\"error\": \"Forbidden: API keys cannot access this endpoint\",","\t\t\t})","\t\t\treturn","\t\t}","\t\tc.Next()","\t}","}","","// AllowFileServeAPIKey guards the tenant-scoped file-proxy routes (/files and","// the KB-scoped image proxy) for X-API-Key callers. Those routes serve an","// arbitrary storage path that only carries a tenant segment — there is no KB","// id in the path a KB-restricted key's allow-list could be checked against —","// so a KB-restricted key is denied outright (it must download KB content via","// the KB-scoped routes such as /knowledge/:id/download, which DO enforce the","// allow-list). A key passes when it is full-access, or when it is NOT","// KB-restricted and carries the retrieve capability: that is exactly the class","// of key that can already read any of the tenant's KB content, so exposing the","// tenant-bounded raw file path (the handler still enforces","// ValidateStoragePathTenant / the KB owner tenant) grants it nothing new. JWT","// sessions carry no API-key scope and pass straight through.","func AllowFileServeAPIKey() gin.HandlerFunc {","\treturn func(c *gin.Context) {","\t\tscope, ok := types.TenantAPIKeyScopeFromContext(c.Request.Context())","\t\tif !ok {","\t\t\tc.Next()","\t\t\treturn","\t\t}","\t\tif scope.FullAccess ||","\t\t\t(!scope.IsKnowledgeBaseRestricted() &&","\t\t\t\tscope.HasCapability(types.APIKeyCapabilityRetrieve)) {","\t\t\tc.Next()","\t\t\treturn","\t\t}","\t\tc.AbortWithStatusJSON(http.StatusForbidden, gin.H{","\t\t\t\"error\": \"Forbidden: API key scope does not allow this operation\",","\t\t})","\t}","}"]},{"id":"f_au_own","path":"internal/application/access/ownership.go","sliceStart":17,"sliceEnd":74,"label":"access/ownership.go","relPath":"internal/application/access/ownership.go","startLine":17,"endLine":74,"lines":["// OwnershipRequest carries server-resolved identity and rollout policy. The","// cross-tenant bypass must already account for the cluster configuration.","// This gate does not replace API-key capabilities or resource-scope checks.","type OwnershipRequest struct {","\tUserID               string","\tRole                 types.TenantRole","\tAPIKey               bool","\tCrossTenantSuperuser bool","\tEnforce              bool","}","","// OwnershipDecision contains the details adapters need for logs and audits.","// The error returned with it determines whether access was allowed.","type OwnershipDecision struct {","\tCreatorID          string","\tEnforcementSkipped bool","\tLookupFailed       bool","}","","// CreatorRoleFloor is the lowest role at which creating a resource still lets","// the caller manage it. Below it a member mutates nothing, including what they","// created before being demoted.","const CreatorRoleFloor = types.TenantRoleContributor","","// CheckOwnershipOrRole performs no resource lookup when API-key authorization,","// role, superuser status, or the RBAC rollout policy already settles the gate.","// The lookup must enforce tenant visibility before returning a creator ID.","func CheckOwnershipOrRole(","\trequest OwnershipRequest,","\trequired types.TenantRole,","\tlookup func() (string, error),",") (OwnershipDecision, error) {","\tvar decision OwnershipDecision","\tif request.APIKey || request.Role.HasPermission(required) || request.CrossTenantSuperuser {","\t\treturn decision, nil","\t}","\tif !request.Enforce {","\t\tdecision.EnforcementSkipped = true","\t\treturn decision, nil","\t}","\tif lookup == nil {","\t\tdecision.LookupFailed = true","\t\treturn decision, errors.New(\"rbac: creator lookup unavailable\")","\t}","\tcreator, err := lookup()","\tdecision.CreatorID = creator","\tif errors.Is(err, ErrResourceNotFound) {","\t\treturn decision, ErrResourceNotFound","\t}","\tif err != nil {","\t\tdecision.LookupFailed = true","\t\treturn decision, err","\t}","\tif creator != \"\" && creator == request.UserID && request.Role.HasPermission(CreatorRoleFloor) {","\t\treturn decision, nil","\t}","\treturn decision, ErrOwnershipForbidden","}"]},{"id":"f_au_kb","path":"internal/application/access/kb_search.go","sliceStart":23,"sliceEnd":65,"label":"access/kb_search.go","relPath":"internal/application/access/kb_search.go","startLine":23,"endLine":65,"lines":["func AuthorizeKBAccess(","\tctx context.Context,","\tshares KBShareLookup,","\tkbs []*types.KnowledgeBase,",") error {","\tif len(kbs) == 0 {","\t\treturn nil","\t}","","\tkbIDs := make([]string, 0, len(kbs))","\tfor _, kb := range kbs {","\t\tkbIDs = append(kbIDs, kb.ID)","\t}","\tif err := types.AuthorizeTenantAPIKeyKnowledgeBases(ctx, kbIDs...); err != nil {","\t\treturn err","\t}","","\trequestTenantID := types.CallerFromContext(ctx).TenantID","\tpermissions := NewKBPermissions(ctx, shares)","","\tfor _, kb := range kbs {","\t\thasPermission, permErr := permissions.Check(kb.ID, kb.TenantID, types.OrgRoleViewer)","\t\tif permErr != nil {","\t\t\tlogger.ErrorWithFields(ctx, permErr, map[string]interface{}{","\t\t\t\t\"caller_tenant_id\": requestTenantID,","\t\t\t\t\"kb_tenant_id\":     kb.TenantID,","\t\t\t\t\"kb_id\":            kb.ID,","\t\t\t\t\"reason\":           \"shared-KB permission lookup failed\",","\t\t\t})","\t\t\treturn apperrors.NewInternalServerError(\"failed to verify knowledge base access\")","\t\t}","\t\tif !hasPermission {","\t\t\tlogger.WarnWithFields(ctx, logger.Fields{","\t\t\t\t\"caller_tenant_id\": requestTenantID,","\t\t\t\t\"kb_tenant_id\":     kb.TenantID,","\t\t\t\t\"kb_id\":            kb.ID,","\t\t\t\t\"reason\":           \"tenant lacks viewer permission for foreign-tenant KB\",","\t\t\t}, \"search scope rejected: unauthorized foreign-tenant KB\")","\t\t\treturn apperrors.NewNotFoundError(\"knowledge base not found\")","\t\t}","\t}","\treturn nil","}"]}],"nodes":[{"id":"au_noauth","type":"frontend","label":"免鉴权与身份级路由表","sublabel":"注册/OIDC/邀请 · tenantless","tag":"白名单","x":34,"y":44,"w":214,"h":86,"fileId":"f_au_auth","startLine":36,"endLine":100,"stepOrder":1,"summary":"严格区分完全匿名白名单（登录/邀请/OIDC/预签名 HEAD+GET）与未加空间前的身份级路由。","deepDive":"`noAuthAPI` 精确绑定 `(path, methods)`，特别放行 `/api/v1/files/presigned` 的 `HEAD` 方法以兼容飞书/Slack 预览探测；`isTenantOptionalAPI` 让刚注册还未加入空间的用户可访问 `/auth/me`、建空间与接受邀请，其余接口返回 `TENANT_REQUIRED`。","pitfall":"若忘记在 `noAuthAPI` 放行邀请注册接口，匿名用户点开分享链接会被全局 Auth 拦回 401 死循环。","interviewQ":"多租户 SaaS 中，一个刚注册但还没加入任何工作空间的用户，认证中间件怎么处理才不会处处报错？","interviewA":"拆出 `isTenantOptionalAPI` 身份级白名单（个人资料、登出、切空间、收邀请、建空间）放行为 tenantless 会话；业务接口则统一返回 409 `TENANT_REQUIRED` 由前端平滑引导至引导页。"},{"id":"au_triple","type":"security","label":"三轨身份解析分发器","sublabel":"内部派发 · JWT Bearer · APIKey","tag":"零信任头","x":322,"y":44,"w":214,"h":86,"fileId":"f_au_auth","startLine":141,"endLine":220,"stepOrder":2,"summary":"按“进程内派发 → JWT Bearer → X-API-Key”三轨识别主体，内部派发主动清空外部凭证头防提权。","deepDive":"Agent 内部操作通过 Go Context 传递 `InternalDispatch`（外部 HTTP 无法伪造），且仍按 `GetUserByID` 回库重验账号活性，并主动 `Header.Del(\"Authorization\"/\"X-API-Key\")` 防止任何携带头劫持身份。","pitfall":"若同时传了失效 Bearer Token 和有效 API Key，需注意代码先验 Bearer 失败后再回落 API Key，且最终错误区分无效 Token 与缺失认证。","interviewQ":"后端 Agent 在进程内代替登录用户发起内部操作调用时，怎样防止身份伪造或被禁用账号继续执行？","interviewA":"利用只能由 Go 内存注入的 `InternalDispatchFromContext` 传递上下文身份，并强制回库重查 `user.IsActive` 与空间成员关系，同时主动删除请求头中的外部认证字段。"},{"id":"au_policy","type":"security","label":"API Key 路由策略注册表","sublabel":"PlatformOnly · FullAccess · Cap","tag":"权限声明","x":610,"y":44,"w":214,"h":86,"fileId":"f_au_gate","startLine":14,"endLine":91,"stepOrder":3,"summary":"将机器 API Key 权限与人类角色彻底分离，按 `(method, fullPath)` 声明平台级/全权/细粒度能力。","deepDive":"机器主体没有“资源创建者”概念，因此启动期由单线程构建无锁读的 `APIKeyRouteAuthorizer` 策略表；`WithCapability` 深拷贝切片防底层数组别名污染，`Capabilities` 采用 any-of 语义且绝不放宽下游 KB 白名单。","pitfall":"策略键必须与 Gin `c.FullPath()` 经 `normalizeRoutePath` 规范化后完全一致，否则匹配 miss 会落入默认拒绝。","interviewQ":"为什么不能直接给 API Key 分配一个 Admin 或 Contributor 角色复用 RBAC？","interviewA":"人类角色耦合了“创建者归属（只能改自己创建的资源）”与个人凭据语义，而机器 Key 需要的是路由级能力白名单（如只允许 `retrieve` 或 `chat`）加指定 KB 集合约束，两套授权模型正交分离才最清晰。"},{"id":"au_deny","type":"security","label":"Default-Deny 与文件隔离","sublabel":"未声明即拒绝 · 限制Key禁原始代理","tag":"Fail-Closed","x":610,"y":236,"w":214,"h":86,"fileId":"f_au_gate","startLine":111,"endLine":203,"stepOrder":4,"summary":"未显式注册策略的路由对 API Key 一律 403；限制了 KB 范围的 Key 禁止访问无 KB ID 的原始 `/files`。","deepDive":"`authorize` 查表未命中直接返回 `errTenantAPIKeyScopeForbidden`（消除过去漏加 `APIKeyDeny` 的隐患）；`AllowFileServeAPIKey` 严格拦截 `IsKnowledgeBaseRestricted()` Key 访问全局租户文件路径，强制其走带 KB 白名单校验的下载接口。","pitfall":"直接挂在 Engine（而非 `/api/v1`）上的路由不会走全局 Gate，必须显式挂 `DenyAPIKeyPrincipal()` 防漏网。","interviewQ":"为什么被限制只能访问 KB-A 的 API Key，不能直接调用租户级 `/files?file_path=...` 下载图片？","interviewA":"原始存储路径里只有租户段没有 KB ID，无法核验该文件属于 KB-A 还是同租户的机密 KB-B；因此 `AllowFileServeAPIKey` 直接拒绝 KB 受限 Key，迫使其走带 KB 鉴权的路由。"},{"id":"au_own","type":"backend","label":"四级 RBAC 与创建者下限","sublabel":"Owner/Admin/Contrib/Viewer","tag":"防降权越权","x":322,"y":236,"w":214,"h":86,"fileId":"f_au_own","startLine":17,"endLine":74,"stepOrder":5,"summary":"校验角色达标或“创建者本人 + 最低 Contributor 角色下限”，防成员降级为 Viewer 后仍修改旧资源。","deepDive":"`CheckOwnershipOrRole` 先短路已满足高角色/API Key/超管路径，避免无效查库；当进入创建者核验时，除比对 `creator == request.UserID` 外，还强制要求 `Role.HasPermission(CreatorRoleFloor)`（即至少 Contributor）。","pitfall":"仅比对 `creator == userID` 存在经典权限漏洞：员工转只读 Viewer 后仍能篡改或删除离岗前创建的知识库！","interviewQ":"如果某员工原本是 Contributor 创建了知识库，后来管理员把他降级为只读 Viewer，他还能改自己以前建的库吗？","interviewA":"不能！`ownership.go` 定义了 `CreatorRoleFloor = TenantRoleContributor`，即便 `creator == UserID` 也必须同时满足当前角色 ≥ Contributor，彻底封堵降权残留修改权。"},{"id":"au_kb","type":"database","label":"多 KB 权限收敛与 404 防枚举","sublabel":"三维权限封顶 · 越权返 NotFound","tag":"防存在泄露","x":34,"y":236,"w":214,"h":86,"fileId":"f_au_kb","startLine":23,"endLine":65,"stepOrder":6,"summary":"多库联合检索先过 API Key KB 白名单，再逐库做三维共享权限核验，越权一律返回 404 防枚举。","deepDive":"`AuthorizeKBAccess` 同时验证 `AuthorizeTenantAPIKeyKnowledgeBases` 与组织共享三维封顶（共享角色 + 调用方组织角色 + 租户 Viewer 上限）；拒绝时记录结构化审计日志（仅含 UUID 不含敏感内容）并统一返 `NotFoundError`。","pitfall":"绝不能对跨租户未授权 KB 返回 `403 Forbidden`，否则攻击者遍历 UUID 就能探测出哪些 KB 真实存在。","interviewQ":"用户发起跨多知识库检索时，如果参数里夹带了一个别人空间的 KB UUID，后端应该怎么处理？","interviewA":"在 `application/access/kb_search.go` 逐个核验 API Key 白名单与组织共享三维权限，任一 KB 无 Viewer 权限即写审计告警并统一返回 `404 NotFound`，既阻断越权又不泄露 ID 是否存在。"}],"edges":[{"id":"e_au_1","from":"au_noauth","to":"au_triple","label":"需认证","variant":"emphasis","fromSide":"right","toSide":"left","targetNodeId":"au_triple"},{"id":"e_au_2","from":"au_triple","to":"au_policy","label":"Key分支","variant":"security","fromSide":"right","toSide":"left","targetNodeId":"au_policy"},{"id":"e_au_3","from":"au_policy","to":"au_deny","label":"查表裁决","variant":"security","fromSide":"bottom","toSide":"top","targetNodeId":"au_deny"},{"id":"e_au_4","from":"au_deny","to":"au_own","label":"JWT/归属","variant":"emphasis","fromSide":"left","toSide":"right","targetNodeId":"au_own"},{"id":"e_au_5","from":"au_own","to":"au_kb","label":"检索收敛","variant":"security","fromSide":"left","toSide":"right","targetNodeId":"au_kb"},{"id":"e_au_6","from":"au_triple","to":"au_own","label":"JWT直达","variant":"dashed","fromSide":"bottom","toSide":"top","targetNodeId":"au_own"}],"stationId":"q2"},{"id":"m_infra","overviewOrder":7,"overviewBadge":"⑦ 解析、分块与检索库","parentOverviewNodeId":"dir_infra","relatedModule":{"moduleId":"ingest","label":"⚡ 关联: 重解析与Wiki"},"shortTitle":"⑦ 解析分块与检索","title":"⑦ DocReader 解析、分块不变量与双存储引擎","subtitle":"横跨 Python 微服务与 Go 基础设施：内联图片解码、多引擎注册、偏移不变量及 PG/SQLite 双检索引擎","viewBox":[856,370],"files":[{"id":"f_inf_py","path":"docreader/main.py","sliceStart":63,"sliceEnd":100,"label":"docreader/main.py (图片)","syntax":"py","relPath":"docreader/main.py","startLine":63,"endLine":100,"lines":["def _resolve_images(","    images: dict, request_id: str, storage_map: dict | None = None",") -> tuple[str, list]:","    \"\"\"Resolve document images into inline bytes for the Go App to persist.","","    ``images`` is a dict of {relative_path: raw_data} where raw_data is","    base64-encoded string or raw bytes.","","    The Go App is solely responsible for persisting images to the configured","    storage backend (local/minio/cos/tos). This function only decodes images","    and returns them as inline bytes via ImageRef.","","    Returns (\"\", list[ImageRef]).  image_dir_path is always empty.","    \"\"\"","    import base64","","    if not images:","        return \"\", []","","    mime_map = {","        \".png\": \"image/png\",","        \".jpg\": \"image/jpeg\",","        \".jpeg\": \"image/jpeg\",","        \".gif\": \"image/gif\",","        \".webp\": \"image/webp\",","        \".bmp\": \"image/bmp\",","    }","","    refs = []","    for ref_path, b64data in images.items():","        try:","            img_bytes = base64.b64decode(b64data)","        except Exception:","            img_bytes = b64data.encode(\"utf-8\") if isinstance(b64data, str) else b64data","","        fname = os.path.basename(ref_path) or f\"{uuid.uuid4().hex}.png\"","        ext = os.path.splitext(fname)[1].lower()","        mime = mime_map.get(ext, \"application/octet-stream\")"]},{"id":"f_inf_grpc","path":"docreader/main.py","sliceStart":400,"sliceEnd":448,"label":"docreader/main.py (gRPC)","syntax":"py","relPath":"docreader/main.py","startLine":400,"endLine":448,"lines":["def main():","    config.print_config()","","    interceptors = [AuthInterceptor()]","","    server = grpc.server(","        RequestThreadPoolExecutor(max_workers=CONFIG.grpc_max_workers),","        options=[","            (\"grpc.max_send_message_length\", CONFIG.grpc_max_message_size_bytes),","            (\"grpc.max_receive_message_length\", CONFIG.grpc_max_message_size_bytes),","        ],","        interceptors=interceptors,","    )","","    servicer = DocReaderServicer()","    docreader_pb2_grpc.add_DocReaderServicer_to_server(servicer, server)","","    health_servicer = HealthServicer()","    health_pb2_grpc.add_HealthServicer_to_server(health_servicer, server)","","    try:","        tls_credentials = load_tls_credentials()","    except TLSConfigError as e:","        logger.error(\"Refusing to start: %s\", e)","        sys.exit(1)","","    if tls_credentials:","        server.add_secure_port(f\"[::]:{CONFIG.grpc_port}\", tls_credentials)","        logger.info(\"Server starting on port %d with TLS\", CONFIG.grpc_port)","    else:","        server.add_insecure_port(f\"[::]:{CONFIG.grpc_port}\")","        logger.warning(","            \"Server starting on port %d WITHOUT TLS (insecure mode)\", CONFIG.grpc_port","        )","","    server.start()","","    logger.info(\"Server started on port %d\", CONFIG.grpc_port)","    logger.info(\"Server is ready to accept connections\")","","    signal.signal(signal.SIGTERM, lambda _signum, _frame: server.stop(0))","    try:","        server.wait_for_termination()","    except KeyboardInterrupt:","        logger.info(\"Received termination signal, shutting down server\")","    finally:","        server.stop(0).wait()","        servicer.close()",""]},{"id":"f_inf_reg","path":"internal/infrastructure/docparser/engine_registry.go","sliceStart":16,"sliceEnd":88,"label":"engine_registry.go","relPath":"internal/infrastructure/docparser/engine_registry.go","startLine":16,"endLine":88,"lines":["type EngineRegistration interface {","\tName() string","\tDescription() string","\tFileTypes(docreaderConnected bool) []string","\tCheckAvailable(docreaderConnected bool, overrides map[string]string) (available bool, reason string)","\t// NewReader builds the reader for one parse request. Returning an error","\t// means this engine cannot serve the request (missing credentials,","\t// unreachable service); the caller reports it rather than silently","\t// parsing with something else.","\tNewReader(ctx context.Context, deps ReaderDeps) (interfaces.DocReader, error)","}","","// ReaderDeps carries everything an engine may need to build its reader but","// cannot construct itself: tenant configuration, tenant credentials, and the","// shared docreader connection.","type ReaderDeps struct {","\t// Overrides holds tenant-level engine configuration (service endpoints,","\t// API keys), as produced by ParserEngineConfig.ToOverridesMap.","\tOverrides map[string]string","\t// Remote is the docreader client. Nil when the service is not connected.","\tRemote interfaces.DocReader","\t// WeKnoraCloudCredentials resolves the tenant's WeKnora Cloud","\t// credentials. It is a function rather than a value because resolving","\t// them can hit the database, which most engines never need. Nil, or a","\t// nil return, means the tenant has not configured them.","\tWeKnoraCloudCredentials func(ctx context.Context) *types.WeKnoraCloudCredentials","}","","// localEngines holds all locally registered parser engines, in registration","// order — which is also the order the engine list is shown in.","var localEngines []EngineRegistration","","// RegisterEngine adds an engine to the local registry. Called from init().","func RegisterEngine(e EngineRegistration) {","\tlocalEngines = append(localEngines, e)","}","","// lookupEngine returns the locally registered engine with this name.","func lookupEngine(name string) (EngineRegistration, bool) {","\tfor _, engine := range localEngines {","\t\tif engine.Name() == name {","\t\t\treturn engine, true","\t\t}","\t}","\treturn nil, false","}","","// NewReader builds the reader for an engine.","//","// An empty engine name means \"no explicit choice\": simple formats are handled","// in Go and everything else goes to the docreader service. An unknown name is","// routed to the docreader too, so engines that only exist in the Python","// service keep working without a Go-side registration.","func NewReader(","\tctx context.Context, engine, fileType string, isURL bool, deps ReaderDeps,",") (interfaces.DocReader, error) {","\tif registration, ok := lookupEngine(engine); ok {","\t\treturn registration.NewReader(ctx, deps)","\t}","\tif engine == \"\" && !isURL && IsSimpleFormat(fileType) {","\t\treturn &SimpleFormatReader{}, nil","\t}","\treturn remoteReader(deps)","}","","// remoteReader returns the docreader client, or an error when the service is","// not connected — a nil interface value here would panic at the call site.","func remoteReader(deps ReaderDeps) (interfaces.DocReader, error) {","\tif deps.Remote == nil {","\t\treturn nil, errNotConnected","\t}","\treturn deps.Remote, nil","}"]},{"id":"f_inf_chk","path":"internal/infrastructure/chunker/splitter.go","sliceStart":16,"sliceEnd":85,"label":"chunker/splitter.go","relPath":"internal/infrastructure/chunker/splitter.go","startLine":16,"endLine":85,"lines":["// Chunk represents a piece of split text with position tracking.","//","// Content holds exactly the text from the original document between Start","// and End (rune offsets), so End-Start == utf8.RuneCountInString(Content).","// This invariant is relied on by document-reconstruction code paths","// (knowledge.go:2278+ for summary generation, UI highlighting, etc.).","//","// ContextHeader is a separately-tracked context string (e.g. a Markdown","// heading breadcrumb) that should be prepended at embedding/retrieval time","// but is NOT part of Content. Keeping the two apart preserves the","// position invariant while still letting embedding pipelines see the","// section context.","type Chunk struct {","\tContent       string","\tContextHeader string","\tSeq           int","\tStart         int","\tEnd           int","}","","// EmbeddingContent returns the text that should be fed to the embedding","// model — the ContextHeader prepended (when set) plus the chunk content.","// Use this where Content alone would lose semantic context (Tier-1 chunks).","//","// Content is returned verbatim from the source document (the End-Start","// rune-count invariant requires that), but for embedding we trim the","// surrounding whitespace so leading/trailing newlines from boundary slices","// don't dilute the embedded vector or waste tokens. Inner whitespace is","// preserved.","func (c Chunk) EmbeddingContent() string {","\tbody := strings.TrimSpace(c.Content)","\tif c.ContextHeader == \"\" {","\t\treturn body","\t}","\treturn c.ContextHeader + \"\\n\\n\" + body","}","","// ImageRef is an image reference found within a chunk's content.","type ImageRef struct {","\tOriginalRef string","\tAltText     string","\tStart       int // offset within the chunk content","\tEnd         int","}","","// SplitterConfig configures the text splitter. Strategy and TokenLimit are","// honored by the strategy entry point in strategy.go; the legacy SplitText","// path uses only ChunkSize/Overlap/Separators.","type SplitterConfig struct {","\tChunkSize    int","\tChunkOverlap int","\tSeparators   []string","","\t// Strategy selects an adaptive tier. Empty = legacy (backwards-compatible).","\t// See strategy.go for valid values.","\tStrategy string","\t// TokenLimit caps chunk size in approximate tokens. 0 = use ChunkSize chars.","\tTokenLimit int","\t// Languages hints multilingual heuristic patterns. Empty = auto-detect.","\tLanguages []string","}","","// Default chunk sizing constants. Single source of truth for the entire","// chunker package and the knowledge service via NormalizeSplitterConfig.","// The frontend KnowledgeBaseEditorModal mirrors these numbers in its initial","// form state — keep them in sync if you change either value here.","//","// DefaultChunkSize = 512 chars: ~100–130 English tokens / ~300 Chinese","// tokens. Validated as a strong baseline by the Vecta Feb-2026 benchmark","// across 50 academic papers. Use 200–400 for FAQ-style atomic content,"]},{"id":"f_inf_pg","path":"internal/application/repository/retriever/postgres/repository.go","sliceStart":20,"sliceEnd":80,"label":"postgres/repository.go","relPath":"internal/application/repository/retriever/postgres/repository.go","startLine":20,"endLine":80,"lines":["// pgRepository implements PostgreSQL-based retrieval operations","type pgRepository struct {","\tdb                   *gorm.DB // Database connection","\tkeywordScoreMu       sync.Mutex","\tkeywordScoreFunction string","","\t// autoIndex is whether ensureHNSWIndex may build indexes at all","\t// (AUTO_MIGRATE != false).","\tautoIndex bool","\t// hnswSeen holds every embedding dimension ensureHNSWIndex has already","\t// scheduled in this process, so the catalog is consulted once per","\t// dimension (int -> struct{}).","\thnswSeen sync.Map","\t// buildHNSWIndex is the work ensureHNSWIndex runs in the background;","\t// tests swap it for a recorder.","\tbuildHNSWIndex func(dimension int)","}","","// NewPostgresRetrieveEngineRepository creates a new PostgreSQL retriever repository","func NewPostgresRetrieveEngineRepository(db *gorm.DB) interfaces.RetrieveEngineRepository {","\tlogger.GetLogger(context.Background()).Info(\"[Postgres] Initializing PostgreSQL retriever engine repository\")","\trepo := &pgRepository{db: db, autoIndex: autoHNSWIndexEnabled()}","\trepo.buildHNSWIndex = repo.buildHNSWIndexInBackground","\treturn repo","}","","// keywordScoreFunctionSQL only selects fixed, schema-qualified function names.","// Some PolarDB pg_search builds expose pgsearch.score instead of paradedb.score.","const keywordScoreFunctionSQL = `SELECT n.nspname || '.score' AS score_function","FROM pg_catalog.pg_proc p","JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace","WHERE n.nspname IN ('paradedb', 'pgsearch')","  AND p.proname = 'score' AND p.prokind = 'f' AND p.pronargs = 1","  AND p.proargtypes[0] = 'pg_catalog.anyelement'::regtype","  AND p.prorettype = 'pg_catalog.float4'::regtype","ORDER BY CASE n.nspname WHEN 'paradedb' THEN 0 ELSE 1 END","LIMIT 1`","","// resolveKeywordScoreFunction probes lazily so vector-only stores remain usable.","// Cache successes per repository/database; transient failures can be retried.","func (g *pgRepository) resolveKeywordScoreFunction(ctx context.Context) (string, error) {","\tg.keywordScoreMu.Lock()","\tdefer g.keywordScoreMu.Unlock()","\tif g.keywordScoreFunction != \"\" {","\t\treturn g.keywordScoreFunction, nil","\t}","\tvar row struct{ ScoreFunction string }","\tif err := g.db.WithContext(ctx).Raw(keywordScoreFunctionSQL).Scan(&row).Error; err != nil {","\t\treturn \"\", fmt.Errorf(\"detect PostgreSQL keyword score function: %w\", err)","\t}","\tif row.ScoreFunction != \"paradedb.score\" && row.ScoreFunction != \"pgsearch.score\" {","\t\treturn \"\", errors.New(\"PostgreSQL keyword retrieval requires paradedb.score(anyelement) or \" +","\t\t\t\"pgsearch.score(anyelement); check pg_search extension compatibility\")","\t}","\tg.keywordScoreFunction = row.ScoreFunction","\treturn g.keywordScoreFunction, nil","}","","// EngineType returns the retriever engine type (PostgreSQL)","func (r *pgRepository) EngineType() types.RetrieverEngineType {","\treturn types.PostgresRetrieverEngineType"]},{"id":"f_inf_sq","path":"internal/application/repository/retriever/sqlite/repository.go","sliceStart":39,"sliceEnd":78,"label":"sqlite/repository.go","relPath":"internal/application/repository/retriever/sqlite/repository.go","startLine":39,"endLine":78,"lines":["type sqliteRepository struct {","\tdb *gorm.DB","\t// vecMu guards vecTables: concurrent BatchSave and retrieval goroutines","\t// all consult it, and an unguarded map write is a fatal runtime error.","\tvecMu     sync.RWMutex","\tvecTables map[int]bool // tracks which vec0 tables have been created (keyed by dimension)","\t// ftsUnavailable records that the driver was built without the fts5 module","\t// (upstream test runs do not pass -tags sqlite_fts5). Keyword indexing","\t// cannot exist in such a build at all, so its writes are skipped instead of","\t// failing every ingestion; Lite release builds always pass the tag.","\tftsUnavailable bool","}","","func NewSQLiteRetrieveEngineRepository(db *gorm.DB) interfaces.RetrieveEngineRepository {","\tlogger.GetLogger(context.Background()).Info(\"[SQLite] Initializing SQLite retriever engine repository with sqlite-vec\")","","\tif err := db.AutoMigrate(&sqliteEmbedding{}); err != nil {","\t\tlogger.GetLogger(context.Background()).Errorf(\"[SQLite] Failed to auto-migrate lite_embeddings: %v\", err)","\t}","","\trepo := &sqliteRepository{","\t\tdb:        db,","\t\tvecTables: make(map[int]bool),","\t}","","\tif err := repo.initFTS5(); err != nil {","\t\tif errors.Is(err, errFTS5ModuleMissing) {","\t\t\trepo.ftsUnavailable = true","\t\t\tlogger.GetLogger(context.Background()).Warnf(","\t\t\t\t\"[SQLite] Keyword index disabled, driver has no fts5 module: %v\", err)","\t\t} else {","\t\t\tlogger.GetLogger(context.Background()).Errorf(\"[SQLite] Failed to initialize FTS5 index: %v\", err)","\t\t}","\t}","\tenableImageChunkIndexes(db)","","\trepo.ensureExistingVecTables()","","\treturn repo","}"]}],"nodes":[{"id":"inf_py_img","type":"cloud","label":"DocReader 图片内联回传","sublabel":"不直连对象存储 · ImageRef字节","tag":"Python解析","x":34,"y":44,"w":214,"h":86,"fileId":"f_inf_py","startLine":63,"endLine":100,"stepOrder":1,"summary":"Python 解析服务不持有对象存储凭证，提取的文档图片统一解码为内联 `ImageRef` 字节回传 Go 侧持久化。","deepDive":"早期架构若让 DocReader 直连 MinIO/COS 会导致存储凭据扩散且难支持租户级动态存储后端；现改由 `_resolve_images` 统一将 base64/raw 图片还原为内联字节流返回，由 Go 主服务唯一负责落盘与编目。","pitfall":"超大扫描件 PDF 若图片过多需走 `ReadStream` 流式逐张回传，避免单次 Protobuf 响应突破 gRPC 消息上限。","interviewQ":"为什么 Python DocReader 不直接把 PDF 里拆出来的图片上传到 MinIO/COS，而要通过 gRPC 传回 Go 服务？","interviewA":"一是收敛对象存储密钥与多租户自定义存储后端路由逻辑，避免双侧维护；二是让 DocReader 彻底无状态，只专注 CPU/OCR 计算，故障与权限边界非常干净。"},{"id":"inf_py_srv","type":"security","label":"gRPC 鉴权与内存追踪池","sublabel":"AuthInterceptor · TLS · 请求池","tag":"安全隔离","x":322,"y":44,"w":214,"h":86,"fileId":"f_inf_grpc","startLine":400,"endLine":448,"stepOrder":2,"summary":"挂载 `AuthInterceptor`、自定义请求内存追踪线程池与可选 TLS 凭证，拒绝配置错误的 TLS 启动。","deepDive":"`main()` 用 `RequestThreadPoolExecutor` 追踪并发解析内存压力，同时暴露标准 `grpc_health.v1` 供 K8s/Docker 探活；遇到 `TLSConfigError` 直接 `sys.exit(1)` 拒绝降级明文启动，SIGTERM 时优雅停止并释放解析资源。","pitfall":"若把 DocReader 暴露在内网跨主机网络，务必配置 TLS 与 Token 拦截器，防止未授权方发送恶意文档触发解析 OOM。","interviewQ":"Python 解析服务在高并发解析复杂 PDF 时很容易内存飙升，WeKnora 在 gRPC 服务层做了哪些防护？","interviewA":"配置可控 `grpc_max_workers` 与 `RequestThreadPoolExecutor` 请求级内存追踪、限制收发最大消息体积、开启鉴权与 TLS 强制校验，并独立进程隔离防止拖垮 Go 主服务。"},{"id":"inf_reg","type":"backend","label":"Go 多解析引擎注册路由","sublabel":"Simple本地 · MinerU/VL · 远端发现","tag":"插件路由","x":610,"y":44,"w":214,"h":86,"fileId":"f_inf_reg","startLine":16,"endLine":88,"stepOrder":3,"summary":"本地注册引擎优先，未指定引擎时纯文本走 Go 本地零开销解析，其余全部透明路由至 DocReader。","deepDive":"`NewReader` 遵循明确优先级：命中本地注册表 → 纯文本简单格式走 `&SimpleFormatReader{}`（免 RPC 网络往返）→ 其余及远端专有引擎（如 MarkItDown）路由给 `deps.Remote`；若某显式指定引擎不可用直接报错，绝不静默降级换引擎。","pitfall":"`remoteReader` 显式判空返回 `errNotConnected`，防止 Go 中 nil interface 调用直接触发运行时 panic。","interviewQ":"当用户指定了 MinerU 或 PaddleOCR-VL 解析但凭据缺失时，系统应该自动降级成普通文本解析还是报错？","interviewA":"WeKnora 选择显式返回错误（`engine_registry.go` 注释明确要求），避免用户以为拿到高精度版面解析结果，实则被静默降级导致表格公式静默丢失。"},{"id":"inf_chk","type":"backend","label":"自适应分块与偏移不变量","sublabel":"End-Start==Runes · 标题分离","tag":"512基线","x":610,"y":236,"w":214,"h":86,"fileId":"f_inf_chk","startLine":16,"endLine":85,"stepOrder":4,"summary":"保持 `Content` 与 `ContextHeader` 物理分离，严格守卫字符偏移不变量，默认 512 字符基准分块。","deepDive":"`Chunk` 明确约定 `End - Start == utf8.RuneCountInString(Content)`，仅在送向量化时由 `EmbeddingContent()` 拼接标题面包屑并裁剪首尾空白，同时支持按文档结构选择自适应 `Strategy` 与 `TokenLimit`。","pitfall":"中文按 UTF-8 字节长算偏移会严重错位，全链路必须统一使用 rune 偏移量。","interviewQ":"为什么 WeKnora 默认分块大小定为 512 字符而不是 2000 字符？","interviewA":"512 字符约对应 100–130 英文 Token 或 300 中文 Token，在学术文档基准测试中兼顾语义完整度与检索信噪比；再配合 `ContextHeader` 面包屑与检索期父子/邻居扩展补全上下文。"},{"id":"inf_pg","type":"database","label":"PG 向量与 BM25 懒探测","sublabel":"paradedb/pgsearch · HNSW自建","tag":"标准引擎","x":322,"y":236,"w":214,"h":86,"fileId":"f_inf_pg","startLine":20,"endLine":80,"stepOrder":5,"summary":"标准版 PostgreSQL 仓储同时承载动态维度 HNSW 索引与 `paradedb`/`pgsearch` BM25 懒探测兼容。","deepDive":"不同云厂商 PG 发行版（如 PolarDB）暴露的 BM25 评分函数可能是 `pgsearch.score` 而非 `paradedb.score`；`resolveKeywordScoreFunction` 查 `pg_catalog.pg_proc` 白名单懒探测并缓存，让纯向量库也能正常启动。","pitfall":"仅允许返回硬编码白名单函数名（`paradedb.score` 或 `pgsearch.score`），杜绝动态 SQL 拼接注入风险。","interviewQ":"同时兼容社区 ParadeDB 和阿里云 PolarDB pg_search 时，SQL 层怎么做平滑适配？","interviewA":"通过查询 `pg_catalog.pg_proc` 懒探测实际安装的是 `paradedb.score` 还是 `pgsearch.score`，验证匹配白名单后带互斥锁缓存在 `pgRepository` 中。"},{"id":"inf_sq","type":"database","label":"Lite SQLite 向量+FTS5","sublabel":"vec0按维分表 · 无FTS5降级","tag":"零依赖Lite","x":34,"y":236,"w":214,"h":86,"fileId":"f_inf_sq","startLine":39,"endLine":78,"stepOrder":6,"summary":"Lite 版单文件 SQLite 通过 `sqlite-vec` 动态建维表 + FTS5 全文检索实现零外部服务混合召回。","deepDive":"`sqliteRepository` 用 `vecMu` 读写锁保护按维度动态创建的 `vec0` 虚拟表映射，规避并发写入 map panic；若开发单测未带 `-tags sqlite_fts5`，捕获 `errFTS5ModuleMissing` 优雅标记 `ftsUnavailable` 而不阻断入库。","pitfall":"Go 标准 map 并发读写会直接触发不可恢复的 fatal runtime error，因此 `vecTables` 必须受 `sync.RWMutex` 保护。","interviewQ":"WeKnora Lite 没有任何外部数据库，是怎么在单进程里同时实现向量检索和关键词检索的？","interviewA":"借助 CGO 绑定 `sqlite-vec` 按向量维度动态维护 `vec0` 虚拟表，再配合 `-tags sqlite_fts5` 编译内置 FTS5 倒排索引，实现与标准版一致的 `RetrieveEngineRepository` 契约。"}],"edges":[{"id":"e_inf_1","from":"inf_py_img","to":"inf_py_srv","label":"gRPC流回传","variant":"emphasis","fromSide":"right","toSide":"left","targetNodeId":"inf_py_srv"},{"id":"e_inf_2","from":"inf_py_srv","to":"inf_reg","label":"引擎路由","variant":"emphasis","fromSide":"right","toSide":"left","targetNodeId":"inf_reg"},{"id":"e_inf_3","from":"inf_reg","to":"inf_chk","label":"Markdown分块","variant":"emphasis","fromSide":"bottom","toSide":"top","targetNodeId":"inf_chk"},{"id":"e_inf_4","from":"inf_chk","to":"inf_pg","label":"标准版落库","variant":"emphasis","fromSide":"left","toSide":"right","targetNodeId":"inf_pg"},{"id":"e_inf_5","from":"inf_pg","to":"inf_sq","label":"Lite对等实现","variant":"dashed","fromSide":"left","toSide":"right","targetNodeId":"inf_sq"}],"stationId":"d2"},{"id":"m_eco","overviewOrder":8,"overviewBadge":"⑧ 模型与多渠道生态","parentOverviewNodeId":"dir_eco","shortTitle":"⑧ 模型与生态","title":"⑧ 多模态模型、11 数据源、9 IM 与 MCP 生态","subtitle":"高扩展生态如何用最小稳定接口屏蔽厂商差异，并通过限流/断点续传/白名单守住生产稳定性","viewBox":[856,370],"files":[{"id":"f_ec_chat","path":"internal/models/chat/chat.go","sliceStart":54,"sliceEnd":94,"label":"models/chat/chat.go","relPath":"internal/models/chat/chat.go","startLine":54,"endLine":94,"lines":["// Prompt-cache helpers re-exported for the application layer.","var (","\tFingerprintPromptPrefix = api.FingerprintPromptPrefix","\tPromptPrefixFingerprint = api.PromptPrefixFingerprint","\tBuildPromptCacheKey     = api.BuildPromptCacheKey",")","","// Chat 定义了聊天接口","type Chat interface {","\t// Chat 进行非流式聊天","\tChat(ctx context.Context, messages []Message, opts *ChatOptions) (*types.ChatResponse, error)","","\t// ChatStream 进行流式聊天","\tChatStream(ctx context.Context, messages []Message, opts *ChatOptions) (<-chan types.StreamResponse, error)","","\t// GetModelName 获取模型名称","\tGetModelName() string","","\t// GetModelID 获取模型ID","\tGetModelID() string","}","","// ChatConfig is the operator-facing configuration of one chat model.","type ChatConfig struct {","\tSource    types.ModelSource","\tBaseURL   string","\tModelName string","\tAPIKey    string","\tModelID   string","\tProvider  string","\t// MaxConcurrency caps concurrent background calls to this model; 0 falls","\t// back to the process-wide default (see limiter.GateN).","\tMaxConcurrency int","\tExtraConfig    map[string]string","\t// CustomHeaders 允许在调用远程 API 时附加自定义 HTTP 请求头（类似 OpenAI Python SDK 的 extra_headers）。","\tCustomHeaders map[string]string","\tAppID         string","\tAppSecret     string // 加密值，由工厂函数调用方传入，在使用前已解密","\t// Spec carries per-row catalog overrides (protocol, compat, levels).","\tSpec *types.ModelSpecOverride","}"]},{"id":"f_ec_lim","path":"internal/models/chat/concurrency_wrapper.go","sliceStart":23,"sliceEnd":88,"label":"concurrency_wrapper.go","relPath":"internal/models/chat/concurrency_wrapper.go","startLine":23,"endLine":88,"lines":["// concurrencyChat throttles background LLM calls through a per-model","// distributed semaphore. It is the outermost wrapper so the slot is held only","// around the actual provider round-trip and the wait time is excluded from the","// inner debug/langfuse timing.","type concurrencyChat struct {","\tinner Chat","\t// limit is this model's configured per-model background cap; 0 falls back","\t// to the process-wide default (see limiter.GateN).","\tlimit int","}","","func (w *concurrencyChat) GetModelName() string { return w.inner.GetModelName() }","func (w *concurrencyChat) GetModelID() string   { return w.inner.GetModelID() }","","func (w *concurrencyChat) Chat(ctx context.Context, messages []Message, opts *ChatOptions) (*types.ChatResponse, error) {","\trelease := limiter.GateNamedN(ctx, w.inner.GetModelID(), w.inner.GetModelName(), w.limit)","\tdefer release()","\treturn w.inner.Chat(ctx, messages, opts)","}","","func (w *concurrencyChat) ChatStream(ctx context.Context, messages []Message, opts *ChatOptions) (<-chan types.StreamResponse, error) {","\trelease := limiter.GateNamedN(ctx, w.inner.GetModelID(), w.inner.GetModelName(), w.limit)","\tch, err := w.inner.ChatStream(ctx, messages, opts)","\tif err != nil || ch == nil {","\t\trelease()","\t\treturn ch, err","\t}","\t// Hold the slot until the stream fully drains, then release. If the","\t// consumer abandons the stream (stops reading out) we would otherwise","\t// block forever on the send and never release the slot; select on","\t// ctx.Done() on both receive and send so cancellation also frees the slot","\t// while upstream is idle. Drain the inner channel in the background so the","\t// upstream producer can exit.","\tout := make(chan types.StreamResponse)","\tgo func() {","\t\tdefer close(out)","\t\tdefer release()","\t\tdrain := func() {","\t\t\tfor {","\t\t\t\tif _, open := <-ch; !open {","\t\t\t\t\treturn","\t\t\t\t}","\t\t\t}","\t\t}","\t\tfor {","\t\t\tvar resp types.StreamResponse","\t\t\tselect {","\t\t\tcase <-ctx.Done():","\t\t\t\tgo drain()","\t\t\t\treturn","\t\t\tcase next, ok := <-ch:","\t\t\t\tif !ok {","\t\t\t\t\treturn","\t\t\t\t}","\t\t\t\tresp = next","\t\t\t}","\t\t\tselect {","\t\t\tcase out <- resp:","\t\t\tcase <-ctx.Done():","\t\t\t\tgo drain()","\t\t\t\treturn","\t\t\t}","\t\t}","\t}()","\treturn out, nil","}"]},{"id":"f_ec_conn","path":"internal/datasource/connector.go","sliceStart":11,"sliceEnd":94,"label":"datasource/connector.go","relPath":"internal/datasource/connector.go","startLine":11,"endLine":94,"lines":["type Connector interface {","\t// Type returns the connector type identifier (e.g., \"feishu\", \"notion\")","\tType() string","","\t// Validate verifies that the provided configuration is valid by testing connectivity","\t// and checking credentials. Returns error if validation fails.","\tValidate(ctx context.Context, config *types.DataSourceConfig) error","","\t// ListResources lists available resources that can be synced (documents, spaces, folders, etc.)","\t// Returns a list of Resource objects that the user can select for syncing.","\t//","\t// parentID controls lazy (on-demand) loading of hierarchical resources:","\t//   - parentID == \"\" → return the top-level resources (e.g. Feishu wiki spaces).","\t//   - parentID != \"\" → return only the direct children of that resource.","\t// Connectors whose listing is already flat or returns the full tree in a single","\t// call may ignore parentID for the root call and return an empty slice for any","\t// non-empty parentID.","\tListResources(ctx context.Context, config *types.DataSourceConfig, parentID string) ([]types.Resource, error)","","\t// ResolveResourceAncestors resolves, for each of the given resource IDs, the","\t// ExternalIDs of every ancestor whose direct children must be loaded so a","\t// lazily-loaded picker can reveal a pre-existing (possibly deeply nested)","\t// selection. The returned set is deduplicated and unordered.","\t//","\t// It exists so connectors that load their tree one level at a time (e.g. the","\t// Feishu wiki) can expose, in O(depth) per selection, the path back to the","\t// root without re-traversing the whole tree. Connectors that already return","\t// the full tree (Notion) or a flat list (Yuque) have nothing to reveal and","\t// return an empty slice.","\tResolveResourceAncestors(","\t\tctx context.Context, config *types.DataSourceConfig, resourceIDs []string,","\t) ([]string, error)","","\t// FetchAll performs a full sync of the specified resources.","\t// Returns all items from the given resource IDs.","\tFetchAll(ctx context.Context, config *types.DataSourceConfig, resourceIDs []string) ([]types.FetchedItem, error)","","\t// FetchIncremental performs an incremental sync based on the provided cursor.","\t// Returns items that have changed since the last sync, a new cursor for the next sync,","\t// and an error if the operation fails.","\tFetchIncremental(ctx context.Context, config *types.DataSourceConfig, cursor *types.SyncCursor) ([]types.FetchedItem, *types.SyncCursor, error)","}","","// StreamHandler receives items and progress checkpoints emitted during a","// streaming fetch. The service implements it to ingest each item as it arrives","// (bounding memory to one item instead of the whole wiki) and to persist the","// connector cursor at page boundaries, so a sync that times out mid-traversal","// resumes from the last checkpoint instead of restarting from scratch","// (Tencent/WeKnora#2136).","type StreamHandler interface {","\t// Emit ingests a single fetched item. Returning an error aborts the","\t// stream: the connector stops fetching and propagates the error, since a","\t// failed ingest means the sync is failing and further API calls are wasted.","\tEmit(ctx context.Context, item types.FetchedItem) error","","\t// Checkpoint persists the cursor reached so far. The cursor is only valid","\t// for the duration of the call (the connector may keep mutating its backing","\t// maps afterwards), so implementations must serialize it synchronously.","\t//","\t// The cursor MUST be a complete resumable snapshot, not a delta: resuming","\t// from it must reproduce all progress so far. This is what lets the service","\t// treat a checkpoint as a safe restart point and, for a full sync, drop the","\t// prior baseline without losing already-synced state.","\tCheckpoint(ctx context.Context, cursor *types.SyncCursor) error","}","","// StreamingConnector is an optional interface. Connectors that implement it let","// the service interleave fetch→ingest→checkpoint so a large sync persists","// incrementally and resumes after a timeout, rather than holding every item in","// memory and losing all progress on retry. Connectors that do not implement it","// fall back to FetchAll / FetchIncremental unchanged.","type StreamingConnector interface {","\tConnector","","\t// FetchStream walks the configured resources starting from cursor (nil =","\t// from the beginning / full sync), calling h.Emit for each changed item and","\t// h.Checkpoint at page boundaries. It returns the final cursor for the next","\t// sync. Nodes already recorded in cursor at their current edit time are","\t// skipped, which is what makes a resumed sync converge.","\tFetchStream(","\t\tctx context.Context, config *types.DataSourceConfig,","\t\tcursor *types.SyncCursor, h StreamHandler,","\t) (*types.SyncCursor, error)","}"]},{"id":"f_ec_sched","path":"internal/datasource/scheduler.go","sliceStart":35,"sliceEnd":99,"label":"datasource/scheduler.go","relPath":"internal/datasource/scheduler.go","startLine":35,"endLine":99,"lines":["// Scheduler manages cron-based periodic sync for data sources.","//","// robfig/cron fires at absolute wall-clock times (e.g. \"0 0 * * * *\" always fires","// at the top of every hour regardless of when the process started). So multiple","// instances will fire at the same moment. Dedup is handled by two layers:","//","//  1. HasRunningSync — if a previous sync is still running, skip (prevent overlap).","//  2. asynq.TaskID  — deterministic ID per (dataSourceID, minute). Redis ensures","//     only one task with a given ID is enqueued. Losers get ErrTaskIDConflict.","type Scheduler struct {","\tcron         *cron.Cron","\tdsRepo       interfaces.DataSourceRepository","\tsyncLogRepo  interfaces.SyncLogRepository","\ttaskEnqueuer interfaces.TaskEnqueuer","","\tmu      sync.Mutex","\tentries map[string]cron.EntryID // dataSourceID → cron entry ID","}","","// NewScheduler creates a new Scheduler.","func NewScheduler(","\tdsRepo interfaces.DataSourceRepository,","\tsyncLogRepo interfaces.SyncLogRepository,","\ttaskEnqueuer interfaces.TaskEnqueuer,",") *Scheduler {","\treturn &Scheduler{","\t\tcron: cron.New(cron.WithParser(syncScheduleParser), cron.WithChain(","\t\t\tcron.Recover(cron.DefaultLogger),","\t\t)),","\t\tdsRepo:       dsRepo,","\t\tsyncLogRepo:  syncLogRepo,","\t\ttaskEnqueuer: taskEnqueuer,","\t\tentries:      make(map[string]cron.EntryID),","\t}","}","","// Start loads all active data sources from the database and registers their","// cron schedules. Then starts the cron runner in the background.","func (s *Scheduler) Start(ctx context.Context) error {","\tdataSources, err := s.dsRepo.FindActive(ctx)","\tif err != nil {","\t\treturn fmt.Errorf(\"load active data sources: %w\", err)","\t}","","\tfor _, ds := range dataSources {","\t\tif ds.SyncSchedule == \"\" {","\t\t\tcontinue","\t\t}","\t\tif err := s.addEntry(ds); err != nil {","\t\t\tlogger.Warnf(ctx, \"[Scheduler] failed to register cron for ds=%s schedule=%q: %v\",","\t\t\t\tds.ID, ds.SyncSchedule, err)","\t\t}","\t}","\t// Retention also runs for paused and manual-only sources. Reuse this","\t// runner so StopWithin waits for cleanup along with in-flight sync jobs.","\tif _, err := s.cron.AddJob(\"@daily\", cron.NewChain(","\t\tcron.SkipIfStillRunning(cron.DefaultLogger),","\t).Then(cron.FuncJob(s.cleanupSyncLogs))); err != nil {","\t\treturn fmt.Errorf(\"register sync log retention: %w\", err)","\t}","","\ts.cron.Start()","\tlogger.Infof(ctx, \"[Scheduler] started with %d cron entries\", len(s.entries))","\treturn nil","}"]},{"id":"f_ec_im","path":"internal/im/qaqueue.go","sliceStart":15,"sliceEnd":75,"label":"im/qaqueue.go","relPath":"internal/im/qaqueue.go","startLine":15,"endLine":75,"lines":["const (","\t// defaultMaxQueueSize is the maximum number of pending QA requests in the queue.","\tdefaultMaxQueueSize = 50","\t// defaultMaxPerUser limits how many requests a single user can have queued.","\tdefaultMaxPerUser = 3","\t// defaultWorkers is the default number of concurrent QA workers.","\tdefaultWorkers = 5","\t// queueTimeout is how long a request can wait in the queue before being discarded.","\tqueueTimeout = 60 * time.Second","\t// redisQueueUserTTL is the TTL for per-user queue counters in Redis.","\tredisQueueUserTTL = 5 * time.Minute","\t// globalGateTTL is the TTL for the global active-worker counter in Redis.","\t// Acts as a safety net: if all instances crash without decrementing, the","\t// counter self-heals after this duration.","\tglobalGateTTL = 5 * time.Minute","\t// globalGateRetryInterval is how long a worker waits before retrying when the","\t// global concurrency limit is reached.","\tglobalGateRetryInterval = 500 * time.Millisecond",")","","// qaRequest represents a QA request waiting in the queue.","type qaRequest struct {","\tctx       context.Context","\tcancel    context.CancelFunc","\tmsg       *IncomingMessage","\tsession   *types.Session","\tagent     *types.CustomAgent","\tadapter   Adapter","\tchannel   *IMChannel","\tchannelID string","","\t// tenant is used to resolve provider:// URLs in outbound replies (scheme-aware).","\ttenant *types.Tenant","","\t// userKey is \"channelID:userID:chatID\", used for per-user limits and /stop.","\tuserKey    string","\tenqueuedAt time.Time","}","","// QueueMetrics exposes observable queue state.","type QueueMetrics struct {","\t// Depth is the current number of requests waiting in the queue.","\tDepth int","\t// ActiveWorkers is the number of workers currently executing a QA request.","\tActiveWorkers int64","\t// TotalEnqueued is the cumulative number of requests enqueued.","\tTotalEnqueued int64","\t// TotalProcessed is the cumulative number of requests dequeued and executed.","\tTotalProcessed int64","\t// TotalRejected is the cumulative number of requests rejected (queue full / per-user limit).","\tTotalRejected int64","\t// TotalTimeout is the cumulative number of requests discarded due to queue timeout.","\tTotalTimeout int64","}","","// qaQueue is a bounded, per-user-limited request queue with a fixed worker pool.","type qaQueue struct {","\tmu         sync.Mutex","\tcond       *sync.Cond","\tqueue      []*qaRequest","\tmaxSize    int"]},{"id":"f_ec_mcp","path":"internal/mcpserver/server.go","sliceStart":108,"sliceEnd":182,"label":"mcpserver/server.go","relPath":"internal/mcpserver/server.go","startLine":108,"endLine":182,"lines":["\ts.mcp = server.NewMCPServer(","\t\tserverName,","\t\tserverVersion,","\t\tserver.WithToolCapabilities(false),","\t\tserver.WithRecovery(),","\t\tserver.WithToolFilter(s.filterTools),","\t\tserver.WithToolHandlerMiddleware(s.guardTool),","\t\tserver.WithInstructions(serverInstructions),","\t)","\ts.mcp.AddTools(s.toolCatalog()...)","\ts.handler = server.NewStreamableHTTPServer(","\t\ts.mcp,","\t\tserver.WithStateLess(true),","\t)","\treturn s","}","","// Handler returns the http.Handler to mount under /mcp/:endpoint_id. The","// caller must run MCPEndpointAuth first; the handler trusts the context.","func (s *Server) Handler() http.Handler {","\treturn s.handler","}","","const serverInstructions = \"WeKnora knowledge workspace. Start with list_knowledge_bases to see what is in scope, \" +","\t\"then use search_knowledge for semantic questions, grep_chunks for exact keywords, read_document to read \" +","\t\"a whole document, and ask to get a synthesized answer with citations. Wiki tools browse the generated \" +","\t\"wiki when a knowledge base has one. Write tools (add/update/delete_document) exist only on endpoints \" +","\t\"that enabled them.\"","","// endpointFromContext returns the endpoint authenticated for this call.","func endpointFromContext(ctx context.Context) (*types.MCPEndpoint, error) {","\tep, ok := ctx.Value(types.MCPEndpointContextKey).(*types.MCPEndpoint)","\tif !ok || ep == nil {","\t\treturn nil, errNoEndpoint","\t}","\treturn ep, nil","}","","// filterTools hides catalog entries the endpoint did not enable.","func (s *Server) filterTools(ctx context.Context, all []mcp.Tool) []mcp.Tool {","\tep, err := endpointFromContext(ctx)","\tif err != nil {","\t\treturn nil","\t}","\tout := make([]mcp.Tool, 0, len(all))","\tfor _, t := range all {","\t\tif ep.HasTool(t.Name) {","\t\t\tout = append(out, t)","\t\t}","\t}","\treturn out","}","","// guardTool enforces the allowlist and rate limit on every tools/call, so a","// client cannot invoke a hidden tool by name.","func (s *Server) guardTool(next server.ToolHandlerFunc) server.ToolHandlerFunc {","\treturn func(ctx context.Context, req mcp.CallToolRequest) (*mcp.CallToolResult, error) {","\t\tep, err := endpointFromContext(ctx)","\t\tif err != nil {","\t\t\treturn mcp.NewToolResultError(\"unauthorized\"), nil","\t\t}","\t\tif !ep.HasTool(req.Params.Name) {","\t\t\treturn mcp.NewToolResultErrorf(\"tool %q is not enabled on this endpoint\", req.Params.Name), nil","\t\t}","\t\tif !s.limiter.Allow(ctx, ep.ID, ep.RateLimitPerMinute) {","\t\t\treturn mcp.NewToolResultError(\"rate limit exceeded for this endpoint, retry shortly\"), nil","\t\t}","\t\ts.touchLastUsed(ctx, ep.ID)","\t\tresult, err := next(ctx, req)","\t\tif err != nil {","\t\t\treturn result, err","\t\t}","\t\treturn s.rewriteResourceURLs(ctx, ep, result), nil","\t}","}"]}],"nodes":[{"id":"ec_chat","type":"frontend","label":"统一 Chat 与前缀缓存","sublabel":"OpenAI/Claude/Gemini · CacheKey","tag":"协议统一","x":34,"y":44,"w":214,"h":86,"fileId":"f_ec_chat","startLine":54,"endLine":94,"stepOrder":1,"summary":"屏蔽 OpenAI/Anthropic/Gemini/Ollama 线协议差异，并内置 Prompt 前缀指纹与自定义请求头支持。","deepDive":"业务层只面向 `chat.Chat` 最小 4 方法接口编程；协议细节全部收敛在 `internal/models/api/*`，厂商目录收敛在 `catalog`，外围按装饰器模式叠加 Debug、Langfuse 与并发治理。","pitfall":"`AppSecret` 等敏感字段仅在工厂调用边界前才解密传入，避免在配置结构里长驻明文。","interviewQ":"同时对接 OpenAI、Anthropic Messages、Google GenAI 和本地 Ollama，怎么保证上层 Agent 零感知切换？","interviewA":"以 `internal/models/api` 统一内部消息与工具调用模型，厂商协议适配各自独立实现，上层只依赖 `chat.Chat` 接口，并用装饰器统一注入 Prompt 缓存键、Tracing 和并发治理。"},{"id":"ec_lim","type":"security","label":"后台与交互并发限流隔离","sublabel":"只限离线任务 · 断流自动排空","tag":"信号量治理","x":322,"y":44,"w":214,"h":86,"fileId":"f_ec_lim","startLine":23,"endLine":88,"stepOrder":2,"summary":"作为最外层装饰器按模型限流后台解析/摘要调用，但对交互式对话完全零阻塞，且断流自动释放槽位。","deepDive":"`concurrencyChat` 识别 `IsBackgroundTask`：仅在后台 Worker 调用时占用按模型分布的信号量；`ChatStream` 在消费端取消 `ctx.Done()` 时起异步 `drain()` 排空上游通道并 `defer release()`，防死锁泄漏并发槽。","pitfall":"必须放在最外层包住 Debug/Langfuse 装饰器，否则等待信号量的排队耗时会被错误计入模型 RT 指标！","interviewQ":"批量入库触发几百个摘要和图谱抽取 LLM 任务时，如何防止把模型配额打爆导致线上问答卡死？","interviewA":"在模型客户端最外层挂 `concurrencyChat` 分布式信号量，只对带后台标记的 Asynq 任务按 `ModelID` 限并发，前台交互问答直接绕过，流式取消时异步 drain 确保信号量必归还。"},{"id":"ec_conn","type":"backend","label":"11 类源流式断点续传","sublabel":"Emit入库 · Checkpoint持久化","tag":"防OOM重试","x":610,"y":44,"w":214,"h":86,"fileId":"f_ec_conn","startLine":11,"endLine":94,"stepOrder":3,"summary":"定义统一 `Connector` 与可选 `StreamingConnector` 接口，支持边拉边入库与分页游标断点续传。","deepDive":"传统 `FetchAll` 同步大型飞书/Confluence Wiki 会把全量文档塞爆内存且超时从头重来；`StreamingConnector` 通过 `StreamHandler.Emit` 单条入库 + `Checkpoint` 同步落盘完整可恢复游标，超时重试跳过已同步节点。","pitfall":"`Checkpoint` 传入的 `SyncCursor` 必须是完整可重放快照（而非增量 delta），且必须同步序列化，防止连接器后续修改内部 map。","interviewQ":"同步一个上万篇文档的企业 Wiki 数据源时，中途接口超时或 Pod 重启怎么办？","interviewA":"采用 `StreamingConnector` 交错执行 `Fetch -> Emit -> Checkpoint`：内存占用恒定为单篇文档，翻页边界持久化完整 `SyncCursor`，下次重启直接跳过编辑时间未变的文档收敛完成。"},{"id":"ec_sched","type":"messagebus","label":"Cron 调度与多副本双去重","sublabel":"HasRunningSync + 确定TaskID","tag":"防重入队","x":610,"y":236,"w":214,"h":86,"fileId":"f_ec_sched","startLine":35,"endLine":99,"stepOrder":4,"summary":"每副本独立跑 Cron，靠 `HasRunningSync` 与按分钟确定的 `asynq.TaskID` 在 Redis 层双保险防重。","deepDive":"`robfig/cron` 按绝对墙钟触发，多副本会在同一秒同时触发同步任务；WeKnora 用“应用层跳过运行中 + Redis 唯一 `TaskID(dsID, minute)` 冲突丢弃”免去了沉重的选主组件，并复用同一 runner 做每日日志清理。","pitfall":"日志清理任务需挂在 `SkipIfStillRunning` 链上且覆盖暂停/手动数据源，保证停机等待与磁盘回收一致。","interviewQ":"多副本部署下不引入分布式选主，怎么保证每个数据源的定时 Cron 同步不会重复执行 N 次？","interviewA":"双层幂等去重：先查 `HasRunningSync` 跳过上轮未结束任务；入队 Asynq 时生成确定性 `TaskID(dataSourceID, minute)`，由 Redis 原子保证同分钟只有首个实例入队成功，其余收到 `ErrTaskIDConflict` 静默忽略。"},{"id":"ec_im","type":"cloud","label":"9 类 IM 有界限流 QA 队列","sublabel":"单人上限3 · 60s超时 · 全局自愈","tag":"防刷爆","x":322,"y":236,"w":214,"h":86,"fileId":"f_ec_im","startLine":15,"endLine":75,"stepOrder":5,"summary":"企微/飞书/钉钉/Slack 等 9 类 IM 统一归一后进入有界 QA 队列，按 `userKey` 限流并带 5 分钟全局自愈 TTL。","deepDive":"默认总队列上限 50、单用户并发排队上限 3、排队超 60s 丢弃，避免群聊刷屏拖垮后端 LLM；多实例共享的 Redis 全局活跃计数带 5 分钟 TTL，即使全节点异常崩溃也能自动自愈不永久锁死。","pitfall":"IM 回复前需通过 `stripIMCitationTags` 剥离 Web 专用的 `<kb/>` 标签并按 300ms 节流刷新，避免触发 IM 平台消息修改频控。","interviewQ":"企业群聊机器人里几十个人同时 @机器人 提问，怎么既防刷爆又不影响正常用户排队？","interviewA":"用 `qaQueue` 做三层背压：固定 Worker 池 + 全局有界队列（50）+ 按 `channelID:userID:chatID` 单人排队上限（3）+ 60s 队列超时淘汰，同时暴露全套 `QueueMetrics` 指标。"},{"id":"ec_mcp","type":"security","label":"内置无状态 Go MCP Server","sublabel":"tools/list过滤 + tools/call强拦","tag":"双向白名单","x":34,"y":236,"w":214,"h":86,"fileId":"f_ec_mcp","startLine":108,"endLine":182,"stepOrder":6,"summary":"单实例注册全量工具目录，按端点上下文双向过滤 `tools/list` 与拦截 `tools/call`，无状态水平扩展。","deepDive":"通过 `WithStateLess(true)` 让任意副本都能应答 Claude Desktop/Cursor 等外部 MCP 客户端；`filterTools` 控制可见列表，`guardTool` 再次校验 `ep.HasTool` 防客户端盲调隐藏工具，并叠加按端点分钟限流与资源短链重写。","pitfall":"切勿只做 `tools/list` 隐藏而不做 `tools/call` 拦截——恶意 MCP 客户端完全可以直接猜出 `delete_document` 名字强行调用！","interviewQ":"向外开放 MCP Server（如给 Cursor/Claude 接入企业知识库）时，如何实现按端点最小权限隔离？","interviewA":"前置 `MCPEndpointAuth` 将端点权限注入 Context，单实例 MCP Server 通过 `WithToolFilter` 隐藏未授权工具、通过 `WithToolHandlerMiddleware` 在调用侧二次验权+限流，且重写返回中的内部文件链接为短链。"}],"edges":[{"id":"e_ec_1","from":"ec_chat","to":"ec_lim","label":"外层限流","variant":"security","fromSide":"right","toSide":"left","targetNodeId":"ec_lim"},{"id":"e_ec_2","from":"ec_lim","to":"ec_conn","label":"后台同步","variant":"emphasis","fromSide":"right","toSide":"left","targetNodeId":"ec_conn"},{"id":"e_ec_3","from":"ec_conn","to":"ec_sched","label":"Cron调度","variant":"emphasis","fromSide":"bottom","toSide":"top","targetNodeId":"ec_sched"},{"id":"e_ec_4","from":"ec_sched","to":"ec_im","label":"多端协同","variant":"dashed","fromSide":"left","toSide":"right","targetNodeId":"ec_im"},{"id":"e_ec_5","from":"ec_im","to":"ec_mcp","label":"开放协议","variant":"emphasis","fromSide":"left","toSide":"right","targetNodeId":"ec_mcp"}],"stationId":"d1"},{"id":"m_client","overviewOrder":9,"overviewBadge":"⑨ 前端、迁移、部署与测试","parentOverviewNodeId":"dir_client","shortTitle":"⑨ 前端迁移与E2E","title":"⑨ Vue 3 续流、双库迁移、容器与 Lite E2E","subtitle":"打通全栈最后一公里：前端断线续流与跨空间 Header、双库 DDL 对齐、容器探活与真进程冒烟测试","viewBox":[856,370],"files":[{"id":"f_cl_rt","path":"frontend/src/router/index.ts","sliceStart":14,"sliceEnd":88,"label":"router/index.ts","syntax":"ts","relPath":"frontend/src/router/index.ts","startLine":14,"endLine":88,"lines":["/** Lite /桌面 WebView 硬刷新时可能只打开 `/`，用 session 记住上次页面以便恢复 */","const LITE_LAST_PATH_KEY = 'weknora_lite_last_path'","","// views/platform/index.vue always mounts the settings modal and opens it when","// the path is /platform/settings, so this route only has to own the URL.","// Rendering Settings.vue here would mount a second, independent copy.","const SettingsRouteOutlet = defineComponent({ name: 'SettingsRouteOutlet', render: () => null })","","function isLiteEdition(authStore: ReturnType<typeof useAuthStore>) {","  return authStore.isLiteMode || localStorage.getItem('weknora_lite_mode') === 'true'","}","","function isLiteSpaDefaultEntry(to: RouteLocationNormalized) {","  return (","    to.path === '/' ||","    to.path === '/platform' ||","    to.path === '/platform/knowledge-bases' ||","    to.name === 'knowledgeBaseList'","  )","}","","function isSafeLiteRestoreTarget(path: string) {","  return path.startsWith('/platform/') && !path.startsWith('/platform/organizations')","}","","function hasPendingOIDCCallback() {","  if (typeof window === 'undefined') return false","  const hash = window.location.hash || ''","  return hash.includes('oidc_result=') || hash.includes('oidc_error=')","}","","const router = createRouter({","  history: createWebHistory(import.meta.env.BASE_URL),","  routes: [","    {","      path: \"/\",","      redirect: \"/platform/knowledge-bases\",","    },","    {","      path: \"/login\",","      name: \"login\",","      component: () => import(\"../views/auth/Login.vue\"),","      meta: { requiresAuth: false, requiresInit: false }","    },","    // Embed chat is a separate entry (embed.html + embed-main.ts), not this SPA.","    {","      path: \"/register\",","      name: \"registerByInvite\",","      // Share-link landing page reuses the Login form: the same Vue","      // component renders both modes and detects ?token=xxx on mount","      // to switch into invite-register flow. Avoids a parallel page","      // that would duplicate the OIDC / language-switch / styling","      // surface for one extra field.","      component: () => import(\"../views/auth/Login.vue\"),","      meta: { requiresAuth: false, requiresInit: false }","    },","    {","      path: \"/onboarding/workspace\",","      name: \"workspaceOnboarding\",","      component: () => import(\"../views/auth/WorkspaceOnboarding.vue\"),","      meta: { requiresAuth: true, requiresInit: false, requiresTenant: false }","    },","    {","      path: \"/join\",","      name: \"joinOrganization\",","      // 重定向到组织列表页，并将 code 参数转换为 invite_code","      redirect: (to) => {","        const code = to.query.code as string","        return {","          path: '/platform/organizations',","          query: code ? { invite_code: code } : {}","        }","      },","      meta: { requiresInit: true, requiresAuth: true }","    },"]},{"id":"f_cl_sse","path":"frontend/src/api/chat/streame.ts","sliceStart":59,"sliceEnd":130,"label":"api/chat/streame.ts","syntax":"ts","relPath":"frontend/src/api/chat/streame.ts","startLine":59,"endLine":130,"lines":["export function useStream() {","  // 响应式状态","  const output = ref('')              // 显示内容","  const isStreaming = ref(false)      // 流状态","  const isLoading = ref(false)        // 初始加载","  const error = ref<string | null>(null)// 错误信息","  const lastStreamRequest = ref<StreamRequestMeta | null>(null)","  let controller = new AbortController()","  let streamGeneration = 0","","  // 流式渲染缓冲","  let buffer: string[] = []","  let renderTimer: number | null = null","","  // 启动流式请求","  const startStream = async (params: { session_id: any; query: any; knowledge_base_ids?: string[]; knowledge_ids?: string[]; tag_ids?: string[]; agent_enabled?: boolean; agent_id?: string; agent_source_tenant_id?: string | number; web_search_enabled?: boolean; local_browser_enabled?: boolean; summary_model_id?: string; reasoning_effort?: string; mcp_service_ids?: string[]; skill_names?: string[]; mentioned_items?: Array<{id: string; name: string; type: string; kb_type?: string; kb_id?: string; kb_name?: string; service_id?: string; skill_name?: string}>; images?: Array<{data: string}>; attachment_uploads?: Array<{data: string; file_name: string; file_size: number}>; attachment_ids?: string[]; suggestion_attribution?: { suggestion_set_id: string; question_id: string }; question_origin?: { knowledge_base_id: string; knowledge_id?: string }; page_context?: PageContextPayload; assistant_access?: AssistantAccessLevel; method: string; url: string; resume_pending_id?: string; embed_token?: string; embed_session_sig?: string; embed_visitor_id?: string }) => {","    const myGeneration = ++streamGeneration","    const streamAbort = controller","    // 重置状态","    output.value = '';","    error.value = null;","    isStreaming.value = true;","    isLoading.value = true;","","    // 获取API配置","    const apiUrl = getApiBaseUrl();","    ","    const embedToken = params.embed_token;","    const token = embedToken || localStorage.getItem('weknora_token');","    if (!token) {","      error.value = i18n.global.t('error.tokenNotFound');","      stopStream();","      return;","    }","","    // 跨空间访问请求头：只要 setSelectedTenant 写过激活空间，就附","    // X-Tenant-ID。早期版本会 short-circuit \"selectedTenantId ===","    // defaultTenantId 时不附\" 来减少 header 体积，但任何把 weknora_tenant","    // 写成激活空间的代码（OIDC 同步 / UserMenu loadUserInfo / router","    // hydrate）都会让两者相等，使得后续流式请求悄悄丢 header、落到","    // home 空间上，导致 SSE 接口返回 404。直接附即可——后端","    // IsTenantAccessible 也允许 header 指向自家空间。","    const selectedTenantId = localStorage.getItem('weknora_selected_tenant_id');","    const tenantIdHeader: string | null = selectedTenantId || null;","","    // TTFB instrumentation: record the moment we kick off the request so","    // we can compare it with the first answer chunk we receive from the","    // server. This makes it possible to correlate the frontend-observed","    // latency with the backend \"TTFB:first_answer_chunk\" log line by","    // matching on X-Request-ID.","    const sentAt = performance.now();","    const requestID = generateRandomString(12);","    let firstAnswerLogged = false;","    let receivedAssistantId = '';","    let receivedTerminal = false;","    let reconnectAttempts = 0;","    let streamMethod = params.method;","    // Never repeat an accepted POST: recovery attaches to its persisted message.","    const canReconnect = () => !embedToken && receivedAssistantId && !receivedTerminal &&","      (params.url === '/api/v1/agent-chat' || params.url === '/api/v1/sessions/continue-stream') &&","      myGeneration === streamGeneration && !streamAbort.signal.aborted;","","","    try {","      let url =","        params.method == \"POST\"","          ? `${apiUrl}${params.url}/${params.session_id}`","          : `${apiUrl}${params.url}/${params.session_id}?message_id=${params.query}`;","      if (params.method === \"GET\" && params.resume_pending_id) {","        url += `&resume_pending_id=${encodeURIComponent(params.resume_pending_id)}`;","      }","      console.log(`[TTFB] request:start request_id=${requestID} url=${url} sent_at=${Date.now()}`);"]},{"id":"f_cl_pg","path":"migrations/versioned/000136_credential_vault.up.sql","sliceStart":1,"sliceEnd":20,"label":"000136_vault.sql (PG)","syntax":"sql","relPath":"migrations/ver
