efs             []string                `json:\"mcp_tool_refs,omitempty\"`","\tVersion                 int                     `json:\"version\"`","\tCollaborationWait       bool                    `json:\"collaboration_wait,omitempty\"`","\tBetweenRounds           bool                    `json:\"between_rounds,omitempty\"`","\t// Request is the caller's types.ResumableAgentRequest.","\tRequest   json.RawMessage `json:\"request,omitempty\"`","\tQuery     string          `json:\"query\"`","\tImageURLs []string        `json:\"image_urls,omitempty\"`","\t// UserMessages holds the raw text referenced by UserMessagesBefore.","\tUserMessages map[string]string `json:\"user_messages,omitempty\"`","","\tCompletedSteps []types.AgentStep     `json:\"completed_steps\"`","\tKnowledgeRefs  []*types.SearchResult `json:\"knowledge_refs,omitempty\"`","\tCurrentRound   int                   `json:\"current_round\"`","\tTurnUsage      types.TokenUsage      `json:\"turn_usage\"`","","\tPendingRound PendingRound `json:\"pending_round\"`","}","","// PendingRound is the round interrupted by the prompt.","type PendingRound struct {","\t// Step carries the round's thought and reasoning; its ToolCalls are the","\t// calls that finished before the blocked one.","\tStep  types.AgentStep `json:\"step\"`","\tCalls []PendingCall   `json:\"calls\"`","\t// BlockedIndex is the call waiting on the prompt. Calls after it have","\t// not run.","\tBlockedIndex int `json:\"blocked_index\"`","}","","// PendingCall is one tool call of the interrupted round.","type PendingCall struct {","\tID   string `json:\"id\"`","\tName string `json:\"name\"`","\t// Arguments is the decoded JSON the call executes with.","\tArguments         string                 `json:\"arguments\"`","\tUnresolvedHandles []string               `json:\"unresolved_handles,omitempty\"`","\tProviderMetadata  types.ToolCallMetadata `json:\"provider_metadata,omitempty\"`","}","","// DecodeRunSnapshot parses a saved snapshot, rejecting unknown versions.","func DecodeRunSnapshot(data []byte) (*RunSnapshot, error) {","\tvar snap RunSnapshot","\tif err := json.Unmarshal(data, &snap); err != nil {","\t\treturn nil, fmt.Errorf(\"decode run snapshot: %w\", err)","\t}","\tif snap.Version != RunSnapshotVersion {","\t\treturn nil, fmt.Errorf(\"unsupported run snapshot version %d\", snap.Version)","\t}","\treturn &snap, nil","}",""]}],"nodes":[{"id":"ag_exec","type":"backend","label":"无状态 Engine 入口","sublabel":"每轮 DB 重建 · 继承比例","tag":"Span追踪","x":34,"y":44,"w":214,"h":86,"fileId":"f_exec","startLine":380,"endLine":444,"stepOrder":1,"summary":"AgentEngine 跨轮无状态，启动时打开顶层 Langfuse Span，并沿用上轮测得的 `ContextTokenScale`。","deepDive":"历史对话由调用方每轮从数据库重建传入，Engine 不持有跨轮内存缓存，天然支持多副本水平扩展；同时把上一轮的 `ContextTokenScale` 透传到 `TurnUsage`，确保单轮无工具调用时校准值不丢失。","pitfall":"必须 `defer e.toolRegistry.Cleanup(ctx)` 释放本轮绑定的沙箱/MCP/浏览器句柄，避免异常退出泄漏资源。","interviewQ":"你们的 Agent 服务是多副本部署的，怎么设计 Engine 状态避免粘性会话依赖？","interviewA":"Engine 严格无状态，每轮历史与压缩 Checkpoint 均从 DB 重建，运行中流式事件与 Steer 信号走 Redis Stream，审批等待走序列化 `RunSnapshot` 落库，任意副本均可接管续跑。"},{"id":"ag_calib","type":"backend","label":"动态 Token 比例校准","sublabel":"相邻轮增量比 · 排除图片","tag":"0.3x~3.0x","x":322,"y":44,"w":214,"h":86,"fileId":"f_calib","startLine":47,"endLine":88,"stepOrder":2,"summary":"对比连续两轮请求的新增消息估算值与厂商实测 `PromptTokens` 差值，动态校准估算器。","deepDive":"两轮连续请求共享相同 System Prompt 与 Tool Schemas，因此 `usage.PromptTokens - prevPrompt` 精确等于中间新增对话的真实开销。仅在无重写、工具未变、无图片且累计样本 ≥256 Token 时更新比例。","pitfall":"绝不能直接拿整次请求的 `PromptTokens / 总估算` 算比例：OpenAI 会压缩 Tool Schemas，导致整体比值偏低，套到对话文本上会严重低估 Token 引发爆窗！","interviewQ":"不同厂商（DeepSeek/Claude/GPT）分词器不同，怎么精准预估上下文剩余 Token 避免触发 400 爆窗？","interviewA":"使用连续请求增量校准法（`calibration.go`）：取同一轮内工具不变、未压缩且不含图片的相邻两次请求，计算 `ΔProviderTokens / ΔEstimatedTokens`，过滤 `[0.3, 3.0]` 异常值后更新 `tokenEstimator` 缩放因子并持久化到下一轮。"},{"id":"ag_cut","type":"security","label":"保对切分压缩","sublabel":"禁切 tool 前 · 预算为上限","tag":"防孤儿结果","x":610,"y":44,"w":214,"h":86,"fileId":"f_cut","startLine":21,"endLine":66,"stepOrder":3,"summary":"压缩切分点禁止落在 `tool` 角色消息之前，且 `keepRecentTokens` 是硬上限而非下限。","deepDive":"`isCutPointMessage` 排除所有 `Role == \"tool\"` 的位置，确保 `assistant(tool_calls)` 与紧随其后的所有 `tool` 结果永远成对保留或成对摘要；`FindCutPoint` 从最新消息倒推累加，遇大搜索结果直接切分本轮而非豁免。","pitfall":"若把 `keepRecentTokens` 误实现为“超预算才停并包含当前条”，一次 10k Token 的 `knowledge_search` 结果会让 16k 预算膨胀到 25k，下一轮立刻再次触发压缩。","interviewQ":"长对话 Agent 触发历史摘要压缩时，如何选切分点才不会被大模型 API 报 400 错误？","interviewA":"严守两条铁律：一是绝不在 `tool` 结果消息前切分，保证 `assistant` 的 `tool_calls` 与 `tool` 结果成对存活；二是 `system` 提示词永远跳过（`historyStart`），且保留预算按硬上限倒推并把摘要存为 Checkpoint。"},{"id":"ag_repair","type":"messagebus","label":"JSON 修复与截断拒执","sublabel":"修正则转义 · 拒半截写入","tag":"拒截断","x":610,"y":236,"w":214,"h":86,"fileId":"f_repair","startLine":25,"endLine":60,"stepOrder":4,"summary":"自动修复大模型常见的正则单斜杠转义、尾逗号与多余尾巴，但对截断参数标记拒执。","deepDive":"`RepairJSONDetail` 按序修复非法反斜杠（如 `\\+`、`\\d`）、裁掉顶层值后的多余字符、去尾逗号、补全括号；关键在于返回布尔值 `truncated`——若靠强制闭环才合法，说明模型中途被截断，上层必须拒绝执行以防写入半份文件！","pitfall":"必须先修非法反斜杠再做括号配对，否则未转义字符会污染引号状态机导致括号计数错乱。","interviewQ":"大模型调工具经常输出非法 JSON（比如正则表达式少转义、尾逗号、或者输出超长被截断），怎么优雅兜底？","interviewA":"分两类处理：对于非法转义、尾逗号、多余后缀做幂等修复直接放行；但若检测到未闭合字符串/括号（说明输出被中途截断），即使能补全成合法 JSON 也显式标记截断并拒绝执行，避免拿半截参数写坏文件。"},{"id":"ag_suspend","type":"security","label":"RunSnapshot 挂起恢复","sublabel":"持久化状态 · 零句柄泄漏","tag":"长时审批","x":322,"y":236,"w":214,"h":86,"fileId":"f_suspend","startLine":29,"endLine":87,"stepOrder":5,"summary":"等待用户审批或安全表单时序列化 `RunSnapshot` 落库退出，恢复时从被阻塞的工具序号续跑。","deepDive":"快照保存 `CompletedSteps`、`PendingRound`（含已完成子调用与 `BlockedIndex`）、`TurnUsage` 与原始 `Query`，且刻意不存请求局部句柄（`chunk://N` 等），恢复时重新渲染上下文确保句柄有效。","pitfall":"强校验 `Version == RunSnapshotVersion`，滚动升级时拒绝解析不兼容旧版快照而非静默跑错逻辑。","interviewQ":"Agent 调用高风险工具需要人类审批，用户 15 分钟后才点同意，你们怎么避免 Goroutine 和 HTTP 连接长期挂死？","interviewA":"热等待超时后自动进入挂起态：将已完成步骤、当前中断轮次的 `BlockedIndex` 及已解码参数序列化为版本化 `RunSnapshot` 持久化，释放连接和协程；用户批准后反序列化快照从断点无损恢复。"},{"id":"ag_guards","type":"cloud","label":"溢出单次重试与 Steer","sublabel":"overflowRecovered · 最多1次","tag":"熔断护栏","x":34,"y":236,"w":214,"h":86,"fileId":"f_engine","startLine":66,"endLine":106,"stepOrder":6,"summary":"用 `overflowRecovered` 限制上下文溢出仅压缩重试一次，并用 `steerSink` 在轮边界注入用户新指令。","deepDive":"若首次压缩重试后依然溢出，说明问题不在历史长度而在单条巨型载荷，直接终止避免白烧轮次；同时 `allowSteerOverrun` 仅允许在超最大轮次后额外跑 1 轮响应最后时刻插话，防止无限拉长单次运行。","pitfall":"每次压缩或工具裁剪都会递增 `contextRewrites`，通知 `calibration.go` 跳过该轮对比，防止改写历史污染 Token 校准样本。","interviewQ":"如何防止 Agent 在上下文压缩、工具报错或用户持续插话时陷入无限循环烧光 Token？","interviewA":"靠四重硬护栏：溢出重试标 `overflowRecovered` 仅限一次；压缩返回空释量记 `compactionExhaustedAt` 不再重复摘要；`maxSteerOverruns=1` 封顶追加轮次；叠加重复内容 2 轮、同错工具 3 次的熔断守卫。"}],"edges":[{"id":"e_ag_1","from":"ag_exec","to":"ag_calib","label":"首轮读比例","variant":"emphasis","fromSide":"right","toSide":"left","targetNodeId":"ag_calib"},{"id":"e_ag_2","from":"ag_calib","to":"ag_cut","label":"预算超窗","variant":"emphasis","fromSide":"right","toSide":"left","targetNodeId":"ag_cut"},{"id":"e_ag_3","from":"ag_cut","to":"ag_repair","label":"LLM调工具","variant":"emphasis","fromSide":"bottom","toSide":"top","targetNodeId":"ag_repair"},{"id":"e_ag_4","from":"ag_repair","to":"ag_suspend","label":"人工审批","variant":"security","fromSide":"left","toSide":"right","targetNodeId":"ag_suspend"},{"id":"e_ag_5","from":"ag_suspend","to":"ag_guards","label":"恢复/插话","variant":"dashed","fromSide":"left","toSide":"right","targetNodeId":"ag_guards"},{"id":"e_ag_6","from":"ag_guards","to":"ag_exec","label":"轮边界回环","variant":"dashed","fromSide":"top","toSide":"bottom","targetNodeId":"ag_guards"}],"stationId":"a1"},{"id":"ingest","pinnedTab":true,"overviewOrder":10,"overviewBadge":"⚡ 重解析与 Wiki 并发专题","parentOverviewNodeId":"dir_service","relatedModule":{"moduleId":"m_infra","label":"🗄️ 关联: 解析与检索库"},"shortTitle":"重解析与 Wiki","title":"分块位移不变量、无感重解析、Asynq 6 池隔离与并发 Wiki 锁","subtitle":"掌握企业知识底座的数据一致性、队列防饿死与高并发异步蒸馏核心源码","viewBox":[856,370],"files":[{"id":"f_chunk","path":"internal/infrastructure/chunker/splitter.go","sliceStart":16,"sliceEnd":78,"label":"chunker/splitter.go","relPath":"internal/infrastructure/chunker/splitter.go","startLine":16,"endLine":78,"lines":["// Chunk represents a piece of split text with position tracking.","//","// Content holds exactly the text from the original document between Start","// and End (rune offsets), so End-Start == utf8.RuneCountInString(Content).","// This invariant is relied on by document-reconstruction code paths","// (knowledge.go:2278+ for summary generation, UI highlighting, etc.).","//","// ContextHeader is a separately-tracked context string (e.g. a Markdown","// heading breadcrumb) that should be prepended at embedding/retrieval time","// but is NOT part of Content. Keeping the two apart preserves the","// position invariant while still letting embedding pipelines see the","// section context.","type Chunk struct {","\tContent       string","\tContextHeader string","\tSeq           int","\tStart         int","\tEnd           int","}","","// EmbeddingContent returns the text that should be fed to the embedding","// model — the ContextHeader prepended (when set) plus the chunk content.","// Use this where Content alone would lose semantic context (Tier-1 chunks).","//","// Content is returned verbatim from the source document (the End-Start","// rune-count invariant requires that), but for embedding we trim the","// surrounding whitespace so leading/trailing newlines from boundary slices","// don't dilute the embedded vector or waste tokens. Inner whitespace is","// preserved.","func (c Chunk) EmbeddingContent() string {","\tbody := strings.TrimSpace(c.Content)","\tif c.ContextHeader == \"\" {","\t\treturn body","\t}","\treturn c.ContextHeader + \"\\n\\n\" + body","}","","// ImageRef is an image reference found within a chunk's content.","type ImageRef struct {","\tOriginalRef string","\tAltText     string","\tStart       int // offset within the chunk content","\tEnd         int","}","","// SplitterConfig configures the text splitter. Strategy and TokenLimit are","// honored by the strategy entry point in strategy.go; the legacy SplitText","// path uses only ChunkSize/Overlap/Separators.","type SplitterConfig struct {","\tChunkSize    int","\tChunkOverlap int","\tSeparators   []string","","\t// Strategy selects an adaptive tier. Empty = legacy (backwards-compatible).","\t// See strategy.go for valid values.","\tStrategy string","\t// TokenLimit caps chunk size in approximate tokens. 0 = use ChunkSize chars.","\tTokenLimit int","\t// Languages hints multilingual heuristic patterns. Empty = auto-detect.","\tLanguages []string","}","","// Default chunk sizing constants. Single source of truth for the entire"]},{"id":"f_proc","path":"internal/application/service/knowledge_process.go","sliceStart":4016,"sliceEnd":4108,"label":"knowledge_process.go","relPath":"internal/application/service/knowledge_process.go","startLine":4016,"endLine":4108,"lines":["// ProcessDocument handles Asynq document processing tasks","func (s *knowledgeService) ProcessDocument(ctx context.Context, t *asynq.Task) error {","\tvar payload types.DocumentProcessPayload","\tif err := json.Unmarshal(t.Payload(), &payload); err != nil {","\t\tlogger.Errorf(ctx, \"failed to unmarshal document process task payload: %v\", err)","\t\treturn nil","\t}","","\tctx = logger.WithRequestID(ctx, payload.RequestId)","\tctx = logger.WithField(ctx, \"document_process\", payload.KnowledgeID)","\tctx = types.WithExecutionTenant(ctx, payload.TenantID)","\tif payload.Language != \"\" {","\t\tctx = context.WithValue(ctx, types.LanguageContextKey, payload.Language)","\t}","","\t// 获取任务重试信息，用于判断是否是最后一次重试。Lite 模式的执行器不提供","\t// asynq 的重试计数，改用它注入的 TaskRetryMetadata；否则每次都算最后一次。","\tretryCount, _ := asynq.GetRetryCount(ctx)","\tmaxRetry, _ := asynq.GetMaxRetry(ctx)","\tif retried, limit, ok := types.TaskRetryMetadataFromContext(ctx); ok {","\t\tretryCount, maxRetry = retried, limit","\t}","\tisLastRetry := retryCount >= maxRetry","","\ttenantInfo, err := s.tenantRepo.GetTenantByID(ctx, payload.TenantID)","\tif err != nil {","\t\t// Retry: acking leaves the row pending with no task behind it.","\t\tlogger.Errorf(ctx, \"failed to get tenant: %v\", err)","\t\treturn fmt.Errorf(\"get tenant %d: %w\", payload.TenantID, err)","\t}","\tctx = context.WithValue(ctx, types.TenantInfoContextKey, tenantInfo)","","\tlogger.Infof(ctx, \"Processing document task: knowledge_id=%s, file_path=%s, retry=%d/%d\",","\t\tpayload.KnowledgeID, payload.FilePath, retryCount, maxRetry)","","\t// 幂等性检查：获取knowledge记录","\tknowledge, err := s.repo.GetKnowledgeByID(ctx, payload.TenantID, payload.KnowledgeID)","\tif errors.Is(err, repository.ErrKnowledgeNotFound) {","\t\treturn nil","\t}","\tif err != nil {","\t\tlogger.Errorf(ctx, \"failed to get knowledge: %v\", err)","\t\treturn fmt.Errorf(\"get knowledge %s: %w\", payload.KnowledgeID, err)","\t}","","\tif knowledge == nil {","\t\treturn nil","\t}","","\tif err := validateProcessingKnowledge(knowledge,","\t\tpayload.TenantID,","\t\tpayload.KnowledgeBaseID,","\t\tpayload.KnowledgeID); err != nil {","\t\treturn err","\t}","","\t// A reparse opened a newer attempt after this task was queued (or while","\t// an earlier delivery of it was running). Its row, chunks and counter","\t// belong to the new run; this task must not touch them.","\tif attemptSuperseded(ctx, s.tracker(), payload.KnowledgeID, payload.Attempt) {","\t\tlogger.Infof(ctx, \"Parse attempt %d superseded, skipping stale process task: %s\",","\t\t\tpayload.Attempt, payload.KnowledgeID)","\t\treturn nil","\t}","","\t// 检查是否正在删除 / 已被用户取消 - 如果是则直接退出","\tif knowledge.ParseStatus == types.ParseStatusDeleting {","\t\tlogger.Infof(ctx, \"Knowledge is being deleted, aborting processing: %s\", payload.KnowledgeID)","\t\treturn nil","\t}","\tif knowledge.ParseStatus == types.ParseStatusCancelled {","\t\tlogger.Infof(ctx, \"Knowledge cancelled by user, aborting processing: %s\", payload.KnowledgeID)","\t\treturn nil","\t}","","\t// 检查任务状态 - 幂等性处理","\tif knowledge.ParseStatus == types.ParseStatusCompleted {","\t\tlogger.Infof(ctx, \"Document already completed, skipping: %s\", payload.KnowledgeID)","\t\treturn nil // 幂等：已完成的任务直接返回","\t}","","\tif knowledge.ParseStatus == types.ParseStatusFailed {","\t\t// 检查是否可恢复（例如：超时、临时错误等）","\t\t// 对于不可恢复的错误，直接返回","\t\tlogger.Warnf(","\t\t\tctx,","\t\t\t\"Document processing previously failed: %s, error: %s\",","\t\t\tpayload.KnowledgeID,","\t\t\tknowledge.ErrorMessage,","\t\t)","\t\t// 这里可以根据错误类型判断是否可恢复，暂时允许重试","\t}",""]},{"id":"f_task","path":"internal/router/task.go","sliceStart":25,"sliceEnd":54,"label":"router/task.go (6池)","relPath":"internal/router/task.go","startLine":25,"endLine":54,"lines":["type AsynqTaskParams struct {","\tdig.In","","\t// Dedicated servers provide minimum capacity for parse, post-process,","\t// enrichment, maintenance, and Wiki work. SharedServer is the elastic tier:","\t// it also subscribes to core/enrichment queues so either stage can borrow","\t// otherwise-idle capacity without consuming the other stage's guarantee.","\tCoreServer           *asynq.Server `name:\"coreAsynqServer\"`","\tPostProcessServer    *asynq.Server `name:\"postProcessAsynqServer\"`","\tEnrichmentServer     *asynq.Server `name:\"enrichmentAsynqServer\"`","\tMaintenanceServer    *asynq.Server `name:\"maintenanceAsynqServer\"`","\tSharedServer         *asynq.Server `name:\"sharedAsynqServer\"`","\tWikiServer           *asynq.Server `name:\"wikiAsynqServer\"`","\tKnowledgeService     interfaces.KnowledgeService","\tKnowledgeBaseService interfaces.KnowledgeBaseService","\tTagService           interfaces.KnowledgeTagService","\tDataSourceService    interfaces.DataSourceService","\tChunkExtractor       interfaces.TaskHandler `name:\"chunkExtractor\"`","\tDataTableSummary     interfaces.TaskHandler `name:\"dataTableSummary\"`","\tImageMultimodal      interfaces.TaskHandler `name:\"imageMultimodal\"`","\tKnowledgePostProcess interfaces.TaskHandler `name:\"knowledgePostProcess\"`","\tKnowledgeAutoTag     interfaces.TaskHandler `name:\"knowledgeAutoTag\"`","\tKnowledgeBaseProfile interfaces.TaskHandler `name:\"knowledgeBaseProfile\"`","\tWikiIngest           interfaces.TaskHandler `name:\"wikiIngest\"`","\tTemporaryDocument    interfaces.TemporaryDocumentService","\tMemoryService        interfaces.MemoryService","\tDeadLetterRepo       interfaces.TaskDeadLetterRepository","\tSpanTracker          service.SpanTracker","}",""]},{"id":"f_task_dl","path":"internal/router/task.go","sliceStart":172,"sliceEnd":250,"label":"router/task.go (并发与死信)","relPath":"internal/router/task.go","startLine":172,"endLine":250,"lines":["// NewCoreAsynqServer runs document and manual parsing with guaranteed capacity.","func NewCoreAsynqServer(svc interfaces.SystemSettingService) *asynq.Server {","\tallocation := resolveWorkerPoolConcurrency(svc)","\tlog.Printf(\"asynq core-pool server starting with concurrency=%d total_upstream=%d redis_op_timeout=%dms\",","\t\tallocation.Core, allocation.UpstreamTotal(), readRedisOpTimeoutMs())","\treturn newAsynqServer(allocation.Core, types.QueueWeightsForPool(types.WorkerPoolCore))","}","","// NewPostProcessAsynqServer reserves capacity for the lightweight but","// latency-sensitive fan-out stage. It cannot be trapped behind a burst of","// long-running document parses in QueueDefault.","func NewPostProcessAsynqServer(svc interfaces.SystemSettingService) *asynq.Server {","\tallocation := resolveWorkerPoolConcurrency(svc)","\tlog.Printf(\"asynq postprocess-pool server starting with concurrency=%d total_upstream=%d\",","\t\tallocation.PostProcess, allocation.UpstreamTotal())","\treturn newAsynqServer(allocation.PostProcess, types.QueueWeightsForPool(types.WorkerPoolPostProcess))","}","","// NewEnrichmentAsynqServer runs high-fanout summary, multimodal, graph, and","// question generation without consuming core parsing capacity.","func NewEnrichmentAsynqServer(svc interfaces.SystemSettingService) *asynq.Server {","\tallocation := resolveWorkerPoolConcurrency(svc)","\tlog.Printf(\"asynq enrichment-pool server starting with concurrency=%d total_upstream=%d\",","\t\tallocation.Enrichment, allocation.UpstreamTotal())","\treturn newAsynqServer(allocation.Enrichment, types.QueueWeightsForPool(types.WorkerPoolEnrichment))","}","","// NewMaintenanceAsynqServer runs connector sync, cleanup, deletion, and batch","// dispatch work. QueueMaintenance keeps the legacy Redis name \"low\", so old","// tasks are drained safely during rolling upgrades.","func NewMaintenanceAsynqServer(svc interfaces.SystemSettingService) *asynq.Server {","\tallocation := resolveWorkerPoolConcurrency(svc)","\tlog.Printf(\"asynq maintenance-pool server starting with concurrency=%d total_upstream=%d\",","\t\tallocation.Maintenance, allocation.UpstreamTotal())","\treturn newAsynqServer(allocation.Maintenance, types.QueueWeightsForPool(types.WorkerPoolMaintenance))","}","","// NewSharedAsynqServer is the elastic tier. Asynq dequeue is atomic, so it is","// safe for this server and the dedicated servers to subscribe to the same","// queues: every task is still executed by exactly one worker.","func NewSharedAsynqServer(svc interfaces.SystemSettingService) *asynq.Server {","\tallocation := resolveWorkerPoolConcurrency(svc)","\tlog.Printf(\"asynq shared-pool server starting with concurrency=%d total_upstream=%d\",","\t\tallocation.Shared, allocation.UpstreamTotal())","\treturn newAsynqServer(allocation.Shared, types.QueueWeightsForSharedPool())","}","","// NewWikiAsynqServer builds the dedicated wiki pool: QueueWiki only. It runs","// the shared handler mux but only ever pulls wiki tasks, so its concurrency","// budget (WEKNORA_WIKI_ASYNQ_CONCURRENCY, default 8) is spent exclusively on","// wiki generation. This is the hard capacity isolation that prevents the parse","// pipeline from starving wiki (and vice-versa) during concurrent uploads.","func NewWikiAsynqServer(svc interfaces.SystemSettingService) *asynq.Server {","\tconcurrency := resolveWorkerPoolConcurrency(svc).Wiki","\tlog.Printf(\"asynq wiki-pool server starting with concurrency=%d\", concurrency)","\treturn newAsynqServer(concurrency, types.QueueWeightsForPool(types.WorkerPoolWiki))","}","","func RunAsynqServer(params AsynqTaskParams) *asynq.ServeMux {","\t// Create a new mux and register all handlers","\tmux := asynq.NewServeMux()","","\t// Install the dead-letter middleware FIRST so it sees the raw error","\t// returned by the handler, before any other middleware that might","\t// transform it. The middleware records one task_dead_letters row per","\t// task that exhausts its retry budget — operators can then SQL-query","\t// failures by task type, scope, or tenant without scraping logs.","\t// Best-effort: a DB failure is logged and swallowed; the original task","\t// error always propagates upstream to asynq for retry/archival.","\t//","\t// The callback flips Knowledge.parse_status to \"failed\" the moment a","\t// document-related task exhausts its retry budget. Without this hook,","\t// a permanently-failing task left its parent knowledge stranded in","\t// \"processing\" until housekeeping cron caught it minutes later — the","\t// UI signal users actually see.","\tknowledgeFailer := newDeadLetterKnowledgeFailer(params.KnowledgeService, params.SpanTracker)","\tmux.Use(asynqdl.MiddlewareWithCallback(params.DeadLetterRepo, knowledgeFailer))","\tmux.Use(asynqdl.RecoverMiddleware())",""]},{"id":"f_wiki","path":"internal/application/service/wiki_ingest.go","sliceStart":31,"sliceEnd":90,"label":"wiki_ingest.go","relPath":"internal/application/service/wiki_ingest.go","startLine":31,"endLine":90,"lines":["// ErrWikiIngestConcurrent is returned by the wiki ingest handler in Lite mode","// when another batch is already running for the same KB (the in-process","// liteLocks guard is held). The asynq/sync executor's RetryDelayFunc uses","// errors.Is on this sentinel to apply a short, fixed retry delay instead of","// exponential backoff, so the deferred batch retries promptly once the active","// one releases. Standard (Redis) mode no longer takes an exclusive per-KB","// lock (Phase 3) and never returns this.","var ErrWikiIngestConcurrent = errors.New(\"concurrent wiki task active\")","","const (","\t// maxContentForWiki limits the document content sent to LLM for wiki generation","\tmaxContentForWiki = 32768","","\t// --- Phase 3: concurrent per-KB batches (standard/Redis mode) ---------","\t//","\t// Phase 3 removed the exclusive per-KB Redis \"batch in progress\" lock","\t// (wiki:active:<kbID>). Standard mode now allows concurrent batches for","\t// one KB, kept safe by row claiming (claimPendingList) plus per-slug","\t// reduce locks (withSlugLock). Lite mode still serializes per KB via the","\t// in-process liteLocks map.","\t//","\t// wikiClaimStaleAfter is how long a claimed-but-undrained ingest row","\t// waits before another worker may re-claim it. It MUST exceed the asynq","\t// task Timeout for wiki:ingest (60m) so a still-running batch's rows are","\t// never stolen mid-flight — only genuinely crashed/abandoned claims are","\t// recovered. This preserves the pre-claim crash behaviour where a dead","\t// batch's undeleted rows were simply re-peeked by the next trigger.","\twikiClaimStaleAfter = 90 * time.Minute","","\t// wikiSlugLockPrefix guards read-modify-write on a single shared wiki","\t// page (entity/concept/summary/index) so two concurrent batches for the","\t// same KB can't lost-update the same slug. Key: wiki:slug:{kbID}:{slug}.","\twikiSlugLockPrefix = \"wiki:slug:\"","","\t// wikiIdentityClaimPrefix reserves the slug chosen for one normalized","\t// (page type, display title) identity while concurrent map phases are","\t// still running. The existing per-slug lock cannot help when two models","\t// emit different slugs for the same title, because those reducers lock","\t// different keys. A short-lived identity claim makes both batches use","\t// the same slug before summaries and page updates are materialized.","\twikiIdentityClaimPrefix = \"wiki:identity:\"","\twikiIdentityClaimTTL    = 2 * time.Hour","\t// wikiIdentityClaimScript atomically GET-or-SET (or overwrite when","\t// ARGV[3] is \"1\"). A valid existing slug wins and has its TTL refreshed.","\t// Missing or corrupt values are replaced so callers cannot diverge on a","\t// dirty key. KEYS[1]=claim key; ARGV = proposed slug, TTL seconds,","\t// authoritative (\"0\"/\"1\"), required slug prefix.","\twikiIdentityClaimScript = `","local proposed = ARGV[1]","local ttl = tonumber(ARGV[2])","local prefix = ARGV[4]","if ARGV[3] == '1' then","  redis.call('SET', KEYS[1], proposed, 'EX', ttl)","  return proposed","end","local existing = redis.call('GET', KEYS[1])","if type(existing) == 'string' and string.sub(existing, 1, #prefix) == prefix then","  redis.call('EXPIRE', KEYS[1], ttl)","  return existing","end"]}],"nodes":[{"id":"in_chunk","type":"backend","label":"分块位移不变量","sublabel":"ContextHeader 与原文分离","tag":"精准高亮","x":34,"y":44,"w":214,"h":86,"fileId":"f_chunk","startLine":16,"endLine":51,"stepOrder":1,"summary":"将标题面包屑 `ContextHeader` 与原文 `Content` 分开保存，向量化时再通过 `EmbeddingContent()` 拼接。","deepDive":"若直接把标题拼进 `Content`，会破坏 `End - Start == utf8.RuneCountInString(Content)` 这一关键不变量，导致摘要重组和前端原文精准高亮错位；分离设计同时兼顾了语义完整性与精确偏移定位。","pitfall":"仅在 `EmbeddingContent()` 中 `TrimSpace`，保留 `Content` 首尾空白以维持原始偏移量分毫不差。","interviewQ":"RAG 分块加标题上下文增强召回时，怎么避免破坏原文高亮定位的字符偏移？","interviewA":"在 `Chunk` 结构中把 `Content`（原文精确切片，维持 `End-Start == runeCount`）与 `ContextHeader`（Markdown 标题面包屑）拆字段存储，仅在送入 Embedding 模型时动态拼接，前端定位仍严格基于 `Content` 偏移。"},{"id":"in_6pool","type":"messagebus","label":"Asynq 6 物理 Worker 池","sublabel":"core/post/enrich/maint/shared/wiki","tag":"防饿死","x":322,"y":44,"w":214,"h":86,"fileId":"f_task_dl","startLine":172,"endLine":228,"stepOrder":2,"summary":"将解析、后处理、增强、维护、弹性共享与 Wiki 拆为 6 个独立 Asynq Server，实现容量硬隔离。","deepDive":"批量上传大 PDF 会占满 `core` 池，若不隔离，轻量的 `postprocess` 扇出和模型密集的 `wiki` 会被彻底饿死；额外设 `SharedServer` 同时订阅 `core/enrichment`，利用 Asynq 原子出队弹性借用空闲并发且保证不重复执行。","pitfall":"`QueueMaintenance` 沿用旧 Redis 队列名 `\"low\"`，确保滚动升级期间平滑排空历史积压任务。","interviewQ":"为什么不把所有异步任务放进一个 Asynq 实例靠权重队列调度，而要拆 6 个物理 Worker 池？","interviewA":"单池权重只能调节出队概率，遇到几十分钟的长文档解析任务仍会占满全部并发槽导致轻量后处理与 Wiki 饥饿。拆 6 物理池给每类负载保底并发，再用 `SharedServer` 原子出队弹性兜底突发流量。"},{"id":"in_reparse","type":"security","label":"无感重解析 Attempt 守卫","sublabel":"旧索引保活 · 拦截迟到任务","tag":"幂等守卫","x":610,"y":44,"w":214,"h":86,"fileId":"f_proc","startLine":4051,"endLine":4096,"stepOrder":3,"summary":"重解析任务携带递增 `Attempt` 序号，迟到旧任务经 `attemptSuperseded` 直接放弃，防覆写新数据。","deepDive":"在 `ProcessDocument` 入口依次校验：① 记录是否存在与归属合法；② `attemptSuperseded` 检测是否已有更新重解析；③ 是否处于 `deleting`/`cancelled`/`completed` 终态；保障并发重试与重解析下的严格幂等。","pitfall":"Lite 同步执行器没有 Asynq 重试计数，代码通过 `TaskRetryMetadataFromContext` 显式注入重试上下文，避免每次失败都被误判为最后一次重试。","interviewQ":"用户连续两次点击“重新解析”同一份文档，或者旧任务卡在队列里 10 分钟后才被消费，怎么防止把新结果覆盖脏掉？","interviewA":"每次重解析生成单调递增的 `Attempt` 编号并与处理 Span 绑定，Worker 执行入口与写入关键点均校验 `attemptSuperseded`，一旦发现已有更高序号 Attempt 立即安全退出，且新旧内容采用原子切换。"},{"id":"in_dlq","type":"security","label":"死信联动状态修复","sublabel":"最外层中间件 · 即时标 failed","tag":"消僵尸态","x":610,"y":236,"w":214,"h":86,"fileId":"f_task_dl","startLine":230,"endLine":250,"stepOrder":4,"summary":"死信中间件挂载在最外层捕获原始错误，重试耗尽落 `task_dead_letters` 并即时回调标父文档失败。","deepDive":"没有这层回调时，彻底失败的文档任务会让 `Knowledge.parse_status` 长期卡在 `processing`，直到定时巡检才清理。通过 `MiddlewareWithCallback` + `newDeadLetterKnowledgeFailer` 把队列终态与业务表状态即时对齐。","pitfall":"死信落库采取 best-effort 策略：即使 DB 瞬断记录死信失败，仍将原错误原样上抛给 Asynq 走归档，绝不吞掉任务错误。","interviewQ":"异步任务队列耗尽所有重试次数彻底失败后，怎么避免前端看到的文档永远卡在“解析中”？","interviewA":"在 Asynq 最外层挂载自定义死信中间件，任务耗尽重试归档时写 `task_dead_letters` 表供运维排查，并同步触发业务回调立即将对应 `Knowledge.parse_status` 翻转为 `failed`。"},{"id":"in_wiki_claim","type":"backend","label":"Wiki 行认领与 90m 回收","sublabel":"多批次并发 · Lite 15s 退避","tag":"孤儿回收","x":322,"y":236,"w":214,"h":86,"fileId":"f_wiki","startLine":31,"endLine":64,"stepOrder":5,"summary":"标准版移除 KB 级独占大锁改为行认领并发，认领过期阈值 90 分钟大于 60 分钟任务超时。","deepDive":"Phase 3 取消了单 KB 串行大锁，允许同 KB 多批并行蒸馏：`claimPendingList` 认领待处理行，`wikiClaimStaleAfter = 90m` 严格大于任务超时（60m），确保运行中批次绝不被误抢，仅回收崩溃遗留孤儿。","pitfall":"Lite 单进程仍按 KB 串行，遇并发冲突返回 `ErrWikiIngestConcurrent`，`RetryDelayFunc` 对它特化 15s 固定退避而非指数退避，避免锁释放后仍干等 7–10 分钟。","interviewQ":"Wiki 异步任务认领超时时间怎么定？遇到锁冲突为什么不用默认指数退避？","interviewA":"认领过期阈值（90m）必须大于单任务最大执行超时（60m），防止慢任务在途被误判崩溃而重复消费；锁冲突时原锁很快释放，若用默认指数退避会把重试拉到数分钟，特化 15s 固定重试可立即跟进。"},{"id":"in_wiki_lua","type":"database","label":"Lua 原子身份 + Slug 锁","sublabel":"wiki:identity · wiki:slug","tag":"防重页","x":34,"y":236,"w":214,"h":86,"fileId":"f_wiki","startLine":65,"endLine":90,"stepOrder":6,"summary":"用 Redis Lua 脚本为同标题概念原子锁定统一 slug，再配合单 slug 写锁防止并发丢更新。","deepDive":"仅靠单 slug 锁不够——两个并发 LLM 批次可能给同一概念起不同英文 slug 导致锁住不同 key、建出两张重复页面。`wikiIdentityClaimScript` 在 Map 阶段即原子 GET-or-SET 统一身份（2h TTL），Reduce 阶段再用 `wiki:slug:{kbID}:{slug}` 保护读改写。","pitfall":"Lua 脚本还校验已有值是否符合预期 `prefix`，遇脏数据直接覆写纠正，防止历史脏 key 导致路由分叉。","interviewQ":"两个并发 Worker 同时把不同文档蒸馏进同一 Wiki，如果模型对同一概念生成了不同 slug 怎么办？","interviewA":"单靠 slug 写锁拦不住“同名异 slug”问题。WeKnora 在 Map 阶段前置一层 Redis Lua 原子身份声明（按 `(pageType, normalizedTitle)` 原子 GET-or-SET 首个胜出 slug），Reduce 阶段再加 `wiki:slug` 锁保护写回。"}],"edges":[{"id":"e_in_1","from":"in_chunk","to":"in_6pool","label":"分块入队","variant":"emphasis","fromSide":"right","toSide":"left","targetNodeId":"in_6pool"},{"id":"e_in_2","from":"in_6pool","to":"in_reparse","label":"Core消费","variant":"emphasis","fromSide":"right","toSide":"left","targetNodeId":"in_reparse"},{"id":"e_in_3","from":"in_reparse","to":"in_dlq","label":"重试耗尽","variant":"security","fromSide":"bottom","toSide":"top","targetNodeId":"in_dlq"},{"id":"e_in_4","from":"in_6pool","to":"in_wiki_claim","label":"Wiki池","variant":"dashed","fromSide":"bottom","toSide":"top","targetNodeId":"in_wiki_claim"},{"id":"e_in_5","from":"in_wiki_claim","to":"in_wiki_lua","label":"Map/Reduce","variant":"emphasis","fromSide":"left","toSide":"right","targetNodeId":"in_wiki_lua"},{"id":"e_in_6","from":"in_dlq","to":"in_wiki_claim","label":"死信归档","variant":"dashed","fromSide":"left","toSide":"right","targetNodeId":"in_dlq"}],"stationId":"d4"},{"id":"security","pinnedTab":true,"overviewOrder":6,"overviewBadge":"⑥ 沙箱与凭据保险库","parentOverviewNodeId":"dir_sandbox","relatedModule":{"moduleId":"m_auth","label":"🔐 关联: 认证与RBAC"},"shortTitle":"安全与审校","title":"多租户 RBAC 门禁、AES-GCM 零明文沙箱填表与 Lite Fail-Closed 自动审校","subtitle":"WeKnora 最具差异化的企业安全护城河：权限真值推导、密码零进 LLM 与防注入审校","viewBox":[856,370],"files":[{"id":"f_rbac","path":"internal/middleware/rbac.go","sliceStart":48,"sliceEnd":80,"label":"middleware/rbac.go","relPath":"internal/middleware/rbac.go","startLine":48,"endLine":80,"lines":["// RequireRole returns a gin middleware that aborts the request with","// HTTP 403 unless the caller's TenantRole (set by the auth middleware","// in TenantRoleContextKey) is at least min.","//","// Cross-tenant superusers (User.CanAccessAllTenants) automatically","// satisfy any role gate. Otherwise rolling out tenant-RBAC would silently","// break organisation-level operators who own no tenant_members row in","// the tenant they're administering. The escape hatch is bounded by the","// existing canAccessTenant gate in auth.go; this middleware does not","// grant extra reach, only honours what was already approved.","//","// When cfg.Tenant.EnableRBAC is false, the middleware logs the would-be","// rejection but lets the request through — preserving today's behaviour","// during the rollout window. Once operators flip the flag to true,","// the same code paths start rejecting unauthorised callers.","//","// The auth middleware always sets a TenantRole; if for some reason it","// is missing, TenantRoleFromContext defaults to TenantRoleViewer, which","// is the safest fail-closed value: anything that requires more than","// Viewer will reject.","func RequireRole(min types.TenantRole, cfg *config.Config) gin.HandlerFunc {","\twarnOnNilConfig(cfg)","\treturn func(c *gin.Context) {","\t\tctx := c.Request.Context()","\t\t// API-key principals are authorized solely by the APIKeyGate","\t\t// (role + KB scope + default-deny). The JWT role ladder does not","\t\t// apply to a machine principal, so short-circuit here.","\t\tif _, ok := types.TenantAPIKeyScopeFromContext(ctx); ok {","\t\t\tc.Next()","\t\t\treturn","\t\t}","\t\trole := types.CallerFromContext(ctx).Role","\t\tif role.HasPermission(min) {"]},{"id":"f_vault","path":"internal/application/service/credential/vault.go","sliceStart":20,"sliceEnd":99,"label":"credential/vault.go","relPath":"internal/application/service/credential/vault.go","startLine":20,"endLine":99,"lines":["// Owner is whose credentials a call touches. It always comes from the","// authenticated context, never from a request body.","type Owner struct {","\tTenantID uint64","\tUserID   string","}","","// OwnerFromContext returns the signed-in web user acting in person. Embed","// visitors, API keys, IM users and automations own no vault.","func OwnerFromContext(ctx context.Context) (Owner, error) {","\ttenantID, ok := types.TenantIDFromContext(ctx)","\tif !ok || tenantID == 0 {","\t\treturn Owner{}, apperrors.NewUnauthorizedError(\"workspace context is required\")","\t}","\tp, ok := types.PrincipalFromContext(ctx)","\tif !ok || p.Type != types.PrincipalWebUser || p.ActingVia != \"\" {","\t\treturn Owner{}, apperrors.NewForbiddenError(\"only a signed-in user can use saved credentials\")","\t}","\treturn Owner{TenantID: tenantID, UserID: p.StorageID()}, nil","}","","// Available reports whether secrets can be stored. EncryptAESGCM returns its","// input unchanged without a key, so nothing here may run without one.","func Available() bool { return utils.GetAESKey() != nil }","","func errUnavailable() error {","\treturn apperrors.NewServiceUnavailableError(\"saved credentials are not enabled on this server\")","}","","func badRequest(err error) error { return apperrors.NewBadRequestError(err.Error()) }","","// LoginInput is a login to store.","type LoginInput struct {","\tTitle    string","\tSite     string","\tDomains  []string","\tUsername string","\tPassword string","}","","// LoginPatch changes some fields of a saved login. Nil leaves a field as is;","// a non-nil empty Domains resets the list to the site alone.","type LoginPatch struct {","\tTitle    *string","\tDomains  []string","\tUsername *string","\tPassword *string","}","","// Vault stores logins for their owner.","type Vault struct {","\trepo     interfaces.CredentialVaultRepository","\tnow      func() time.Time","\tmaxItems int","}","","// NewVault builds a vault over repo.","func NewVault(repo interfaces.CredentialVaultRepository) *Vault {","\treturn &Vault{repo: repo, now: time.Now, maxItems: types.CredentialVaultMaxItems}","}","","// sealed binds the password to its row so a ciphertext copied onto another","// row does not open.","type sealed struct {","\tItemID   string `json:\"item_id\"`","\tUserID   string `json:\"user_id\"`","\tPassword string `json:\"password\"`","}","","func seal(itemID, userID, password string) (string, error) {","\tkey := utils.GetAESKey()","\tif key == nil {","\t\treturn \"\", errUnavailable()","\t}","\traw, err := json.Marshal(sealed{ItemID: itemID, UserID: userID, Password: password})","\tif err != nil {","\t\treturn \"\", err","\t}","\treturn utils.EncryptAESGCM(string(raw), key)","}"]},{"id":"f_sform","path":"internal/agent/approval/secure_form.go","sliceStart":14,"sliceEnd":60,"label":"approval/secure_form.go","relPath":"internal/agent/approval/secure_form.go","startLine":14,"endLine":60,"lines":["// SecureFormRequest raises a secure_form prompt.","type SecureFormRequest struct {","\tTenantID           uint64","\tUserID             string","\tSessionID          string","\tAssistantMessageID string","\tRequestID          string","\tToolCallID         string","\tEventBus           *event.EventBus","\tForm               types.SecureFormPromptRequest","\t// Snapshot, when set, lets the run suspend after the hot wait.","\tSnapshot        []byte","\tSnapshotVersion int","}","","// SecureFormAnswer is how a secure_form prompt ended. Response holds a","// handle, never a value the user typed.","type SecureFormAnswer struct {","\towner     string","\tanswered  bool","\tPromptID  string","\tAnswered  bool","\tResponse  types.SecureFormPromptResponse","\tReason    string","\tTimedOut  bool","\tCanceled  bool","\tSuspended *types.PromptSuspension","}","","// SecureFormAsker is the surface the request_secure_form tool uses.","type SecureFormAsker interface {","\tRequestSecureForm(ctx context.Context, req SecureFormRequest) (SecureFormAnswer, error)","\tResumeSecureForm(ctx context.Context, prompt *types.AgentPrompt, bus *event.EventBus) SecureFormAnswer","}","","var _ SecureFormAsker = (*Gate)(nil)","","// RequestSecureForm shows the card and waits for the submission, the","// timeout, or the suspension of the run.","func (g *Gate) RequestSecureForm(ctx context.Context, req SecureFormRequest) (SecureFormAnswer, error) {","\tif g == nil {","\t\treturn SecureFormAnswer{}, fmt.Errorf(\"secure form: nil gate\")","\t}","\tif req.EventBus == nil {","\t\treturn SecureFormAnswer{}, fmt.Errorf(\"secure form: EventBus is nil\")","\t}","\trequest, err := json.Marshal(req.Form)"]},{"id":"f_sfill","path":"internal/sandbox/secret_fill.go","sliceStart":53,"sliceEnd":160,"label":"sandbox/secret_fill.go","relPath":"internal/sandbox/secret_fill.go","startLine":53,"endLine":160,"lines":["// SessionSecureBrowser advertises the capability while the manager is open.","func (m *SessionBoundManager) SessionSecureBrowser() SessionSecureBrowser {","\tif m == nil || m.remoteDisabled() {","\t\treturn nil","\t}","\treturn m","}","","// CurrentPage reads the top-level URL of the session browser.","func (m *SessionBoundManager) CurrentPage(ctx context.Context, sessionID string) (BrowserPage, error) {","\tout, err := m.runSecretHelper(ctx, sessionID, \"\", nil, []string{\"--probe\"}, secretProbeTimeout)","\tif err != nil {","\t\treturn BrowserPage{}, err","\t}","\tvar probe struct {","\t\tURL   *string `json:\"url\"`","\t\tError string  `json:\"error\"`","\t}","\tif err := json.Unmarshal([]byte(strings.TrimSpace(out)), &probe); err != nil {","\t\treturn BrowserPage{}, errors.New(\"sandbox: unreadable browser probe output\")","\t}","\tif probe.Error != \"\" {","\t\treturn BrowserPage{}, fmt.Errorf(\"sandbox: browser probe: %s\", probe.Error)","\t}","\tif probe.URL == nil {","\t\treturn BrowserPage{}, nil","\t}","\treturn BrowserPage{URL: *probe.URL}, nil","}","","// FillSecret hands req to the helper without putting a value on any channel","// envd logs: the one-time key travels through the file API, which logs only","// the path, and argv carries only ciphertext.","func (m *SessionBoundManager) FillSecret(","\tctx context.Context, sessionID string, req SecretFillRequest,",") (*SecretFillResult, error) {","\tkey := make([]byte, 32)","\tif _, err := rand.Read(key); err != nil {","\t\treturn nil, err","\t}","\tdefer clear(key)","\tpayload, err := json.Marshal(req)","\tif err != nil {","\t\treturn nil, err","\t}","\tsealed, err := sealSecretPayload(key, payload)","\tclear(payload)","\tif err != nil {","\t\treturn nil, err","\t}","\tname := make([]byte, 16)","\tif _, err := rand.Read(name); err != nil {","\t\treturn nil, err","\t}","\tkeyPath := secretFillKeyDir + \"/wk-fill-\" + hex.EncodeToString(name)","\tout, err := m.runSecretHelper(ctx, sessionID, keyPath, key,","\t\t[]string{\"--key-file\", keyPath, sealed}, secretFillTimeout)","\tif err != nil {","\t\treturn nil, err","\t}","\tvar res struct {","\t\tFields map[string]string `json:\"fields\"`","\t\tError  string            `json:\"error\"`","\t}","\tif err := json.Unmarshal([]byte(strings.TrimSpace(out)), &res); err != nil {","\t\treturn nil, errors.New(\"sandbox: unreadable wk-secret-fill output\")","\t}","\tswitch res.Error {","\tcase \"\":","\tcase \"no_browser\":","\t\treturn nil, errors.New(\"sandbox: the session browser is not running\")","\tcase \"browser_busy\":","\t\treturn nil, errors.New(\"sandbox: the session browser stayed busy; retry\")","\tdefault:","\t\treturn nil, fmt.Errorf(\"sandbox: wk-secret-fill: %s\", res.Error)","\t}","\treturn &SecretFillResult{Fields: res.Fields}, nil","}","","// runSecretHelper runs wk-secret-fill in the session's sandbox. With keyPath","// set it stages key there first and always removes it afterwards.","func (m *SessionBoundManager) runSecretHelper(","\tctx context.Context, sessionID, keyPath string, key []byte, args []string, timeout time.Duration,",") (string, error) {","\tif err := m.requireRemoteBackend(); err != nil {","\t\treturn \"\", err","\t}","\tif strings.TrimSpace(sessionID) == \"\" {","\t\treturn \"\", errors.New(\"sandbox: session ID required for the browser helper\")","\t}","\tsc, err := m.scope(ctx, sessionID)","\tif err != nil {","\t\treturn \"\", err","\t}","\tctx, release, err := m.admitUser(ctx, sc, \"shell\")","\tif err != nil {","\t\treturn \"\", err","\t}","\tdefer release()","\thandle, err := m.resolveScope(ctx, sc)","\tif err != nil {","\t\treturn \"\", err","\t}","\tif keyPath != \"\" {","\t\tdefer func() { _ = m.client.Remove(context.WithoutCancel(ctx), handle, keyPath) }()","\t\tencoded := []byte(base64.StdEncoding.EncodeToString(key))","\t\terr := m.client.WriteFile(ctx, handle, keyPath, encoded)","\t\tclear(encoded)"]},{"id":"f_hrev","path":"internal/agent/hostreview/reviewer.go","sliceStart":51,"sliceEnd":127,"label":"hostreview/reviewer.go","relPath":"internal/agent/hostreview/reviewer.go","startLine":51,"endLine":127,"lines":["// Review fails closed: any error, timeout or malformed reply is a refusal.","func (r *Reviewer) Review(ctx context.Context, turn Turn, req sandbox.CommandApprovalRequest) Verdict {","\tstarted := time.Now()","\tv := r.review(ctx, turn, req)","\tlogger.Infof(ctx, \"[HostReview] session=%s tool=%s reason=%s approved=%t risk=%s elapsed=%s why=%q\",","\t\tturn.SessionID, req.Tool, reviewReason(req), v.Approved, v.RiskLevel, time.Since(started), v.Reason)","\treturn v","}","","func (r *Reviewer) review(ctx context.Context, turn Turn, req sandbox.CommandApprovalRequest) Verdict {","\tif r == nil || r.model == nil {","\t\treturn Verdict{Reason: \"auto review is unavailable; ask the user to switch to ask mode\"}","\t}","\tif !req.TargetsComplete {","\t\treturn Verdict{Reason: \"too many targets to review automatically; ask the user to switch to ask mode\"}","\t}","\tif req.ScriptsIncomplete {","\t\treturn Verdict{Reason: \"this command runs a script that cannot be shown for review; \" +","\t\t\t\"ask the user to switch to ask mode\"}","\t}","\tif size, err := actionSize(req); err != nil || size > maxActionBytes {","\t\treturn Verdict{Reason: \"the action is too long to review automatically; ask the user to switch to ask mode\"}","\t}","\tif turn.RequestID == \"\" {","\t\tturn.RequestID, _ = types.RequestIDFromContext(ctx)","\t}","\tvar msgs []*types.Message","\tif r.messages != nil {","\t\tvar err error","\t\tif msgs, err = r.messages.GetRecentUserMessages(ctx, turn.SessionID, transcriptFetch); err != nil {","\t\t\treturn Verdict{Reason: fmt.Sprintf(\"auto review could not read the conversation: %v\", err)}","\t\t}","\t}","\tcurrent, earlier := splitTranscript(msgs, turn.RequestID)","\t// Only this turn can authorize. An empty current list would leave the","\t// model guessing from earlier messages or the untrusted action.","\tif turn.RequestID == \"\" || len(current) == 0 {","\t\treturn Verdict{Reason: \"auto review could not identify this turn's user messages; \" +","\t\t\t\"ask the user to switch to ask mode\"}","\t}","\tif currentTurnTooLong(current) {","\t\treturn Verdict{Reason: \"this turn's messages are too long to review automatically; \" +","\t\t\t\"ask the user to switch to ask mode\"}","\t}","\tprompt, err := buildUserPrompt(current, earlier, req)","\tif err != nil {","\t\treturn Verdict{Reason: fmt.Sprintf(\"auto review could not build its input: %v\", err)}","\t}","","\tcallCtx, cancel := context.WithTimeout(ctx, r.timeout)","\tdefer cancel()","\tresp, err := r.model.Chat(callCtx, []chat.Message{","\t\t{Role: \"system\", Content: systemPolicy},","\t\t{Role: \"user\", Content: prompt},","\t}, &chat.ChatOptions{","\t\tTemperature:         0,","\t\tMaxCompletionTokens: 4096,","\t\t// Off, not low: a graded level still turns thinking on, and a small","\t\t// completion budget is then spent before the JSON answer is written.","\t\tReasoningEffort: api.ReasoningOff,","\t\tIsolated:        true,","\t\tPromptCacheKey:  \"host-review:\" + turn.SessionID,","\t})","\tswitch {","\tcase errors.Is(callCtx.Err(), context.DeadlineExceeded) && ctx.Err() == nil:","\t\treturn Verdict{Reason: \"auto review timed out\"}","\tcase ctx.Err() != nil:","\t\treturn Verdict{Reason: \"the turn was stopped\"}","\tcase err != nil:","\t\treturn Verdict{Reason: fmt.Sprintf(\"auto review failed: %v\", err)}","\tcase resp == nil:","\t\treturn Verdict{Reason: \"auto review returned nothing\"}","\tcase len(resp.ToolCalls) > 0:","\t\treturn Verdict{Reason: \"auto review tried to call a tool, which is not allowed\"}","\t}","\treturn parseAssessment(resp.Content).verdict()","}"]}],"nodes":[{"id":"sec_rbac","type":"security","label":"四级 RBAC 与 Key 分流","sublabel":"缺省降级 Viewer · 跨空间 404","tag":"双轨权限","x":34,"y":44,"w":214,"h":86,"fileId":"f_rbac","startLine":48,"endLine":80,"stepOrder":1,"summary":"JWT 走四级角色阶梯（缺失默认安全降级 Viewer）；API Key 短路交由 `APIKeyGate` 默认拒绝裁决。","deepDive":"两套主体权限互不干扰：`RequireRole` 检测到 `TenantAPIKeyScopeFromContext` 时立即放行给路由级 `APIKeyGate`；资源不存在或跨租户时让下游返 404 而非 403，彻底杜绝租户资源枚举。","pitfall":"切勿把人类角色阶梯硬套到机器 API Key 上，否则受限只读 Key 与多空间平台 Key 的语义会互相冲突。","interviewQ":"同时支持人类 JWT 登录和第三方 API Key 调用时，权限中间件怎么设计才不打架？","interviewA":"抽象统一 `Principal`，JWT 走四级 RBAC + 资源创建者归属校验；API Key 在 `RequireRole` 处短路，统一由挂在 `/api/v1` 最前面的 `APIKeyGate` 按显式路由白名单 + KB 作用域执行 Default-Deny。"},{"id":"sec_vault","type":"database","label":"AES-GCM 行绑定凭据库","sublabel":"绑定 item_id + user_id","tag":"无Key禁用","x":322,"y":44,"w":214,"h":86,"fileId":"f_vault","startLine":20,"endLine":99,"stepOrder":2,"summary":"仅登录 Web 真人用户拥有凭据库；密码打包 `{item_id, user_id, password}` 经 `SYSTEM_AES_KEY` 密封。","deepDive":"`OwnerFromContext` 显式拒绝 Embed 访客、API Key、IM 和自动化主体；`seal()` 将密码与 `item_id`/`user_id` 一起做 AES-256-GCM 认证加密，哪怕攻击者把密文复制到自己的数据库行也无法解开；无 AES 密钥时直接 503 拒绝启用。","pitfall":"`EncryptAESGCM` 在空密钥下可能原样返回，所以 `vault.go` 前置强制检查 `Available() bool { return utils.GetAESKey() != nil }` 防止明文落库。","interviewQ":"个人加密凭据落数据库时，除了 AES-GCM 加密，还要防什么数据库层攻击？","interviewA":"防“密文移植/替换攻击”：把 `item_id` 和 `user_id` 与密码一起序列化后再做 AES-GCM 密封，解密时强校验行身份一致；同时未配置 `SYSTEM_AES_KEY` 时 Fail-Closed 直接禁用功能，绝不降级存明文。"},{"id":"sec_form","type":"security","label":"SecureForm 句柄门禁","sublabel":"LLM 永不见用户输入明文","tag":"句柄隔离","x":610,"y":44,"w":214,"h":86,"fileId":"f_sform","startLine":14,"endLine":60,"stepOrder":3,"summary":"Agent 发起 `SecureForm` 卡片等待用户提交，返回的 `SecureFormAnswer` 仅含不透明句柄。","deepDive":"通过门禁把凭据输入与对话通道物理隔离：用户通过独立接口提交凭据或选用保险库条目后，回调给 Agent 工具结果的只有句柄 ID，确保明文密码永不进入大模型 Prompt、SSE 流或消息持久化表。","pitfall":"同样支持带 `Snapshot` 挂起恢复，避免用户寻找账号密码耗时过长导致 Agent 协程超时断开。","interviewQ":"Agent 需要登录受保护业务网站，怎么保证密码绝对不会出现在 LLM 上下文和聊天记录里？","interviewA":"采用“句柄化隔离”：`request_secure_form` 弹出独立加密表单，服务端落密文后仅把不透明句柄交给 Agent；后续填表工具只传句柄，由服务端直接和沙箱通信注入。"},{"id":"sec_probe","type":"cloud","label":"沙箱顶层 URL 域探针","sublabel":"先探针核域名再放行","tag":"防钓鱼","x":610,"y":236,"w":214,"h":86,"fileId":"f_sfill","startLine":53,"endLine":80,"stepOrder":4,"summary":"填表前通过 `CurrentPage` 执行 `--probe` 读取沙箱浏览器真实顶层 URL，核验命中凭据允许域名。","deepDive":"即使提示词注入诱骗 Agent 跳转钓鱼站再调 `browser_fill_secret`，服务端也会在沙箱侧探针核对顶层窗口真实域名与凭据白名单，不匹配直接拒绝解密注入。","pitfall":"只认沙箱助手探针读出的真实顶层 URL，绝不轻信大模型口头声称的当前页面地址。","interviewQ":"如果网页里的 Prompt Injection 诱骗浏览器 Agent 跳到攻击者域名再调用填表工具怎么办？","interviewA":"填表前服务端先调用 `CurrentPage` 探针直接从沙箱浏览器读取真实顶层 URL，并对照 `credential_vault_items.domains` 白名单强校验，不命中直接拒绝下发密文。"},{"id":"sec_fill","type":"messagebus","label":"/dev/shm 一次密钥填表","sublabel":"argv 仅密文 · 内存即清零","tag":"secret-fill","x":322,"y":236,"w":214,"h":86,"fileId":"f_sfill","startLine":83,"endLine":160,"stepOrder":5,"summary":"生成 32 字节一次性密钥写入沙箱 `/dev/shm`，命令行仅传密文载荷，执行完立即 `clear()` 与删文件。","deepDive":"规避容器运行时 `envd` 记录命令行参数的审计泄露风险：临时密钥走文件 API 写内存盘 `/dev/shm`（日志仅记路径），`argv` 只带加密载荷；`defer clear(key)` 与 `context.WithoutCancel` 删密钥确保异常取消也能彻底擦除。","pitfall":"删除临时密钥文件必须用 `context.WithoutCancel(ctx)`，防止调用方超时取消 Context 导致 `Remove` 失败、把密钥遗留在 `/dev/shm`。","interviewQ":"把密码传进 Docker/MicroVM 沙箱填表时，如何防止容器命令日志或进程参数把密码泄露出去？","interviewA":"服务端临时生成 32B 随机密钥加密表单载荷，密钥经文件 API 写进沙箱 `/dev/shm` 临时文件，`wk-secret-fill` 命令行 `argv` 只传密文；Go 侧立即 `clear()` 清零内存缓冲，并用 `WithoutCancel` 保证退出必删密钥文件。"},{"id":"sec_hrev","type":"security","label":"Lite 自动审校 Fail-Closed","sublabel":"无工具 · 禁思考 · 仅认本轮","tag":"默认拒绝","x":34,"y":236,"w":214,"h":86,"fileId":"f_hrev","startLine":60,"endLine":127,"stepOrder":6,"summary":"用独立隔离模型审查宿主机命令/文件改动，遇目标不全、脚本不可见、超时或尝试调工具一律拒绝。","deepDive":"六重 Fail-Closed 防线：① 校验 `TargetsComplete` 与 `!ScriptsIncomplete` 及动作字节上限；② 仅以本轮用户消息（`current`）作授权依据；③ 独立 `Chat` 设 `Temperature: 0`、`ReasoningOff`、`Isolated: true`；④ 一旦审校模型试图输出 `ToolCalls` 直接拒绝；⑤ 超时/报错/空回全拒绝。","pitfall":"刻意关闭 `ReasoningEffort`（`ReasoningOff` 而非 `low`），防止小预算被思考 token 耗光导致 JSON 裁决写不完整。","interviewQ":"用大模型自动审批本地高危命令（auto 模式），怎么防止误放行、超时失效或被 Prompt Injection 劫持？","interviewA":"遵循严格 Fail-Closed：输入侧拒绝不完整目标、不可见脚本和超长动作，仅信任本轮用户原话授权；模型侧关闭工具权限与思考消耗、设 `Temperature=0` 且 `Isolated=true`；任何超时、异常、空响应或模型企图调工具都直接拒绝并退回人工审批。"}],"edges":[{"id":"e_s_1","from":"sec_rbac","to":"sec_vault","label":"Web真人","variant":"security","fromSide":"right","toSide":"left","targetNodeId":"sec_vault"},{"id":"e_s_2","from":"sec_vault","to":"sec_form","label":"密文句柄","variant":"security","fromSide":"right","toSide":"left","targetNodeId":"sec_form"},{"id":"e_s_3","from":"sec_form","to":"sec_probe","label":"不透明句柄","variant":"emphasis","fromSide":"bottom","toSide":"top","targetNodeId":"sec_probe"},{"id":"e_s_4","from":"sec_probe","to":"sec_fill","label":"域名核验","variant":"security","fromSide":"left","toSide":"right","targetNodeId":"sec_fill"},{"id":"e_s_5","from":"sec_fill","to":"sec_hrev","label":"Lite防线","variant":"dashed","fromSide":"left","toSide":"right","targetNodeId":"sec_hrev"},{"id":"e_s_6","from":"sec_hrev","to":"sec_rbac","label":"所有者切模式","variant":"security","fromSide":"top","toSide":"bottom","targetNodeId":"sec_hrev"}],"stationId":"a4"},{"id":"m_cmd","overviewOrder":1,"overviewBadge":"① 进程入口与全局配置","parentOverviewNodeId":"dir_cmd","shortTitle":"① 启动与DI装配","title":"① 进程入口、配置加载、Uber Dig 装配与双阶段优雅停机流程图","subtitle":"从 main.go Dotenv 发现、config.yaml 阈值、Dig 容器组装到带预算拆分的优雅关停全链路","viewBox":[856,370],"files":[{"id":"f_cmd_main","path":"cmd/server/main.go","sliceStart":45,"sliceEnd":162,"label":"cmd/server/main.go","relPath":"cmd/server/main.go","startLine":45,"endLine":162,"lines":["func main() {","\t// Load dotenv configuration before any container provider reads it.","\t// Explicit ENV_FILE is honored on every build; automatic .env.lite","\t// discovery is scoped to Lite builds (internal/handler.Edition is","\t// injected at build time), so a standard binary built in the repo root","\t// never picks up Lite defaults. Process variables remain authoritative.","\tif err := envfile.Load(handler.Edition == \"lite\"); err != nil {","\t\tfmt.Fprintf(os.Stderr, \"warning: %v\\n\", err)","\t}","\t// Dotenv loading happens after the logger package initialized, so","\t// re-apply file-based LOG_LEVEL / LOG_PATH (mirrors cmd/desktop).","\tlogger.ConfigureFromEnv()","\t// Set Gin mode","\tif os.Getenv(\"GIN_MODE\") == \"release\" {","\t\tgin.SetMode(gin.ReleaseMode)","\t} else {","\t\tgin.SetMode(gin.DebugMode)","\t}","\t// Mute Gin's per-route registration spam (one line per route × ~150","\t// routes) — replaced by a single summary printed after router build.","\truntime.SilenceGinRouteSpam()","\t// Print the env banner before container build so operators see what","\t// config landed even when DB / storage init fails.","\truntime.LogStartupEnv(context.Background())","\truntime.MarkServerStarted()","","\t// Build dependency injection container","\tc := container.BuildContainer(runtime.GetContainer())","","\t// One-shot bootstrap hooks (e.g. promote env-named user to system","\t// admin). Best-effort: never aborts startup — see bootstrap.go.","\trunStartupBootstrap(c)","","\t// Run application","\terr := c.Invoke(func(","\t\tcfg *config.Config,","\t\trouter *gin.Engine,","\t\tresourceCleaner interfaces.ResourceCleaner,","\t\tsystemSettingSvc interfaces.SystemSettingService,","\t\tmodelCatalogSvc *service.ModelCatalogService,","\t) error {","\t\t// Create HTTP server","\t\tserver := &http.Server{","\t\t\tHandler: router,","\t\t}","","\t\taddr := fmt.Sprintf(\"%s:%d\", cfg.Server.Host, cfg.Server.Port)","\t\tlistener, err := listenWithRetry(addr, 10, 300*time.Millisecond)","\t\tif err != nil {","\t\t\treturn fmt.Errorf(\"failed to start server: %v\", err)","\t\t}","","\t\tctx, done := context.WithCancel(context.Background())","\t\tmodelCatalogSvc.Start(ctx)","","\t\t// Start the system_settings pubsub subscriber. Runs in its own","\t\t// goroutine and exits when ctx is cancelled at shutdown. Best-","\t\t// effort: an error here only warns (Redis may legitimately be","\t\t// disabled in lite-mode deployments — the service no-ops in","\t\t// that case anyway).","\t\tif err := systemSettingSvc.SubscribeRedis(ctx); err != nil {","\t\t\tlogger.Warnf(ctx, \"[system_settings] subscribe failed: %v\", err)","\t\t}","","\t\tsignals := make(chan os.Signal, 1)","\t\tsignal.Notify(signals, shutdownSignals...)","\t\tgo func() {","\t\t\tsig := <-signals","\t\t\tlogger.Infof(context.Background(), \"Received signal: %v, starting server shutdown...\", sig)","","\t\t\tdrainBudget, cleanupBudget := runtime.ShutdownBudgets(cfg.Server.ShutdownTimeout)","\t\t\tshutdownCtx, shutdownCancel := context.WithTimeout(context.Background(), drainBudget)","\t\t\tdefer shutdownCancel()","","\t\t\t// Second signal → force close all connections immediately.","\t\t\tgo func() {","\t\t\t\tsig := <-signals","\t\t\t\tlogger.Warnf(context.Background(), \"Received second signal: %v, forcing shutdown...\", sig)","\t\t\t\tserver.Close()","\t\t\t}()","","\t\t\t// Do NOT close the listener manually before Shutdown. Serve would","\t\t\t// return the raw accept error (\"use of closed network connection\")","\t\t\t// instead of ErrServerClosed, and logger.Fatalf → os.Exit(1) would","\t\t\t// kill the process before ResourceCleaner runs. Shutdown closes","\t\t\t// listeners first, so the port is released before the drain.","\t\t\tif err := server.Shutdown(shutdownCtx); err != nil {","\t\t\t\tlogger.Errorf(context.Background(), \"Server forced to shutdown: %v\", err)","\t\t\t\tserver.Close()","\t\t\t}","","\t\t\tlogger.Info(context.Background(), \"Cleaning up resources...\")","\t\t\t// Fresh context sized from the reserved slice of ShutdownTimeout.","\t\t\t// Drain must not hand cleanup an already-expired context, and the","\t\t\t// two slices must still add up to one supervisor grace period.","\t\t\tcleanupCtx, cleanupCancel := context.WithTimeout(context.Background(), cleanupBudget)","\t\t\tdefer cleanupCancel()","\t\t\terrs := resourceCleaner.Cleanup(cleanupCtx)","\t\t\tif len(errs) > 0 {","\t\t\t\tlogger.Errorf(context.Background(), \"Errors occurred during resource cleanup: %v\", errs)","\t\t\t}","\t\t\tlogger.Info(context.Background(), \"Server has exited\")","\t\t\tdone()","\t\t}()","","\t\truntime.LogGinRouteCount(context.Background())","\t\tlogger.Infof(context.Background(), \"Server is running at %s\", addr)","\t\tif err := server.Serve(listener); err != nil && err != http.ErrServerClosed {","\t\t\treturn fmt.Errorf(\"server error: %v\", err)","\t\t}","","\t\t<-ctx.Done()","\t\treturn nil","\t})","\tif err != nil {","\t\tlogger.Fatalf(context.Background(), \"Failed to run application: %v\", err)","\t}","}"]},{"id":"f_cmd_cfg","path":"config/config.yaml","sliceStart":1,"sliceEnd":51,"label":"config/config.yaml","syntax":"yaml","relPath":"config/config.yaml","startLine":1,"endLine":51,"lines":["# Server configuration","server:", mplates/generate_questions.yaml","","# Knowledge base configuration","knowledge_base:","  chunk_size: 512","  chunk_overlap: 50","  split_markers: [\"\\n\\n\", \"\\n\", \"。\"]","  document_process_timeout: 2h","  image_processing:","    enable_multimodal: true",""]},{"id":"f_cmd_di","path":"internal/container/container.go","sliceStart":124,"sliceEnd":175,"label":"container.go","relPath":"internal/container/container.go","startLine":124,"endLine":175,"lines":["func BuildContainer(container *dig.Container) *dig.Container {","\t// Deployment-level model catalog overlay (config/models.json, optional).","\t// Register providers explicitly, then validate and publish one catalog generation.","\tif err := modelruntime.Initialize(config.ConfigDir()); err != nil {","\t\tlogger.Warnf(context.Background(), \"Load models catalog overlay failed: %v\", err)","\t}","\tctx := context.Background()","\tlogger.Debugf(ctx, \"[Container] Starting container initialization...\")","","\t// Register resource cleaner for proper cleanup of resources","\tmust(container.Provide(NewResourceCleaner, dig.As(new(interfaces.ResourceCleaner))))","","\t// Core infrastructure configuration","\tlogger.Debugf(ctx, \"[Container] Registering core infrastructure...\")","\tmust(container.Provide(config.LoadConfig))","\tmust(container.Provide(initLangfuse))","\tmust(container.Provide(initDatabase))","\tmust(container.Provide(initFileService))","\tmust(container.Provide(initRedisClient))","\tmust(container.Provide(initAntsPool))","","\tmust(container.Invoke(registerLangfuseCleanup))","","\t// Register goroutine pool cleanup handler","\tmust(container.Invoke(registerPoolCleanup))","","\t// Initialize retrieval engine registry for search capabilities","\tlogger.Debugf(ctx, \"[Container] Registering retrieval engine registry...\")","\tmust(container.Provide(initRetrieveEngineRegistry))","","\t// External service clients","\tlogger.Debugf(ctx, \"[Container] Registering external service clients...\")","\tmust(container.Provide(initDocReaderClient))","\tmust(container.Provide(docparser.NewImageResolver))","\tmust(container.Provide(initOllamaService))","\tmust(container.Provide(initNeo4jClient))","\tmust(container.Provide(stream.NewStreamManager))","\tlogger.Debugf(ctx, \"[Container] Initializing DuckDB...\")","\tmust(container.Provide(NewDuckDB))","\tlogger.Debugf(ctx, \"[Container] DuckDB registered\")","","\t// Data repositories layer","\tlogger.Debugf(ctx, \"[Container] Registering repositories...\")","\tmust(container.Provide(repository.NewTenantRepository))","\tmust(container.Provide(repository.NewTenantAPIKeyRepository))","\tmust(container.Provide(repository.NewTenantMemberRepository))","\tmust(container.Provide(repository.NewTenantInvitationRepository))","\tmust(container.Provide(repository.NewAuditLogRepository))","\tmust(container.Provide(repository.NewKnowledgeBaseRepository))","\tmust(container.Provide(repository.NewKnowledgeRepository))","\tmust(container.Provide(repository.NewKnowledgeSpanRepository))","\tmust(container.Provide(repository.NewChunkRepository))"]},{"id":"f_cmd_boot","path":"cmd/server/bootstrap.go","sliceStart":39,"sliceEnd":118,"label":"bootstrap.go","relPath":"cmd/server/bootstrap.go","startLine":39,"endLine":118,"lines":["func runStartupBootstrap(c *dig.Container) {","\tctx := context.Background()","","\t// Legacy hash repair for migration 000065 placeholder rows. Invoked each","\t// startup but short-circuits with a cheap EXISTS once every row is","\t// backfilled (no api_key decryption on the steady-state path).","\tif err := c.Invoke(func(apiKeySvc interfaces.TenantAPIKeyService) {","\t\tif n, err := apiKeySvc.BackfillMissingKeyHashes(ctx); err != nil {","\t\t\tlogger.Warnf(ctx, \"[bootstrap] tenant api key hash backfill failed: %v\", err)","\t\t} else if n > 0 {","\t\t\tlogger.Infof(ctx, \"[bootstrap] backfilled %d legacy tenant api key hash(es)\", n)","\t\t}","\t}); err != nil {","\t\tlogger.Warnf(ctx, \"[bootstrap] failed to resolve TenantAPIKeyService: %v\", err)","\t}","","\temail := strings.TrimSpace(os.Getenv(bootstrapEnvVar))","\tif email == \"\" {","\t\treturn","\t}","\t// dig.Invoke resolves UserService from the container; if user","\t// service registration is broken we want to know loudly, but still","\t// not abort startup — bootstrap is best-effort.","\tif err := c.Invoke(func(userSvc interfaces.UserService) {","\t\tbootstrapSystemAdmin(ctx, userSvc, email)","\t}); err != nil {","\t\tlogger.Warnf(ctx, \"[bootstrap] failed to resolve UserService: %v\", err)","\t}","}","","// bootstrapSystemAdmin promotes the user identified by `email` to system","// administrator only when the deployment currently has no system admins.","// The function is idempotent and non-fatal — it warns and returns on","// every error path.","//","// The bootstrap intentionally does NOT create a user when the email is","// not yet registered: account creation is a workflow with side effects","// (password hashing, tenant assignment, audit) that we don't want to","// short-circuit. Operators should sign up normally first, then set the","// env var on the next restart.","func bootstrapSystemAdmin(ctx context.Context, userSvc interfaces.UserService, email string) {","\tuser, err := userSvc.GetUserByEmail(ctx, email)","\tif err != nil {","\t\t// \"not found\" surfaces as an error in this codebase; treat it","\t\t// gently — operators commonly set the var before the user has","\t\t// signed up. The next restart after registration will succeed.","\t\tlogger.Warnf(ctx,","\t\t\t\"[bootstrap] %s=%s: user lookup failed (have they signed up yet?): %v\",","\t\t\tbootstrapEnvVar, email, err)","\t\treturn","\t}","\tif user == nil {","\t\tlogger.Warnf(ctx,","\t\t\t\"[bootstrap] %s=%s: no matching user (will retry on next restart)\",","\t\t\tbootstrapEnvVar, email)","\t\treturn","\t}","\tif user.IsSystemAdmin {","\t\tlogger.Infof(ctx,","\t\t\t\"[bootstrap] %s=%s: user %s is already a system admin (no-op)\",","\t\t\tbootstrapEnvVar, email, user.ID)","\t\treturn","\t}","\t_, total, err := userSvc.ListSystemAdmins(ctx, 0, 1)","\tif err != nil {","\t\tlogger.Warnf(ctx,","\t\t\t\"[bootstrap] %s=%s: cannot verify existing system admins, skipping promotion: %v\",","\t\t\tbootstrapEnvVar, email, err)","\t\treturn","\t}","\tif total > 0 {","\t\tlogger.Infof(ctx,","\t\t\t\"[bootstrap] %s=%s: %d system admin(s) already exist; not promoting user %s\",","\t\t\tbootstrapEnvVar, email, total, user.ID)","\t\treturn","\t}","\tuser.IsSystemAdmin = true","\tif err := userSvc.UpdateUser(ctx, user); err != nil {","\t\tlogger.Warnf(ctx,","\t\t\t\"[bootstrap] %s=%s: failed to promote user %s: %v\","]}],"nodes":[{"id":"cmd_env","type":"frontend","label":"Dotenv 与 Lite 发现","sublabel":"Edition==lite · 日志重载","tag":"同源构建","x":34,"y":44,"w":214,"h":86,"fileId":"f_cmd_main","startLine":45,"endLine":70,"stepOrder":1,"summary":"按编译注入的 `Edition == \"lite\"` 隔离 `.env.lite` 自动加载，并重载日志级别与启动环境横幅。","deepDive":"标准版和 Lite 版共享同一份 `cmd/server/main.go` 入口：`envfile.Load(handler.Edition == \"lite\")` 确保在仓库根目录直接编译标准二进制时不会误读 Lite 默认配置，且进程级环境变量优先级始终最高。","pitfall":"Dotenv 在 `logger` 包 init 之后才加载，因此必须紧跟 `logger.ConfigureFromEnv()` 重新应用 `LOG_LEVEL`/`LOG_PATH`，否则文件配置不生效。","interviewQ":"WeKnora 标准集群版和单进程 Lite 版是如何做到同源构建却不互相污染配置的？","interviewA":"编译期通过 `-ldflags -X internal/handler.Edition=lite` 注入版本标识，`main.go` 据此决定是否自动发现 `.env.lite`，并在 DI 容器内按驱动类型切换 PG/SQLite 与 Redis/内存流。"},{"id":"cmd_cfg","type":"cloud","label":"默认阈值与模板配置","sublabel":"RAG阈值 · 512分块 · PromptID","tag":"YAML配置","x":322,"y":44,"w":214,"h":86,"fileId":"f_cmd_cfg","startLine":1,"endLine":51,"stepOrder":2,"summary":"声明端口、RAG 检索/重排默认阈值、Prompt 模板 ID 映射与知识库默认分块参数（512/50）。","deepDive":"`config/config.yaml` 把所有 Prompt 正文解耦到 `prompt_templates/*.yaml`，此处只保留 `*_prompt_id` 引用；同时集中声明 `chunk_size: 512`、`chunk_overlap: 50`、`document_process_timeout: 2h` 等基线参数。","pitfall":"前端知识库创建弹窗的初始分块值需与 `config.yaml` 及 `chunker/splitter.go` 保持同源，改一处漏改另一处会造成默认值漂移。","interviewQ":"为什么把系统 Prompt 正文从 `config.yaml` 抽成 `prompt_templates/` 并用 `*_prompt_id` 索引？","interviewA":"便于版本化维护、多语言扩展与运营热选模板，避免长段多行 Prompt 把主配置文件撑爆，同时启动时统一校验并预加载模板内容。"},{"id":"cmd_di","type":"backend","label":"Uber Dig 全量容器装配","sublabel":"模型目录 · DB/Redis · 仓储","tag":"依赖注入","x":610,"y":44,"w":214,"h":86,"fileId":"f_cmd_di","startLine":124,"endLine":175,"stepOrder":3,"summary":"先发布模型目录 Overlay，再向 Uber Dig 注册清理器、基础设施、外部客户端与业务仓储层。","deepDive":"`BuildContainer` 按分层顺序执行 `must(container.Provide(...))`：先注册 `ResourceCleaner` 与 `config/Langfuse/DB/Redis/AntsPool`，再挂 10 类检索注册表、DocReader、Ollama、Neo4j、StreamManager 与 DuckDB，最后装配仓储、服务与路由。","pitfall":"`modelruntime.Initialize` 必须在所有依赖模型目录的 provider 之前完成，否则自定义 `config/models.json` 覆盖不会生效。","interviewQ":"2,300 行的 Uber Dig 装配容器在大型 Go 项目里有什么优缺点，如何避免循环依赖？","interviewA":"优点是构造函数签名即依赖声明、编译解耦；为防循环依赖与启动期隐性失败，WeKnora 严格按 `Infra -> Repo -> Service -> Handler -> Router` 单向依赖分层，并用 `must()` 在启动第一时间暴露缺失注入。"},{"id":"cmd_boot","type":"security","label":"幂等引导与超管提升","sublabel":"Hash回填 · 仅首个超管生效","tag":"Best-Effort","x":610,"y":236,"w":214,"h":86,"fileId":"f_cmd_boot","startLine":39,"endLine":118,"stepOrder":4,"summary":"容器就绪后、监听端口前运行一次性引导：修补历史 API Key 哈希，并在零超管时提升指定邮箱。","deepDive":"`runStartupBootstrap` 刻意设计为 Best-Effort（仅告警不阻断启动）：先 `BackfillMissingKeyHashes` 廉价 `EXISTS` 短路；再检查 `WEKNORA_BOOTSTRAP_SYSTEM_ADMIN_EMAIL`，仅当当前系统超管总数 `total == 0` 时才提升，防止 UI 撤销权限后被重启静默恢复。","pitfall":"故意不自动创建未注册账号，避免绕过密码哈希、租户初始化与审计事件等完整注册副作用链路。","interviewQ":"为什么用环境变量提升首个系统管理员时，必须在 `total > 0` 时停止生效？","interviewA":"因为运维往往会把环境变量留在 Docker/K8s 清单里忘记删；一旦系统已有超管就停用自动提升，可防止某管理员在 UI 被降权后因下次 Pod 重启又被重新提权。"},{"id":"cmd_listen","type":"messagebus","label":"重试监听与热配置订阅","sublabel":"10次重试 · Redis PubSub","tag":"平滑启动","x":322,"y":236,"w":214,"h":86,"fileId":"f_cmd_main","startLine":79,"endLine":108,"stepOrder":5,"summary":"带 10×300ms 重试绑定监听端口，启动模型目录轮询与 `system_settings` Redis PubSub 订阅。","deepDive":"通过 `c.Invoke` 拉起完整 HTTP Server，`listenWithRetry` 缓解滚动重启或桌面端快速重启时的 `EADDRINUSE` 短暂端口占用；`SubscribeRedis` 在 Lite 无 Redis 模式下安全 no-op，保证多副本配置热同步。","pitfall":"必须先 `listenWithRetry` 成功再启动后台订阅与信号监听，避免端口冲突时残留孤儿协程。","interviewQ":"多副本部署下，管理员在界面修改系统配置怎么实时同步到其他 Go 节点？","interviewA":"写库的同时发布 Redis PubSub 通知，各实例在启动阶段调用 `systemSettingSvc.SubscribeRedis(ctx)` 监听变更并刷新本地缓存；Lite 单进程则静默降级为无操作。"},{"id":"cmd_shutdown","type":"security","label":"双阶段预算优雅停机","sublabel":"排空预算 + 清理预算 · 二次强杀","tag":"零丢连接","x":34,"y":236,"w":214,"h":86,"fileId":"f_cmd_main","startLine":109,"endLine":158,"stepOrder":6,"summary":"将 `ShutdownTimeout` 切分为排空与资源清理两段预算，绝不让排空超时饿死 `ResourceCleaner`。","deepDive":"收到首个退出信号先按 `drainBudget` 调用 `server.Shutdown` 优雅放行在途请求，再新建带 `cleanupBudget` 的独立 Context 执行 `resourceCleaner.Cleanup`（关闭 DB/Pool/Langfuse）；收到第二次信号立即 `server.Close()` 强退。","pitfall":"切勿在 `server.Shutdown` 前手动关闭 `listener`！否则 `server.Serve` 返回原始 accept 错误而非 `http.ErrServerClosed`，触发 `logger.Fatalf` 直接 `os.Exit(1)` 跳过资源清理。","interviewQ":"Go 服务做优雅停机时，为什么不能把 HTTP Shutdown 和 DB/池资源清理共用同一个超时 Context？","interviewA":"如果长连接 SSE/下载把整个超时 Context 耗尽，后续清理拿到已过期 Context 会立刻失败导致连接和遥测未刷盘；WeKnora 用 `ShutdownBudgets` 明确切分 `drainBudget` 与 `cleanupBudget`。"}],"edges":[{"id":"e_cmd_1","from":"cmd_env","to":"cmd_cfg","label":"加载配置","variant":"emphasis","fromSide":"right","toSide":"left","targetNodeId":"cmd_cfg"},{"id":"e_cmd_2","from":"cmd_cfg","to":"cmd_di","label":"Dig装配","variant":"emphasis","fromSide":"right","toSide":"left","targetNodeId":"cmd_di"},{"id":"e_cmd_3","from":"cmd_di","to":"cmd_boot","label":"启动钩子","variant":"security","fromSide":"bottom","toSide":"top","targetNodeId":"cmd_boot"},{"id":"e_cmd_4","from":"cmd_boot","to":"cmd_listen","label":"监听服务","variant":"emphasis","fromSide":"left","toSide":"right","targetNodeId":"cmd_listen"},{"id":"e_cmd_5","from":"cmd_listen","to":"cmd_shutdown","label":"退出信号","variant":"security","fromSide":"left","toSide":"right","targetNodeId":"cmd_shutdown"},{"id":"e_cmd_6","from":"cmd_cfg","to":"cmd_listen","label":"端口配置","variant":"dashed","fromSide":"bottom","toSide":"top","targetNodeId":"cmd_listen"}],"stationId":"d3"},{"id":"m_router","overviewOrder":2,"overviewBadge":"② 路由网关与控制器","parentOverviewNodeId":"dir_router","relatedModule":{"moduleId":"ingest","label":"⚡ 关联: 6池重解析与Wiki"},"shortTitle":"② 路由与6池任务","title":"② HTTP 路由网关、公开面与 6 池调度","subtitle":"深入 355 路径 / 456 操作的分层路由挂载顺序、启动自检防呆与 6 物理队列池隔离机制","viewBox":[856,370],"files":[{"id":"f_rt_main","path":"internal/router/router.go","sliceStart":105,"sliceEnd":352,"label":"router/router.go","relPath":"internal/router/router.go","startLine":105,"endLine":352,"lines":["func NewRouter(params RouterParams) *gin.Engine {","\tr := gin.New()","\tr.ContextWithFallback = true","\t// 清理 FormFile/MultipartForm 解析产生的 multipart 临时文件，避免容器 /tmp 持续增长。","\tr.Use(middleware.MultipartFormCleanup())","","\t// Trusted proxies: gin defaults to trusting ALL proxies, which makes","\t// c.ClientIP() honor a client-supplied X-Forwarded-For. Public, unauthed","\t// embed endpoints rate-limit per (channel, ClientIP), so a spoofed XFF would","\t// trivially bypass the limiter. Restrict to the fronting proxy network so","\t// only the real client IP (appended by nginx) is returned. Configurable via","\t// WEKNORA_TRUSTED_PROXIES (comma-separated CIDRs/IPs).","\tif err := r.SetTrustedProxies(trustedProxies()); err != nil {","\t\tlogger.Errorf(context.Background(), \"[Router] failed to set trusted proxies: %v\", err)","\t}","","\t// CORS 中间件应放在最前面。","\t// 注意：通配符 AllowOrigins 下浏览器会拒绝一切带凭据（cookie）的跨域","\t// 请求（CORS 规范禁止 \"*\" 与 credentials 组合），因此 AllowCredentials","\t// 实际只对未来改为回显具体 Origin 时才生效；当前认证全部走显式的","\t// Authorization / X-API-Key 头，不依赖 ambient 凭据。若引入 cookie","\t// 认证，必须先把 AllowOrigins 换成受控清单。","\tr.Use(cors.New(cors.Config{","\t\tAllowOrigins: []string{\"*\"},","\t\tAllowMethods: []string{\"GET\", \"POST\", \"PUT\", \"PATCH\", \"DELETE\", \"OPTIONS\"},","\t\tAllowHeaders: []string{","\t\t\t\"Origin\", \"Content-Type\", \"Accept\", \"Authorization\", \"X-API-Key\", \"X-Request-ID\", \"X-Tenant-ID\",","\t\t\t\"X-Embed-Session\", \"X-External-User-ID\", \"X-External-User-Token\", \"X-WeKnora-Desktop-Token\",","\t\t\t// Streamable HTTP MCP clients running in a browser send these on","\t\t\t// the /mcp/:endpoint_id surface.","\t\t\t\"MCP-Protocol-Version\", \"Mcp-Method\", \"Mcp-Name\", \"Mcp-Session-Id\", \"Last-Event-ID\",","\t\t},","\t\tExposeHeaders:    []string{\"Content-Length\", \"Access-Control-Allow-Origin\", \"Mcp-Session-Id\"},","\t\tAllowCredentials: true,","\t\tMaxAge:           12 * time.Hour,","\t}))","","\t// 基础中间件（不需要认证）","\tr.Use(middleware.RequestID())","\tr.Use(middleware.Language())","\tr.Use(middleware.Logger())","\tr.Use(middleware.Recovery())","\tr.Use(middleware.ErrorHandler())","","\t// 健康检查（不需要认证）","\tr.GET(\"/health\", func(c *gin.Context) {","\t\tc.JSON(200, gin.H{\"status\": \"ok\"})","\t})","","\t// Swagger API 文档（仅在非生产环境下启用）","\t// 通过 GIN_MODE 环境变量判断：release 模式下禁用 Swagger","\tif gin.Mode() != gin.ReleaseMode {","\t\tr.GET(\"/swagger/*any\", ginSwagger.WrapHandler(swaggerFiles.Handler,","\t\t\tginSwagger.DefaultModelsExpandDepth(-1), // 默认折叠 Models","\t\t\tginSwagger.DocExpansion(\"list\"),         // 展开模式: \"list\"(展开标签), \"full\"(全部展开), \"none\"(全部折叠)","\t\t\tginSwagger.DeepLinking(true),            // 启用深度链接","\t\t\tginSwagger.PersistAuthorization(true),   // 持久化认证信息","\t\t))","\t}","","\t// Embed page framing policy: emit a per-channel `frame-ancestors` CSP so the","\t// embed SPA page (/embed/:channelId) can only be iframed by the channel's","\t// allowed origins. This is the page-level counterpart to the API Origin","\t// allowlist enforced in EmbedAuth. Registered before the static handler so","\t// it runs for the embed HTML response.","\tif params.EmbedChannelService != nil {","\t\tr.Use(embedFrameAncestorsMiddleware(params.EmbedChannelService))","\t}","","\t// Lite bundles the frontend; other editions can explicitly opt in.","\tif handler.Edition == \"lite\" || strings.TrimSpace(os.Getenv(\"WEKNORA_WEB_DIR\")) != \"\" {","\t\tserveFrontendStatic(r)","\t}","","\t// IM 回调路由（在认证中间件之前注册，使用各平台自身的签名验证 \"missing required parameter: file_path\"})","\t\treturn \"\", false","\t}","\tif strings.Contains(filePath, \"..\") {","\t\tc.JSON(http.StatusBadRequest, gin.H{\"error\": \"invalid file path\"})","\t\treturn \"\", false","\t}","\treturn filePath, true","}"]},{"id":"f_rt_task","path":"internal/router/task.go","sliceStart":172,"sliceEnd":255,"label":"router/task.go","relPath":"internal/router/task.go","startLine":172,"endLine":255,"lines":["// NewCoreAsynqServer runs document and manual parsing with guaranteed capacity.","func NewCoreAsynqServer(svc interfaces.SystemSettingService) *asynq.Server {","\tallocation := resolveWorkerPoolConcurrency(svc)","\tlog.Printf(\"asynq core-pool server starting with concurrency=%d total_upstream=%d redis_op_timeout=%dms\",","\t\tallocation.Core, allocation.UpstreamTotal(), readRedisOpTimeoutMs())","\treturn newAsynqServer(allocation.Core, types.QueueWeightsForPool(types.WorkerPoolCore))","}","","// NewPostProcessAsynqServer reserves capacity for the lightweight but","// latency-sensitive fan-out stage. It cannot be trapped behind a burst of","// long-running document parses in QueueDefault.","func NewPostProcessAsynqServer(svc interfaces.SystemSettingService) *asynq.Server {","\tallocation := resolveWorkerPoolConcurrency(svc)","\tlog.Printf(\"asynq postprocess-pool server starting with concurrency=%d total_upstream=%d\",","\t\tallocation.PostProcess, allocation.UpstreamTotal())","\treturn newAsynqServer(allocation.PostProcess, types.QueueWeightsForPool(types.WorkerPoolPostProcess))","}","","// NewEnrichmentAsynqServer runs high-fanout summary, multimodal, graph, and","// question generation without consuming core parsing capacity.","func NewEnrichmentAsynqServer(svc interfaces.SystemSettingService) *asynq.Server {","\tallocation := resolveWorkerPoolConcurrency(svc)","\tlog.Printf(\"asynq enrichment-pool server starting with concurrency=%d total_upstream=%d\",","\t\tallocation.Enrichment, allocation.UpstreamTotal())","\treturn newAsynqServer(allocation.Enrichment, types.QueueWeightsForPool(types.WorkerPoolEnrichment))","}","","// NewMaintenanceAsynqServer runs connector sync, cleanup, deletion, and batch","// dispatch work. QueueMaintenance keeps the legacy Redis name \"low\", so old","// tasks are drained safely during rolling upgrades.","func NewMaintenanceAsynqServer(svc interfaces.SystemSettingService) *asynq.Server {","\tallocation := resolveWorkerPoolConcurrency(svc)","\tlog.Printf(\"asynq maintenance-pool server starting with concurrency=%d total_upstream=%d\",","\t\tallocation.Maintenance, allocation.UpstreamTotal())","\treturn newAsynqServer(allocation.Maintenance, types.QueueWeightsForPool(types.WorkerPoolMaintenance))","}","","// NewSharedAsynqServer is the elastic tier. Asynq dequeue is atomic, so it is","// safe for this server and the dedicated servers to subscribe to the same","// queues: every task is still executed by exactly one worker.","func NewSharedAsynqServer(svc interfaces.SystemSettingService) *asynq.Server {","\tallocation := resolveWorkerPoolConcurrency(svc)","\tlog.Printf(\"asynq shared-pool server starting with concurrency=%d total_upstream=%d\",","\t\tallocation.Shared, allocation.UpstreamTotal())","\treturn newAsynqServer(allocation.Shared, types.QueueWeightsForSharedPool())","}","","// NewWikiAsynqServer builds the dedicated wiki pool: QueueWiki only. It runs","// the shared handler mux but only ever pulls wiki tasks, so its concurrency","// budget (WEKNORA_WIKI_ASYNQ_CONCURRENCY, default 8) is spent exclusively on","// wiki generation. This is the hard capacity isolation that prevents the parse","// pipeline from starving wiki (and vice-versa) during concurrent uploads.","func NewWikiAsynqServer(svc interfaces.SystemSettingService) *asynq.Server {","\tconcurrency := resolveWorkerPoolConcurrency(svc).Wiki","\tlog.Printf(\"asynq wiki-pool server starting with concurrency=%d\", concurrency)","\treturn newAsynqServer(concurrency, types.QueueWeightsForPool(types.WorkerPoolWiki))","}","","func RunAsynqServer(params AsynqTaskParams) *asynq.ServeMux {","\t// Create a new mux and register all handlers","\tmux := asynq.NewServeMux()","","\t// Install the dead-letter middleware FIRST so it sees the raw error","\t// returned by the handler, before any other middleware that might","\t// transform it. The middleware records one task_dead_letters row per","\t// task that exhausts its retry budget — operators can then SQL-query","\t// failures by task type, scope, or tenant without scraping logs.","\t// Best-effort: a DB failure is logged and swallowed; the original task","\t// error always propagates upstream to asynq for retry/archival.","\t//","\t// The callback flips Knowledge.parse_status to \"failed\" the moment a","\t// document-related task exhausts its retry budget. Without this hook,","\t// a permanently-failing task left its parent knowledge stranded in","\t// \"processing\" until housekeeping cron caught it minutes later — the","\t// UI signal users actually see.","\tknowledgeFailer := newDeadLetterKnowledgeFailer(params.KnowledgeService, params.SpanTracker)","\tmux.Use(asynqdl.MiddlewareWithCallback(params.DeadLetterRepo, knowledgeFailer))","\tmux.Use(asynqdl.RecoverMiddleware())","","\t// Mark every asynq worker execution as a background task so the chat","\t// concurrency governor throttles ingestion/enrichment LLM traffic while","\t// leaving user-facing interactive chat ungated. Installed early so all","\t// downstream handlers (and their model calls) inherit the flag.","\tmux.Use(backgroundTaskMiddleware())"]}],"nodes":[{"id":"rt_base","type":"frontend","label":"可信代理与基础中间件链","sublabel":"Multipart清理 · XFF防护 · CORS","tag":"入口基线","x":34,"y":44,"w":214,"h":86,"fileId":"f_rt_main","startLine":105,"endLine":163,"stepOrder":1,"summary":"按序挂载 multipart 临时文件清理、受控 `TrustedProxies`、CORS、RequestID、Recovery 与非生产 Swagger。","deepDive":"Gin 默认信任所有代理，会导致公开 Embed 限流被伪造 `X-Forwarded-For` 轻松绕过；此处通过 `SetTrustedProxies(trustedProxies())` 仅信任私网/Nginx CIDR；`GIN_MODE=release` 自动禁用 Swagger 暴露。","pitfall":"上传大文档会产生 `/tmp` multipart 临时文件，忘记挂 `MultipartFormCleanup()` 会导致容器磁盘缓慢打满。","interviewQ":"Gin 默认的 `c.ClientIP()` 在 Nginx 反向代理后面做限流时有什么安全隐患？","interviewA":"Gin 默认信任全部代理，攻击者伪造 `X-Forwarded-For` 即可不断换 IP 绕过限流；必须用 `SetTrustedProxies` 严格收口为实际前置代理网段（或设空直接取 peer IP）。"},{"id":"rt_public","type":"cloud","label":"公开前置面与自鉴权入口","sublabel":"IM回调 · Embed · MCP · WS票据","tag":"免全局Auth","x":322,"y":44,"w":214,"h":86,"fileId":"f_rt_main","startLine":170,"endLine":211,"stepOrder":2,"summary":"在全局 `Auth` 之前精准注册 IM 签名回调、Embed 公开令牌、MCP 端点、短链与沙箱 WS 票据路由。","deepDive":"浏览器 WebSocket 握手无法附带 `Authorization` 请求头，IM 平台与 MCP 客户端也有独立鉴权协议，因此统一排在 `r.Use(middleware.Auth(...))` 之前，并由各自的签名/短期票据/Origin CSP 中间件独立守卫。","pitfall":"`embedFrameAncestorsMiddleware` 必须在静态托管 `serveFrontendStatic` 之前注册，才能为 `/embed/:channelId` HTML 响应下发精确 `frame-ancestors` CSP。","interviewQ":"企业系统里同时有 Web 登录、IM Webhook、外部 MCP Server 和 WebSocket 终端，路由顺序怎么编排？","interviewA":"按认证协议分层前置：IM 回调（平台签名）、Embed（Origin CSP + 短期令牌）、MCP（端点 Bearer）、沙箱 WS（一次性 Query Ticket）都在全局 `Auth` 之前注册，其余核心业务统一收归 `/api/v1`。"},{"id":"rt_v1","type":"security","label":"/api/v1 业务装配与自检","sublabel":"APIKeyGate · 355路径 · 漂移Panic","tag":"启动防呆","x":610,"y":44,"w":214,"h":86,"fileId":"f_rt_main","startLine":236,"endLine":349,"stepOrder":3,"summary":"挂接全局 `Auth`、`Langfuse`、`Audit` 与 `APIKeyGate`，装配 30+ 领域路由并在启动期校验策略漂移。","deepDive":"所有 `/api/v1` 子组都继承首位的 `apiKeyAuthorizer.Middleware()`；全部 `Register*` 完成后立即执行 `assertAPIKeyPoliciesMatchRoutes(r)`，若有任何策略模板与实际 Gin 路径拼写不匹配直接 panic，绝不带病上线。","pitfall":"修改任何带路径参数的接口时务必同步更新其 API Key 策略注册，否则启动自检会直接阻断进程拉起。","interviewQ":"路由数量膨胀到 355 个后，如何防止权限策略表里的路径模板跟实际路由慢慢漂移导致静默 403？","interviewA":"在 `NewRouter` 末尾加一道启动期自检 `assertAPIKeyPoliciesMatchRoutes(r)`，把策略表里的 `(method, fullPath)` 与 Gin 注册树做全量比对，有拼写漂移直接启动期 fail-fast。"},{"id":"rt_chat","type":"backend","label":"会话、续流与插话路由组","sublabel":"chat能力 · stop/steer · 通配隔离","tag":"流式控制","x":610,"y":236,"w":214,"h":86,"fileId":"f_rt_chat","star
