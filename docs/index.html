fSublabel":"DocReader · MinerU · Chunker","dfTag":"父子分块","nodeType":"backend","stars":5,"duration":"16 分钟","inputSpec":"对象存储中的原始多格式文件（PDF/Word/Excel/扫描图/XMind 等）","outputSpec":"结构化 Markdown + 内联图片字节 + 严格满足 `End-Start == RuneCount` 且与标题面包屑分离的父子 Chunks","packetSample":"Chunk { Content: \"一线城市住宿上限...\", ContextHeader: \"第4章 > 差旅报销\", Start: 412, End: 538 }\nInvariant: End - Start === utf8.RuneCount(Content)","analogy":"就像**古籍整理流水线**：专业扫描师（Python DocReader）把图文扫描好原样递回，绝不拿金库钥匙（对象存储凭证）；馆长（Go Chunker）切段时，正面严丝合缝保留原书逐字切片保页码行号，背面另贴章节便签（`ContextHeader`）给向量模型看！","files":[{"id":"fd2_py","path":"docreader/main.py","sliceStart":63,"sliceEnd":100,"label":"docreader/main.py","syntax":"py","relPath":"docreader/main.py","startLine":63,"endLine":100,"lines":["def _resolve_images(","    images: dict, request_id: str, storage_map: dict | None = None",") -> tuple[str, list]:","    \"\"\"Resolve document images into inline bytes for the Go App to persist.","","    ``images`` is a dict of {relative_path: raw_data} where raw_data is","    base64-encoded string or raw bytes.","","    The Go App is solely responsible for persisting images to the configured","    storage backend (local/minio/cos/tos). This function only decodes images","    and returns them as inline bytes via ImageRef.","","    Returns (\"\", list[ImageRef]).  image_dir_path is always empty.","    \"\"\"","    import base64","","    if not images:","        return \"\", []","","    mime_map = {","        \".png\": \"image/png\",","        \".jpg\": \"image/jpeg\",","        \".jpeg\": \"image/jpeg\",","        \".gif\": \"image/gif\",","        \".webp\": \"image/webp\",","        \".bmp\": \"image/bmp\",","    }","","    refs = []","    for ref_path, b64data in images.items():","        try:","            img_bytes = base64.b64decode(b64data)","        except Exception:","            img_bytes = b64data.encode(\"utf-8\") if isinstance(b64data, str) else b64data","","        fname = os.path.basename(ref_path) or f\"{uuid.uuid4().hex}.png\"","        ext = os.path.splitext(fname)[1].lower()","        mime = mime_map.get(ext, \"application/octet-stream\")"]},{"id":"fd2_reg","path":"internal/infrastructure/docparser/engine_registry.go","sliceStart":63,"sliceEnd":88,"label":"engine_registry.go","relPath":"internal/infrastructure/docparser/engine_registry.go","startLine":63,"endLine":88,"lines":["// NewReader builds the reader for an engine.","//","// An empty engine name means \"no explicit choice\": simple formats are handled","// in Go and everything else goes to the docreader service. An unknown name is","// routed to the docreader too, so engines that only exist in the Python","// service keep working without a Go-side registration.","func NewReader(","\tctx context.Context, engine, fileType string, isURL bool, deps ReaderDeps,",") (interfaces.DocReader, error) {","\tif registration, ok := lookupEngine(engine); ok {","\t\treturn registration.NewReader(ctx, deps)","\t}","\tif engine == \"\" && !isURL && IsSimpleFormat(fileType) {","\t\treturn &SimpleFormatReader{}, nil","\t}","\treturn remoteReader(deps)","}","","// remoteReader returns the docreader client, or an error when the service is","// not connected — a nil interface value here would panic at the call site.","func remoteReader(deps ReaderDeps) (interfaces.DocReader, error) {","\tif deps.Remote == nil {","\t\treturn nil, errNotConnected","\t}","\treturn deps.Remote, nil","}"]},{"id":"fd2_chk","path":"internal/infrastructure/chunker/splitter.go","sliceStart":16,"sliceEnd":60,"label":"chunker/splitter.go","relPath":"internal/infrastructure/chunker/splitter.go","startLine":16,"endLine":60,"lines":["// Chunk represents a piece of split text with position tracking.","//","// Content holds exactly the text from the original document between Start","// and End (rune offsets), so End-Start == utf8.RuneCountInString(Content).","// This invariant is relied on by document-reconstruction code paths","// (knowledge.go:2278+ for summary generation, UI highlighting, etc.).","//","// ContextHeader is a separately-tracked context string (e.g. a Markdown","// heading breadcrumb) that should be prepended at embedding/retrieval time","// but is NOT part of Content. Keeping the two apart preserves the","// position invariant while still letting embedding pipelines see the","// section context.","type Chunk struct {","\tContent       string","\tContextHeader string","\tSeq           int","\tStart         int","\tEnd           int","}","","// EmbeddingContent returns the text that should be fed to the embedding","// model — the ContextHeader prepended (when set) plus the chunk content.","// Use this where Content alone would lose semantic context (Tier-1 chunks).","//","// Content is returned verbatim from the source document (the End-Start","// rune-count invariant requires that), but for embedding we trim the","// surrounding whitespace so leading/trailing newlines from boundary slices","// don't dilute the embedded vector or waste tokens. Inner whitespace is","// preserved.","func (c Chunk) EmbeddingContent() string {","\tbody := strings.TrimSpace(c.Content)","\tif c.ContextHeader == \"\" {","\t\treturn body","\t}","\treturn c.ContextHeader + \"\\n\\n\" + body","}","","// ImageRef is an image reference found within a chunk's content.","type ImageRef struct {","\tOriginalRef string","\tAltText     string","\tStart       int // offset within the chunk content","\tEnd         int","}",""]}],"steps":[{"id":"sd2_1","order":1,"type":"cloud","label":"Python 内联图片回传","sublabel":"不持存储密钥 · 彻底无状态","tag":"Python gRPC","edgeLabel":"引擎路由","fileId":"fd2_py","startLine":63,"endLine":100,"explain":"Python DocReader 只专注 20+ 格式解析与 OCR，提取的图片在 `_resolve_images` 解码为内联字节 `ImageRef` 回传 Go 服务，由 Go 侧统一持久化到当前租户的对象存储后端。","pitfall":"超大扫描件走 `ReadStream` 逐张流式吐出图片，防止突破单次 gRPC 消息体积上限。"},{"id":"sd2_2","order":2,"type":"backend","label":"Go 多解析引擎路由","sublabel":"纯文本本地 · 显式不降级","tag":"插件注册","edgeLabel":"分块","fileId":"fd2_reg","startLine":63,"endLine":88,"explain":"`NewReader` 对简单文本走 Go 本地零网络开销解析，复杂格式走远端 DocReader；若用户指定 MinerU/PaddleOCR-VL 但凭据缺失直接报错，绝不静默降级损坏表格！","pitfall":"`remoteReader` 显式判空返回错误，杜绝 Go nil interface panic。"},{"id":"sd2_3","order":3,"type":"database","label":"分块位移不变量","sublabel":"ContextHeader与原文物理分离","tag":"精准高亮","edgeLabel":"","fileId":"fd2_chk","startLine":16,"endLine":60,"explain":"`Content` 严守 `End-Start == utf8.RuneCountInString(Content)` 支撑原文精准高亮；章节面包屑存 `ContextHeader`，仅在 `EmbeddingContent()` 送向量化时动态拼接。","pitfall":"仅在 `EmbeddingContent()` 里 `TrimSpace`，绝不修改原始 `Content` 首尾空白破坏字符偏移！"}],"quiz":{"question":"为什么 Python DocReader 不直接将 PDF 里的图片上传至 MinIO/COS，而是通过 gRPC 以内联字节回传给 Go 主服务？","options":["因为 Python 不支持 HTTP 请求","避免对象存储密钥扩散到解析微服务，统一由 Go 侧按多租户动态存储后端落盘与编目，让解析器彻底无状态","为了让图片体积变大一倍","因为 MinIO 不支持 PNG 格式"],"correctIndex":1,"explanation":"非常清晰！把凭据管理与多租户存储路由收口在 Go 侧，Python 解析服务只做纯计算无状态扩缩，架构边界极其干净。"},"interviewQ":"解析用 Python、分块用 Go，且如何兼顾“加标题上下文提升召回”和“原文精确高亮不错位”？","interviewA":"解析依重 Python 生态且易 OOM，独立 gRPC 服务内联回传图片实现无状态故障隔离；分块放 Go 侧吞吐高，把 `Content`（严守 `End-Start == runeCount` 偏移不变量）与 `ContextHeader`（标题面包屑）拆字段存储，仅在向量化 `EmbeddingContent()` 时拼接。","whyBlock":{"painPoint":"PDF/Word/扫描件里混杂复杂表格、公式与插图，且切分段落时存在一对天然矛盾：① 为了让向量模型理解段落背景，需要拼上「第 3 章 > 住宿标准」标题上下文；② 为了让前端点击引用时精准高亮原文，每个 Chunk 的 `StartAt / EndAt` 字符偏移必须严丝合缝等于原文逐字切片，一插字就会导致引用错位！另外如果让 Python 解析微服务直连对象存储，会导致存储密钥扩散。","analogy":"就像**古籍数字化修复工坊**：修复师（Python DocReader）专心把各种材质的书页扫描成清晰文字和内联图片交回馆长（Go），自己绝不碰金库钥匙（对象存储）；馆长切卡片时，**卡片正面（`Content`）严丝合缝保留原书逐字切片**绝不改一字，**卡片背面（`ContextHeader`）贴上章节面包屑便签**供检索理解，两全其美！","avoidRabbitHole":"不要逐个翻看 `docreader/parser/` 下 PDF/EPUB/XMind 20 个格式解析器的实现细节！本站只需抓住「Python 只返回内联图片不碰存储」、「`engine_registry.go` 按后缀/配置动态路由引擎（内置/MinerU/外部）」和「`splitter.go` 标题面包屑与原文位移不变量」三大架构契约。"},"ioContract":{"inType":"gRPC `DocReader.ReadFromFile` 请求 + Go `ChunkerConfig` 切分参数","inFields":[{"name":"file_bytes / file_type","type":"bytes / string","desc":"原始文件二进制内容与扩展名（pdf / docx / md / xlsx 等）"},{"name":"engine_name","type":"string","desc":"路由选中的解析引擎：`builtin` / `mineru` / `paddleocr`"},{"name":"chunk_size / overlap","type":"int / int","desc":"目标分块长度（如 `512` 字符）与相邻重叠窗口（如 `64` 字符）"}],"inSample":"{\n  \"grpc_method\": \"docreader.DocReader/ReadFromFile\",\n  \"file_name\": \"2026差旅报销制度.pdf\",\n  \"file_type\": \"pdf\",\n  \"parser_engine\": \"mineru\",\n  \"chunk_config\": { \"chunk_size\": 512, \"chunk_overlap\": 64, \"preserve_headings\": true }\n}","transformSteps":["`engine_registry.go` 按文档类型与租户配置路由到最合适的解析引擎（本地 DocReader gRPC 或 MinerU 视觉引擎）","`docreader/main.py` 提取纯 Markdown 文本及内联图片二进制（Base64/bytes）直接回传 Go 主服务，不在 Python 侧持有 MinIO/S3 凭据","`splitter.go` 自适应分块：计算精确原文字符区间 `[StartAt, EndAt]`，同时剥离并附着层级标题面包屑 `ContextHeader`，严守 `fullText[StartAt:EndAt] == Content` 位移不变量"],"outType":"[]types.Chunk（带精确位移、章节面包屑与待上传内联图片列表）","outFields":[{"name":"Content","type":"string","desc":"严守原文逐字切片的正文内容（用于原文高亮溯源）"},{"name":"ContextHeader","type":"string","desc":"所属层级标题路径（如 `报销制度 > 第三章 住宿标准`），供向量化增强语义"},{"name":"StartAt / EndAt","type":"int / int","desc":"在整篇解析文本中的精确起止字符偏移"},{"name":"Images","type":"[]InlineImage","desc":"Python 随文提取的内联图片数据，由 Go 侧统一存入对象存储并可选 VLM 描述"}],"outSample":"{\n  \"total_chars\": 14820,\n  \"chunks_count\": 34,\n  \"sample_chunk\": {\n    \"seq\": 5,\n    \"context_header\": \"2026差旅报销制度 > 第三章 住宿标准\",\n    \"content\": \"一线城市（北上广深）住宿报销上限 750 元/晚，新一线城市 550 元/晚...\",\n    \"start_at\": 1240,\n    \"end_at\": 1395,\n    \"invariant_check\": \"fullText[1240:1395] === content (TRUE)\",\n    \"inline_images\": [{ \"ref\": \"img_p3_1.png\", \"bytes_len\": 48210 }]\n  }\n}"}},{"id":"d3","flowId":"flow_ingest","stage":2,"row":0,"dfNodeId":"obj_rdb","techCompIds":["rdb","obj_store","doc_parser"],"wbTarget":{"moduleId":"ingest","nodeId":"in_reparse"},"codeLabel":"2-3","title":"主库落盘与无感重解析：Attempt 守卫保旧索引不断服 + 双阶段优雅停机","dfLabel":"主库与对象存储","dfSublabel":"PG/SQLite · MinIO/S3","dfTag":"权威主数据","nodeType":"database","stars":5,"duration":"15 分钟","inputSpec":"解析产出的新 Chunks / 图片字节（可能是首次上传，也可能是热点文档的并发重解析 `Attempt=2`）","outputSpec":"Chunk 权威落库、旧索引在切换前始终保活可检、迟到旧任务幂等退出、停机确保连接刷盘","packetSample":"Knowledge(kn_501): latest_attempt=2 | old_chunks(v1): SERVING -> new_chunks(v2): ATOMIC_SWAP -> quota_delta: +12KB","analogy":"就像**热更新一座跨江大桥**：新桥（`Attempt=2`）建好验收前老桥照常通车（旧索引不断服）；如果老施工队（`Attempt=1`）堵车迟到一小时才来施工，门卫核对施工代际号直接劝退（`attemptSuperseded`）；晚上收工（优雅停机）先排空桥上车流再留足独立预算断电锁门！","files":[{"id":"fd3_proc","path":"internal/application/service/knowledge_process.go","sliceStart":4016,"sliceEnd":4108,"label":"knowledge_process.go","relPath":"internal/application/service/knowledge_process.go","startLine":4016,"endLine":4108,"lines":["// ProcessDocument handles Asynq document processing tasks","func (s *knowledgeService) ProcessDocument(ctx context.Context, t *asynq.Task) error {","\tvar payload types.DocumentProcessPayload","\tif err := json.Unmarshal(t.Payload(), &payload); err != nil {","\t\tlogger.Errorf(ctx, \"failed to unmarshal document process task payload: %v\", err)","\t\treturn nil","\t}","","\tctx = logger.WithRequestID(ctx, payload.RequestId)","\tctx = logger.WithField(ctx, \"document_process\", payload.KnowledgeID)","\tctx = types.WithExecutionTenant(ctx, payload.TenantID)","\tif payload.Language != \"\" {","\t\tctx = context.WithValue(ctx, types.LanguageContextKey, payload.Language)","\t}","","\t// 获取任务重试信息，用于判断是否是最后一次重试。Lite 模式的执行器不提供","\t// asynq 的重试计数，改用它注入的 TaskRetryMetadata；否则每次都算最后一次。","\tretryCount, _ := asynq.GetRetryCount(ctx)","\tmaxRetry, _ := asynq.GetMaxRetry(ctx)","\tif retried, limit, ok := types.TaskRetryMetadataFromContext(ctx); ok {","\t\tretryCount, maxRetry = retried, limit","\t}","\tisLastRetry := retryCount >= maxRetry","","\ttenantInfo, err := s.tenantRepo.GetTenantByID(ctx, payload.TenantID)","\tif err != nil {","\t\t// Retry: acking leaves the row pending with no task behind it.","\t\tlogger.Errorf(ctx, \"failed to get tenant: %v\", err)","\t\treturn fmt.Errorf(\"get tenant %d: %w\", payload.TenantID, err)","\t}","\tctx = context.WithValue(ctx, types.TenantInfoContextKey, tenantInfo)","","\tlogger.Infof(ctx, \"Processing document task: knowledge_id=%s, file_path=%s, retry=%d/%d\",","\t\tpayload.KnowledgeID, payload.FilePath, retryCount, maxRetry)","","\t// 幂等性检查：获取knowledge记录","\tknowledge, err := s.repo.GetKnowledgeByID(ctx, payload.TenantID, payload.KnowledgeID)","\tif errors.Is(err, repository.ErrKnowledgeNotFound) {","\t\treturn nil","\t}","\tif err != nil {","\t\tlogger.Errorf(ctx, \"failed to get knowledge: %v\", err)","\t\treturn fmt.Errorf(\"get knowledge %s: %w\", payload.KnowledgeID, err)","\t}","","\tif knowledge == nil {","\t\treturn nil","\t}","","\tif err := validateProcessingKnowledge(knowledge,","\t\tpayload.TenantID,","\t\tpayload.KnowledgeBaseID,","\t\tpayload.KnowledgeID); err != nil {","\t\treturn err","\t}","","\t// A reparse opened a newer attempt after this task was queued (or while","\t// an earlier delivery of it was running). Its row, chunks and counter","\t// belong to the new run; this task must not touch them.","\tif attemptSuperseded(ctx, s.tracker(), payload.KnowledgeID, payload.Attempt) {","\t\tlogger.Infof(ctx, \"Parse attempt %d superseded, skipping stale process task: %s\",","\t\t\tpayload.Attempt, payload.KnowledgeID)","\t\treturn nil","\t}","","\t// 检查是否正在删除 / 已被用户取消 - 如果是则直接退出","\tif knowledge.ParseStatus == types.ParseStatusDeleting {","\t\tlogger.Infof(ctx, \"Knowledge is being deleted, aborting processing: %s\", payload.KnowledgeID)","\t\treturn nil","\t}","\tif knowledge.ParseStatus == types.ParseStatusCancelled {","\t\tlogger.Infof(ctx, \"Knowledge cancelled by user, aborting processing: %s\", payload.KnowledgeID)","\t\treturn nil","\t}","","\t// 检查任务状态 - 幂等性处理","\tif knowledge.ParseStatus == types.ParseStatusCompleted {","\t\tlogger.Infof(ctx, \"Document already completed, skipping: %s\", payload.KnowledgeID)","\t\treturn nil // 幂等：已完成的任务直接返回","\t}","","\tif knowledge.ParseStatus == types.ParseStatusFailed {","\t\t// 检查是否可恢复（例如：超时、临时错误等）","\t\t// 对于不可恢复的错误，直接返回","\t\tlogger.Warnf(","\t\t\tctx,","\t\t\t\"Document processing previously failed: %s, error: %s\",","\t\t\tpayload.KnowledgeID,","\t\t\tknowledge.ErrorMessage,","\t\t)","\t\t// 这里可以根据错误类型判断是否可恢复，暂时允许重试","\t}",""]},{"id":"fd3_main","path":"cmd/server/main.go","sliceStart":109,"sliceEnd":158,"label":"cmd/server/main.go","relPath":"cmd/server/main.go","startLine":109,"endLine":158,"lines":["\t\tsignals := make(chan os.Signal, 1)","\t\tsignal.Notify(signals, shutdownSignals...)","\t\tgo func() {","\t\t\tsig := <-signals","\t\t\tlogger.Infof(context.Background(), \"Received signal: %v, starting server shutdown...\", sig)","","\t\t\tdrainBudget, cleanupBudget := runtime.ShutdownBudgets(cfg.Server.ShutdownTimeout)","\t\t\tshutdownCtx, shutdownCancel := context.WithTimeout(context.Background(), drainBudget)","\t\t\tdefer shutdownCancel()","","\t\t\t// Second signal → force close all connections immediately.","\t\t\tgo func() {","\t\t\t\tsig := <-signals","\t\t\t\tlogger.Warnf(context.Background(), \"Received second signal: %v, forcing shutdown...\", sig)","\t\t\t\tserver.Close()","\t\t\t}()","","\t\t\t// Do NOT close the listener manually before Shutdown. Serve would","\t\t\t// return the raw accept error (\"use of closed network connection\")","\t\t\t// instead of ErrServerClosed, and logger.Fatalf → os.Exit(1) would","\t\t\t// kill the process before ResourceCleaner runs. Shutdown closes","\t\t\t// listeners first, so the port is released before the drain.","\t\t\tif err := server.Shutdown(shutdownCtx); err != nil {","\t\t\t\tlogger.Errorf(context.Background(), \"Server forced to shutdown: %v\", err)","\t\t\t\tserver.Close()","\t\t\t}","","\t\t\tlogger.Info(context.Background(), \"Cleaning up resources...\")","\t\t\t// Fresh context sized from the reserved slice of ShutdownTimeout.","\t\t\t// Drain must not hand cleanup an already-expired context, and the","\t\t\t// two slices must still add up to one supervisor grace period.","\t\t\tcleanupCtx, cleanupCancel := context.WithTimeout(context.Background(), cleanupBudget)","\t\t\tdefer cleanupCancel()","\t\t\terrs := resourceCleaner.Cleanup(cleanupCtx)","\t\t\tif len(errs) > 0 {","\t\t\t\tlogger.Errorf(context.Background(), \"Errors occurred during resource cleanup: %v\", errs)","\t\t\t}","\t\t\tlogger.Info(context.Background(), \"Server has exited\")","\t\t\tdone()","\t\t}()","","\t\truntime.LogGinRouteCount(context.Background())","\t\tlogger.Infof(context.Background(), \"Server is running at %s\", addr)","\t\tif err := server.Serve(listener); err != nil && err != http.ErrServerClosed {","\t\t\treturn fmt.Errorf(\"server error: %v\", err)","\t\t}","","\t\t<-ctx.Done()","\t\treturn nil","\t})"]}],"steps":[{"id":"sd3_1","order":1,"type":"frontend","label":"双端统一重试上下文","sublabel":"标准Asynq与Lite语义对齐","tag":"统一容错","edgeLabel":"代际校验","fileId":"fd3_proc","startLine":4016,"endLine":4050,"explain":"`ProcessDocument` 入口注入 `TaskRetryMetadataFromContext`，弥补 Lite 同步执行器缺少 Asynq 重试计数的差异，避免首次失败被误判成终态。","pitfall":"双形态架构（标准版/Lite 版）最易在重试次数与并发语义上漂移，必须抽象到统一上下文。"},{"id":"sd3_2","order":2,"type":"security","label":"Attempt 递增守卫","sublabel":"attemptSuperseded 拦迟到","tag":"无感重解析","edgeLabel":"停机保障","fileId":"fd3_proc","startLine":4051,"endLine":4108,"explain":"入口校验记录归属、`attemptSuperseded`（已有更高序号重解析即退出）与 `deleting`/`cancelled`/`completed` 终态；新结果就绪后再原子切换旧索引并按差额修配额。","pitfall":"重解析绝不能先删旧数据再解析，否则热点文档在解析耗时期间线上完全搜不到！"},{"id":"sd3_3","order":3,"type":"security","label":"双阶段预算优雅停机","sublabel":"drainBudget + cleanupBudget","tag":"零脏写盘","edgeLabel":"","fileId":"fd3_main","startLine":109,"endLine":158,"explain":"主进程将停机总超时拆为请求排空预算与资源清理独立预算，确保即使长连接排空超时，DB/连接池/Langfuse 仍有专属清理预算安全落盘；且绝不提前手动关 `listener`。","pitfall":"提前手动关 `listener` 会使 `Serve` 报普通 accept 错误触发 `Fatalf` 直接 `os.Exit(1)` 跳过清理！"}],"quiz":{"question":"对热点文档连续点击两次“重新解析”，系统靠什么既保证解析期间线上不断服，又防止先触发的慢任务反手把新结果覆盖脏？","options":["重解析前先删除旧向量，再给前端加 30 秒冷却弹窗","保留旧索引持续服务至新结果原子切换，并靠单调递增的 Attempt 编号 + attemptSuperseded 守卫拦截迟到的旧任务","重启 PostgreSQL 清空所有缓存","把文档状态永久锁定为只读"],"correctIndex":1,"explanation":"一击命中！旧索引保活解决可用性空窗，递增 `Attempt` 守卫解决分布式乱序覆盖，配额按差额修正解决账务一致！"},"interviewQ":"热点文档重新解析时，怎么保证线上检索不中断、并发重试不脏写、服务重启不丢数据？","interviewA":"Chunk 以关系库为权威源、索引可重建；重解析不先删旧块而是生成递增 `Attempt`，入口和关键写点校验 `attemptSuperseded` 拦截迟到旧任务，新索引就绪后原子替换并按差额修配额；进程层面用双阶段预算优雅停机保障在途清理完整刷盘。","whyBlock":{"painPoint":"如果一份热门制度文档用户点了「重新解析」——甚至手抖连点了两次！传统做法「先删旧分块 → 再解析 → 再建新索引」会导致 5 分钟内线上完全搜不到这份文档（服务中断）；更致命的是如果第 1 次慢任务晚于第 2 次完成，还会反手把最新解析结果覆盖脏了！此外，发布重启进程时若直接强杀，正在刷盘的数据库和 SSE 流会被拦腰截断。","analogy":"无感重解析就像**高架桥原址换梁**：先在旁边把新桥（`Attempt=2` 的新 Chunk 与向量）全部造好验收，造桥期间车辆照旧走老桥（旧索引保活不断服），最后瞬间通车拆老桥（原子切换）；如果迟到的旧施工队（`Attempt=1`）半小时后才来砌砖，门卫一看施工令过期（`attemptSuperseded`），直接拦下！而双阶段优雅停机就像**餐厅打烊**：先拉卷帘门停接新客，留 20 秒排空在吃客人，**硬性保留最后 10 秒关煤气锁门**！","avoidRabbitHole":"`knowledge_process.go` 有 5,000+ 行，**千万不要从头到尾通读**！本站聚焦 `ProcessDocument` 入口处的 `Attempt` 幂等守卫与无感重解析替换段（L4016–L4108），再配合 `cmd/server/main.go`（L109–L158）的双阶段预算停机，即可吃透权威落库与进程可靠性。"},"ioContract":{"inType":"[]types.Chunk（含向量 Embedding）+ 当前任务 `Attempt` 版本号","inFields":[{"name":"knowledge_id","type":"string","desc":"目标文档主键"},{"name":"task_attempt","type":"int64","desc":"本次解析任务持有的单调递增版本票据（对比数据库最新 `parse_attempt`）"},{"name":"chunks_with_vec","type":"[]ChunkEmbedding","desc":"已生成向量与对象存储图片 URL 的完整分块集合"}],"inSample":"{\n  \"knowledge_id\": \"doc_travel_2026\",\n  \"mode\": \"reparse_zero_downtime\",\n  \"task_attempt\": 2,\n  \"db_current_attempt\": 2,\n  \"new_chunks_count\": 34,\n  \"old_active_chunks_count\": 31\n}","transformSteps":["入口与落库前多次执行 `checkAttemptValid` 校验：若 `task_attempt < db_current_attempt` 立即静默中止（`attemptSuperseded`），杜绝并发乱序覆盖","新分块以「新批次/未激活」写入 PG/SQLite 权威主库，向量写入检索引擎，全过程旧分块持续对外可检不断服","在事务内原子切换激活状态并清理旧批次分块与旧向量，再触发下游后处理事件；进程收到 SIGTERM 时 `main.go` 预留 `cleanupBudget` 确保写库与资源清理完整刷盘"],"outType":"权威主库已提交（`chunks` + `embeddings` 原子生效）→ 派发后处理任务","outFields":[{"name":"knowledge.parse_status","type":"string","desc":"更新为 `completed`（基础解析可检，异步增强随即启动）"},{"name":"active_chunks","type":"int","desc":"原子替换后对外生效的最新分块数（如 `34`）"},{"name":"post_process_event","type":"AsynqTask","desc":"投递至后处理池，扇出摘要、图谱、记忆与 Wiki 蒸馏任务"}],"outSample":"{\n  \"db_transaction\": \"COMMITTED\",\n  \"knowledge_id\": \"doc_travel_2026\",\n  \"parse_status\": \"completed\",\n  \"active_attempt\": 2,\n  \"replaced_old_chunks\": 31,\n  \"activated_new_chunks\": 34,\n  \"dispatched_next\": \"knowledge:post_process\"\n}"}},{"id":"d4","flowId":"flow_ingest","stage":3,"row":0,"dfNodeId":"wiki_enrich","techCompIds":["asynq_pools","wiki_enrich"],"wbTarget":{"moduleId":"ingest","nodeId":"in_6pool"},"codeLabel":"2-4","title":"Asynq 6 池隔离与 Wiki 并发蒸馏：防饿死与三层锁组合拳","dfLabel":"增强与 Wiki 蒸馏","dfSublabel":"摘要 · 图谱 · Wiki · 记忆","dfTag":"Asynq 异步","nodeType":"backend","stars":4,"duration":"18 分钟","inputSpec":"已完成主解析的文档 Chunks，需要扇出摘要、推荐问题、图谱、多模态与 Wiki 蒸馏","outputSpec":"6 物理池容量硬隔离不饿死、多 Worker 并发蒸馏 Wiki 无重复建页且无覆盖丢更新","packetSample":"AsynqPools: [core | postprocess | enrichment | maintenance | shared | wiki]\nWikiLock: 90m row claim -> Redis Lua identity(title->slug) -> single slug write lock","analogy":"就像**医院急诊/门诊/手术室分科 + 百科全书协同编纂**：6 物理池让大手术（大 PDF 解析）绝不堵死轻量挂号扇出和 Wiki 蒸馏，还有弹性全科医生（`SharedServer`）借空闲算力；多人同写百科词条时先领 90 分钟借阅牌 → 找总编按概念名用 Lua 脚本拿唯一编号防建重页 → 改单页加单页锁！","files":[{"id":"fd4_task","path":"internal/router/task.go","sliceStart":172,"sliceEnd":255,"label":"router/task.go","relPath":"internal/router/task.go","startLine":172,"endLine":255,"lines":["// NewCoreAsynqServer runs document and manual parsing with guaranteed capacity.","func NewCoreAsynqServer(svc interfaces.SystemSettingService) *asynq.Server {","\tallocation := resolveWorkerPoolConcurrency(svc)","\tlog.Printf(\"asynq core-pool server starting with concurrency=%d total_upstream=%d redis_op_timeout=%dms\",","\t\tallocation.Core, allocation.UpstreamTotal(), readRedisOpTimeoutMs())","\treturn newAsynqServer(allocation.Core, types.QueueWeightsForPool(types.WorkerPoolCore))","}","","// NewPostProcessAsynqServer reserves capacity for the lightweight but","// latency-sensitive fan-out stage. It cannot be trapped behind a burst of","// long-running document parses in QueueDefault.","func NewPostProcessAsynqServer(svc interfaces.SystemSettingService) *asynq.Server {","\tallocation := resolveWorkerPoolConcurrency(svc)","\tlog.Printf(\"asynq postprocess-pool server starting with concurrency=%d total_upstream=%d\",","\t\tallocation.PostProcess, allocation.UpstreamTotal())","\treturn newAsynqServer(allocation.PostProcess, types.QueueWeightsForPool(types.WorkerPoolPostProcess))","}","","// NewEnrichmentAsynqServer runs high-fanout summary, multimodal, graph, and","// question generation without consuming core parsing capacity.","func NewEnrichmentAsynqServer(svc interfaces.SystemSettingService) *asynq.Server {","\tallocation := resolveWorkerPoolConcurrency(svc)","\tlog.Printf(\"asynq enrichment-pool server starting with concurrency=%d total_upstream=%d\",","\t\tallocation.Enrichment, allocation.UpstreamTotal())","\treturn newAsynqServer(allocation.Enrichment, types.QueueWeightsForPool(types.WorkerPoolEnrichment))","}","","// NewMaintenanceAsynqServer runs connector sync, cleanup, deletion, and batch","// dispatch work. QueueMaintenance keeps the legacy Redis name \"low\", so old","// tasks are drained safely during rolling upgrades.","func NewMaintenanceAsynqServer(svc interfaces.SystemSettingService) *asynq.Server {","\tallocation := resolveWorkerPoolConcurrency(svc)","\tlog.Printf(\"asynq maintenance-pool server starting with concurrency=%d total_upstream=%d\",","\t\tallocation.Maintenance, allocation.UpstreamTotal())","\treturn newAsynqServer(allocation.Maintenance, types.QueueWeightsForPool(types.WorkerPoolMaintenance))","}","","// NewSharedAsynqServer is the elastic tier. Asynq dequeue is atomic, so it is","// safe for this server and the dedicated servers to subscribe to the same","// queues: every task is still executed by exactly one worker.","func NewSharedAsynqServer(svc interfaces.SystemSettingService) *asynq.Server {","\tallocation := resolveWorkerPoolConcurrency(svc)","\tlog.Printf(\"asynq shared-pool server starting with concurrency=%d total_upstream=%d\",","\t\tallocation.Shared, allocation.UpstreamTotal())","\treturn newAsynqServer(allocation.Shared, types.QueueWeightsForSharedPool())","}","","// NewWikiAsynqServer builds the dedicated wiki pool: QueueWiki only. It runs","// the shared handler mux but only ever pulls wiki tasks, so its concurrency","// budget (WEKNORA_WIKI_ASYNQ_CONCURRENCY, default 8) is spent exclusively on","// wiki generation. This is the hard capacity isolation that prevents the parse","// pipeline from starving wiki (and vice-versa) during concurrent uploads.","func NewWikiAsynqServer(svc interfaces.SystemSettingService) *asynq.Server {","\tconcurrency := resolveWorkerPoolConcurrency(svc).Wiki","\tlog.Printf(\"asynq wiki-pool server starting with concurrency=%d\", concurrency)","\treturn newAsynqServer(concurrency, types.QueueWeightsForPool(types.WorkerPoolWiki))","}","","func RunAsynqServer(params AsynqTaskParams) *asynq.ServeMux {","\t// Create a new mux and register all handlers","\tmux := asynq.NewServeMux()","","\t// Install the dead-letter middleware FIRST so it sees the raw error","\t// returned by the handler, before any other middleware that might","\t// transform it. The middleware records one task_dead_letters row per","\t// task that exhausts its retry budget — operators can then SQL-query","\t// failures by task type, scope, or tenant without scraping logs.","\t// Best-effort: a DB failure is logged and swallowed; the original task","\t// error always propagates upstream to asynq for retry/archival.","\t//","\t// The callback flips Knowledge.parse_status to \"failed\" the moment a","\t// document-related task exhausts its retry budget. Without this hook,","\t// a permanently-failing task left its parent knowledge stranded in","\t// \"processing\" until housekeeping cron caught it minutes later — the","\t// UI signal users actually see.","\tknowledgeFailer := newDeadLetterKnowledgeFailer(params.KnowledgeService, params.SpanTracker)","\tmux.Use(asynqdl.MiddlewareWithCallback(params.DeadLetterRepo, knowledgeFailer))","\tmux.Use(asynqdl.RecoverMiddleware())","","\t// Mark every asynq worker execution as a background task so the chat","\t// concurrency governor throttles ingestion/enrichment LLM traffic while","\t// leaving user-facing interactive chat ungated. Installed early so all","\t// downstream handlers (and their model calls) inherit the flag.","\tmux.Use(backgroundTaskMiddleware())"]},{"id":"fd4_post","path":"internal/application/service/knowledge_post_process.go","sliceStart":82,"sliceEnd":120,"label":"knowledge_post_process.go","relPath":"internal/application/service/knowledge_post_process.go","startLine":82,"endLine":120,"lines":["// Handle implements asynq handler for TypeKnowledgePostProcess.","func (s *KnowledgePostProcessService) Handle(ctx context.Context, task *asynq.Task) error {","\tvar payload types.KnowledgePostProcessPayload","\tif err := json.Unmarshal(task.Payload(), &payload); err != nil {","\t\treturn fmt.Errorf(\"unmarshal knowledge post process payload: %w\", err)","\t}","","\tlogger.Infof(ctx, \"[KnowledgePostProcess] Orchestrating post processing for knowledge: %s\", payload.KnowledgeID)","","\tctx = types.WithExecutionTenant(ctx, payload.TenantID)","\tif payload.Language != \"\" {","\t\tctx = context.WithValue(ctx, types.LanguageContextKey, payload.Language)","\t}","","\t// 1. Fetch Knowledge and KB","\tknowledge, err := s.knowledgeRepo.GetKnowledgeByIDOnly(ctx, payload.KnowledgeID)","\tif err != nil {","\t\treturn fmt.Errorf(\"get knowledge %s: %w\", payload.KnowledgeID, err)","\t}","\tif knowledge == nil {","\t\tlogger.Warnf(ctx, \"[KnowledgePostProcess] Knowledge %s not found, aborting.\", payload.KnowledgeID)","\t\treturn nil","\t}","","\tif err := validateProcessingKnowledge(knowledge,","\t\tpayload.TenantID,","\t\tpayload.KnowledgeBaseID,","\t\tpayload.KnowledgeID); err != nil {","\t\treturn err","\t}","\tkb, err := s.kbService.GetKnowledgeBaseByIDOnly(ctx, payload.KnowledgeBaseID)","\tif err != nil || kb == nil {","\t\treturn fmt.Errorf(\"get knowledge base %s: %w\", payload.KnowledgeBaseID, err)","\t}","","\tif kb.ID != payload.KnowledgeBaseID || kb.TenantID != payload.TenantID {","\t\treturn fmt.Errorf(\"postprocess task KB owner changed: %w\", asynq.SkipRetry)","\t}","\tctx, err = access.WithKBTaskWrite(ctx, kb, payload.TenantID)"]},{"id":"fd4_wiki","path":"internal/application/service/wiki_ingest.go","sliceStart":31,"sliceEnd":90,"label":"wiki_ingest.go","relPath":"internal/application/service/wiki_ingest.go","startLine":31,"endLine":90,"lines":["// ErrWikiIngestConcurrent is returned by the wiki ingest handler in Lite mode","// when another batch is already running for the same KB (the in-process","// liteLocks guard is held). The asynq/sync executor's RetryDelayFunc uses","// errors.Is on this sentinel to apply a short, fixed retry delay instead of","// exponential backoff, so the deferred batch retries promptly once the active","// one releases. Standard (Redis) mode no longer takes an exclusive per-KB","// lock (Phase 3) and never returns this.","var ErrWikiIngestConcurrent = errors.New(\"concurrent wiki task active\")","","const (","\t// maxContentForWiki limits the document content sent to LLM for wiki generation","\tmaxContentForWiki = 32768","","\t// --- Phase 3: concurrent per-KB batches (standard/Redis mode) ---------","\t//","\t// Phase 3 removed the exclusive per-KB Redis \"batch in progress\" lock","\t// (wiki:active:<kbID>). Standard mode now allows concurrent batches for","\t// one KB, kept safe by row claiming (claimPendingList) plus per-slug","\t// reduce locks (withSlugLock). Lite mode still serializes per KB via the","\t// in-process liteLocks map.","\t//","\t// wikiClaimStaleAfter is how long a claimed-but-undrained ingest row","\t// waits before another worker may re-claim it. It MUST exceed the asynq","\t// task Timeout for wiki:ingest (60m) so a still-running batch's rows are","\t// never stolen mid-flight — only genuinely crashed/abandoned claims are","\t// recovered. This preserves the pre-claim crash behaviour where a dead","\t// batch's undeleted rows were simply re-peeked by the next trigger.","\twikiClaimStaleAfter = 90 * time.Minute","","\t// wikiSlugLockPrefix guards read-modify-write on a single shared wiki","\t// page (entity/concept/summary/index) so two concurrent batches for the","\t// same KB can't lost-update the same slug. Key: wiki:slug:{kbID}:{slug}.","\twikiSlugLockPrefix = \"wiki:slug:\"","","\t// wikiIdentityClaimPrefix reserves the slug chosen for one normalized","\t// (page type, display title) identity while concurrent map phases are","\t// still running. The existing per-slug lock cannot help when two models","\t// emit different slugs for the same title, because those reducers lock","\t// different keys. A short-lived identity claim makes both batches use","\t// the same slug before summaries and page updates are materialized.","\twikiIdentityClaimPrefix = \"wiki:identity:\"","\twikiIdentityClaimTTL    = 2 * time.Hour","\t// wikiIdentityClaimScript atomically GET-or-SET (or overwrite when","\t// ARGV[3] is \"1\"). A valid existing slug wins and has its TTL refreshed.","\t// Missing or corrupt values are replaced so callers cannot diverge on a","\t// dirty key. KEYS[1]=claim key; ARGV = proposed slug, TTL seconds,","\t// authoritative (\"0\"/\"1\"), required slug prefix.","\twikiIdentityClaimScript = `","local proposed = ARGV[1]","local ttl = tonumber(ARGV[2])","local prefix = ARGV[4]","if ARGV[3] == '1' then","  redis.call('SET', KEYS[1], proposed, 'EX', ttl)","  return proposed","end","local existing = redis.call('GET', KEYS[1])","if type(existing) == 'string' and string.sub(existing, 1, #prefix) == prefix then","  redis.call('EXPIRE', KEYS[1], ttl)","  return existing","end"]}],"steps":[{"id":"sd4_1","order":1,"type":"messagebus","label":"6 物理 Worker 池","sublabel":"core/post/enrich/maint/shared/wiki","tag":"硬隔离防饿死","edgeLabel":"扇出","fileId":"fd4_task","startLine":172,"endLine":255,"explain":"拆为 6 个独立 `asynq.Server` 保证各负载保底并发，外加 `SharedServer` 靠 Redis 原子出队弹性借用空闲槽位；并用 `backgroundTaskMiddleware` 标记后台任务供外层模型限流隔离。","pitfall":"单池权重队列在长任务占满槽位时依然会饿死轻量任务，物理分池才是硬解法！"},{"id":"sd4_2","order":2,"type":"backend","label":"后处理属主校验扇出","sublabel":"防跨库移动竞态 · SkipRetry","tag":"安全编排","edgeLabel":"三层锁","fileId":"fd4_post","startLine":82,"endLine":120,"explain":"`KnowledgePostProcessService` 校验知识与 KB 租户归属未被中途移动或删除（变化则 `SkipRetry` 立即终止），再扇出摘要/问题/图谱/多模态/Wiki 增强任务。","pitfall":"文档被删或被移走后若继续重试后处理任务，会产生大量无效错误日志和死信噪音。"},{"id":"sd4_3","order":3,"type":"database","label":"Wiki 三层并发锁","sublabel":"90m认领 + Lua身份 + Slug锁","tag":"防重页覆盖","edgeLabel":"","fileId":"fd4_wiki","startLine":31,"endLine":90,"explain":"① `90m` 行认领（`>60m` 超时）允许同 KB 多批并发且只回收崩溃孤儿；② Map 阶段 Redis Lua 原子把同一概念不同英文 slug 归一到首个胜出 slug；③ Reduce 阶段单 slug 锁保护写回。","pitfall":"Lite 锁冲突特化 15s 固定退避而非指数退避，防止锁释放后白等 7–10 分钟！"}],"quiz":{"question":"多个 Worker 并发将文档蒸馏进同一 Wiki 时，为什么单有 `wiki:slug` 写锁还不够，必须前置 Redis Lua 原子身份声明脚本？","options":["因为 Redis 写锁不支持并发读","两个并发 LLM 可能给同一概念生成不同的英文 slug，导致各自锁住不同 key 建出重复页面；Lua 脚本按标准化标题原子收敛到唯一胜出 slug","为了绕过 PostgreSQL 事务","Lua 脚本用来替代 Embedding 模型"],"correctIndex":1,"explanation":"完美！这正是分布式 + 大模型不确定性碰撞出的经典架构解法，面试讲出来极度加分！"},"interviewQ":"大批量上传导致异步任务堆积、多 Worker 并发蒸馏 Wiki 冲突，WeKnora 是怎么系统性治理的？","interviewA":"调度层拆 6 个物理 Asynq 池给解析/后处理/增强/维护/Wiki 保底容量并用 `SharedServer` 弹性补位，后台任务打标与在线问答做模型限流隔离；Wiki 并发蒸馏用 90m 行认领回收孤儿、Map 阶段 Redis Lua 按概念标题原子归一 slug 防重页、Reduce 阶段单 slug 锁防覆盖。","whyBlock":{"painPoint":"三个高并发线上大坑集中在这一站：① 客户一口气上传 50 本 500 页 PDF，把异步队列全占满，轻量的后处理与 Wiki 蒸馏全部被饿死；② 多个 Worker 并发将文档蒸馏成 Wiki 时，两个 LLM 给同一概念起了不同的英文 slug，生出两张重复页面；③ 某个蒸馏 Worker 崩溃了，占着的数据库任务行永远卡死在「处理中」！","analogy":"① **Asynq 6 池物理隔离**就像高速公路设「货车道 + 应急车道 + 专车道 + 潮汐车道（`SharedServer`）」：大货车（长 PDF 解析）堵满货车道，救护车（后处理扇出）和 Wiki 专车照样畅通！② **Wiki 三层锁**就像多人合写百科全书：先领 90 分钟借书牌（行认领防崩溃滞留）→ 词条先去总编那领唯一编号（Redis Lua 原子身份声明防重页）→ 写某一页时锁住该页（单 slug 写锁防覆盖）！","avoidRabbitHole":"不必死背 6 个队列各自的默认并发数（都支持环境变量动态调优）！重点吃透三件事：① 为什么单个加权队列防不住长 PDF 饥饿、必须物理拆 Server；② `knowledge_post_process.go` 如何把一次入库扇出为多个独立增强任务；③ `wiki_ingest.go` 的三层并发锁（行认领 + Lua 身份声明 + 单页锁）各自防什么故障！"},"ioContract":{"inType":"Asynq `knowledge:post_process` 扇出任务 + 文档全部已落库 Chunks","inFields":[{"name":"knowledge_id / kb_id","type":"string","desc":"已完成基础解析的文档与所属知识库"},{"name":"enable_summary / graph / wiki","type":"bool","desc":"知识库级后处理开关（决定扇出哪些异步增强任务）"},{"name":"worker_pool","type":"enum","desc":"物理隔离池：`doc_parse` / `post_process` / `enrich` / `wiki` / `maintenance` / `shared`"}],"inSample":"{\n  \"queue\": \"post_process\",\n  \"knowledge_id\": \"doc_travel_2026\",\n  \"kb_id\": \"kb_finance_2026\",\n  \"fanout_flags\": {\n    \"generate_summary\": true,\n    \"extract_graph\": true,\n    \"distill_wiki\": true,\n    \"extract_memory\": false\n  }\n}","transformSteps":["`task.go` 启动 6 个物理隔离 Asynq Server（外加死信 Handler 兜底），长耗时 PDF 绝不阻塞轻量后处理与 Wiki 池","`knowledge_post_process.go` 按知识库开关扇出独立子任务（摘要生成、实体图谱抽取、FAQ 问题生成、Wiki 蒸馏）","`wiki_ingest.go` 执行三层并发防重：① DB 行认领（90min 租约防僵尸）→ ② Redis Lua 原子声明概念 slug 映射防重页 → ③ 单 slug 写锁原子递增 Wiki 版本号落库"],"outType":"多维知识资产落库（文档摘要 + Neo4j 图谱三元组 + 版本化 Wiki 页面）","outFields":[{"name":"summary_chunk","type":"string","desc":"LLM 生成的文档级结构化摘要（回写检索索引）"},{"name":"graph_triples","type":"[]Triple","desc":"抽取的 `(实体, 关系, 实体)` 写入图谱库支持关联跳查"},{"name":"wiki_page","type":"types.WikiPage","desc":"版本递增的百科词条（带来源引用列表与 `version` 乐观锁）"}],"outSample":"{\n  \"knowledge_id\": \"doc_travel_2026\",\n  \"summary\": \"规定了 2026 年一/二/三线城市住宿、交通与旺季例外审批标准。\",\n  \"graph_triples_added\": 14,\n  \"wiki_distilled\": {\n    \"slug\": \"travel-lodging-policy-2026\",\n    \"version\": 3,\n    \"lua_identity_claim\": \"OK (reused existing slug)\",\n    \"source_knowledges\": [\"doc_travel_2026\", \"doc_finance_faq\"]\n  }\n}"}},{"id":"d5","flowId":"flow_ingest","stage":4,"row":0,"dfNodeId":"wiki_console","techCompIds":["rdb","asynq_pools"],"wbTarget":{"moduleId":"ingest","nodeId":"in_dlq"},"codeLabel":"2-5","title":"进度面板与死信回调：消灭僵尸 processing 文档的闭环可观测","dfLabel":"Wiki 与进度面板","dfSublabel":"知识图谱 · Spans · 死信","dfTag":"运维可观测","nodeType":"frontend","stars":4,"duration":"12 分钟","inputSpec":"持续推进的异步解析/后处理/Wiki 阶段 Span，或耗尽重试次数的彻底失败任务","outputSpec":"平台级进度面板实时透视阶段耗时与历史死信档案；任务彻底失败即时翻转父文档为 `failed` 绝不永转圈！","packetSample":"DocumentProgress { parse_status: \"failed\", attempt: 2, stages: [{ name: \"parse\", status: \"done\" }, { name: \"postprocess\", status: \"failed\" }], failures: 1 }","analogy":"就像**快递物流全链路追踪 + 丢件秒级理赔通知**：每一站扫码耗时一目了然（`DocumentStageProgress`），一旦某单彻底派送失败（重试耗尽进死信），系统不等月底盘点，立刻把订单翻成“失败”并附上原因（`newDeadLetterKnowledgeFailer`），同时核对单号绝不误伤用户重新下的新单！","files":[{"id":"fd5_prog","path":"internal/application/service/document_progress.go","sliceStart":36,"sliceEnd":93,"label":"document_progress.go","relPath":"internal/application/service/document_progress.go","startLine":36,"endLine":93,"lines":["// Valid bounds pagination and search work for this platform-wide view.","func (f DocumentProgressFilter) Valid() bool {","\treturn f.Page >= 1 && f.Page <= 10000 && f.PageSize >= 1 && f.PageSize <= 100 &&","\t\tutf8.RuneCountInString(f.Search) <= 200 && len(f.KnowledgeBaseID) <= 64 &&","\t\t(f.Status == \"all\" || f.Status == \"unfinished\" || f.Status == \"failed\" || f.Status == \"completed\")","}","","// DocumentStageProgress contains metadata only; span prompts and outputs stay private.","type DocumentStageProgress struct {","\tName       string     `json:\"name\"`","\tStatus     string     `json:\"status\"`","\tErrorCode  string     `json:\"error_code,omitempty\"`","\tFinishedAt *time.Time `json:\"finished_at,omitempty\"`","}","","// DocumentProgress separates document ingestion, Wiki work, and historical failures.","type DocumentProgress struct {","\tID                string                  `json:\"id\"`","\tTenantID          uint64                  `json:\"tenant_id\"`","\tKnowledgeBaseID   string                  `json:\"knowledge_base_id\"`","\tKnowledgeBaseName string                  `json:\"knowledge_base_name\"`","\tTitle             string                  `json:\"title\"`","\tParseStatus       string                  `json:\"parse_status\"`","\tIngestionStatus   string                  `json:\"ingestion_status\"`","\tAttempt           int                     `json:\"attempt\"`","\tWikiStatus        string                  `json:\"wiki_status\"`","\tWikiPending       int64                   `json:\"wiki_pending\"`","\tWikiRetries       int                     `json:\"wiki_retries\"`","\tFailureCount      int64                   `json:\"failure_count\"`","\tCanStart          bool                    `json:\"can_start\"`","\tStages            []DocumentStageProgress `json:\"stages\" gorm:\"-\"`","\tUpdatedAt         time.Time               `json:\"updated_at\"`","\twikiEnabled       bool","}","","// DocumentProgressResponse is one page of durable document metadata.","type DocumentProgressResponse struct {","\tDocuments []DocumentProgress `json:\"documents\"`","\tTotal     int64              `json:\"total\"`","\tPage      int                `json:\"page\"`","\tPageSize  int                `json:\"page_size\"`","}","","// DocumentFailure is a bounded projection of an immutable dead-letter record.","type DocumentFailure struct {","\tID        int64     `json:\"id\"`","\tTaskType  string    `json:\"task_type\"`","\tLastError string    `json:\"last_error\"`","\tFailCount int       `json:\"fail_count\"`","\tFailedAt  time.Time `json:\"failed_at\"`","}","","// DocumentProgressDetail keeps current stages separate from the original failure archive.","type DocumentProgressDetail struct {","\tDocument        DocumentProgress  `json:\"document\"`","\tFailures        []DocumentFailure `json:\"failures\"`","\tHasMoreFailures bool              `json:\"has_more_failures\"`","}"]},{"id":"fd5_dlq","path":"internal/router/task.go","sliceStart":372,"sliceEnd":452,"label":"router/task.go (死信回调)","relPath":"internal/router/task.go","startLine":372,"endLine":452,"lines":["var taskTypesAffectingKnowledgeStatus = map[string]struct{}{","\ttypes.TypeDocumentProcess:      {},","\ttypes.TypeKnowledgePostProcess: {},","\ttypes.TypeManualProcess:        {},","}","","// newDeadLetterKnowledgeFailer returns the callback wired into the asynq","// dead-letter middleware. When a document-related task exhausts its retry","// budget, this callback marks the corresponding Knowledge row as failed so","// the UI surfaces the error instead of a perpetual spinner.","//","// All work is best-effort: missing payload, missing knowledge_id, or DB","// errors are logged and swallowed. The dead-letter record is the source of","// truth — this is purely a UX shortcut so users don't wait for the","// housekeeping cron's next sweep.","func newDeadLetterKnowledgeFailer(ks interfaces.KnowledgeService, tracker service.SpanTracker) asynqdl.OnDeadLetter {","\tif ks == nil {","\t\treturn nil","\t}","\trepo := ks.GetRepository()","\tif repo == nil {","\t\treturn nil","\t}","\treturn func(ctx context.Context, t *asynq.Task, taskErr error) {","\t\tif t == nil || taskErr == nil || errors.Is(taskErr, asynq.SkipRetry) {","\t\t\treturn","\t\t}","\t\tif t.Type() == types.TypeKnowledgeListDelete {","\t\t\tmarkKnowledgeListDeleteFailed(ctx, repo, t, taskErr)","\t\t\treturn","\t\t}","\t\tif _, ok := taskTypesAffectingKnowledgeStatus[t.Type()]; !ok {","\t\t\treturn","\t\t}","\t\tvar probe deadLetterKnowledgePayload","\t\tif err := json.Unmarshal(t.Payload(), &probe); err != nil || probe.KnowledgeID == \"\" ||","\t\t\tprobe.KnowledgeBaseID == \"\" ||","\t\t\tprobe.TenantID == 0 {","\t\t\treturn","\t\t}","\t\trow, err := repo.GetKnowledgeByID(ctx, probe.TenantID, probe.KnowledgeID)","\t\tif err != nil || row == nil || row.ID != probe.KnowledgeID || row.TenantID != probe.TenantID ||","\t\t\trow.KnowledgeBaseID != probe.KnowledgeBaseID {","\t\t\treturn","\t\t}","\t\tswitch row.ParseStatus {","\t\tcase types.ParseStatusPending, types.ParseStatusProcessing, types.ParseStatusFinalizing:","\t\tdefault:","\t\t\treturn","\t\t}","\t\t// The row belongs to a newer run (a reparse cancelled this task or","\t\t// raced it): failing it would kill a run that is still healthy.","\t\tif tracker != nil && probe.Attempt > 0 &&","\t\t\ttracker.LatestAttempt(ctx, probe.KnowledgeID) > probe.Attempt {","\t\t\tlogger.Infof(ctx, \"dead-letter callback: attempt %d of knowledge %s superseded, leaving row alone\",","\t\t\t\tprobe.Attempt, probe.KnowledgeID)","\t\t\treturn","\t\t}","\t\terrMsg := truncateKnowledgeErrorMessage(\"task \" + t.Type() + \" exhausted retries: \" + taskErr.Error())","\t\tbefore, after := *row, *row","\t\tafter.ParseStatus = types.ParseStatusFailed","\t\tafter.ErrorMessage = errMsg","\t\tif err := repo.UpdateKnowledgeForTransfer(ctx, &before, &after); err != nil {","\t\t\tlogger.Warnf(","\t\t\t\tctx,","\t\t\t\t\"dead-letter callback: knowledge %s changed or failed to update: %v\",","\t\t\t\tprobe.KnowledgeID,","\t\t\t\terr,","\t\t\t)","\t\t\treturn","\t\t}","\t\t// Close the matching root span so the timeline stops showing","\t\t// \"进行中\" after dead-letter exhaustion. Best-effort: nil","\t\t// tracker / missing attempt / missing root all no-op cleanly.","\t\tif tracker != nil && probe.Attempt > 0 {","\t\t\ttracker.FinalizeAttempt(ctx, probe.KnowledgeID, probe.Attempt,","\t\t\t\ttypes.SpanStatusFailed, nil, \"TASK_TIMEOUT\", errMsg)","\t\t}","\t\tlogger.Infof(ctx, \"dead-letter callback: marked knowledge %s as failed (task=%s)\", probe.KnowledgeID, t.Type())","\t}","}"]}],"steps":[{"id":"sd5_1","order":1,"type":"frontend","label":"阶段 Span 聚合视图","sublabel":"复用持久表 · 零额外存储","tag":"运维面板","edgeLabel":"重试耗尽","fileId":"fd5_prog","startLine":36,"endLine":93,"explain":"`DocumentProgressService` 直接联合已有持久化任务表与死信表投影出平台级文档进度，严格校验分页边界且只暴露元数据（绝不泄露私有 Prompt/输出内容）。","pitfall":"进度查询独立于易失的实时 Redis 队列，哪怕 Redis 重启历史失败档案依然可查。"},{"id":"sd5_2","order":2,"type":"security","label":"死信回调即时标 Failed","sublabel":"终态任务白名单 · 消僵尸","tag":"状态一致","edgeLabel":"防误杀","fileId":"fd5_dlq","startLine":372,"endLine":421,"explain":"仅对会导致父文档卡死的终态任务（`DocumentProcess`/`PostProcess`/`ManualProcess`）触发失败翻转；单张图片失败不在此列（由最后一次重试收口），避免误伤仍可完成的文档。","pitfall":"死信回调全链路 Best-Effort：即使写库瞬断也绝不吞掉原错误，确保 Asynq 正常归档。"},{"id":"sd5_3","order":3,"type":"security","label":"Attempt 校验防误杀新跑","sublabel":"LatestAttempt > probe.Attempt","tag":"并发安全","edgeLabel":"","fileId":"fd5_dlq","startLine":422,"endLine":452,"explain":"标记失败前检查 `tracker.LatestAttempt > probe.Attempt`：如果用户已发起新一轮健康的重解析，老任务的死信回调必须静默放手，最后同步关闭对应 Root Span 终结“进行中”！","pitfall":"🎉 恭喜通关「主线二 · 文档上传到 Wiki 与可观测」离线全链路！接下来进入最具差异化的主线三：Agent 与零明文安全！"}],"quiz":{"question":"在 `router/task.go` 的死信回调 `newDeadLetterKnowledgeFailer` 中，为什么标记文档 `failed` 之前必须判断 `tracker.LatestAttempt(ctx, id) > probe.Attempt`？","options":["因为 Attempt 越大失败率越高","防止已经过时的旧解析任务耗尽重试进入死信时，把用户刚重新发起且正在健康运行的新一轮重解析文档误标为 failed","为了只记录奇数次失败","因为数据库不允许更新 Attempt=1 的行"],"correctIndex":1,"explanation":"太细了！分布式异步系统里，“旧任务的失败回调不能杀死新任务的状态”是必须牢记的一条铁律。"},"interviewQ":"异步任务队列耗尽重试后，如何消除前端永远转圈的“僵尸处理中”文档，同时避免并发重解析误杀？","interviewA":"在 Asynq 最外层挂载 `asynqdl.MiddlewareWithCallback`，耗尽重试写 `task_dead_letters` 表供进度面板排查，并对终态任务类型触发回调即时翻转父 `Knowledge.parse_status = failed` 并关闭 Root Span；翻转前严格比对 `LatestAttempt > probe.Attempt`，确保旧任务死信绝不误杀已启动的新重解析。","whyBlock":{"painPoint":"文档上传后要经历「上传 → 解析 → 分块 → 向量化 → 摘要 → 图谱 → Wiki」7 个异步阶段，如果前端只看到一个「处理中」转圈圈，用户根本不知道卡在哪一步；更致命的是如果某个任务在 Asynq 重试耗尽进入死信（Archived），如果不主动回写数据库，前端文档状态就会**永远僵尸卡死在「解析中」**！","analogy":"就像**快递全链路物流面板 + 丢件自动退款**：每个中转站（解析/向量/摘要/Wiki）扫码都会点亮独立进度节点（`document_progress.go`）；一旦快递车半路彻底抛锚且重试 3 次失败（进入死信），最外层死信回调（`ErrorHandler`）会立刻主动把运单标为「异常失败并附原因」，绝不让客户页面永远显示「派送中」！","avoidRabbitHole":"不需要把前端每个进度条组件 CSS 都看完！本站紧盯两个后端真相来源：`document_progress.go` 如何从多张表聚合实时进度视图，以及 `task.go`（L372–L452）如何把死信回调挂载在中间件最外层以彻底消灭僵尸状态。"},"ioContract":{"inType":"GET /api/v1/knowledges/:id/progress 轮询 + Asynq 重试耗尽回调 `ErrorHandler`","inFields":[{"name":"knowledge_id","type":"string","desc":"查询进度的文档 ID（或死信回调负载中的文档 ID）"},{"name":"retried / max_retry","type":"int / int","desc":"Asynq 任务已重试次数与最大上限，相等时判定为终态死信"},{"name":"last_error","type":"error","desc":"导致任务彻底失败的底层错误信息（如解析超时/模型配额耗尽）"}],"inSample":"{\n  \"query_api\": \"GET /api/v1/knowledges/doc_travel_2026/progress\",\n  \"dead_letter_trigger_example\": {\n    \"task_type\": \"document:process\",\n    \"knowledge_id\": \"doc_broken_scan\",\n    \"retried\": 3,\n    \"max_retry\": 3,\n    \"err\": \"docreader gRPC deadline exceeded after 180s\"\n  }\n}","transformSteps":["`document_progress.go` 聚合主库文档状态、分块计数、增强任务表与 Wiki 关联表，拼装结构化分阶段进度（含百分比与错误详情）","`task.go` 的死信处理器拦截 `retried >= max_retry` 的终态失败任务，写死信审计表并反向更新 `knowledges.parse_status = failed`","前端知识库面板与运维台据此实时渲染每个子阶段绿灯/红灯，并支持一键针对失败文档发起无感重试"],"outType":"types.DocumentProgress（全阶段可观测进度 JSON）+ 死信终态落库","outFields":[{"name":"overall_status","type":"enum","desc":"`pending` / `processing` / `completed` / `partial_failed` / `failed`"},{"name":"stages","type":"[]StageProgress","desc":"各阶段（解析、分块向量、摘要、图谱、Wiki）独立状态与耗时"},{"name":"error_message","type":"string","desc":"若进入死信，返回可读失败原因供排障与重试"}],"outSample":"{\n  \"knowledge_id\": \"doc_travel_2026\",\n  \"overall_status\": \"completed\",\n  \"progress_percent\": 100,\n  \"stages\": [\n    { \"name\": \"parse_and_chunk\", \"status\": \"completed\", \"chunks\": 34, \"ms\": 2410 },\n    { \"name\": \"vector_index\", \"status\": \"completed\", \"dim\": 1536, \"ms\": 860 },\n    { \"name\": \"summary_and_graph\", \"status\": \"completed\", \"triples\": 14, \"ms\": 3120 },\n    { \"name\": \"wiki_distill\", \"status\": \"completed\", \"slug\": \"travel-lodging-policy-2026\", \"ms\": 4050 }\n  ],\n  \"dead_letter_count\": 0\n}"}},{"id":"a1","flowId":"flow_agent","stage":0,"row":2,"dfNodeId":"cred_input","techCompIds":["qa_agent","sandbox_vault"],"wbTarget":{"moduleId":"agent","nodeId":"ag_exec"},"codeLabel":"3-1","title":"ReAct 引擎入口、安全表单与内置无状态 MCP Server","dfLabel":"用户凭据表单","dfSublabel":"Vault · SecureForm · ReAct","dfTag":"敏感/工具入口","nodeType":"security","stars":5,"duration":"15 分钟","inputSpec":"复杂任务触发 ReAct Agent 多步工具规划，或需登录受保护内网站点弹出安全表单，或外部 IDE 通过 MCP 调用","outputSpec":"无状态 Agent 开启 Langfuse Span 执行规划；安全表单只把不透明句柄还给 LLM；MCP 端点双向白名单受控放行","packetSample":"AgentTool: request_secure_form(site=\"erp.corp\") -> User Submits -> SecureFormAnswer { handle_id: \"sf_h_918a\" } // 零明文！","analogy":"就像**特工借用公司门禁卡**：特工（Agent）要进机房查报表，绝不能把机房密码念给他听（否则全记在笔记本/大模型日志里），而是让你在独立保险箱屏幕输密码，只递给特工一张不写密码的“3 号门禁牌”（不透明句柄）！","files":[{"id":"fa1_eng","path":"internal/agent/engine.go","sliceStart":378,"sliceEnd":445,"label":"agent/engine.go","relPath":"internal/agent/engine.go","startLine":378,"endLine":445,"lines":["// Execute executes the agent with conversation history and streaming output","// All events are emitted to EventBus and handled by subscribers (like Handler layer)","func (e *AgentEngine) Execute(","\tctx context.Context,","\tsessionID, messageID, query string,","\tllmContext []chat.Message,","\timageURLs ...[]string,",") (*types.AgentState, error) {","\tlogger.Infof(ctx, \"[Agent] Starting execution: session=%s, message=%s, query_len=%d, context_msgs=%d\",","\t\tsessionID, messageID, len(query), len(llmContext))","\t// Ensure tools are cleaned up after execution","\tdefer e.toolRegistry.Cleanup(ctx)","","\tcommon.PipelineInfo(ctx, \"Agent\", \"execute_start\", map[string]interface{}{","\t\t\"session_id\":   sessionID,","\t\t\"message_id\":   messageID,","\t\t\"query\":        query,","\t\t\"context_msgs\": len(llmContext),","\t})","","\t// Open a top-level Langfuse span so the agent run — including every","\t// round's LLM call and every tool execution — groups under a single","\t// node in the Langfuse UI instead of being flat children of the HTTP","\t// trace. No-op when Langfuse is disabled.","\timgCount := 0","\tif len(imageURLs) > 0 {","\t\timgCount = len(imageURLs[0])","\t}","\tkbIDs := make([]string, 0, len(e.knowledgeBasesInfo))","\tfor _, kb := range e.knowledgeBasesInfo {","\t\tif kb != nil {","\t\t\tkbIDs = append(kbIDs, kb.ID)","\t\t}","\t}","\tspanCtx, agentSpan := langfuse.GetManager().StartSpan(ctx, langfuse.SpanOptions{","\t\tName: \"agent.execute\",","\t\tInput: map[string]interface{}{","\t\t\t\"query\":        truncateRunes(query, langfuseQueryPreview),","\t\t\t\"query_len\":    len(query),","\t\t\t\"context_msgs\": len(llmContext),","\t\t\t\"image_count\":  imgCount,","\t\t},","\t\tMetadata: map[string]interface{}{","\t\t\t\"session_id\":          sessionID,","\t\t\t\"message_id\":          messageID,","\t\t\t\"max_iterations\":      e.config.MaxIterations,","\t\t\t\"parallel_tool_calls\": e.config.ParallelToolCalls,","\t\t\t\"web_search\":          e.config.WebSearchEnabled,","\t\t\t\"multi_turn\":          e.config.MultiTurnEnabled,","\t\t\t\"knowledge_base_ids\":  kbIDs,","\t\t\t\"allowed_tools\":       e.config.AllowedTools,","\t\t},","\t})","\tctx = spanCtx","","\t// Initialize state","\tstate := &types.AgentState{","\t\tRoundSteps:    []types.AgentStep{},","\t\tKnowledgeRefs: []*types.SearchResult{},","\t\tIsComplete:    false,","\t\tCurrentRound:  0,","\t\t// A turn that measures no scale of its own (no tool call, so no two","\t\t// requests to compare) passes on the one it started from, so the","\t\t// newest turn always carries the latest known scale and the loader","\t\t// never has to look past its first page for one.","\t\tTurnUsage: types.TokenUsage{ContextTokenScale: e.config.ContextTokenScale},","\t}",""]},{"id":"fa1_sf","path":"internal/agent/approval/secure_form.go","sliceStart":14,"sliceEnd":60,"label":"approval/secure_form.go","relPath":"internal/agent/approval/secure_form.go","startLine":14,"endLine":60,"lines":["// SecureFormRequest raises a secure_form prompt.","type SecureFormRequest struct {","\tTenantID           uint64","\tUserID             string","\tSessionID          string","\tAssistantMessageID string","\tRequestID          string","\tToolCallID         string","\tEventBus           *event.EventBus","\tForm               types.SecureFormPromptRequest","\t// Snapshot, when set, lets the run suspend after the hot wait.","\tSnapshot        []byte","\tSnapshotVersion int","}","","// SecureFormAnswer is how a secure_form prompt ended. Response holds a","// handle, never a value the user typed.","type SecureFormAnswer struct {","\towner     string","\tanswered  bool","\tPromptID  string","\tAnswered  bool","\tResponse  types.SecureFormPromptResponse","\tReason    string","\tTimedOut  bool","\tCanceled  bool","\tSuspended *types.PromptSuspension","}","","// SecureFormAsker is the surface the request_secure_form tool uses.","type SecureFormAsker interface {","\tRequestSecureForm(ctx context.Context, req SecureFormRequest) (SecureFormAnswer, error)","\tResumeSecureForm(ctx context.Context, prompt *types.AgentPrompt, bus *event.EventBus) SecureFormAnswer","}","","var _ SecureFormAsker = (*Gate)(nil)","","// RequestSecureForm shows the card and waits for the submission, the","// timeout, or the suspension of the run.","func (g *Gate) RequestSecureForm(ctx context.Context, req SecureFormRequest) (SecureFormAnswer, error) {","\tif g == nil {","\t\treturn SecureFormAnswer{}, fmt.Errorf(\"secure form: nil gate\")","\t}","\tif req.EventBus == nil {","\t\treturn SecureFormAnswer{}, fmt.Errorf(\"secure form: EventBus is nil\")","\t}","\trequest, err := json.Marshal(req.Form)"]},{"id":"fa1_mcp","path":"internal/mcpserver/server.go","sliceStart":108,"sliceEnd":182,"label":"mcpserver/server.go","relPath":"internal/mcpserver/server.go","startLine":108,"endLine":182,"lines":["\ts.mcp = server.NewMCPServer(","\t\tserverName,","\t\tserverVersion,","\t\tserver.WithToolCapabilities(false),","\t\tserver.WithRecovery(),","\t\tserver.WithToolFilter(s.filterTools),","\t\tserver.WithToolHandlerMiddleware(s.guardTool),","\t\tserver.WithInstructions(serverInstructions),","\t)","\ts.mcp.AddTools(s.toolCatalog()...)","\ts.handler = server.NewStreamableHTTPServer(","\t\ts.mcp,","\t\tserver.WithStateLess(true),","\t)","\treturn s","}","","// Handler returns the http.Handler to mount under /mcp/:endpoint_id. The","// caller must run MCPEndpointAuth first; the handler trusts the context.","func (s *Server) Handler() http.Handler {","\treturn s.handler","}","","const serverInstructions = \"WeKnora knowledge workspace. Start with list_knowledge_bases to see what is in scope, \" +","\t\"then use search_knowledge for semantic questions, grep_chunks for exact keywords, read_document to read \" +","\t\"a whole document, and ask to get a synthesized answer with citations. Wiki tools browse the generated \" +","\t\"wiki when a knowledge base has one. Write tools (add/update/delete_document) exist only on endpoints \" +","\t\"that enabled them.\"","","// endpointFromContext returns the endpoint authenticated for this call.","func endpointFromContext(ctx context.Context) (*types.MCPEndpoint, error) {","\tep, ok := ctx.Value(types.MCPEndpointContextKey).(*types.MCPEndpoint)","\tif !ok || ep == nil {","\t\treturn nil, errNoEndpoint","\t}","\treturn ep, nil","}","","// filterTools hides catalog entries the endpoint did not enable.","func (s *Server) filterTools(ctx context.Context, all []mcp.Tool) []mcp.Tool {","\tep, err := endpointFromContext(ctx)","\tif err != nil {","\t\treturn nil","\t}","\tout := make([]mcp.Tool, 0, len(all))","\tfor _, t := range all {","\t\tif ep.HasTool(t.Name) {","\t\t\tout = append(out, t)","\t\t}","\t}","\treturn out","}","","// guardTool enforces the allowlist and rate limit on every tools/call, so a","// client cannot invoke a hidden tool by name.","func (s *Server) guardTool(next server.ToolHandlerFunc) server.ToolHandlerFunc {","\treturn func(ctx context.Context, req mcp.CallToolRequest) (*mcp.CallToolResult, error) {","\t\tep, err := endpointFromContext(ctx)","\t\tif err != nil {","\t\t\treturn mcp.NewToolResultError(\"unauthorized\"), nil","\t\t}","\t\tif !ep.HasTool(req.Params.Name) {","\t\t\treturn mcp.NewToolResultErrorf(\"tool %q is not enabled on this endpoint\", req.Params.Name), nil","\t\t}","\t\tif !s.limiter.Allow(ctx, ep.ID, ep.RateLimitPerMinute) {","\t\t\treturn mcp.NewToolResultError(\"rate limit exceeded for this endpoint, retry shortly\"), nil","\t\t}","\t\ts.touchLastUsed(ctx, ep.ID)","\t\tresult, err := next(ctx, req)","\t\tif err != nil {","\t\t\treturn result, err","\t\t}","\t\treturn s.rewriteResourceURLs(ctx, ep, result), nil","\t}","}"]}],"steps":[{"id":"sa1_1","order":1,"type":"backend","label":"无状态 ReAct 入口","sublabel":"每轮DB重建 · 继承校准比","tag":"水平扩展","edgeLabel":"凭据门禁","fileId":"fa1_eng","startLine":378,"endLine":445,"explain":"`AgentEngine` 跨轮不持内存状态，每轮从 DB 重建历史与 Checkpoint，透传上轮 `ContextTokenScale`，并在 `defer` 释放所有沙箱/MCP/浏览器句柄。","pitfall":"漏写 `defer toolRegistry.Cleanup(ctx)` 会在异常断开时持续泄漏沙箱容器与 MCP 长连接！"},{"id":"sa1_2","order":2,"type":"security","label":"SecureForm 句柄门禁","sublabel":"LLM 永远不见密码明文","tag":"物理隔离","edgeLabel":"对外MCP","fileId":"fa1_sf","startLine":14,"endLine":60,"explain":"安全表单将用户输入通道与对话消息通道物理隔离：用户填写或选用凭据库条目后，回调给 Agent 工具结果的只有 `handle` ID，明文密码永不进入 Prompt、SSE 和聊天表。","pitfall":"同样支持带 `Snapshot` 挂起恢复，避免用户翻密码管理器太久导致连接超时。"},{"id":"sa1_3","order":3,"type":"cloud","label":"内置无状态 Go MCP","sublabel":"list过滤 + call二次强拦","tag":"双向白名单","edgeLabel":"","fileId":"fa1_mcp","startLine":108,"endLine":182,"explain":"单实例注册全量工具目录，`WithStateLess(true)` 支持多副本水平扩展；`filterTools` 隐藏未授权工具，`guardTool` 在调用侧二次验权 + 限流 + 短链重写。","pitfall":"只藏 `tools/list` 不拦 `tools/call` 极度危险——恶意客户端可直接猜工具名强行调用写/删工具！"}],"quiz":{"question":"当 Agent 需要登录受保护业务网站时，`SecureForm` 门禁返回给大模型工具结果的是什么，以保证密码永不泄露给 LLM 供应商？","options":["Base64 编码后的密码字符串","一个不含任何密码内容的不透明句柄 ID（由服务端后续直接与沙箱通信注入）","只隐藏密码前三位，保留后几位","把密码写进 System Prompt 里要求大模型不要说出去"],"correctIndex":1,"explanation":"绝对正确！Base64 不是加密，要求大模型保密更是纸糊防线；只有物理隔离通道 + 句柄化引用才能真正实现零明文！"},"interviewQ":"企业级 Agent 同时面向多副本水平扩展和外部 MCP 客户端开放，入口架构怎么设计？","interviewA":"`AgentEngine` 严格无状态每轮从 DB 重建历史与压缩 Checkpoint 并 `defer` 回收工具句柄；涉及敏感输入走 `SecureForm` 仅回传不透明句柄；对外 MCP Server 采用无状态 Streamable HTTP，配合 `WithToolFilter` + `WithToolHandlerMiddleware` 双向白名单与端点限流。","whyBlock":{"painPoint":"当企业让 ReAct Agent 帮员工登录 OA/ERP 查报表，或者通过内置 MCP Server 对接外部 AI 客户端（如 Cursor/Claude Desktop）时，面临两大棘手痛点：① 如果把网站账号密码直接打在聊天框，密码会永久泄露到 LLM 厂商日志与对话记录中；② Agent 执行高危工具前如何优雅暂停等待人类填表/审批，而不是把敏感凭据暴露给大模型？","analogy":"就像**银行柜台密码键盘**：大堂经理（ReAct Agent）帮你办业务，需要输入银行卡密码时，经理会退后一步把**独立加密密码键盘（`SecureForm`）**推到你面前；你敲完密码直接进银行加密保险柜，系统只回传给经理一张「3 号存包牌（不透明 `credential_id` 句柄）」，经理全程压根看不见你的真实密码！","avoidRabbitHole":"暂时不用逐个翻 `internal/agent/tools/` 里的 50 个具体工具！本站只需看透 `engine.go` 的 ReAct 主循环入口、`secure_form.go` 如何触发加密表单挂起，以及 `mcpserver/server.go` 如何把 WeKnora 自身作为无状态 MCP Server 暴露给外部 Agent。"},"ioContract":{"inType":"ReAct Agent 工具调用触发 / 前端 SecureForm 加密提单 / MCP JSON-RPC 请求","inFields":[{"name":"tool_name","type":"string","desc":"Agent 请求调用的工具（如 `sandbox_browser_login` 或 MCP 工具）"},{"name":"form_schema","type":"[]SecureField","desc":"需用户填写的敏感字段定义（如 `username`, `password`, `target_domain`）"},{"name":"mcp_api_key","type":"Header (string)","desc":"外部 MCP 客户端接入时携带的能力域限定 API Key"}],"inSample":"{\n  \"event\": \"agent.secure_form_required\",\n  \"run_id\": \"run_ag_5512\",\n  \"tool_call\": {\n    \"id\": \"call_01\",\n    \"name\": \"sandbox_browser_login\",\n    \"args\": { \"url\": \"https://oa.corp.internal/login\" }\n  },\n  \"secure_form_fields\": [\n    { \"key\": \"username\", \"label\": \"内网工号\", \"secret\": false },\n    { \"key\": \"password\", \"label\": \"登录密码\", \"secret\": true }\n  ]\n}","transformSteps":["`engine.go` 驱动无状态 ReAct 循环，检测到工具需用户敏感凭据或高危授权时中断自动执行","`secure_form.go` 下发安全表单契约给前端弹窗，用户提交的明文直接走受保护 API 进入凭据库封装，**绝不写入对话历史 Messages**","`mcpserver/server.go` 对外部 MCP 客户端执行双向白名单校验，将 WeKnora 知识检索能力以标准 MCP Tool 暴露"],"outType":"待加密封装的个人凭据提单（直连 Vault，LLM 侧仅获得不透明句柄）","outFields":[{"name":"owner_user_id / tenant_id","type":"string / uint64","desc":"凭据强绑定的唯一属主身份（他人不可解）"},{"name":"allowed_domains","type":"[]string","desc":"该凭据仅允许自动填充的合法目标域名白名单（防钓鱼网站套取）"},{"name":"secret_fields","type":"map[string]string","desc":"内存瞬态明文字段，立刻交由下一站 AES-GCM 封装并清零"}],"outSample":"{\n  \"credential_id\": \"cred_88201_oa\",\n  \"tenant_id\": 10042,\n  \"user_id\": \"u_88201\",\n  \"allowed_domains\": [\"oa.corp.internal\"],\n  \"secret_payload_in_memory\": { \"username\": \"roitman\", \"password\": \"<TRANSIENT_RAW_SECRET>\" },\n  \"llm_visible_handle_only\": \"{{secret:cred_88201_oa}}\"\n}"}},{"id":"a2","flowId":"flow_agent","stage":1,"row":2,"dfNodeId":"vault_seal","techCompIds":["sandbox_vault","qa_agent"],"wbTarget":{"moduleId":"security","nodeId":"sec_vault"},"codeLabel":"3-2","title":"AES-GCM 行绑定加密 & ReAct 相邻轮增量 Token 比例校准","dfLabel":"AES-GCM 封装","dfSublabel":"行级绑定 · 增量Token校准","dfTag":"零明文/防爆窗","nodeType":"security","stars":5,"duration":"16 分钟","inputSpec":"用户提交的个人登录凭据 + Agent 多轮执行中不断增长的工具观察上下文","outputSpec":"绑定 `item_id + user_id` 的认证密文（无 AES Key 即禁用）+ 经相邻轮消元校准的精准 `ContextTokenScale`","packetSample":"VaultSeal: AES-256-GCM({ item_id, user_id, password }, SYSTEM_AES_KEY)\nCalibration: ΔProviderTokens(1420) / ΔEstTokens(1180) = 1.20x (clamped [0.3, 3.0])","analogy":"① 凭据密封就像**把钞票连同你的身份证号和保险箱号一起焊死进钢盒**，别人就算把钢盒偷搬进自己家也打不开！② Token 校准就像**用连续两天的行李增重算自家秤的误差**，巧妙避开了行李箱自重（Tool Schemas 压缩）的干扰！","files":[{"id":"fa2_vlt","path":"internal/application/service/credential/vault.go","sliceStart":20,"sliceEnd":99,"label":"credential/vault.go","relPath":"internal/application/service/credential/vault.go","startLine":20,"endLine":99,"lines":["// Owner is whose credentials a call touches. It always comes from the","// authenticated context, never from a request body.","type Owner struct {","\tTenantID uint64","\tUserID   string","}","","// OwnerFromContext returns the signed-in web user acting in person. Embed","// visitors, API keys, IM users and automations own no vault.","func OwnerFromContext(ctx context.Context) (Owner, error) {","\ttenantID, ok := types.TenantIDFromContext(ctx)","\tif !ok || tenantID == 0 {","\t\treturn Owner{}, apperrors.NewUnauthorizedError(\"workspace context is required\")","\t}","\tp, ok := types.PrincipalFromContext(ctx)","\tif !ok || p.Type != types.PrincipalWebUser || p.ActingVia != \"\" {","\t\treturn Owner{}, apperrors.NewForbiddenError(\"only a signed-in user can use saved credentials\")","\t}","\treturn Owner{TenantID: tenantID, UserID: p.StorageID()}, nil","}","","// Available reports whether secrets can be stored. EncryptAESGCM returns its","// input unchanged without a key, so nothing here may run without one.","func Available() bool { return utils.GetAESKey() != nil }","","func errUnavailable() error {","\treturn apperrors.NewServiceUnavailableError(\"saved credentials are not enabled on this server\")","}","","func badRequest(err error) error { return apperrors.NewBadRequestError(err.Error()) }","","// LoginInput is a login to store.","type LoginInput struct {","\tTitle    string","\tSite     string","\tDomains  []string","\tUsername string","\tPassword string","}","","// LoginPatch changes some fields of a saved login. Nil leaves a field as is;","// a non-nil empty Domains resets the list to the site alone.","type LoginPatch struct {","\tTitle    *string","\tDomains  []string","\tUsername *string","\tPassword *string","}","","// Vault stores logins for their owner.","type Vault struct {","\trepo     interfaces.CredentialVaultRepository","\tnow      func() time.Time","\tmaxItems int","}","","// NewVault builds a vault over repo.","func NewVault(repo interfaces.CredentialVaultRepository) *Vault {","\treturn &Vault{repo: repo, now: time.Now, maxItems: types.CredentialVaultMaxItems}","}","","// sealed binds the password to its row so a ciphertext copied onto another","// row does not open.","type sealed struct {","\tItemID   string `json:\"item_id\"`","\tUserID   string `json:\"user_id\"`","\tPassword string `json:\"password\"`","}","","func seal(itemID, userID, password string) (string, error) {","\tkey := utils.GetAESKey()","\tif key == nil {","\t\treturn \"\", errUnavailable()","\t}","\traw, err := json.Marshal(sealed{ItemID: itemID, UserID: userID, Password: password})","\tif err != nil {","\t\treturn \"\", err","\t}","\treturn utils.EncryptAESGCM(string(raw), key)","}"]},{"id":"fa2_cal","path":"internal/agent/calibration.go","sliceStart":42,"sliceEnd":105,"label":"agent/calibration.go","relPath":"internal/agent/calibration.go","startLine":42,"endLine":105,"lines":["","// calibrateEstimator compares this round's request with the previous one and,","// once the turn has enough samples, rescales the estimator and records the","// scale on the turn's usage so the next turn starts from it. messages is the","// transcript whose first e.lastSentMsgCount entries were just sent.","func (e *AgentEngine) calibrateEstimator(","\tctx context.Context, round int, messages []chat.Message, tools []chat.Tool,","\tusage types.TokenUsage, state *types.AgentState,",") {","\tif usage.PromptTokens <= 0 {","\t\treturn","\t}","\tc := &e.calibration","\tsent := e.lastSentMsgCount","\ttoolTokens := e.rawEstimator.EstimateTools(tools)","","\tcomparable := c.prevPrompt > 0 && usage.PromptTokens > c.prevPrompt &&","\t\tc.prevRewrites == e.contextRewrites && c.prevTools == toolTokens &&","\t\tc.prevSent > 0 && c.prevSent < sent && sent <= len(messages)","\tif comparable {","\t\tappended := messages[c.prevSent:sent]","\t\testimated := 0","\t\tfor i := range appended {","\t\t\testimated += e.rawEstimator.EstimateMessage(&appended[i])","\t\t}","\t\tcounted := usage.PromptTokens - c.prevPrompt","\t\tif estimated > 0 && !hasImageParts(appended) {","\t\t\tif ratio := float64(counted) / float64(estimated); ratio >= minPlausibleTokenRatio &&","\t\t\t\tratio <= maxPlausibleTokenRatio {","\t\t\t\tc.provider += float64(counted)","\t\t\t\tc.estimated += float64(estimated)","\t\t\t} else {","\t\t\t\tlogger.Debugf(ctx, \"[Agent][Round-%d][ctx] calibration sample skipped: \"+","\t\t\t\t\t\"provider=%d estimated=%d\", round, counted, estimated)","\t\t\t}","\t\t}","\t}","\tc.prevPrompt, c.prevSent, c.prevTools, c.prevRewrites = usage.PromptTokens, sent, toolTokens, e.contextRewrites","","\tif c.estimated < minCalibrationTokens {","\t\treturn","\t}","\te.tokenEstimator.SetScale(c.provider / c.estimated)","\tstate.TurnUsage.ContextTokenScale = e.tokenEstimator.Scale()","\tlogger.Debugf(ctx, \"[Agent][Round-%d][ctx] token scale %.2f (provider=%.0f estimated=%.0f)\",","\t\tround, state.TurnUsage.ContextTokenScale, c.provider, c.estimated)","}","","// hasImageParts reports whether any message carries an image. Images are","// estimated at a fixed cost while providers bill them by tiles, so a sample","// containing one measures image pricing, not text.","func hasImageParts(messages []chat.Message) bool {","\tfor i := range messages {","\t\tif len(messages[i].Images) > 0 {","\t\t\treturn true","\t\t}","\t\tfor _, part := range messages[i].MultiContent {","\t\t\tif part.ImageURL != nil || part.Type == \"image_url\" {","\t\t\t\treturn true","\t\t\t}","\t\t}","\t}","\treturn false","}"]}],"steps":[{"id":"sa2_1","order":1,"type":"security","label":"Web 真人主体隔离","sublabel":"拒绝 APIKey/Embed/IM","tag":"Fail-Closed","edgeLabel":"行绑定","fileId":"fa2_vlt","startLine":20,"endLine":68,"explain":"`OwnerFromContext` 显式只允许登录 Web 真人用户使用个人凭据库；`Available()` 强校验 `SYSTEM_AES_KEY` 已配置，未配直接返回 503 禁用功能，杜绝明文落库！","pitfall":"通用加密函数在空密钥下可能原样返回，所以业务层必须前置 `Available()` 硬拦截！"},{"id":"sa2_2","order":2,"type":"database","label":"AES-256-GCM 行绑定","sublabel":"密封 {item_id, user_id, pwd}","tag":"防密文移植","edgeLabel":"防爆窗","fileId":"fa2_vlt","startLine":69,"endLine":99,"explain":"`seal()` 把密码与 `item_id`、`user_id` 打包序列化后再做 AES-256-GCM 认证加密，解封时强核对行身份完全匹配，防数据库层密文移植/替换攻击。","pitfall":"单加密密码字段不绑行身份，存在经典“把管理员行密文复制到自己账号行里借接口解密”漏洞！"},{"id":"sa2_3","order":3,"type":"backend","label":"相邻轮增量 Token 校准","sublabel":"消元ToolSchema · 排图片","tag":"0.3x~3.0x","edgeLabel":"","fileId":"fa2_cal","startLine":42,"endLine":105,"explain":"只取同一轮内工具不变、无改写、无图片的相邻两轮请求，拿 `ΔProviderTokens / ΔEstTokens` 校准比例（相同 System Prompt 和 Tool Schemas 自动相消！），累计 ≥256 Token 且在 `[0.3, 3.0]` 才生效。","pitfall":"直接用全量 `PromptTokens / 总估算` 会被 OpenAI 压缩 Tool Schemas 拉偏，导致正文估算严重偏低触发 400 爆窗！"}],"quiz":{"question":"个人凭据保险库（`vault.go`）在将密码用 AES-256-GCM 加密落库时，为什么要把 `item_id` 和 `user_id` 也一起打包密封进密文？","options":["为了让密文看起来更长","防止数据库层“密文移植/替换攻击”——哪怕攻击者把他人行的密文复制到自己行里，解密核验身份不匹配也会直接失败","因为 AES-GCM 要求明文必须包含数字","用来替代数据库主键索引"],"correctIndex":1,"explanation":"完美！这正是密码学工程中的绑定上下文（Context Binding / Row Binding）最佳实践！"},"interviewQ":"凭据落库怎么防密文移植？多厂商大模型下 Agent 上下文怎么精准估算 Token 不爆窗？","interviewA":"凭据加密把 `{item_id, user_id, password}` 行身份一并经 `SYSTEM_AES_KEY` 做 AES-256-GCM 密封且无密钥直接禁用；Token 估算用相邻两轮请求增量比值 `ΔProvider/ΔEst` 动态校准（排除图片与改写轮、限 `[0.3, 3.0]`），自动消元 Tool Schemas 压缩偏差。","whyBlock":{"painPoint":"这一站藏着两个让企业级 Agent 上线后瞬间翻车的硬核痛点：① 普通 AES 加密只加密内容不绑定「行身份」，黑客或越权 DBA 若把用户 A 的密文直接复制到用户 B 的数据库行里（密文嫁接攻击），系统会傻傻帮用户 B 解密出 A 的密码！② Agent 多轮调用工具时，不同模型分词器差异 + Tool Schema 自重会让本地 Token 估算差一倍，导致突然 400 爆窗中断！","analogy":"① **AES-GCM 行绑定加密（AAD）**就像把保险箱焊死在你的「身份证号 + 租户号 + 凭据 ID」上：就算小偷把整个保险箱搬进自己家，箱门一核对户主身份证对不上，当场锁死报错！② **相邻轮增量 Token 校准**就像旅行称行李：称相邻两天新塞进去的衣服重量变化，精准算出家里秤和机场秤的误差系数（避开固定行李箱自重 Tool Schemas 干扰），永远提前精准预警防超重！","avoidRabbitHole":"密码学底层不必手推 Galois 域数学公式！本站重点抓牢两个工程设计：`vault.go` 如何把 `tenant_id|user_id|cred_id` 塞入 AES-256-GCM 的 `AdditionalData (AAD)` 防密文嫁接，以及 `calibration.go` 为什么必须用「相邻两轮增量 Δ」而不是「绝对总量」来算校准因子。"},"ioContract":{"inType":"瞬态明文凭据 Map + ReAct 上下文相邻两轮 Usage 统计","inFields":[{"name":"plaintext_json","type":"[]byte","desc":"待封装的凭据字段 JSON 字节流（仅存活于本函数栈帧）"},{"name":"aad_tuple","type":"string","desc":"行绑定附加认证数据：`tenantID + \":\" + userID + \":\" + credID`"},{"name":"prev_usage / curr_usage","type":"TokenUsage","desc":"上一轮与本轮 LLM API 返回的真实 `PromptTokens`，用于增量校准"}],"inSample":"{\n  \"vault_encrypt_in\": {\n    \"master_key_bits\": 256,\n    \"aad\": \"10042:u_88201:cred_88201_oa\",\n    \"plaintext_bytes\": 54\n  },\n  \"token_calibration_in\": {\n    \"prev_actual_prompt_tokens\": 14200,\n    \"curr_actual_prompt_tokens\": 18600,\n    \"delta_actual\": 4400,\n    \"delta_local_estimated\": 3520\n  }\n}","transformSteps":["`vault.go` 生成 12 字节随机 Nonce，以 `tenant_id:user_id:cred_id` 作为 AAD 执行 AES-256-GCM 认证加密，产出含认证标签的密文包","若任何一字节密文被篡改或被复制到其他用户行，解密时 GCM Tag 校验必然失败（零宽容防密文嫁接）","`calibration.go` 用相邻两轮增量比 `delta_actual / delta_estimated = 1.25` 平滑更新校准系数（并设安全上下界），避免首轮静态 Tool Schema 扭曲估算"],"outType":"AES-GCM 认证密文记录（可安全落库）+ 校准后剩余上下文窗口预算","outFields":[{"name":"ciphertext_b64","type":"string","desc":"含随机 Nonce + 密文 + 16B AuthTag 的加密载荷（库内零明文）"},{"name":"calibrated_factor","type":"float64","desc":"平滑更新后的模型 Token 估算修正系数（如 `1.25`）"},{"name":"need_compaction","type":"bool","desc":"校准估算逼近上下文阈值时置 `true`，触发下一站保对压缩"}],"outSample":"{\n  \"vault_sealed_row\": {\n    \"id\": \"cred_88201_oa\",\n    \"tenant_id\": 10042,\n    \"user_id\": \"u_88201\",\n    \"nonce_len\": 12,\n    \"ciphertext_b64\": \"9xK2mP7vQ1...== (AES-256-GCM + AAD Bound)\"\n  },\n  \"calibration_out\": {\n    \"ratio_sample\": 1.25,\n    \"smoothed_factor\": 1.18,\n    \"estimated_next_prompt_tokens\": 96400,\n    \"window_limit\": 128000,\n    \"trigger_compaction\": true\n  }\n}"}},{"id":"a3","flowId":"flow_agent","stage":2,"row":2,"dfNodeId":"vault_db","techCompIds":["rdb","qa_agent"],"wbTarget":{"moduleId":"agent","nodeId":"ag_cut"},"codeLabel":"3-3","title":"加密凭据双库迁移 & 上下文保对切分压缩 Checkpoint","dfLabel":"加密凭据库","dfSublabel":"credential_vault · cutpoint","dfTag":"仅本人可读","nodeType":"database","stars":5,"duration":"14 分钟","inputSpec":"已封装的密文记录落双库持久化 + 接近上下文窗口上限的 Agent 多工具长对话历史","outputSpec":"PG/SQLite 软删除部分唯一索引双轨对齐落库 + 严禁切碎 `tool` 对的安全压缩 Checkpoint","packetSample":"DDL: UNIQUE (tenant_id, user_id, site, username) WHERE deleted_at IS NULL\nCutPoint: [sys, u1, asst(tc), tool] | <-- 合法切点只能落在非 tool 消息处！","analogy":"① 软删除部分唯一索引就像**只要求“在职员工”工号不重**，离职删除后还能用同账号重新入职；② 保对切分压缩就像**打包旧衣服绝不把一双鞋拆开只丢左脚**——`assistant(tool_calls)` 和紧随其后的 `tool` 结果必须成对留或成对摘要！","files":[{"id":"fa3_pg","path":"migrations/versioned/000136_credential_vault.up.sql","sliceStart":1,"sliceEnd":20,"label":"000136_vault.sql (PG)","syntax":"sql","relPath":"migrations/versioned/000136_credential_vault.up.sql","startLine":1,"endLine":20,"lines":["-- Per-user saved logins for the sandbox browser's secure credential form.","-- The password is only in secret_ciphertext (AES-256-GCM, SYSTEM_AES_KEY).","CREATE TABLE IF NOT EXISTS credential_vault_items (","    id VARCHAR(36) PRIMARY KEY,","    tenant_id BIGINT NOT NULL,","    user_id VARCHAR(128) NOT NULL,","    kind VARCHAR(16) NOT NULL DEFAULT 'login',","    title VARCHAR(200) NOT NULL,","    site VARCHAR(255) NOT NULL,","    domains JSONB NOT NULL DEFAULT '[]',","    username VARCHAR(256) NOT NULL,","    secret_ciphertext TEXT NOT NULL,","    last_used_at TIMESTAMPTZ,","    created_at TIMESTAMPTZ NOT NULL,","    updated_at TIMESTAMPTZ NOT NULL,","    deleted_at TIMESTAMPTZ",");","CREATE UNIQUE INDEX IF NOT EXISTS uq_credential_vault_items_owner_site_user","    ON credential_vault_items(tenant_id, user_id, site, username) WHERE deleted_at IS NULL;","CREATE INDEX IF NOT EXISTS idx_credential_vault_items_deleted_at ON credential_vault_items(deleted_at);"]},{"id":"fa3_sq","path":"migrations/sqlite/000052_credential_vault.up.sql","sliceStart":1,"sliceEnd":20,"label":"000052_vault.sql (SQLite)","syntax":"sql","relPath":"migrations/sqlite/000052_credential_vault.up.sql","startLine":1,"endLine":20,"lines":["-- Per-user saved logins for the sandbox browser's secure credential form.","-- The password is only in secret_ciphertext (AES-256-GCM, SYSTEM_AES_KEY).","CREATE TABLE IF NOT EXISTS credential_vault_items (","    id VARCHAR(36) PRIMARY KEY,","    tenant_id BIGINT NOT NULL,","    user_id VARCHAR(128) NOT NULL,","    kind VARCHAR(16) NOT NULL DEFAULT 'login',","    title VARCHAR(200) NOT NULL,","    site VARCHAR(255) NOT NULL,","    domains TEXT NOT NULL DEFAULT '[]',","    username VARCHAR(256) NOT NULL,","    secret_ciphertext TEXT NOT NULL,","    last_used_at DATETIME,","    created_at DATETIME NOT NULL,","    updated_at DATETIME NOT NULL,","    deleted_at DATETIME",");","CREATE UNIQUE INDEX IF NOT EXISTS uq_credential_vault_items_owner_site_user","    ON credential_vault_items(tenant_id, user_id, site, username) WHERE deleted_at IS NULL;","CREATE INDEX IF NOT EXISTS idx_credential_vault_items_deleted_at ON credential_vault_items(deleted_at);"]},{"id":"fa3_cut","path":"internal/agent/compaction/cutpoint.go","sliceStart":15,"sliceEnd":70,"label":"compaction/cutpoint.go","relPath":"internal/agent/compaction/cutpoint.go","startLine":15,"endLine":70,"lines":["\tTurnStartIdx int","\t// IsSplitTurn reports that the cut divides a single turn, so the part","\t// before it needs its own summary to explain the part after it.","\tIsSplitTurn bool","}","","// isCutPointMessage reports whether history may be cut immediately before this","// message. Everything except a tool result qualifies. Tool results are excluded","// because they must stay with the assistant message that requested them —","// cutting between the two leaves an orphaned tool result and providers reject","// the request outright.","//","// The corollary is what makes mid-turn compaction safe: a cut that lands on an","// assistant message keeps that message and every tool result following it, so","// the pairing is never split from either side.","func isCutPointMessage(msg *chat.Message) bool {","\treturn msg.Role != \"tool\"","}","","// isTurnStartMessage reports whether this message opens a turn. Compaction","// summaries count: they stand in for everything before them, so the turn they","// begin is complete on its own.","func isTurnStartMessage(msg *chat.Message) bool {","\treturn msg.Role == \"user\"","}","","// historyStart is the first index compaction may touch. The system prompt is","// never a candidate — it carries the agent's instructions, not its history.","func historyStart(messages []chat.Message) int {","\tif len(messages) > 0 && messages[0].Role == \"system\" {","\t\treturn 1","\t}","\treturn 0","}","","// FindCutPoint walks backwards from the newest message accumulating estimated","// size, and keeps the largest suffix that still fits keepRecentTokens.","//","// The budget is a ceiling, not a floor. Stopping at the first message that","// reaches the budget and keeping that message too is the obvious reading and","// the wrong one: a single knowledge_search result is routinely ten thousand","// tokens on its own, so \"keep the recent 16k\" would hand back 25k and leave","// barely a round of headroom before the next compaction.","//","// Nothing here consults the current turn. That is deliberate: the budget is the","// only rule, and a turn large enough to exceed it on its own gets split rather","// than exempted.","func FindCutPoint(","\tmessages []chat.Message,","\tstart, keepRecentTokens int,","\testimator *agenttoken.Estimator,",") CutPoint {","\tif start < 0 {","\t\tstart = 0","\t}","\tvar cutPoints []int"]}],"steps":[{"id":"sa3_1","order":1,"type":"database","label":"PG 部分唯一索引","sublabel":"JSONB · WHERE deleted_at IS NULL","tag":"PostgreSQL","edgeLabel":"双库同步","fileId":"fa3_pg","startLine":1,"endLine":20,"explain":"标准版 138 份版本化迁移之一：仅存 `secret_ciphertext` 与允许域名 `domains JSONB`，并通过 `WHERE deleted_at IS NULL` 部分唯一索引优雅兼容软删除后同账号重建。","pitfall":"软删除表建普通唯一索引会导致用户删掉一条凭据后永远无法再添加同站点同用户名！"},{"id":"sa3_2","order":2,"type":"database","label":"SQLite 双轨对齐迁移","sublabel":"TEXT/DATETIME · 语义一致","tag":"Lite迁移","edgeLabel":"保对压缩","fileId":"fa3_sq","startLine":1,"endLine":20,"explain":"Lite 版同步维护 54 份 SQLite 迁移，将 `JSONB`/`TIMESTAMPTZ` 映射为 `TEXT`/`DATETIME` 并保留完全一致的部分唯一索引，配合真进程 E2E 防双库漂移。","pitfall":"新增任何业务表若漏加 SQLite 迁移，桌面版与 Lite 版会在运行期直接报 `no such table`！"},{"id":"sa3_3","order":3,"type":"security","label":"禁切 tool 前保对压缩","sublabel":"keepRecentTokens 为硬上限","tag":"防400拒收","edgeLabel":"","fileId":"fa3_cut","startLine":15,"endLine":70,"explain":"`isCutPointMessage` 绝不在 `Role == \"tool\"` 之前下刀，保证 `tool_calls` 与 `tool` 成对存活；`FindCutPoint` 从最新消息倒推并以 `keepRecentTokens` 作为严格硬上限防止大搜索结果撑爆窗口。","pitfall":"孤儿 `tool` 消息发给 OpenAI/Claude 会直接 400 崩溃；把预算误写成下限会导致下一轮立刻重复触发压缩！"}],"quiz":{"question":"在 `compaction/cutpoint.go` 为长对话 Agent 寻找历史摘要压缩切分点时，为什么严禁在 `Role == \"tool\"` 的消息之前切分？","options":["因为 tool 消息字数太少不值得压缩","若切在 tool 消息前会把配对的 assistant(tool_calls) 裁进摘要而留下孤儿 tool 结果，大模型 API 会直接报 400 拒绝请求","因为 tool 消息没有时间戳","为了把 System Prompt 一起删掉"],"correctIndex":1,"explanation":"精准！严守“不切 tool 前 + 永远跳过 system + 硬上限预算”三条铁律，Agent 跑 50 轮工具调用依然稳如磐石！"},"interviewQ":"长对话 Agent 触发上下文压缩时，怎么选切分点才不会报 400 或下一轮立刻又爆窗？","interviewA":"`isCutPointMessage` 排除所有 `tool` 角色位置，确保 `assistant(tool_calls)` 与后续 `tool` 结果永远成对保留或成对压缩；`FindCutPoint` 跳过 `system` 并把 `keepRecentTokens` 当严格硬上限倒推累加，遇超大工具结果直接切走而非豁免，并将摘要存为 Checkpoint 复用。","whyBlock":{"painPoint":"加密凭据落库和 Agent 长对话历史管理各自踩着一颗深水炸弹：① 标准版用 PostgreSQL、Lite 版用 SQLite，双库表结构与唯一索引必须严格保持语义一致，确保租户内个人凭据天然物理隔离；② 当 Agent 对话超过窗口阈值需要截断压缩旧消息时，如果按「保留最后 N 条」一刀切在 `tool` 返回消息前，把成对的 `assistant(tool_calls)` 切丢了，OpenAI/Claude/DeepSeek API 会立刻报 400 崩溃！","analogy":"① 双库迁移 SQL 就像**一式两份的保险库设计蓝图**（大型银行金库 PG 版 vs 便携保险柜 SQLite 版），锁孔规格与 `(tenant_id, user_id, name)` 防撞锁完全一致；② **`cutpoint.go` 保对压缩**就像整理行李箱腾空间：你可以把旧鞋子整双打包收走，但**绝不允许把一双鞋拆开、只留一只右脚（孤立 `tool` 消息）在箱子里**！","avoidRabbitHole":"不需要把 `migrations/` 下 138 个 PG 迁移脚本和 54 个 SQLite 迁移脚本逐个看完！本站只需对比 `000136_credential_vault.up.sql` 与 `000052_credential_vault.up.sql` 学会双库同源规范，再吃透 `cutpoint.go` 里「绝不在 `role == tool` 处下刀」的滑动边界算法即可。"},"ioContract":{"inType":"封装后加密凭据行 + 触发压缩的完整 ReAct 对话历史 `[]Message`","inFields":[{"name":"credential_vault_row","type":"SQL INSERT","desc":"含 `tenant_id`, `user_id`, `name`, `encrypted_data`, `allowed_domains` 的密文行"},{"name":"messages","type":"[]types.Message","desc":"包含 `system`、`user`、`assistant(tool_calls)` 与 `tool` 结果的完整多轮消息数组"},{"name":"keep_recent_tokens","type":"int","desc":"希望在尾部保留不压缩的最新消息 Token 预算"}],"inSample":"{\n  \"messages_before_cut\": [\n    { \"idx\": 0, \"role\": \"system\", \"tokens\": 1200 },\n    { \"idx\": 1, \"role\": \"user\", \"tokens\": 120 },\n    { \"idx\": 2, \"role\": \"assistant\", \"tool_calls\": [\"call_1\"], \"tokens\": 350 },\n    { \"idx\": 3, \"role\": \"tool\", \"tool_call_id\": \"call_1\", \"tokens\": 8400 },\n    { \"idx\": 4, \"role\": \"assistant\", \"content\": \"已查询完一季度数据...\", \"to
